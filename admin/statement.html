<!doctype html>
<html lang="en"><head><script src="../shared/loading.js"></script><script src="../assets/icons.js"></script><script src="../shared/sync.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Statement - General Traders</title><link rel="stylesheet" href="../shared/theme.css"><link rel="stylesheet" href="../shared/admin.css"><script src="../shared/theme.js"></script><style>
.st-wrap{max-width:900px;margin:auto}.st-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}.st-bar label{display:grid;gap:5px;font-size:12px;color:var(--muted)}.st-bar select,.st-bar input{min-height:40px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);padding:8px;font:inherit}.st-bar select{min-width:240px}.st-bar button{border:1px solid var(--border);border-radius:9px;padding:10px 14px;background:var(--card);color:var(--text);cursor:pointer;font:inherit}.st-bar .primary{background:var(--primary);color:var(--on-primary)}.st-bar button:disabled{opacity:.5}
.st-paper{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px}.st-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--primary);padding-bottom:12px;margin-bottom:14px}.st-top h1{margin:0;font-size:22px}.st-top p{margin:3px 0;color:var(--muted);font-size:13px}.st-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.st-sum div{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px}.st-sum span{display:block;color:var(--muted);font-size:12px}.st-sum b{display:block;margin-top:4px;font-size:16px}
.st-tw{overflow:auto}.st-t{width:100%;border-collapse:collapse}.st-t th,.st-t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px}.st-t th{font-size:12px;color:var(--muted)}.st-t .num{text-align:right;white-space:nowrap}.st-t tr.st-sub td{font-weight:700;background:var(--bg)}.st-empty{padding:30px;text-align:center;color:var(--muted)}.st-foot{margin-top:14px;font-size:12px;color:var(--muted)}
@media(max-width:700px){.st-sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{body,.a-main{background:#fff!important}.st-paper{border:0;border-radius:0;padding:0;background:#fff!important;color:#000!important}.st-paper *{color:#000!important;background:transparent!important;border-color:#999!important}.st-sum div,.st-t tr.st-sub td{background:#f2f2f2!important}.st-t th,.st-t td{font-size:11px;padding:5px 6px}.st-tw{overflow:visible}.st-t tr{page-break-inside:avoid}.st-t thead{display:table-header-group}}
</style></head><body><script src="../shared/admin.js"></script><script>
(function(){"use strict";GA.guard();var pg=GA.mount("statement.html","Customer Statement",{back:["accounts.html","Ledger"]}),S=GA.ops.get(),$=function(id){return document.getElementById(id)},esc=GA.esc;
function money(v){return "₹"+Number(v||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function dmy(d){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(d||""));return m?m[3]+"-"+m[2]+"-"+m[1]:"—"}
var customers=(S.customers||[]).filter(function(c){return c&&!c.inactive});
var opts='<option value="">Select customer</option>'+customers.map(function(c){return '<option value="'+esc(String(c.code||""))+'">'+esc(String(c.name||c.shopName||c.code||""))+' · '+esc(String(c.code||""))+'</option>'}).join("");
pg.innerHTML='<div class="st-wrap"><div class="st-bar no-print"><label>Customer<select id="stCustomer">'+opts+'</select></label><label>From<input id="stFrom" type="date"></label><label>To<input id="stTo" type="date"></label><button type="button" class="btn a-btn" id="stLoad">Show</button><button type="button" class="btn btn-secondary a-btn" id="stPrint" data-act disabled>Print / Save as PDF</button></div><div class="st-paper" id="stPaper"><div class="st-empty">Choose a customer to see their statement.</div></div></div>';
var data=null;
function load(){
  var code=$("stCustomer").value;if(!code){$("stPaper").innerHTML='<div class="st-empty">Choose a customer to see their statement.</div>';$("stPrint").disabled=true;return}
  var q=[];if($("stFrom").value)q.push("from="+$("stFrom").value);if($("stTo").value)q.push("to="+$("stTo").value);
  $("stPaper").innerHTML='<div class="st-empty">Loading...</div>';$("stPrint").disabled=true;
  fetch("/api/accounts/customers/"+encodeURIComponent(code)+"/statement"+(q.length?"?"+q.join("&"):""),{credentials:"same-origin"}).then(function(r){return r.json().catch(function(){return {}}).then(function(d){if(!r.ok)throw new Error(d.error||"Request failed");return d})}).then(function(d){data=d;render();$("stPrint").disabled=false}).catch(function(e){$("stPaper").innerHTML='<div class="st-empty">'+esc(e.message)+'</div>'});
}
function render(){
  var d=data,period=d.from||d.to?(d.from?dmy(d.from):"Start")+" to "+(d.to?dmy(d.to):"Today"):"All dates";
  var rows=d.rows.length?d.rows.map(function(x){return '<tr><td>'+dmy(x.date)+'</td><td>'+esc(x.ref)+'</td><td>'+esc(x.detail)+'</td><td class="num">'+(x.debit?money(x.debit):"")+'</td><td class="num">'+(x.credit?money(x.credit):"")+'</td><td class="num">'+money(x.balance)+'</td></tr>'}).join(""):'<tr><td colspan="6" class="st-empty">No entries in this period.</td></tr>';
  $("stPaper").innerHTML='<div class="st-top"><div><h1>Customer Statement</h1><p><b>'+esc(d.customer.name)+'</b> · '+esc(d.customer.code)+'</p>'+(d.customer.address?'<p>'+esc(d.customer.address)+'</p>':'')+(d.customer.phone?'<p>Phone: '+esc(d.customer.phone)+'</p>':'')+'<p>Period: '+esc(period)+'</p></div><div style="text-align:right"><p><b>General Traders</b></p><p>Printed '+dmy(new Date(new Date(d.generatedAt).getTime()+19800000).toISOString())+'</p></div></div>'+
  '<div class="st-sum"><div><span>Opening balance</span><b>'+money(d.openingBalance)+'</b></div><div><span>Billed</span><b>'+money(d.totalDebit)+'</b></div><div><span>Paid</span><b>'+money(d.totalCredit)+'</b></div><div><span>Closing balance</span><b>'+money(d.closingBalance)+'</b></div></div>'+
  '<div class="st-tw"><table class="st-t"><thead><tr><th>Date</th><th>Invoice</th><th>Details</th><th class="num">Billed</th><th class="num">Paid</th><th class="num">Balance</th></tr></thead><tbody><tr class="st-sub"><td colspan="5">Opening balance</td><td class="num">'+money(d.openingBalance)+'</td></tr>'+rows+'<tr class="st-sub"><td colspan="3">Total</td><td class="num">'+money(d.totalDebit)+'</td><td class="num">'+money(d.totalCredit)+'</td><td class="num">'+money(d.closingBalance)+'</td></tr></tbody></table></div><p class="st-foot">Only approved payments are shown. Payments waiting for approval are not counted.</p>';
}
$("stLoad").onclick=load;$("stCustomer").onchange=load;$("stPrint").onclick=function(){window.print()};
var pre=new URLSearchParams(location.search).get("customer");if(pre){$("stCustomer").value=pre;if($("stCustomer").value===pre)load()}
})();
</script></body></html>
