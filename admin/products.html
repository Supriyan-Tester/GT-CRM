<!doctype html>
<html lang="en">
  <head>
    <script src="../shared/loading.js"></script>
    <script src="../assets/icons.js"></script>
    <script src="../shared/sync.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products - General Traders Admin</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/admin.css" />
    <link rel="stylesheet" href="../shared/plan.css" />
    <link rel="stylesheet" href="../shared/products.css" />
    <script src="../shared/theme.js"></script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/icon-32.png"
    />
    <link rel="apple-touch-icon" href="/assets/icon-180.png" />
  </head>
  <body>
    <script src="../shared/mock-data.js"></script>
    <script src="../shared/admin.js"></script>
    <script src="../shared/plan-core.js"></script>
    <script src="../shared/xlsx-lite.js"></script>
    <script src="../shared/products.js"></script>
    <script>
      GA.guard();
      var $ = function (i) {
          return document.getElementById(i);
        },
        esc = GA.esc,
        L = PR.load();
      var st = {
        tab: "all",
        cat: "",
        tax: "",
        chk: "",
        sort: "name",
        view: "list",
        q: "",
        pg: 1,
        ps: 10,
        sel: {},
      };
      var COLS = [
          ["category", "Category", 1],
          ["unit", "Unit", 1],
          ["mrp", "MRP", 1, 1],
          ["price", "Selling price", 1, 1],
          ["margin", "Margin", 1, 1],
          ["tax", "Tax", 1],
          ["cost", "Purchase price", 1, 1],
          ["hsn", "HSN", 1],
          ["brand", "Brand", 0],
          ["pack", "Pack size", 0],
          ["openQty", "Opening qty", 0, 1],
          ["avg", "Avg sales", 0, 1],
          ["stock", "Stock", 0, 1],
          ["batch", "Batch", 0],
        ],
        showCols = {},
        speed = function () {
          return "";
        };
      COLS.forEach(function (c) {
        showCols[c[0]] = !!c[2];
      });
      try {
        var sc = JSON.parse(localStorage.getItem("gm_pr_cols"));
        if (sc)
          COLS.forEach(function (c) {
            if (c[0] in sc) showCols[c[0]] = !!sc[c[0]];
          });
      } catch (e) {}
      try {
        st.view =
          localStorage.getItem("gm_pr_view") === "grid" ? "grid" : "list";
      } catch (e) {}
      var pg = GA.mount("products.html", "Products");
      pg.innerHTML =
        '<div class="pr-head"><div class="pr-title"><span class="chip c-p">' +
        GA.icon("box") +
        "</span><div><p>Manage your product catalogue, prices and stock information.</p></div></div>" +
        '<div class="pr-tools"><div class="field a-f" data-act style="width:190px;height:38px"><input type="search" id="pQ" placeholder="Search product..." aria-label="Search product name or code" autocomplete="off"></div>' +
        '<button class="btn btn-secondary a-btn" id="pImp" data-act type="button">' +
        DP.icon("upload") +
        ' Import</button><button class="btn btn-secondary a-btn" id="pStk" data-act type="button">' +
        DP.icon("upload") +
        ' Import Stock</button><button class="pr-ib" data-act id="pMore" type="button" aria-label="More actions" aria-haspopup="menu">' +
        DP.icon("dots-vertical") +
        "</button>" +
        '<a class="btn a-btn" id="pAdd" data-act href="product-edit.html">' +
        GA.icon("plus") +
        " Add product</a></div></div>" +
        '<div class="pr-tiles" id="pTiles"></div>' +
        '<section class="pr-panel" aria-label="Product list"><div class="pr-bar"><div class="field"><select id="pSeg" aria-label="Filter by status"></select></div>' +
        '<div class="field"><select id="pCat" aria-label="Filter by category"></select></div><div class="field"><select id="pTax" aria-label="Filter by tax rate"><option value="">All tax rates</option><option value="0">Exempt (0%)</option><option value="5">5%</option><option value="12">12%</option><option value="18">18%</option><option value="28">28%</option></select></div><div class="field"><select id="pChk" aria-label="Quick checks"><option value="">Quick checks: none</option><option value="hsn">Missing HSN</option><option value="nostock">No stock number</option><option value="gst">Missing GST rate</option><option value="mrp">Missing MRP</option><option value="cat">Missing category</option><option value="cost">Missing purchase price</option><option value="lowm">Low margin (under 5%)</option><option value="loss">Selling below cost</option><option value="lows">Low stock</option><option value="fast">Fast moving</option><option value="slow">Slow moving</option></select></div><span class="pr-sp"></span>' +
        '<div class="field"><select id="pSort" aria-label="Sort products"><option value="name">Sort: Name (A-Z)</option><option value="namez">Sort: Name (Z-A)</option><option value="pricel">Sort: Price (low first)</option><option value="priceh">Sort: Price (high first)</option><option value="mrp">Sort: MRP (high first)</option><option value="mgh">Sort: Margin % (high first)</option><option value="mgl">Sort: Margin % (low first)</option><option value="code">Sort: Code</option><option value="new">Sort: Recently added</option></select></div>' +
        '<div class="pr-view" role="group" aria-label="View"><button type="button" id="vList" aria-label="List view" title="List view">' +
        DP.icon("menu") +
        '</button><button type="button" id="vGrid" aria-label="Grid view" title="Grid view">' +
        DP.icon("grip") +
        '</button></div><button type="button" class="btn btn-secondary a-btn" id="pCols">' +
        DP.icon("filter") +
        ' Columns</button><button type="button" class="btn btn-secondary a-btn" id="pExp">' +
        DP.icon("download") +
        " Export</button></div>" +
        '<div class="pr-sel" id="pSel" hidden></div><div id="pBody"></div><div class="pr-foot" id="pFoot"></div></section>';

      function toast(m, k) {
        DP.toast(m, k);
      }
      function flash() {
        try {
          var f = sessionStorage.getItem("pr_flash");
          if (f) {
            sessionStorage.removeItem("pr_flash");
            toast(f);
          }
        } catch (e) {}
      }

      /* ---------- changes: always start from the newest saved list and wait for the server ---------- */
      function change(fn, okMsg, after) {
        var cur = PR.load(),
          r = fn(cur);
        if (r === false) return Promise.resolve();
        return PR.save(cur).then(function (res) {
          L = PR.load();
          if (!res.ok) {
            toast(res.error, "err");
            render();
            return;
          }
          if (after) after();
          render();
          toast(okMsg, res.server === "failed" ? "warn" : "ok");
          if (res.server === "failed")
            toast(
              "Server not reachable. The change is kept on this computer and will be sent again automatically.",
              "warn",
            );
        });
      }
      function byCode(c) {
        return L.filter(function (p) {
          return p.code === c;
        })[0];
      }

      /* ---------- list ---------- */
      function mg(p) {
        var m = PR.margin(p);
        return m ? m.pct : -1e9;
      }
      function filtered() {
        speed = PR.speedMap(L);
        var q = st.q.toLowerCase().trim();
        var l = L.filter(function (p) {
          if (st.tab === "active" && !PR.isOn(p)) return false;
          if (st.tab === "inactive" && PR.isOn(p)) return false;
          if (st.tab === "np" && p.price) return false;
          if (st.cat === "__none") {
            if (p.category) return false;
          } else if (st.cat && p.category !== st.cat) return false;
          if (st.tax !== "" && String(p.tax) !== st.tax) return false;
          if (st.chk) {
            var m = PR.margin(p),
              c = st.chk;
            if (c === "hsn" && p.hsn) return false;
            if (c === "nostock" && p.stock !== "" && p.stock != null) return false;
            if (c === "gst" && p.tax !== "" && p.tax != null) return false;
            if (c === "mrp" && p.mrp) return false;
            if (c === "cat" && p.category) return false;
            if (c === "cost" && p.cost !== "" && p.cost != null && p.cost !== 0)
              return false;
            if (c === "lowm" && !(m && m.pct < PR.LOWM && m.pct >= 0))
              return false;
            if (c === "loss" && !PR.loss(p)) return false;
            if (c === "lows" && !PR.low(p)) return false;
            if (c === "fast" && speed(p) !== "fast") return false;
            if (c === "slow" && speed(p) !== "slow") return false;
          }
          return (
            !q ||
            (
              p.name +
              " " +
              p.code +
              " " +
              (p.category || "") +
              " " +
              (p.brand || "") +
              " " +
              (p.alias || "") +
              " " +
              (p.printName || "") +
              " " +
              (p.hsn || "") +
              " " +
              (p.barcode || "")
            )
              .toLowerCase()
              .indexOf(q) > -1
          );
        });
        var S = {
          name: function (a, b) {
            return a.name.localeCompare(b.name);
          },
          namez: function (a, b) {
            return b.name.localeCompare(a.name);
          },
          pricel: function (a, b) {
            return (a.price || 0) - (b.price || 0);
          },
          priceh: function (a, b) {
            return (b.price || 0) - (a.price || 0);
          },
          mrp: function (a, b) {
            return (b.mrp || 0) - (a.mrp || 0);
          },
          mgh: function (a, b) {
            return mg(b) - mg(a);
          },
          mgl: function (a, b) {
            return mg(a) - mg(b);
          },
          code: function (a, b) {
            return String(a.code).localeCompare(String(b.code), undefined, {
              numeric: true,
            });
          },
          new: function (a, b) {
            return (b.at || 0) - (a.at || 0);
          },
        };
        return l.sort(S[st.sort] || S.name);
      }
      function statusB(p) {
        return PR.isOn(p)
          ? '<span class="badge b-success">Active</span>'
          : '<span class="badge b-danger">Inactive</span>';
      }
      function priceH(p) {
        return p.price
          ? PR.rupee(p.price)
          : '<span class="badge b-danger">No price</span>';
      }
      function kebab(p) {
        return (
          '<button type="button" class="pr-ib" data-k="' +
          esc(p.code) +
          '" aria-label="Actions for ' +
          esc(p.name) +
          '" aria-haspopup="menu">' +
          DP.icon("dots-vertical") +
          "</button>"
        );
      }
      function nameCell(p) {
        var sp = speed(p),
          sub = [p.alias, p.brand].filter(Boolean).join(" · ");
        return (
          '<div class="pr-cell">' +
          PR.thumb(p) +
          '<div style="min-width:0"><b><a href="#" class="pr-nm" data-v="' +
          esc(p.code) +
          '" style="color:inherit;text-decoration:none">' +
          esc(p.name) +
          "</a>" +
          (sp
            ? '<span class="pr-tag ' +
              sp[0] +
              '">' +
              (sp === "fast" ? "Fast moving" : "Slow moving") +
              "</span>"
            : "") +
          (PR.low(p)
            ? '<span class="pr-low" title="Stock ' +
              esc(p.stock) +
              " is at or below the alert level " +
              esc(p.low) +
              '">Low stock</span>'
            : "") +
          "</b>" +
          (sub ? "<small>" + esc(sub) + "</small>" : "") +
          "</div></div>"
        );
      }
      function cellH(k, p) {
        var D = '<span class="mu">-</span>',
          m;
        switch (k) {
          case "category":
            return p.category ? esc(p.category) : D;
          case "unit":
            return p.unit ? esc(p.unit) : D;
          case "mrp":
            return p.mrp ? PR.rupee(p.mrp) : D;
          case "price":
            return priceH(p);
          case "margin":
            m = PR.margin(p);
            return m
              ? '<span class="pr-mgv ' +
                  (m.pct < PR.LOWM ? "lo" : "ok") +
                  '" title="' +
                  PR.rupee(m.amt) +
                  ' per unit">' +
                  m.pct +
                  "%</span>"
              : D;
          case "tax":
            return PR.taxLabel(p)
              ? '<span class="badge b-info">' + PR.taxLabel(p) + "</span>"
              : D;
          case "cost":
            return p.cost ? PR.rupee(p.cost) : D;
          case "hsn":
            return p.hsn ? esc(p.hsn) : D;
          case "brand":
            return p.brand ? esc(p.brand) : D;
          case "pack":
            return PR.packText(p) ? esc(PR.packText(p)) : D;
          case "openQty":
            return p.openQty !== "" && p.openQty != null
              ? PR.num(p.openQty)
              : D;
          case "avg":
            return p.avg !== "" && p.avg != null ? PR.num(p.avg) : D;
          case "stock":
            return p.track && p.stock !== "" && p.stock != null
              ? PR.num(p.stock)
              : D;
          case "batch":
            return p.batch ? "Yes" : D;
        }
        return D;
      }
      function visCols() {
        return COLS.filter(function (c) {
          return showCols[c[0]];
        });
      }
      function rowH(p) {
        return (
          '<tr><td class="ck"><input type="checkbox" class="pr-ck" data-c="' +
          esc(p.code) +
          '"' +
          (st.sel[p.code] ? " checked" : "") +
          ' aria-label="Select ' +
          esc(p.name) +
          '"></td><td><span class="pr-code">' +
          esc(p.code) +
          "</span></td><td>" +
          nameCell(p) +
          "</td>" +
          visCols()
            .map(function (c) {
              return (
                "<td" +
                (c[3] ? ' class="num"' : "") +
                ">" +
                cellH(c[0], p) +
                "</td>"
              );
            })
            .join("") +
          "<td>" +
          statusB(p) +
          '</td><td class="act">' +
          kebab(p) +
          "</td></tr>"
        );
      }
      function cardH(p) {
        return (
          '<div class="pr-gc"><span class="ckw"><input type="checkbox" class="pr-ck" data-c="' +
          esc(p.code) +
          '"' +
          (st.sel[p.code] ? " checked" : "") +
          ' aria-label="Select ' +
          esc(p.name) +
          '"></span><span class="k">' +
          kebab(p) +
          "</span>" +
          PR.thumb(p, "lg") +
          "<b>" +
          esc(p.name) +
          "</b><small>" +
          esc(p.code) +
          (p.category ? " · " + esc(p.category) : "") +
          (p.unit ? " · " + esc(p.unit) : "") +
          (p.mrp ? " · MRP " + PR.rupee(p.mrp) : "") +
          '</small><div class="pp"><strong>' +
          (p.price
            ? PR.rupee(p.price)
            : '<span class="badge b-danger">No price</span>') +
          "</strong>" +
          statusB(p) +
          "</div></div>"
        );
      }
      function pageBtns(pages) {
        var out = [],
          i,
          last = 0,
          want = {};
        [1, 2, pages - 1, pages, st.pg - 1, st.pg, st.pg + 1].forEach(
          function (n) {
            if (n >= 1 && n <= pages) want[n] = 1;
          },
        );
        Object.keys(want)
          .map(Number)
          .sort(function (a, b) {
            return a - b;
          })
          .forEach(function (n) {
            if (last && n - last > 1)
              out.push('<button type="button" disabled>...</button>');
            out.push(
              '<button type="button" data-p="' +
                n +
                '"' +
                (n === st.pg ? ' class="on" aria-current="page"' : "") +
                ">" +
                n +
                "</button>",
            );
            last = n;
          });
        return out.join("");
      }
      function render() {
        var on = L.filter(PR.isOn).length,
          np = L.filter(function (p) {
            return !p.price;
          }).length;
        function tl(key, ic, cls, n, lb) {
          return (
            '<button type="button" class="pr-tile' +
            (st.tab === key ? " on" : "") +
            '" data-t="' +
            key +
            '"><span class="chip ' +
            cls +
            '">' +
            DP.icon(ic) +
            "</span><div><b>" +
            PR.num(n) +
            "</b><span>" +
            lb +
            "</span></div></button>"
          );
        }
        $("pTiles").innerHTML =
          tl("all", "box", "c-i", L.length, "Total products") +
          tl("active", "check", "c-s", on, "Active products") +
          tl("inactive", "power", "c-d", L.length - on, "Inactive products") +
          tl("np", "alert-triangle", "c-a", np, "Products without price");
        $("pSeg").innerHTML = [
          ["all", "All products"],
          ["active", "Active"],
          ["inactive", "Inactive"],
          ["np", "No price"],
        ]
          .map(function (t) {
            return (
              '<option value="' +
              t[0] +
              '"' +
              (st.tab === t[0] ? " selected" : "") +
              ">" +
              t[1] +
              "</option>"
            );
          })
          .join("");
        var cats = PR.cats(L),
          none = L.some(function (p) {
            return !p.category;
          });
        $("pCat").innerHTML =
          '<option value="">All categories</option>' +
          cats
            .map(function (c) {
              return '<option value="' + esc(c) + '">' + esc(c) + "</option>";
            })
            .join("") +
          (none && cats.length
            ? '<option value="__none">Uncategorised</option>'
            : "");
        if (st.cat && st.cat !== "__none" && cats.indexOf(st.cat) < 0)
          st.cat = "";
        $("pCat").value = st.cat;
        $("pSort").value = st.sort;
        $("pTax").value = st.tax;
        $("pChk").value = st.chk;
        $("vList").classList.toggle("on", st.view === "list");
        $("vGrid").classList.toggle("on", st.view === "grid");
        var list = filtered(),
          pages = Math.max(1, Math.ceil(list.length / st.ps));
        if (st.pg > pages) st.pg = pages;
        var from = (st.pg - 1) * st.ps,
          part = list.slice(from, from + st.ps);
        if (!part.length) {
          $("pBody").innerHTML =
            '<div class="pr-empty"><b>' +
            (L.length ? "No products match" : "No products yet") +
            "</b>" +
            (L.length
              ? "Change the search or the filters."
              : "Add your first product, or import your product list.") +
            (L.length
              ? ""
              : '<br><a class="btn a-btn" href="product-edit.html">' +
                GA.icon("plus") +
                " Add product</a>") +
            "</div>";
        } else if (st.view === "grid")
          $("pBody").innerHTML =
            '<div class="pr-grid">' + part.map(cardH).join("") + "</div>";
        else
          $("pBody").innerHTML =
            '<div class="pr-scroll"><table class="pr-table"><thead><tr><th class="ck"><input type="checkbox" class="pr-ck" id="pAll" aria-label="Select all on this page"></th><th>Code</th><th>Product</th>' +
            visCols()
              .map(function (c) {
                return (
                  "<th" + (c[3] ? ' class="num"' : "") + ">" + c[1] + "</th>"
                );
              })
              .join("") +
            '<th>Status</th><th class="act"><span class="sr-only" style="position:absolute;left:-9999px">Actions</span></th></tr></thead><tbody>' +
            part.map(rowH).join("") +
            "</tbody></table></div>";
        $("pFoot").innerHTML = list.length
          ? "<span>Showing " +
            (from + 1) +
            "-" +
            (from + part.length) +
            " of " +
            PR.num(list.length) +
            ' products</span><span class="pr-sp"></span><div class="pr-pages"><button type="button" data-p="' +
            (st.pg - 1) +
            '"' +
            (st.pg <= 1 ? " disabled" : "") +
            ' aria-label="Previous page">&lsaquo;</button>' +
            pageBtns(pages) +
            '<button type="button" data-p="' +
            (st.pg + 1) +
            '"' +
            (st.pg >= pages ? " disabled" : "") +
            ' aria-label="Next page">&rsaquo;</button></div><div class="field"><select id="pPS" aria-label="Rows per page">' +
            [10, 25, 50, 100]
              .map(function (n) {
                return (
                  '<option value="' +
                  n +
                  '"' +
                  (n === st.ps ? " selected" : "") +
                  ">" +
                  n +
                  " / page</option>"
                );
              })
              .join("") +
            "</select></div>"
          : "";
        selBar(part);
      }
      function selBar(part) {
        Object.keys(st.sel).forEach(function (c) {
          if (!byCode(c)) delete st.sel[c];
        });
        var n = Object.keys(st.sel).length,
          bar = $("pSel");
        bar.hidden = !n;
        if (n)
          bar.innerHTML =
            "<b>" +
            n +
            ' selected</b><button type="button" class="btn btn-secondary a-btn" data-b="on">Activate</button><button type="button" class="btn btn-secondary a-btn" data-b="off">Deactivate</button><button type="button" class="btn btn-secondary a-btn" data-b="tax">Set GST / HSN</button><button type="button" class="btn btn-secondary a-btn" data-b="trk">Track stock</button><button type="button" class="btn btn-secondary a-btn" data-b="utrk">Stop tracking</button><button type="button" class="btn btn-secondary a-btn" data-b="del" style="color:var(--danger)">Delete</button><button type="button" class="btn btn-secondary a-btn" data-b="clr">Clear selection</button>';
        var all = $("pAll");
        if (all && part) {
          var k = part.filter(function (p) {
            return st.sel[p.code];
          }).length;
          all.checked = k > 0 && k === part.length;
          all.indeterminate = k > 0 && k < part.length;
        }
      }

      /* ---------- events (delegated, so a redraw never loses them) ---------- */
      function setTab(t) {
        st.tab = t;
        st.pg = 1;
        render();
      }
      $("pTiles").onclick = function (e) {
        var b = e.target.closest("[data-t]");
        if (b) setTab(b.dataset.t);
      };
      $("pSeg").onchange = function () {
        setTab(this.value);
      };
      $("pQ").oninput = function () {
        st.q = this.value;
        st.pg = 1;
        render();
      };
      $("pCat").onchange = function () {
        st.cat = this.value;
        st.pg = 1;
        render();
      };
      $("pTax").onchange = function () {
        st.tax = this.value;
        st.pg = 1;
        render();
      };
      $("pChk").onchange = function () {
        st.chk = this.value;
        st.pg = 1;
        render();
      };
      $("pSort").onchange = function () {
        st.sort = this.value;
        st.pg = 1;
        render();
      };
      function setView(v) {
        st.view = v;
        try {
          localStorage.setItem("gm_pr_view", v);
        } catch (e) {}
        render();
      }
      $("vList").onclick = function () {
        setView("list");
      };
      $("vGrid").onclick = function () {
        setView("grid");
      };
      $("pFoot").onclick = function (e) {
        var b = e.target.closest("[data-p]");
        if (b && !b.disabled) {
          st.pg = +b.dataset.p;
          render();

      /* ---------- import ---------- */
      function csvParse(t) {
        var rows = [],
          row = [],
          cur = "",
          q = false,
          i,
          ch;
        t = t.replace(/^﻿/, "");
        for (i = 0; i < t.length; i++) {
          ch = t[i];
          if (q) {
            if (ch === '"') {
              if (t[i + 1] === '"') {
                cur += '"';
                i++;
              } else q = false;
            } else cur += ch;
          } else if (ch === '"') q = true;
          else if (ch === "," || ch === "\t") {
            row.push(cur.trim());
            cur = "";
          } else if (ch === "\n" || ch === "\r") {
            if (ch === "\r" && t[i + 1] === "\n") i++;
            row.push(cur.trim());
            cur = "";
            if (row.some(Boolean)) rows.push(row);
            row = [];
          } else cur += ch;
        }
        row.push(cur.trim());
        if (row.some(Boolean)) rows.push(row);
        return rows;
      }

        var n = parseFloat(String(v).replace(/[^\d.\-]/g, ""));

        v = String(v || "").trim();
        if (!v) return "";
        if (/exempt/i.test(v)) return "0";
        var m = /(\d+(?:\.\d+)?)\s*%/.exec(v) || /^(\d+(?:\.\d+)?)$/.exec(v);
        return m && PR.TAX.indexOf(m[1]) > -1 ? m[1] : "";
      }
      function readProducts(rows) {
        var hi = -1,

          i;
        var NAME =
            /^(product name|product|item name|item|items|description|particulars|name|product description)$/,
          CODE = /^(code|item code|product code|sku|part no|s\.?\s?code)$/,
          PRICE =
            /^(price|rate|mrp|selling price|sale rate|sales rate|unit price|retail price|s\.?\s?rate)$/,
          CAT = /^(category|item group|group|product category)$/,
          UNIT = /^(unit|uom|pack|pack size|main unit)$/,
          COST = /^(purchase price|purc rate|purchase rate|cost|cost price)$/,
          TAXC = /^(tax rate|gst|gst-sale|gst sale|gst %|tax %)$/,
          HSNC = /^(hsn|hsn\/sac|hsn code|sac)$/,
          ALIAS = /^alias$/,
          PNAME = /^print name$/,
          MRPC = /^(mrp|m\.r\.p\.?|mrp rate)$/,
          SUBU = /^sub unit$/,
          RATIO = /^ratio$/,
          OQ = /^(open qty|opening qty|opening stock)$/,
          OV = /^(open val|opening value)$/,
          AVG = /^avg sales$/,
          BATCH = /^batch$/,
          BOXQ = /^(box qty|box quantity|pcs per box|pieces per box|pcs\/box|case qty|case size|box size|qty per box)$/;
        for (i = 0; i < Math.min(rows.length, 15) && hi < 0; i++) {
          var h = rows[i].map(function (c) {
            return String(c).trim().toLowerCase();
          });
          if (
            h.some(function (c) {
              return NAME.test(c);
            })
          ) {
            hi = i;
            h.forEach(function (c, n) {
              if (c && H[c] == null) H[c] = n;
            });
          }
        }
        if (hi < 0)
          throw new Error(
            "No product column found. The file needs a column named Product or Item Name.",
          );
        function col(re) {
          for (var c in H) if (re.test(c)) return H[c];
          return -1;
        }
        var cn = col(NAME),
          cc = col(CODE),
          cp = col(PRICE),
          cg = col(CAT),
          cu = col(UNIT),
          cs = col(COST),
          ct = col(TAXC),
          ch = col(HSNC),
          ca = col(ALIAS),
          cpn = col(PNAME),
          cm = col(MRPC),
          csu = col(SUBU),
          cr = col(RATIO),
          coq = col(OQ),
          cov = col(OV),
          cav = col(AVG),
          cb = col(BATCH),
          cbx = col(BOXQ),
          out = [],
          skip = [],
          seen = {},
          dup = 0;
        function cell(r, c) {
          return c > -1 ? String(r[c] == null ? "" : r[c]).trim() : "";
        }
        rows.slice(hi + 1).forEach(function (r, n) {
          var name = cell(r, cn)
            .replace(/^\s*-\s*/, "")
            .replace(/\s+/g, " ")
            .trim();
          if (!name) {
            if (
              r.some(function (c) {
                return String(c).trim();
              })
            )
              skip.push("Row " + (hi + n + 2) + ": no product name");
            return;
          }
          var code = cell(r, cc),
            raw = cell(r, cp).replace(/[^\d.\-]/g, ""),
            pr = parseFloat(raw);
          if (cp > -1 && raw && (isNaN(pr) || pr < 0)) {
            skip.push(
              "Row " + (hi + n + 2) + " " + name + ": price is not a number",
            );
            return;
          }
          var x = {
              code: code,
              name: name,
              price: isNaN(pr) ? 0 : pr,
              category: cell(r, cg),
              unit: cell(r, cu),
              cost: parseFloat(cell(r, cs).replace(/[^\d.]/g, "")) || "",
              hsn: cell(r, ch).replace(/\D/g, ""),
              tax: taxOf(cell(r, ct)),
              alias: cell(r, ca),
              printName: cell(r, cpn) === name ? "" : cell(r, cpn),
              mrp: numOf(cell(r, cm)),
              subUnit: cell(r, csu),
              ratio: numOf(cell(r, cr)),
              openQty: numOf(cell(r, coq)),
              openVal: numOf(cell(r, cov)),
              avg: numOf(cell(r, cav)),
              batch: /^(yes|y|true|1)$/i.test(cell(r, cb)),
              boxQty: Math.floor(numOf(cell(r, cbx))) || "",
            },
            key = code ? "C:" + code.toUpperCase() : "N:" + PR.nk(name);
          if (seen[key] != null) {
            dup++;
            out[seen[key]] = x;
            return;
          }
          seen[key] = out.length;
          out.push(x);
        });
        return { list: out, skip: skip, dup: dup };
      }
      function findP(cur, code, name) {
        var i,
          k = PR.nk(name),
          c = String(code || "")
            .trim()
            .toUpperCase();
        if (c)
          for (i = 0; i < cur.length; i++)
            if (String(cur[i].code).toUpperCase() === c) return cur[i];
        if (k)
          for (i = 0; i < cur.length; i++)
            if (PR.nk(cur[i].name) === k) return cur[i];
        return null;
      }
      $("pImp").onclick = function () {
        DP.dialog({
          title: "Import products",
          sub: "Upload a .xlsx or .csv with a Product (or Item Name) column. Code, Category (or Group), Unit, Sale Rate, MRP, Purchase Rate, HSN, GST, Alias, Print Name, Sub Unit, Ratio, Open Qty, Open Val, Avg Sales, Batch and Box Qty (pieces per box) columns are used if present.",
          cls: "dp-small",
          html: '<div class="a-fg"><input class="a-file" type="file" id="xFile" accept=".xlsx,.csv,.txt" aria-label="Product file"></div><div class="msg" id="xMsg" style="margin-bottom:10px"></div><div id="xRes"></div><div class="btn-group"><button class="btn btn-secondary a-btn" data-x2 type="button">Close</button></div>',
          onOpen: function (api) {
            var say = function (m, ok) {
              var e = api.q("#xMsg");
              e.textContent = m;
              e.className = m ? (ok ? "msg ok" : "msg") : "";
            };
            api.q("[data-x2]").onclick = function () {
              api.close();
            };
            api.q("#xFile").onchange = function () {
              var f = this.files[0],
                inp = this;
              if (!f) return;
              say("Reading " + f.name + "...", true);
              api.q("#xRes").innerHTML = "";
              var fr = new FileReader(),
                isX = /\.xlsx$/i.test(f.name);
              fr.onerror = function () {
                say("Could not read that file");
              };
              fr.onload = function () {
                (isX
                  ? XLSXLite.parse(fr.result)
                  : Promise.resolve(csvParse(String(fr.result)))
                )
                  .then(function (rows) {
                    var o = readProducts(rows);
                    if (!o.list.length)
                      throw new Error("No products found in this file");
                    var add = 0,
                      upd = 0,
                      np = 0,
                      cur = PR.load();
                    o.list.forEach(function (x) {
                      if (findP(cur, x.code, x.name)) upd++;
                      else add++;
                      if (!x.price) np++;
                    });
                    say("", true);
                    api.q("#xRes").innerHTML =
                      '<p style="margin-bottom:8px"><b>' +
                      o.list.length +
                      '</b> products found.</p><ul class="mu" style="margin:0 0 12px 18px;line-height:1.7"><li><b>' +
                      add +
                      "</b> new</li><li><b>" +
                      upd +
                      "</b> already in the list (name and price updated)</li>" +
                      (np ? "<li>" + np + " without a price</li>" : "") +
                      (o.dup
                        ? "<li>" +
                          o.dup +
                          " repeated in the file (last one used)</li>"
                        : "") +
                      "</ul>" +
                      (o.skip.length
                        ? '<div class="mu" style="font-size:12px;max-height:120px;overflow:auto;margin-bottom:10px"><b>' +
                          o.skip.length +
                          " rows skipped</b><br>" +
                          o.skip.slice(0, 30).map(esc).join("<br>") +
                          (o.skip.length > 30
                            ? "<br>and " + (o.skip.length - 30) + " more"
                            : "") +
                          "</div>"
                        : "") +
                      '<button class="btn a-btn" id="xGo" type="button" style="margin-bottom:10px">Import ' +
                      o.list.length +
                      " products</button>";
                    api.q("#xGo").onclick = function () {
                      var btn = this,
                        a = 0,
                        u = 0;
                      DP.setBusy(api, btn, true, "Importing...");
                      var c2 = PR.load();
                      o.list.forEach(function (x) {
                        var p = findP(c2, x.code, x.name);
                        if (p) {
                          p.name = x.name;
                          if (x.price || !p.price) p.price = x.price;
                          if (x.code) p.code = x.code;
                          if (x.category && !p.category)
                            p.category = x.category;
                          if (x.unit && !p.unit) p.unit = x.unit;
                          if (
                            x.cost !== "" &&
                            (p.cost === "" || p.cost == null)
                          )
                            p.cost = x.cost;
                          if (x.hsn && !p.hsn) p.hsn = x.hsn;
                          ["alias", "printName", "subUnit"].forEach(
                            function (k) {
                              if (x[k] && !p[k]) p[k] = x[k];
                            },
                          );
                          ["mrp", "ratio", "openQty", "openVal", "avg"].forEach(
                            function (k) {
                              if (
                                x[k] !== "" &&
                                (p[k] === "" || p[k] == null || p[k] === 0)
                              )
                                p[k] = x[k];
                            },
                          );
                          if (x.batch) p.batch = true;
                          if (x.boxQty) p.boxQty = x.boxQty; // a Box Qty column in the file is an explicit instruction
                          if (x.tax !== "" && !p.tax) p.tax = x.tax;
                          u++;
                        } else {
                          c2.push({
                            id: PR.uid(),
                            code: x.code || PR.nextCode(c2),
                            name: x.name,
                            price: x.price,
                            category: x.category,
                            unit: x.unit,
                            cost: x.cost,
                            hsn: x.hsn,
                            tax: x.tax,
                            alias: x.alias,
                            printName: x.printName,
                            mrp: x.mrp,
                            subUnit: x.subUnit,
                            ratio: x.ratio,
                            openQty: x.openQty,
                            openVal: x.openVal,
                            avg: x.avg,
                            batch: x.batch,
                            boxQty: x.boxQty,
                            active: true,
                            at: Date.now(),
                          });
                          a++;
                        }
                      });
                      PR.save(c2).then(function (res) {
                        DP.setBusy(api, btn, false);
                        inp.value = "";
                        if (!res.ok) {
                          say(res.error);
                          return;
                        }
                        L = PR.load();
                        st.pg = 1;
                        api.close();
                        render();
                        toast(
                          "Done: " +
                            a +
                            " added, " +
                            u +
                            " updated" +
                            (o.skip.length
                              ? ", " + o.skip.length + " rows skipped"
                              : "") +
                            ".",
                        );
                      });
                    };
                  })
                  .catch(function (er) {
                    say(String((er && er.message) || er));
                    inp.value = "";
                  });
              };
              if (isX) fr.readAsArrayBuffer(f);
              else fr.readAsText(f);
            };
          },
        });
      };

      /* ---------- import stock (Tally "Stock report" or any Product + Qty file) ---------- */
      function qtyOf(v) {
        var m = /^\s*(-?[\d,]*\.?\d+)/.exec(String(v == null ? "" : v));
        if (!m) return null;
        var n = parseFloat(m[1].replace(/,/g, ""));
        return isNaN(n) ? null : Math.round(n * 1000) / 1000;
      }
      function readStock(rows) {
        var hi = -1,
          H = {},
          i,
          when = "";
        var NAME =
            /^(product name|product|item name|item|items|description|particulars|name)$/,
          SET = /^(close qty|closing qty|closing stock|close stock|stock|qty|quantity|current stock)$/,
          ADD = /^(in qty|received qty|receive qty|add qty|purchase qty|qty|quantity|stock in)$/;
        for (i = 0; i < Math.min(rows.length, 15); i++) {
          var line = rows[i].join(" ");
          var pm = /PERIOD\s+FROM\s+(\d{1,2}\/\d{1,2}\/\d{4})\s+TO\s+(\d{1,2}\/\d{1,2}\/\d{4})/i.exec(line);
          if (pm) when = pm[2];
        }
        for (i = 0; i < Math.min(rows.length, 15) && hi < 0; i++) {
          var h = rows[i].map(function (c) {
            return String(c).trim().toLowerCase();
          });
          if (
            h.some(function (c) {
              return NAME.test(c);
            })
          ) {
            hi = i;
            h.forEach(function (c, n) {
              if (c && H[c] == null) H[c] = n;
            });
          }
        }
        if (hi < 0)
          throw new Error(
            "No product column found. The file needs a column named Item Name or Product.",
          );
        function col(re) {
          for (var c in H) if (re.test(c)) return H[c];
          return -1;
        }
        var cn = col(NAME),
          cs = col(SET),
          ca = col(ADD);
        if (cs < 0 && ca < 0)
          throw new Error(
            "No quantity column found. Use a column named Close Qty, Stock or Qty.",
          );
        var out = [],
          skip = [],
          seen = {},
          dup = 0;
        rows.slice(hi + 1).forEach(function (r, n) {
          var name = String(r[cn] == null ? "" : r[cn])
            .replace(/^\s*-\s*/, "")
            .replace(/\s+/g, " ")
            .trim();
          if (!name) return; // blank and the totals line at the bottom
          var close = cs > -1 ? qtyOf(r[cs]) : null,
            inq = ca > -1 ? qtyOf(r[ca]) : null;
          if (close == null && inq == null) {
            skip.push("Row " + (hi + n + 2) + " " + name + ": no quantity");
            return;
          }
          var k = PR.nk(name),
            x = { name: name, close: close, inq: inq };
          if (seen[k] != null) {
            dup++;
            out[seen[k]] = x;
            return;
          }
          seen[k] = out.length;
          out.push(x);
        });
        return {
          list: out,
          skip: skip,
          dup: dup,
          when: when,
        };
      }
      $("pStk").onclick = function () {
        DP.dialog({
          title: "Import stock",
          sub: "Upload the Stock report (.xlsx) from your billing software, or any .xlsx / .csv with an Item Name column and a Close Qty (or Stock / Qty) column. Prices and other product details are not touched.",
          cls: "dp-small",
          html:
            '<div class="a-fg"><input class="a-file" type="file" id="sFile" accept=".xlsx,.csv,.txt" aria-label="Stock file"></div>' +
            '<div class="a-fg" style="margin:6px 0 10px"><label style="display:block;margin-bottom:6px"><input type="radio" name="sMode" value="set" checked> <b>Replace stock</b> with the closing quantity in the file <span class="mu">(use for the daily stock report)</span></label>' +
            '<label style="display:block;margin-bottom:6px"><input type="radio" name="sMode" value="add"> <b>Add to current stock</b> <span class="mu">(use for goods just received: In Qty / Qty is added)</span></label>' +
            '<label style="display:block"><input type="checkbox" id="sZero"> <span>Set products that are <b>not in the file</b> to 0 stock</span></label></div>' +
            '<div class="msg" id="sMsg" style="margin-bottom:10px"></div><div id="sRes"></div><div class="btn-group"><button class="btn btn-secondary a-btn" data-s2 type="button">Close</button></div>',
          onOpen: function (api) {
            var data = null,
              inp = api.q("#sFile");
            var say = function (m, ok) {
              var e = api.q("#sMsg");
              e.textContent = m;
              e.className = m ? (ok ? "msg ok" : "msg") : "";
            };
            var mode = function () {
              var r = api.q('input[name="sMode"]:checked');
              return r ? r.value : "set";
            };
            api.q("[data-s2]").onclick = function () {
              api.close();
            };
            // work out what the import will do, without saving anything
            function plan() {
              var cur = PR.load(),
                hit = [],
                miss = [],
                neg = 0,
                used = {},
                md = mode(),
                zero = api.q("#sZero").checked,
                noq = 0;
              data.list.forEach(function (x) {
                var p = findP(cur, "", x.name),
                  q = md === "add" ? (x.inq != null ? x.inq : x.close) : x.close;
                if (q == null) {
                  noq++;
                  return;
                }
                if (!p) {
                  miss.push(x.name);
                  return;
                }
                used[p.id] = 1;
                var nv = md === "add" ? (Number(p.track ? p.stock : 0) || 0) + q : q;
                if (nv < 0) neg++;
                hit.push({ p: p, v: Math.max(0, Math.round(nv * 1000) / 1000) });
              });
              var zeroed = zero && md === "set"
                ? cur.filter(function (p) {
                    return PR.isOn(p) && !used[p.id] && p.track && Number(p.stock) > 0;
                  })
                : [];
              return { hit: hit, miss: miss, neg: neg, zeroed: zeroed, noq: noq };
            }
            function show() {
              if (!data) return;
              var P = plan(),
                md = mode();
              api.q("#sRes").innerHTML =
                '<p style="margin-bottom:8px"><b>' +
                P.hit.length +
                '</b> products will be updated' +
                (data.when ? " (stock as on " + esc(data.when) + ")" : "") +
                ".</p>" +
                '<ul class="mu" style="margin:0 0 12px 18px;line-height:1.7">' +
                (P.neg
                  ? "<li>" + P.neg + " have a negative quantity in the file and will be set to 0</li>"
                  : "") +
                (P.zeroed.length
                  ? "<li>" + P.zeroed.length + " products not in the file will be set to 0</li>"
                  : "") +
                (P.miss.length
                  ? "<li>" + P.miss.length + " not found in your product list (skipped): see below</li>"
                  : "") +
                (data.dup ? "<li>" + data.dup + " repeated in the file (last one used)</li>" : "") +
                "</ul>" +
                (P.miss.length
                  ? '<div class="mu" style="font-size:12px;max-height:110px;overflow:auto;margin-bottom:10px"><b>Not in product list</b><br>' +
                    P.miss.slice(0, 30).map(esc).join("<br>") +
                    (P.miss.length > 30 ? "<br>and " + (P.miss.length - 30) + " more" : "") +
                    "</div>"
                  : "") +
                '<button class="btn a-btn" id="sGo" type="button" style="margin-bottom:10px"' +
                (P.hit.length || P.zeroed.length ? "" : " disabled") +
                ">" +
                (md === "add" ? "Add stock to " : "Update stock for ") +
                P.hit.length +
                " products</button>";
              var go = api.q("#sGo");
              if (go)
                go.onclick = function () {
                  var btn = this,
                    c2 = PR.load(),
                    P2 = plan(),
                    now = Date.now(),
                    byId = {};
                  c2.forEach(function (p) {
                    byId[p.id] = p;
                  });
                  DP.setBusy(api, btn, true, "Saving...");
                  P2.hit.forEach(function (h) {
                    var p = byId[h.p.id];
                    if (!p) return;
                    p.stock = h.v;
                    p.track = true; // the Sales app only shows and checks stock for tracked products
                    p.stockAt = now;
                    if (data.when && md === "set") p.stockDate = data.when;
                  });
                  P2.zeroed.forEach(function (z) {
                    var p = byId[z.id];
                    if (!p) return;
                    p.stock = 0;
                    p.stockAt = now;
                  });
                  PR.save(c2).then(function (res) {
                    DP.setBusy(api, btn, false);
                    if (!res.ok) {
                      say(res.error);
                      return;
                    }
                    inp.value = "";
                    L = PR.load();
                    st.pg = 1;
                    api.close();
                    render();
                    toast(
                      "Stock updated for " +
                        P2.hit.length +
                        " products" +
                        (P2.zeroed.length ? ", " + P2.zeroed.length + " set to 0" : "") +
                        ".",
                    );
                  });
                };
            }
            api.q("#sZero").onchange = show;
            api.qa('input[name="sMode"]').forEach(function (r) {
              r.onchange = function () {
                api.q("#sZero").disabled = mode() === "add";
                show();
              };
            });
            inp.onchange = function () {
              var f = this.files[0];
              if (!f) return;
              say("Reading " + f.name + "...", true);
              api.q("#sRes").innerHTML = "";
              data = null;
              var fr = new FileReader(),
                isX = /\.xlsx$/i.test(f.name);
              fr.onerror = function () {
                say("Could not read that file");
              };
              fr.onload = function () {
                (isX
                  ? XLSXLite.parse(fr.result)
                  : Promise.resolve(csvParse(String(fr.result)))
                )
                  .then(function (rows) {
                    data = readStock(rows);
                    if (!data.list.length) throw new Error("No products found in this file");
                    say("", true);
                    show();
                  })
                  .catch(function (er) {
                    say(String((er && er.message) || er));
                    inp.value = "";
                  });
              };
              if (isX) fr.readAsArrayBuffer(f);
              else fr.readAsText(f);
            };
          },
        });
      };

      window.addEventListener("gm-sync", function () {
        L = PR.load();
        render();
      });
      render();
      flash();
    </script>
  </body>
</html>
