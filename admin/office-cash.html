<!doctype html>
<html lang="en">
  <head>
    <script src="../shared/loading.js"></script>
    <script src="../assets/icons.js"></script>
    <script src="../shared/sync.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Office Cash - General Traders</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/admin.css" />
    <script src="../shared/theme.js"></script>
    <style>
.oc-flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 16px}
.oc-step{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
.oc-step i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;background:var(--t-primary);color:var(--primary)}
.oc-step.you{border-color:var(--primary)}.oc-step.you i{background:var(--primary);color:#fff}
.oc-step b{display:block;font-size:14px}.oc-step span{font-size:12.5px;color:var(--muted)}
.oc-card{margin-bottom:16px}
.oc-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.oc-head .card-title{margin:0}.oc-head .btn{width:auto;padding:0 16px}
.oc-note{color:var(--muted);font-size:13px;margin:4px 0 12px}
.oc-list{display:grid;gap:10px}
.oc-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--border);border-radius:14px}
.oc-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--t-primary);color:var(--primary)}
.oc-who{min-width:0}.oc-who b{display:block;font-size:15px}.oc-who span{font-size:12.5px;color:var(--muted)}
.oc-amt{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.oc-btn{width:auto;padding:0 16px;white-space:nowrap}
.oc-row.done{padding:10px 14px}.oc-row.done .oc-amt{font-size:15px}
.oc-empty{padding:28px 12px;text-align:center;color:var(--muted)}.oc-empty b{display:block;color:var(--text);margin-bottom:2px}
@media(max-width:800px){.oc-flow{grid-template-columns:1fr}.oc-row{grid-template-columns:40px minmax(0,1fr) auto}.oc-row .oc-btn,.oc-row .badge{grid-column:2/4}}
</style>
  </head>
  <body>
    <script src="../shared/admin.js"></script>
    <script>
      (function () {
        "use strict";
        GA.guard();
        var pg = GA.mount("office-cash.html", "Office Cash"),
          esc = GA.esc,
          $ = function (id) {
            return document.getElementById(id);
          };
        function money(n) {
          return (
            "₹" +
            Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
          );
        }
        function when(iso) {
          var d = new Date(iso);
          return isNaN(d)
            ? ""
            : d.toLocaleString("en-IN", {
                day: "numeric",
                month: "short",
                year: "numeric",
                hour: "numeric",
                minute: "2-digit",
                timeZone: "Asia/Kolkata",
              });
        }
        function toast(msg) {
          var t = document.createElement("div");
          t.className = "a-toast";
          t.innerHTML = "<div><b>" + esc(msg) + "</b></div>";
          document.body.appendChild(t);
          setTimeout(function () {
            t.classList.add("out");
          }, 2600);
          setTimeout(function () {
            t.remove();
          }, 3200);
        }
        function req(url, opts) {
          return fetch(url, Object.assign({ credentials: "same-origin", headers: { "Content-Type": "application/json" } }, opts || {})).then(
            function (r) {
              return r
                .json()
                .catch(function () {
                  return {};
                })
                .then(function (d) {
                  if (!r.ok) throw new Error(d.error || "Request failed");
                  return d;
                });
            },
          );
        }

        pg.innerHTML =
          '<div class="oc-flow"><div class="oc-step"><i>1</i><div><b>Employee collects</b><span>Cash taken from customers on the route</span></div></div>' +
          '<div class="oc-step"><i>2</i><div><b>Employee hands in</b><span>They submit the deposit in the Sales panel</span></div></div>' +
          '<div class="oc-step you"><i>3</i><div><b>You count and receive</b><span>Tick it below once the cash is in your hand</span></div></div></div>' +
          '<div id="ocStats"></div>' +
          '<div class="card oc-card"><div class="oc-head"><div class="card-title">Waiting for you to count</div><button class="btn btn-outline" id="refresh" type="button">Refresh</button></div>' +
          '<div class="oc-note">Count the cash first, then press Receive. Only then does it become office cash.</div><div class="oc-list" id="pending"><div class="oc-empty">Loading…</div></div></div>' +
          '<div class="card oc-card"><div class="card-title">Recently received</div><div class="oc-list" id="history" style="margin-top:10px"></div></div>';
        var NAMES = {};
        function nm(id) { return NAMES[String(id)] || String(id || "Unknown"); }

        function drawStats(balance, pending, done) {
          var pendingSum = pending.reduce(function (n, x) {
            return n + Number(x.amount || 0);
          }, 0);
          $("ocStats").innerHTML =
            '<div class="a-stats">' +
            GA.tile("s-s", "coin", money(balance), "Office cash", "Counted cash in the office") +
            GA.tile("s-a", "clipboard-list", pending.length, "Waiting to count", money(pendingSum)) +
            GA.tile("s-p", "check-circle", done.length, "Received recently") +
            "</div>";
        }
        function load() {
          return req("/api/accounts/office-cash")
            .then(function (d) {
              var rows = d.movements || [],
                pending = rows.filter(function (x) {
                  return x.status === "recorded";
                }),
                done = rows.filter(function (x) {
                  return x.status === "confirmed";
                });
              drawStats(d.officeBalance, pending, done);
              NAMES = d.names || {};
              $("pending").innerHTML = pending.length
                ? pending.map(function (x) {
                    return '<div class="oc-row"><div class="oc-av">' + esc(nm(x.from_employee_id).charAt(0).toUpperCase()) + '</div><div class="oc-who"><b>' + esc(nm(x.from_employee_id)) + '</b><span>Submitted ' + esc(when(x.recorded_at)) + (x.note ? " · " + esc(String(x.note)) : "") + '</span></div><div class="oc-amt">' + money(x.amount) + '</div><button class="btn btn-success oc-btn" type="button" data-confirm="' + esc(x.id) + '">Count &amp; receive</button></div>';
                  }).join("")
                : '<div class="oc-empty"><b>Nothing to count</b>When an employee submits a cash deposit, it will show here.</div>';
              $("history").innerHTML = done.length
                ? done.slice(0, 15).map(function (x) {
                    return '<div class="oc-row done"><div class="oc-av">' + esc(nm(x.from_employee_id).charAt(0).toUpperCase()) + '</div><div class="oc-who"><b>' + esc(nm(x.from_employee_id)) + '</b><span>Received ' + esc(when(x.confirmed_at || x.recorded_at)) + ' · by ' + esc(nm(x.confirmed_by)) + '</span></div><div class="oc-amt">' + money(x.amount) + '</div><span class="badge b-success">Received</span></div>';
                  }).join("")
                : '<div class="oc-empty">No cash received yet.</div>';
              document.querySelectorAll("[data-confirm]").forEach(function (b) {
                b.onclick = function () {
                  if (!confirm("Have you counted this cash and is it in your hand?")) return;
                  b.disabled = true;
                  req("/api/accounts/office-deposits/" + b.dataset.confirm + "/confirm", { method: "POST", body: "{}" })
                    .then(function () {
                      toast("Cash received into office.");
                      return load();
                    })
                    .catch(function (e) {
                      toast(e.message);
                      b.disabled = false;
                    });
                };
              });
            })
            .catch(function (e) {
              $("pending").innerHTML = '<div class="oc-empty"><b>Could not load</b>' + esc(e.message) + "</div>";
            });
        }
        $("refresh").onclick = load;
        load();
      })();
    </script>
  </body>
</html>
