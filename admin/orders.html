<!doctype html>
<html lang="en">
  <head>
    <script src="../assets/icons.js"></script>
    <script src="../shared/sync.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Management - General Traders Admin</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/admin.css" />
    <script src="../shared/theme.js"></script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/icon-32.png"
    />
    <link rel="apple-touch-icon" href="/assets/icon-180.png" />
    <style>
      .om-sub {
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 14px;
      }
      .om-bar {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }
      .om-bar > * {
        min-width: 0;
      }
      .om-bar input,
      .om-bar select {
        width: 100%;
        height: 42px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0 12px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-size: 14px;
      }
      .om-bar .om-q {
        grid-column: 1 / -1;
      }
      .om-foot label {
        white-space: nowrap;
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 0;
        font-weight: 400;
      }
      .om-foot select {
        width: auto !important;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--card);
        color: var(--text);
        padding: 0 8px;
      }
      @media (max-width: 700px) {
        .om-bar {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .om-k {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .om-kc {
          padding: 10px;
        }
        .om-ki {
          display: none;
        }
      }
      .om-k {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 12px;
        margin-bottom: 14px;
      }
      .om-kc {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        display: flex;
        gap: 12px;
        align-items: center;
        box-shadow: var(--shadow);
      }
      .om-ki {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        flex: none;
      }
      .om-ki svg {
        width: 24px;
        height: 24px;
      }
      .om-kc small {
        display: block;
        color: var(--muted);
        font-size: 12.5px;
      }
      .om-kc b {
        display: block;
        font-size: 22px;
        line-height: 1.25;
      }
      .om-kc em {
        font-style: normal;
        font-size: 12px;
        font-weight: 600;
      }
      .om-up {
        color: var(--success);
      }
      .om-dn {
        color: var(--danger);
      }
      .om-mu {
        color: var(--muted);
        font-weight: 400;
      }
      .om-main {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }
      .om-main.has-d {
        grid-template-columns: minmax(0, 1fr) 380px;
      }
      .om-box {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        box-shadow: var(--shadow);
        min-width: 0;
      }
      .om-tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      .om-tab {
        border: 1px solid transparent;
        background: var(--t-primary);
        color: var(--text);
        border-radius: 10px;
        padding: 9px 14px;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .om-tab.on {
        background: var(--primary);
        color: var(--on-primary);
        font-weight: 600;
      }
      .om-sp {
        flex: 1;
      }
      .om-ib {
        height: 40px;
        min-width: 40px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        border-radius: 10px;
        padding: 0 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: inherit;
        font-size: 14px;
      }
      .om-ib svg {
        width: 18px;
        height: 18px;
      }
      .om-ib.danger {
        color: var(--danger);
      }
      .om-scroll {
        overflow-x: auto;
      }
      .om-t {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      .om-t th {
        text-align: left;
        color: var(--muted);
        font-weight: 600;
        font-size: 12.5px;
        padding: 10px 8px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      .om-t td {
        padding: 10px 8px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      .om-t tbody tr {
        cursor: pointer;
      }
      .om-t tbody tr:hover,
      .om-t tbody tr.sel {
        background: var(--t-primary);
      }
      .om-t td.oc-id,
      .om-t td.oc-dt {
        white-space: nowrap;
      }
      .om-t .r {
        text-align: right;
      }
      .om-av {
        display: inline-grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--t-info);
        color: var(--info);
        font-size: 11px;
        font-weight: 700;
        margin-right: 8px;
        vertical-align: middle;
      }
      .om-s small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .om-st {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 8px;
        font-size: 12.5px;
        font-weight: 600;
      }
      .om-st.placed {
        background: var(--t-success);
        color: var(--success);
      }
      .om-st.draft {
        background: var(--t-info);
        color: var(--info);
      }
      .om-st.cancelled {
        background: var(--t-danger);
        color: var(--danger);
      }
      .om-acts {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }
      .om-acts button {
        width: 34px;
        height: 34px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        border-radius: 9px;
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .om-acts svg {
        width: 17px;
        height: 17px;
      }
      .om-foot {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        margin-top: 12px;
        color: var(--muted);
        font-size: 13px;
      }
      .om-pg {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .om-pg button {
        min-width: 36px;
        height: 36px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        border-radius: 9px;
        cursor: pointer;
        font: inherit;
        display: inline-grid;
        place-items: center;
      }
      .om-pg button.on {
        background: var(--primary);
        color: var(--on-primary);
        border-color: var(--primary);
      }
      .om-pg button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .om-pg svg {
        width: 16px;
        height: 16px;
      }
      .om-empty {
        padding: 36px 12px;
        text-align: center;
        color: var(--muted);
      }
      /* detail panel */
      .om-d {
        position: sticky;
        top: 12px;
      }
      .om-dh {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .om-dh h2 {
        font-size: 18px;
        margin: 0;
        flex: 1;
      }
      .om-dx {
        width: 34px;
        height: 34px;
        border: 0;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .om-dx svg {
        width: 20px;
        height: 20px;
      }
      .om-dt {
        display: flex;
        border-bottom: 1px solid var(--border);
        margin-bottom: 12px;
      }
      .om-dt button {
        flex: 1;
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 10px 4px;
        font: inherit;
        font-size: 13.5px;
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }
      .om-dt button.on {
        color: var(--primary);
        border-bottom-color: var(--primary);
        font-weight: 600;
      }
      .om-dbody {
        max-height: calc(100vh - 260px);
        overflow-y: auto;
      }
      .om-sec {
        margin-bottom: 16px;
      }
      .om-sec h3 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      .om-g {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 14px;
      }
      .om-g div small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .om-g div b {
        font-size: 14px;
        font-weight: 600;
      }
      .om-g .w {
        grid-column: 1/-1;
      }
      .om-it {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .om-it th {
        text-align: left;
        color: var(--muted);
        font-size: 12px;
        padding: 6px 4px;
        border-bottom: 1px solid var(--border);
      }
      .om-it td {
        padding: 7px 4px;
        border-bottom: 1px solid var(--border);
      }
      .om-it .r {
        text-align: right;
      }
      .om-tot {
        display: flex;
        justify-content: space-between;
        padding: 6px 4px;
        font-size: 14px;
      }
      .om-tot.big {
        font-weight: 700;
        font-size: 16px;
      }
      .om-hist {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .om-hist li {
        padding: 8px 0 8px 16px;
        border-left: 2px solid var(--border);
        position: relative;
        font-size: 13.5px;
      }
      .om-hist li::before {
        content: "";
        position: absolute;
        left: -6px;
        top: 13px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--primary);
      }
      .om-hist small {
        display: block;
        color: var(--muted);
      }
      .om-tl {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .om-tl li {
        position: relative;
        padding: 0 0 18px 32px;
        font-size: 13.5px;
      }
      .om-tl li:last-child {
        padding-bottom: 0;
      }
      .om-tl li::before {
        content: "";
        position: absolute;
        left: 11px;
        top: 24px;
        bottom: 0;
        width: 2px;
        background: var(--border);
      }
      .om-tl li:last-child::before {
        display: none;
      }
      .om-tl li.done::before {
        background: var(--primary);
      }
      .om-tl .dot {
        position: absolute;
        left: 0;
        top: 0;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid var(--border);
        background: var(--card, #fff);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }
      .om-tl li.done .dot {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .om-tl li.now .dot {
        border-color: var(--primary);
        color: var(--primary);
      }
      .om-tl li.bad .dot {
        background: #dc2626;
        border-color: #dc2626;
        color: #fff;
      }
      .om-tl b {
        display: block;
      }
      .om-tl li.todo b {
        color: var(--muted);
        font-weight: 600;
      }
      .om-tl small {
        display: block;
        color: var(--muted);
      }
      #omSub[hidden],
      #omBar[hidden],
      #omK[hidden],
      #omMain[hidden],
      #omFull[hidden] {
        display: none !important;
      }
      .om-th {
        display: inline-flex;
        margin-right: -8px;
        vertical-align: middle;
      }
      .om-th img,
      .om-th i {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 2px solid var(--card);
        object-fit: cover;
        background: var(--bg);
        display: grid;
        place-items: center;
        font-style: normal;
        font-weight: 700;
        font-size: 12px;
        color: var(--muted);
        margin-right: 0;
      }
      .om-th > * + * {
        margin-left: -10px;
      }
      .om-more {
        margin-left: 14px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      .om-shp {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .om-shp > i {
        flex: none;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: var(--bg);
        color: var(--primary);
        display: grid;
        place-items: center;
        font-style: normal;
        font-weight: 800;
        font-size: 13px;
      }
      .om-shp b {
        display: block;
      }
      .om-shp small {
        color: var(--muted);
      }
      .om-dt2 small {
        display: block;
        color: var(--muted);
      }
      .of-top {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .of-top h2 {
        margin: 0;
        font-size: 22px;
      }
      .of-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        border-radius: 12px;
        padding: 8px 14px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .of-act {
        margin-left: auto;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .of-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card, 16px);
        padding: 16px 18px;
        margin-bottom: 16px;
      }
      .of-card h3 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      .of-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px;
      }
      .of-tiles > div {
        background: var(--bg);
        border-radius: 12px;
        padding: 12px 14px;
      }
      .of-tiles small,
      .of-kv small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .of-tiles b {
        font-size: 16px;
      }
      .of-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      @media (max-width: 1250px) {
        .of-grid {
          grid-template-columns: 1fr;
        }
      }
      .of-it th.r,
      .of-it td.r {
        white-space: nowrap;
      }
      .of-it {
        width: 100%;
        border-collapse: collapse;
      }
      .of-it th {
        text-align: left;
        font-size: 12px;
        color: var(--muted);
        padding: 8px 6px;
        border-bottom: 1px solid var(--border);
      }
      .of-it td {
        padding: 10px 6px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }
      .of-it .r {
        text-align: right;
      }
      .of-it .pn {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .of-it .pn img,
      .of-it .pn i {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        object-fit: cover;
        background: var(--bg);
        display: grid;
        place-items: center;
        font-style: normal;
        font-weight: 700;
        color: var(--muted);
      }
      .of-it small {
        color: var(--muted);
        display: block;
      }
      .of-tot {
        margin-top: 14px;
        margin-left: auto;
        max-width: 320px;
      }
      .of-tot div {
        display: flex;
        justify-content: space-between;
        padding: 5px 0;
      }
      .of-tot .g {
        border-top: 1px solid var(--border);
        margin-top: 6px;
        padding-top: 10px;
        font-size: 18px;
        font-weight: 800;
        color: var(--primary);
      }
      .of-kv {
        display: grid;
        gap: 10px;
      }
      .of-kv b {
        font-weight: 600;
      }
      .om-tl.h {
        display: flex;
      }
      .om-tl.h li {
        flex: 1;
        min-width: 0;
        padding: 34px 8px 0 0;
      }
      .om-tl.h li::before {
        left: 26px;
        right: 0;
        top: 11px;
        bottom: auto;
        width: auto;
        height: 2px;
        display: block;
      }
      .om-tl.h li:last-child::before {
        display: none;
      }
      @media (max-width: 760px) {
        .om-tl.h {
          display: block;
        }
        .om-tl.h li {
          padding: 0 0 18px 32px;
        }
        .om-tl.h li::before {
          left: 11px;
          right: auto;
          top: 24px;
          bottom: 0;
          width: 2px;
          height: auto;
        }
      }
      .om-dact {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .om-dact button {
        flex: 1;
        justify-content: center;
      }
      .om-pri {
        background: var(--primary) !important;
        color: var(--on-primary) !important;
        border-color: var(--primary) !important;
      }
      .om-scrim {
        display: none;
      }
      @media (max-width: 1100px) {
        .om-main.has-d {
          grid-template-columns: minmax(0, 1fr);
        }
        .om-d {
          position: fixed;
          inset: 0;
          z-index: 60;
          background: var(--bg);
          overflow-y: auto;
          padding: 12px;
        }
        .om-d .om-box {
          min-height: 100%;
        }
        .om-dbody {
          max-height: none;
        }
      }
      @media (max-width: 700px) {
        .om-t thead {
          display: none;
        }
        .om-t,
        .om-t tbody,
        .om-t tr,
        .om-t td {
          display: block;
          width: 100%;
        }
        .om-t tr {
          display: grid;
          grid-template-columns: 1fr auto;
          gap: 2px 10px;
          padding: 12px 4px;
          border-bottom: 1px solid var(--border);
        }
        .om-t td {
          border: 0;
          padding: 0;
        }
        .om-t td.oc-n,
        .om-t td.oc-a,
        .om-t td.oc-i,
        .om-t td.oc-ar,
        .om-t td.oc-ac {
          display: none;
        }
        .om-t td.oc-id {
          font-weight: 700;
        }
        .om-t td.oc-amt {
          text-align: right;
          font-weight: 700;
        }
        .om-t td.oc-st {
          text-align: right;
        }
        .om-t td.oc-sh {
          grid-column: 1;
        }
        .om-t td.oc-dt {
          color: var(--muted);
          font-size: 12.5px;
        }
        .om-g {
          grid-template-columns: 1fr 1fr;
        }
      }
      @page {
        margin: 12mm;
      }
      @media print {
        body > *:not(#omPrint) {
          display: none !important;
        }
        #omPrint {
          display: block !important;
        }
      }
      #omPrint {
        display: none;
      }
    </style>
  </head>
  <body>
    <script src="../shared/mock-data.js"></script>
    <script src="../shared/admin.js"></script>
    <script>
      GA.guard();
      var $ = function (i) {
          return document.getElementById(i);
        },
        esc = GA.esc;
      var pg = GA.mount("orders.html", "Order Management");
      var CAN_DEL = !!(GA.session() || {}).super; // only the Super Admin sees Delete (the server checks again)

      function rd(k, d) {
        try {
          var v = JSON.parse(localStorage.getItem(k));
          return v == null ? d : v;
        } catch (e) {
          return d;
        }
      }
      function istDay(t) {
        return new Date((t == null ? Date.now() : t) + 5.5 * 3600e3)
          .toISOString()
          .slice(0, 10);
      }
      function addDays(ds, n) {
        var d = new Date(ds + "T00:00:00Z");
        d.setUTCDate(d.getUTCDate() + n);
        return d.toISOString().slice(0, 10);
      }
      function daysBetween(a, b) {
        return Math.round(
          (new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 864e5,
        );
      }
      function money(n) {
        return (
          "₹" +
          Number(n || 0).toLocaleString("en-IN", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          })
        );
      }
      function when(t) {
        return new Date(t).toLocaleString("en-IN", {
          day: "numeric",
          month: "short",
          year: "numeric",
          hour: "numeric",
          minute: "2-digit",
          hour12: true,
          timeZone: "Asia/Kolkata",
        });
      }
      function initials(n) {
        var p = String(n || "?")
          .trim()
          .split(/\s+/);

      // Business details printed at the top of the order slip. The Super Admin / Admin sets them in Profile > Business Details.
      function bizInfo() {

      function r2(n) {

      // Products sold by the kilo: under a kilo shows as grams ("500 g"), otherwise "1.5 Kg"
      function qtyText(i) {

      }
      // HSN and GST rate of a line: saved on the order when it was placed, else taken from the product
      function taxInfo(i) {
        var p = prodOf(i.id);
        return {
          hsn: i.hsn != null && i.hsn !== "" ? String(i.hsn) : String(p.hsn || ""),
          rate: i.tax != null ? Number(i.tax) || 0 : Number(p.tax) || 0,

      }
      // GST on top of the price: line GST = amount (after its share of any discount) x rate.
      // Same state (first 2 digits of both GSTINs) = CGST + SGST, different state = IGST.
      function calc(o, cu) {
        var sub = 0;
        o._items.forEach(function (i) {
          sub += Number(i.amount) || 0;
        });
        sub = r2(sub);
        var disc = Math.min(sub, Number(o.discount) || 0),
          f = sub ? (sub - disc) / sub : 1,
          lines = o._items.map(function (i) {
            var t = taxInfo(i),
              amt = r2(i.amount),
              gst = r2(amt * f * (t.rate / 100));
            return {
              i: i,
              hsn: t.hsn,
              rate: t.rate,
              amt: amt,
              gst: gst,
              total: r2(amt + gst),
            };
          }),
          gst = r2(
            lines.reduce(function (t, l) {
              return t + l.gst;

          ),
          sa = String(bizInfo().gstin || "").slice(0, 2),
          ba = String((cu && cu.gstin) || "").slice(0, 2),
          inter = /^\d\d$/.test(sa) && /^\d\d$/.test(ba) && sa !== ba,
          half = r2(gst / 2),
          rates = {};
        lines.forEach(function (l) {
          rates[l.rate] = 1;
        });
        var rl = Object.keys(rates);
        return {
          lines: lines,
          sub: sub,
          disc: r2(disc),
          taxable: r2(sub - disc),
          gst: gst,
          inter: inter,
          cgst: inter ? 0 : half,
          sgst: inter ? 0 : r2(gst - half),
          rate: rl.length === 1 ? Number(rl[0]) : null, // the one rate, when every line has the same
          grand: r2(sub - disc + gst),
        };

          I("print") +

          I("refresh") +

        [].forEach.call($("omTabs").querySelectorAll(".om-tab"), function (b) {

          .filter(function (o) {

        var pbtn = "";

        $("omFoot").innerHTML =

      }
      function find(all, id) {
        return all.filter(function (o) {
          return o.id === id;
        })[0];
      }

      // Order status timeline: real events only (created, each stage the office ticked, or cancelled)
      var STAGES = [
        ["processing", "Processing", "Order is being prepared"],
        ["out", "Out for delivery", "Order is on the way"],
        ["delivered", "Delivered", "Order completed"],
      ];
      function nextStage(o) {
        var g = o.stages || {};
        return o.status === "placed"
          ? STAGES.filter(function (x) {
              return !g[x[0]];
            })[0]
          : null;
      }
      function timeline(o) {
        var g = o.stages || {},
          cx = o.status === "cancelled",
          nx = nextStage(o),
          rows = [
            '<li class="done"><span class="dot">&#10003;</span><b>Order created</b><small>' +
              when(o.t) +
              " · by " +
              esc(o._rep) +
              "</small></li>",
          ];
        STAGES.forEach(function (x) {
          var e = g[x[0]];
          if (e)
            rows.push(
              '<li class="done"><span class="dot">&#10003;</span><b>' +
                x[1] +
                "</b><small>" +
                when(e.at) +
                (e.by ? " · by " + esc(e.by) : "") +
                "</small></li>",
            );
          else if (!cx)
            rows.push(
              '<li class="' +
                (nx && nx[0] === x[0] ? "now" : "todo") +
                '"><span class="dot">&bull;</span><b>' +
                x[1] +
                "</b><small>" +
                x[2] +
                "</small></li>",
            );
        });
        if (cx)
          rows.push(
            '<li class="bad"><span class="dot">&times;</span><b>Cancelled</b><small>' +
              (o.cancelAt ? when(o.cancelAt) : "") +
              (o.cancelBy ? " · by " + esc(o.cancelBy) : "") +
              (o.cancelReason ? " — " + esc(o.cancelReason) : "") +
              "</small></li>",
          );
        return '<ul class="om-tl">' + rows.join("") + "</ul>";
      }

          .then(function (r) {
            return r.json().then(function (j) {
              if (!r.ok) throw new Error(j.error || "Could not update");

        D.innerHTML =

                ? "Mark as Delivered"

            drawDetail(all);

        $("omPr").onclick = function () {
          printOrder(o);

        if ($("omNx"))

      // Super Admin only: permanently removes the order (the server checks this again).
      function removeOrder(o) {
        if (!o) return;
        if (
          !confirm(
            "Delete order " +
              o.id +
              " (" +
              (o.shop || o.code || "") +
              ") permanently?\n\nThis cannot be undone.",
          )
        )
          return;
        fetch("/api/salesadmin/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: o.id }),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              if (!r.ok) throw new Error(j.error || "Could not delete");
            });
          })
          .then(function () {
            var ord = rd("gm_sales_orders_v1", []);
            if (Array.isArray(ord))
              try {
                localStorage.setItem(
                  "gm_sales_orders_v1",
                  JSON.stringify(
                    ord.filter(function (x) {
                      return x && x.id !== o.id;
                    }),
                  ),
                );
              } catch (e) {}
            if (st.sel === o.id) st.sel = "";
            draw();
          })
          .catch(function (e) {
            alert(e.message);
          });
      }

      function cancel(o) {
        var why = prompt("Why is order " + o.id + " being cancelled? (needed)");
        if (!why || why.trim().length < 3) return;
        fetch("/api/salesadmin/cancel", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: o.id, reason: why.trim() }),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              if (!r.ok) throw new Error(j.error || "Could not cancel");
            });
          })
          .then(function () {
            alert("Order cancelled.");
          })
          .catch(function (e) {
            alert(e.message);
          });
      }

      // Print every order in the current list (date, sales person, area, search and status filters), grouped by shop,
      // followed by the total of each product. The browser's print window can save it as a PDF.
      function printAll(L) {
        var live = L.filter(function (o) {
          return o.status !== "cancelled";
        });
        if (!L.length) {
          alert("There are no orders to print for these filters.");
          return;
        }
        if ($("omPrint").parentNode !== document.body)
          document.body.appendChild($("omPrint"));
        var custs = {};
        (rd("gm_admin_v1", {}).customers || []).forEach(function (x) {
          custs[x.code] = x;
        });
        var B = bizInfo(),
          cell = "border:1px solid #999;padding:4px 6px;",
          shops = {},
          items = {},
          tot = { sub: 0, gst: 0, grand: 0 };
        L.forEach(function (o) {
          var k = o.code || o.shop || "-";
          (shops[k] = shops[k] || { code: o.code, name: o.shop || o.code || "-", list: [] }).list.push(o);
        });
        var order = Object.keys(shops).sort(function (a, b) {
          return String(shops[a].name).toLowerCase() < String(shops[b].name).toLowerCase() ? -1 : 1;
        });
        function th(h, al) {
          return '<th style="' + cell + "text-align:" + al + '">' + h + "</th>";
        }
        function td(v, al, b) {
          return '<td style="' + cell + "text-align:" + al + '">' + (b ? "<b>" + v + "</b>" : v) + "</td>";
        }
        var shopHtml = order
          .map(function (k) {
            var sh = shops[k],
              cu = custs[sh.code] || {},
              sTot = 0,
              orders = sh.list
                .slice()
                .sort(function (a, b) {
                  return (a.t || 0) - (b.t || 0);
                })
                .map(function (o) {
                  var cc = calc(o, cu),
                    off = o.status === "cancelled";
                  if (!off) {
                    tot.sub += cc.sub;
                    tot.gst += cc.gst;
                    tot.grand += cc.grand;
                    sTot += cc.grand;
                    cc.lines.forEach(function (l) {
                      var i = l.i,
                        key = (i.id || i.name) + "|" + (i.unit || ""),
                        e = (items[key] = items[key] || { name: i.name || i.id, unit: i.unit || "", qty: 0, amt: 0, shops: {} });
                      e.qty += Number(i.qty) || 0;
                      e.amt += l.amt;
                      e.shops[sh.code || sh.name] = 1;
                    });
                  }
                  return (
                    '<div style="margin:0 0 10px;page-break-inside:avoid;' + (off ? "opacity:.6" : "") + '">' +
                    '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span><b>' +
                    esc(o.id) + "</b> &middot; " + dateOnly(o.t) + ", " + timeOnly(o.t) + " &middot; taken by " + esc(o._rep) +
                    (off ? ' &middot; <b style="color:#b00">CANCELLED' + (o.cancelReason ? " - " + esc(o.cancelReason) : "") + "</b>" : "") +
                    "</span></div>" +
                    '<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="background:#eee">' +
                    th("#", "center") + th("Product", "left") + th("HSN", "center") + th("Qty", "center") + th("Price", "right") + th("Amount", "right") + th("GST", "right") + th("Total", "right") +
                    "</tr></thead><tbody>" +
                    cc.lines
                      .map(function (l, n) {
                        var i = l.i;
                        return (
                          "<tr>" + td(n + 1, "center") + td(esc(i.name || i.id), "left") + td(esc(l.hsn || "-"), "center") +
                          td(esc(qtyText(i)), "center", 1) + td(money(i.price), "right") + td(money(l.amt), "right") +
                          td(money(l.gst) + " (" + l.rate + "%)", "right") + td(money(l.total), "right", 1) + "</tr>"
                        );
                      })
                      .join("") +
                    '<tr style="background:#f6f6f6">' + '<td colspan="5" style="' + cell + 'text-align:right"><b>Order total</b></td>' +
                    td(money(cc.sub - cc.disc), "right") + td(money(cc.gst), "right") + td(money(cc.grand), "right", 1) + "</tr>" +
                    "</tbody></table>" +
                    (o.notes ? '<div style="font-size:11px;margin-top:2px">Notes: ' + esc(o.notes) + "</div>" : "") +
                    "</div>"
                  );
                })
                .join("");
            return (
              '<div style="margin-bottom:14px"><div style="border-top:2px solid #000;border-bottom:1px solid #000;padding:5px 2px;font-size:13px;page-break-after:avoid;display:flex;justify-content:space-between"><span><b>' +
              esc(sh.name) + "</b>" + (sh.code ? " (" + esc(sh.code) + ")" : "") +
              (sh.list[0].area || cu.area ? " &middot; " + esc(sh.list[0].area || cu.area) : "") +
              (cu.phone ? " &middot; " + esc(cu.phone) : "") + "</span><span>" + sh.list.length + (sh.list.length === 1 ? " order" : " orders") +
              (sTot ? " &middot; " + money(sTot) : "") + "</span></div>" +
              (cu.address || cu.gstin ? '<div style="font-size:11px;margin:3px 0 6px;color:#333">' + (cu.address ? esc(cu.address) : "") + (cu.gstin ? " &middot; GSTIN " + esc(cu.gstin) : "") + "</div>" : '<div style="height:6px"></div>') +
              orders + "</div>"
            );
          })
          .join("");
        var itemRows = Object.keys(items)
          .map(function (k) {
            return items[k];
          })
          .sort(function (a, b) {
            return String(a.name).toLowerCase() < String(b.name).toLowerCase() ? -1 : 1;
          });
        var itemHtml =
          '<div style="page-break-before:always"><h3 style="margin:0 0 6px">Item totals (all shops)</h3>' +
          '<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="background:#eee">' +
          th("#", "center") + th("Product", "left") + th("Total qty", "center") + th("Shops", "center") + th("Amount (ex-GST)", "right") +
          "</tr></thead><tbody>" +
          itemRows
            .map(function (e, n) {
              return (
                "<tr>" + td(n + 1, "center") + td(esc(e.name), "left") +
                td(esc(qtyText({ qty: Math.round(e.qty * 1000) / 1000, unit: e.unit })) + (/^kgs?$/i.test(e.unit) ? "" : e.unit ? " " + esc(e.unit) : ""), "center", 1) +
                td(Object.keys(e.shops).length, "center") + td(money(e.amt), "right") + "</tr>"
              );
            })
            .join("") +
          "</tbody></table></div>";
        var range = st.from === st.to ? dateOnly(st.from + "T12:00:00+05:30") : dateOnly(st.from + "T12:00:00+05:30") + " to " + dateOnly(st.to + "T12:00:00+05:30"),
          filt = [
            "Status: " + (st.status === "all" ? "all" : st.status),
            st.rep ? "Sales person: " + esc((L.filter(function (o) { return o.rep === st.rep; })[0] || {})._rep || st.rep) : "",
            st.area ? "Area: " + esc(st.area) : "",
            st.q ? "Search: " + esc(st.q) : "",
          ].filter(Boolean).join(" &middot; ");
        $("omPrint").innerHTML =
          '<div style="font-family:Arial,sans-serif;color:#000;max-width:780px;margin:0 auto">' +
          '<div style="border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px"><h2 style="margin:0">' + esc(B.name || "General Traders") + '</h2><div style="font-size:12px">' +
          (B.address ? esc(B.address) + " &middot; " : "") + (B.phone ? "Phone: " + esc(B.phone) + " &middot; " : "") + (B.gstin ? "GSTIN: " + esc(B.gstin) : "") + "</div></div>" +
          '<h3 style="margin:0 0 4px">Orders report</h3><div style="font-size:12px;margin-bottom:8px">' + range + " &middot; " + filt + "<br>" +
          "<b>" + live.length + "</b> " + (live.length === 1 ? "order" : "orders") + (L.length !== live.length ? " (" + (L.length - live.length) + " cancelled, not counted)" : "") + " from <b>" + order.length + "</b> " + (order.length === 1 ? "shop" : "shops") + " &middot; Subtotal " + money(tot.sub) + " &middot; GST " + money(tot.gst) + " &middot; <b>Total " + money(tot.grand) + "</b></div>" +
          shopHtml + (itemRows.length ? itemHtml : "") + "</div>";
        window.print();
      }

      // Export: one line per product ordered, with HSN, GST and totals
      function exportCsv(L) {
        function c(v) {
          return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
        }
        var custs = {};
        (rd("gm_admin_v1", {}).customers || []).forEach(function (x) {
          custs[x.code] = x;
        });
        var rows = [
          [
            "Order ID",
            "Date",
            "Time",
            "Status",
            "Customer ID",
            "Shop",
            "Phone",
            "GSTIN",
            "Address",
            "Area",
            "Order taken by",
            "Product code",
            "HSN",
            "Product",
            "Unit",
            "Unit price",
            "Qty",
            "Item amount",
            "GST %",
            "GST amount",
            "Line total",
            "Order subtotal",
            "Discount",
            "Taxable value",
            "Order GST",
            "Order total (incl. GST)",
            "Notes",
          ],
        ];
        L.forEach(function (o) {
          var cu = custs[o.code] || {},
            cc = calc(o, cu),
            head = [
              o.id,
              dateOnly(o.t),
              timeOnly(o.t),
              LABEL[o.status] || o.status,
              o.code,
              o.shop,
              cu.phone || "",
              cu.gstin || "",
              cu.address || "",
              o.area || cu.area || "",
              o._rep,
            ],
            lines = cc.lines.length ? cc.lines : [{ i: {}, hsn: "", rate: "", amt: "", gst: "", total: "" }];
          lines.forEach(function (l, n) {
            var i = l.i;
            // order-level amounts appear on the first line only, so adding up a column never counts an order twice
            rows.push(
              head.concat([
                i.code || "",
                l.hsn || "",
                i.name || "",
                i.unit || "",
                i.price != null ? i.price : "",
                i.qty != null ? i.qty : "",
                l.amt,
                l.rate,
                l.gst,
                l.total,
                n === 0 ? cc.sub : "",
                n === 0 ? cc.disc : "",
                n === 0 ? cc.taxable : "",
                n === 0 ? cc.gst : "",
                n === 0 ? cc.grand : "",
                n === 0 ? o.notes || "" : "",
              ]),
            );
          });
        });
        var blob = new Blob(
          [
            "﻿" +
              rows
                .map(function (r) {
                  return r.map(c).join(",");
                })
                .join("\r\n"),
          ],
          {
            type: "text/csv",
          },
        );
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "orders-" + st.from + "-to-" + st.to + ".csv";
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 500);
      }

      draw();
      window.addEventListener("gm-sync", draw);
    </script>
  </body>
