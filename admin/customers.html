<body>

<script>
GA.guard();
var O = GA.ops, S = O.get(), esc = GA.esc, tile = GA.tile;
function $(i) { return document.getElementById(i); }
function cust(c) { return O.cust(S, c); }

var pg = GA.mount('customers.html', 'Customers');
/* GM CUSTOMERS PRODUCTION REDESIGN v1 */
pg.innerHTML =
'<section class="gtc-page" id="gtCustomersPage">' +
  '<div class="gtc-head">' +
    '<div class="gtc-head-copy"><p>Manage shops, customer information and delivery routes</p></div>' +
    '<div class="gtc-head-actions">' +
      '<div class="field a-f" data-act style="width:190px;height:38px"><input type="search" id="cSearch" placeholder="Search customer..." aria-label="Search customers, shops or phone numbers" autocomplete="off"></div>' +
      '<button class="btn btn-secondary a-btn" id="demo" data-act style="display:none">Load demo data</button>' +
      '<button class="btn btn-secondary a-btn" id="imp" data-act>' + GA.icon('plus') + ' Import</button>' +
      '<button class="btn btn-secondary a-btn" id="sugRt" data-act>Suggest routes</button>' +
      '<button class="btn btn-secondary a-btn" id="exp" data-act>Export</button>' +
      '<button class="btn btn-secondary a-btn" id="shopLoc" data-act>Shop locations</button>' +
      '<button class="btn a-btn" id="add" data-act>' + GA.icon('plus') + ' Add customer</button>' +
    '</div>' +
  '</div>' +

  '<div class="gtc-stats" id="stats"></div>' +
  '<div class="msg" id="xPageMsg" style="margin:0 0 12px"></div>' +

  '<section class="gtc-toolbar card">' +
    '<div class="gtc-filters">' +
      '<div class="gtc-filter field a-f"><select id="cArea"><option value="">All areas</option></select></div>' +
      '<div class="gtc-filter field a-f"><select id="cRoute"><option value="">All routes</option></select></div>' +
      '<div class="gtc-filter field a-f"><select id="cSt"><option value="active">Active</option><option value="inactive">Inactive</option><option value="all">All status</option></select></div>' +
      '<div class="gtc-filter field a-f"><select id="cPin"><option value="">All locations</option><option value="yes">Located</option><option value="no">Missing location</option></select></div>' +
      '<div class="gtc-filter field a-f"><select id="cVisit"><option value="">Last visit</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="never">No visit recorded</option></select></div>' +
      '<button class="gtc-clear" id="clearFilters" type="button">Clear filters</button>' +
    '</div>' +
  '</section>' +

  '<section class="gtc-list-card card">' +
    '<div class="gtc-list-head"><div><b>Customer list</b><span id="cCount" class="gtc-count"></span></div><div class="gtc-view-switch" role="group" aria-label="Customer view"><button class="on" type="button" data-view="list">List</button><button type="button" data-view="cards">Cards</button><button type="button" data-view="map">Map</button></div></div>' +
    '<div id="cBulk"></div>' +
    '<div id="cListView" class="gtc-list-view">' +
      '<div class="a-scroll"><table class="a-table gtc-table"><thead><tr><th style="width:38px"><input type="checkbox" id="cAll" title="Select visible customers"></th><th>Customer</th><th>Phone</th><th>Area</th><th>Route</th><th>Address</th><th>Location</th><th>Status</th><th>Last visit</th><th class="gtc-actions-th"></th></tr></thead><tbody id="cBody"></tbody></table></div>' +
    '</div>' +
    '<div id="cCardsView" class="gtc-cards-view" hidden></div>' +
    '<div id="cMapView" class="gtc-map-view" hidden><div id="gtcMapHost"></div></div>' +
    '<div class="gtc-pager" id="cPager"></div>' +
  '</section>' +

  '<aside class="gtc-quick" id="gtcQuick" aria-hidden="true"><div class="gtc-quick-head"><div><span class="gtc-eyebrow">QUICK VIEW</span><h3 id="gtcQuickTitle">Customer</h3></div><button class="gtc-close" id="gtcQuickClose" type="button" aria-label="Close">\u00D7</button></div><div id="gtcQuickBody"></div></aside>' +
  '<div class="gtc-scrim" id="gtcScrim"></div>' +

  '<div class="modal-overlay a-c" id="mo"><div class="modal-sheet" id="mc"></div></div>' +
  '<div class="gtc-detail-overlay" id="gtcDetail"><div class="gtc-detail" id="gtcDetailBody"></div></div>' +
'</section>';
function show(html) { $('mc').innerHTML = '<div class="modal-handle"></div>' + html; $('mo').classList.add('active'); }
function closeM() { $('mo').classList.remove('active'); $('mc').innerHTML = ''; }
$('mo').onclick = function (e) { if (e.target === this) closeM(); };
function fg(label, id, val, extra) { return '<div class="a-fg"><label for="' + id + '">' + label + '</label><div class="field a-f"><input id="' + id + '" value="' + esc(val == null || val === false ? '' : String(val)) + '" ' + (extra || '') + '></div></div>'; }
function err(m, ok) { var e = $('mm'); e.textContent = m; e.className = ok ? 'msg ok' : 'msg'; }
function nextCode() { var m = 0; S.customers.forEach(function (c) { var x = /^C(\d+)$/i.exec(c.code); if (x) m = Math.max(m, +x[1]); }); return 'C' + String(m + 1).padStart(3, '0'); }
function mapLink(la, lo) { return 'https://www.google.com/maps?q=' + encodeURIComponent(la + ',' + lo); }
function parseGeo(t) {
  t = String(t || '').trim(); if (!t) return { empty: true };
  var m = /!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/.exec(t) || /@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/.exec(t) || /[?&](?:q|query|ll|destination)=(-?\d+(?:\.\d+)?)(?:,|%2C)\s*(-?\d+(?:\.\d+)?)/i.exec(t) || /^\(?\s*(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)\s*\)?$/.exec(t);
  if (!m) return { bad: true };
  var la = parseFloat(m[1]), lo = parseFloat(m[2]);
  if (isNaN(la) || isNaN(lo) || Math.abs(la) > 90 || Math.abs(lo) > 180) return { bad: true };
  return { lat: la, lng: lo };
}
function coords() { return parseGeo($('fGeo').value); }
function viewLink() { var c = coords(), a = $('fView'); if (window.gcePrev) window.gcePrev(c); if (c.lat == null) { a.style.display = 'none'; return; } a.href = mapLink(c.lat, c.lng); a.style.display = 'inline-block'; }
function geoCheck() { var c = coords(); viewLink(); if (c.bad) err('Not a valid pin. Paste it like: 10.807993, 76.841984'); else if (c.empty) err(''); else err('Pin accepted. Use the map link to check it.', true); }
function setPos(la, lo) { $('fGeo').value = la.toFixed(6) + ', ' + lo.toFixed(6); viewLink(); $('fGeo').dispatchEvent(new Event('change', { bubbles: true })); }

function gceF(label, id, val, extra, req) { return '<div class="gce-fg"><label for="' + id + '">' + label + (req ? ' <i>*</i>' : '') + '</label><div class="gce-in"><input id="' + id + '" value="' + esc(val == null || val === false ? '' : String(val)) + '" ' + (extra || '') + '></div></div>'; }
window.gcePrev = function (k) {
  var b = $('fMap'); if (!b) return;
  if (!k || k.lat == null) { if (b.getAttribute('data-k')) { b.setAttribute('data-k', ''); b.innerHTML = '<div class="gce-map-ph">Pin not set yet.<br>Use "Find from address" or paste the pin below.</div>'; } return; }
  var key = k.lat.toFixed(5) + ',' + k.lng.toFixed(5); if (b.getAttribute('data-k') === key) return; b.setAttribute('data-k', key);
  b.innerHTML = '<iframe loading="lazy" title="Map" src="https://www.openstreetmap.org/export/embed.html?bbox=' + (k.lng - 0.004) + ',' + (k.lat - 0.003) + ',' + (k.lng + 0.004) + ',' + (k.lat + 0.003) + '&layer=mapnik&marker=' + k.lat + ',' + k.lng + '"></iframe>';
};
function form(c) {
  var e = !!c, r = e && routeOf(c.code), off = e && !!c.inactive;
  show('<div class="gce">' +
    '<div class="gce-head"><div class="gce-hico"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9v11h16V9"/><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9"/><path d="M10 20v-5h4v5"/></svg></div><div class="gce-ht"><h3>' + (e ? 'Edit Customer' : 'Add Customer') + '</h3><p>' + (e ? 'Update customer information and delivery details' : 'Enter the shop details and delivery location') + '</p></div><button type="button" class="gce-x" id="no" aria-label="Close">&times;</button></div>' +
    '<div class="gce-band"><div><span>Customer ID</span><b class="gce-id" id="fCode">' + (e ? esc(c.code) : 'Auto') + '</b></div><div><span>Current status</span><div class="gce-st"><i class="gce-dot"></i><select id="fSt"><option value="a"' + (off ? '' : ' selected') + '>Active</option><option value="i"' + (off ? ' selected' : '') + '>Inactive</option></select></div></div></div>' +
    '<div class="gce-cols"><div class="gce-col">' +
      '<section class="gce-card"><h4>Basic Information<small>Shop details and contact information</small></h4>' +
        gceF('Shop name', 'fN', e && c.name, '', 1) +
        '<div class="gce-two">' + gceF('Phone number', 'fP', e && c.phone, 'inputmode="tel"') + gceF('Alternate phone', 'fP2', e && c.phone2, 'inputmode="tel" placeholder="Alternate phone"') + '</div>' +
        gceF('Area', 'fAr', e && c.area) +
        '<div class="gce-fg"><label for="fA">Address</label><div class="gce-in"><textarea id="fA" rows="3">' + esc(e && c.address ? c.address : '') + '</textarea></div></div>' +
        gceF('GST number', 'fGst', e && c.gstin, 'placeholder="Enter GST number"') +
      '</section>' +
    '</div><div class="gce-col">' +
      '<section class="gce-card"><h4>Location<small>Set shop location on map</small></h4>' +
        '<div class="gce-map" id="fMap" data-k=""><div class="gce-map-ph">Pin not set yet.<br>Use "Find from address" or paste the pin below.</div></div>' +
        '<div class="gce-btns"><button class="gce-btn" id="fFind" type="button">Find from address</button><button class="gce-btn" id="fMe" type="button">Use my location</button></div>' +
        gceF('Location pin (latitude, longitude)', 'fGeo', e && c.lat != null && c.lng != null ? c.lat + ', ' + c.lng : '', 'inputmode="text" autocomplete="off" placeholder="10.807993, 76.841984"') +
        '<a class="gce-link" id="fView" href="#" target="_blank" rel="noopener" style="display:none">Open in Google Maps</a>' +
        gceF('Location place (landmark or area)', 'fL', e && c.place, 'placeholder="Enter landmark or nearby area"') +
      '</section>' +
      '<section class="gce-card"><h4>Route<small>Delivery route for this shop</small></h4><div class="gce-fg"><label for="fR">Route</label><div class="gce-in"><select id="fR"></select></div></div></section>' +
      '<section class="gce-card"><div id="fPhoto"></div></section>' +
    '</div></div>' +
    '<div class="gce-msg msg" id="mm"></div>' +
    '<div class="gce-foot"><span></span><button class="gce-btn soft" id="fSave" type="button" disabled>Save Changes</button><button class="gce-btn pri" id="ok" type="button">Close</button></div>' +
  '</div>');
  routeOptions($('fR'), true); $('fR').value = r ? r.id : '';
  if (window.gpFormPhoto) window.gpFormPhoto(c, $('fPhoto'));
  $('fGeo').oninput = geoCheck; viewLink();
  var FIDS = ['fN', 'fP', 'fP2', 'fAr', 'fA', 'fGst', 'fL', 'fGeo', 'fR', 'fSt'];
  function snap() { return FIDS.map(function (i) { return $(i).value; }).join('\u0001'); }
  var base = snap();
  function dirty() { return snap() !== base; }
  function sync() { var d = dirty(); $('fSave').disabled = !d; $('ok').textContent = d ? 'Cancel' : 'Close'; }
  var gceBox = document.querySelector('.gce'); gceBox.addEventListener('input', sync); gceBox.addEventListener('change', sync);
  $('ok').onclick = closeM;
  $('no').onclick = function () { if (dirty() && !confirm('Discard your unsaved changes?')) return; closeM(); };
  $('fFind').onclick = function () {
    var q = [$('fL').value.trim(), $('fA').value.trim(), $('fAr').value.trim()].filter(Boolean).join(', ');
    if (!q) { err('Enter an address or a place first'); return; }
    if (coords().lat != null && !confirm('Replace the pin already entered?')) return;
    err('Searching...', true);
    fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q)).then(function (x) { return x.json(); }).then(function (d) {
      if (!d.length) { err('No match found. Try a nearby landmark, or type the coordinates.'); return; }
      setPos(parseFloat(d[0].lat), parseFloat(d[0].lon));
      if (!$('fL').value.trim()) $('fL').value = String(d[0].display_name).split(',').slice(0, 2).join(',').trim(); $('fL').dispatchEvent(new Event('change', { bubbles: true }));
      err('Location found. Check it on the map.', true);
    }).catch(function () { err('Could not search (no internet?). Type the coordinates instead.'); });
  };
  $('fMe').onclick = function () {
    if (!navigator.geolocation) { err('This browser cannot give your location'); return; }
    err('Getting your location...', true);
    navigator.geolocation.getCurrentPosition(function (p) { setPos(p.coords.latitude, p.coords.longitude); err('Location set from this device.', true); }, function () { err('Location was blocked. Allow it in the browser, or type the coordinates.'); }, { enableHighAccuracy: true, timeout: 10000 });
  };
  function doSave() {
    var name = $('fN').value.trim(); if (!name) { err('Shop name is required'); return; }
    var k = coords(); if (k.bad) { err('Location pin is not valid. Paste it like: 10.807993, 76.841984, or leave it empty'); return; }
    var x = c, oldArea = c ? String(c.area || '') : '', before = c ? routeOf(c.code) : null, isNew = !x;
    if (!x) { x = { code: nextCode() }; S.customers.push(x); }
    x.name = name; x.area = $('fAr').value.trim(); x.address = $('fA').value.trim(); x.phone = $('fP').value.trim(); x.phone2 = $('fP2').value.trim(); x.gstin = $('fGst').value.trim().toUpperCase(); x.place = $('fL').value.trim();
    x.lat = k.empty ? null : k.lat; x.lng = k.empty ? null : k.lng;
    if ($('fSt').value === 'i') x.inactive = true; else delete x.inactive;
    var rv = $('fR').value, follow = before && rv === before.id && oldArea && before.name.toLowerCase() === oldArea.toLowerCase() && x.area && x.area.toLowerCase() !== oldArea.toLowerCase();
    if (follow) { O.assign(S, x.code, O.areaRoute(S, x.area).id); delete x.noRoute; }
    else { O.assign(S, x.code, rv); if (rv) { delete x.noRoute; if (rv !== (before ? before.id : '')) x.handRoute = true; } else if (before) x.noRoute = true; }
    O.syncRoutes(S); save(); areaOptions(); render();
    c = x; base = snap(); sync(); $('fCode').textContent = x.code; if (window.gpFormPhoto) window.gpFormPhoto(c, $('fPhoto'));
    err(isNew ? 'Customer added (' + x.code + ').' : 'Changes saved.', true);
  }
  $('fSave').onclick = doSave;
}

$('add').onclick = function () { form(null); };
$('shopLoc').onclick = openShopLoc;
function xmsg(m, ok) { var e = $('xMsg') || $('xPageMsg'); e.textContent = m; e.className = ok ? 'msg ok' : 'msg'; }
function normKey(n) { return String(n || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function plan_import(list) {
  var idx = {}, seen = {};
  S.customers.forEach(function (c) { var k = normKey(c.name); if (seen[k]) { seen[k]++; k += '#' + seen[k]; } else seen[k] = 1; idx[k] = c; });
  function find(r) { var c = r.code ? (cust(r.code) || cust(String(r.code).toUpperCase())) : null; return c || idx[r.key] || null; }
  var add = 0, upd = 0; list.forEach(function (r) { if (find(r)) upd++; else add++; });
  return { idx: idx, find: find, add: add, upd: upd };
}
function geoOf(r) {
  var la = String(r.rawLat || '').trim(), lo = String(r.rawLng || '').trim(), lk = String(r.rawLink || '').trim();
  if (la && lo) return parseGeo(la + ', ' + lo);
  if (lk) { if (/goo\.gl|maps\.app|bit\.ly/i.test(lk) && !/[@!=]/.test(lk)) return { short: true }; return parseGeo(lk); }
  return { empty: true };
}
function apply_import(list, mkRoutes, repPins) {
  var P = plan_import(list), pins = 0;
  list.forEach(function (r) {
    var c = P.find(r), isNew = !c, oldArea = isNew ? '' : String(c.area || '');
    if (isNew) { c = { code: (r.code && String(r.code).trim() && !cust(String(r.code).trim())) ? String(r.code).trim() : nextCode() }; S.customers.push(c); c.address = ''; }
    c.name = r.name; if (r.area || isNew) c.area = r.area; if (r.phone) c.phone = r.phone; else if (isNew) c.phone = '';
    if (r.address && (isNew || !String(c.address || '').trim())) c.address = r.address;
    if (r.phone2) c.phone2 = r.phone2; if (r.gstin) c.gstin = r.gstin; if (r.regn) c.regn = r.regn;
    if (r.geo && r.geo.lat != null && (repPins || c.lat == null || c.lng == null)) { c.lat = r.geo.lat; c.lng = r.geo.lng; pins++; }
    if (!isNew && r.area && oldArea && r.area.toLowerCase() !== oldArea.toLowerCase()) { var cr = routeOf(c.code); if (cr && cr.name.toLowerCase() === oldArea.toLowerCase() && !c.handRoute) O.assign(S, c.code, ''); }
  });
  var sr = O.syncRoutes(S);
  save(); return { added: P.add, updated: P.upd, routes: sr.made, pins: pins };
}
function onXFile() {
  var f = this.files[0], inp = this; if (!f) return;
  xmsg('Reading ' + f.name + '...', true);
  var fr = new FileReader(), isX = /\.xlsx$/i.test(f.name);
  fr.onerror = function () { xmsg('Could not read that file'); };
  fr.onload = function () {
    (isX ? XLSXLite.parse(fr.result) : Promise.resolve(csvParse(String(fr.result)))).then(function (rows) {
      if (XLSXLite.bill(rows)) return billShops(rows, f, inp);
      var full = rows.slice(0, 15).some(function (r) { return r.some(function (c) { return /^ledger name$/i.test(String(c).trim()); }); });
      if (!full) return pinOnly(rows, f, inp);
      var o = XLSXLite.optech(rows), list = o.customers; if (!list.length) throw new Error('No customers found in this file');
      var P = plan_import(list), ar = {}, locSkip = [], withPin = 0, hasPin = 0, hasCols = false;
      list.forEach(function (r) {
        if (r.area) ar[r.area] = 1;
        var g = geoOf(r);
        if (g.empty) return; hasCols = true;
        if (g.short) { locSkip.push('Row ' + r.line + ' ' + r.name + ': short Google link cannot be read, paste the coordinates'); return; }
        if (g.bad) { locSkip.push('Row ' + r.line + ' ' + r.name + ': location is not valid'); return; }
        r.geo = g; withPin++;
        var ex = P.find(r); if (ex && ex.lat != null && ex.lng != null) hasPin++;
      });
      var withPhone = list.filter(function (r) { return r.phone; }).length, withGst = list.filter(function (r) { return r.gstin; }).length;
      xmsg('');
      show('<div class="card-title">Import customers</div>' +
        '<p style="margin-bottom:8px"><b>' + list.length + '</b> customers found in <b>' + esc(f.name) + '</b>.</p>' +
        '<ul class="mu" style="margin:0 0 12px 18px;line-height:1.7"><li><b>' + P.add + '</b> new shops will be added</li><li><b>' + P.upd + '</b> shops already here will be updated</li><li>' + Object.keys(ar).length + ' areas (each area becomes a route), ' + withPhone + ' with a phone number, ' + withGst + ' with a GST number</li>' +
        (hasCols ? '<li><b>' + withPin + '</b> shops have a map location in the file' + (hasPin ? ' (' + hasPin + ' of them already have a pin)' : '') + '</li>' : '<li>No location columns in this file, so no pins will change</li>') +
        (o.skipped ? '<li>' + o.skipped + ' extra lines in the file were skipped</li>' : '') + '</ul>' +
        (hasPin ? '<label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:10px"><input type="checkbox" id="xRep" style="margin-top:3px"><span>Replace the ' + hasPin + ' existing pins. Left unticked, they are kept.</span></label>' : '') +
        (locSkip.length ? '<div class="mu" style="font-size:12px;max-height:130px;overflow:auto;margin-bottom:10px"><b>' + locSkip.length + ' locations skipped</b> (the shops themselves are still imported):<br>' + locSkip.slice(0, 30).map(esc).join('<br>') + (locSkip.length > 30 ? '<br>and ' + (locSkip.length - 30) + ' more' : '') + '</div>' : '') +
        '<div class="msg" id="mm" style="margin-bottom:10px"></div><div class="btn-group"><button class="btn btn-secondary a-btn" id="no">Cancel</button><button class="btn a-btn" id="ok">Import ' + list.length + ' customers</button></div>');
      $('no').onclick = function () { closeM(); inp.value = ''; };
      $('ok').onclick = function () {
        var r = apply_import(list, true, $('xRep') && $('xRep').checked); inp.value = ''; areaOptions(); refilter();
        importDone('Done: ' + r.added + ' added, ' + r.updated + ' updated' + (hasCols ? ', ' + r.pins + ' pins saved' : '') + (r.routes ? ', ' + r.routes + ' routes created' : '') + (locSkip.length ? ', ' + locSkip.length + ' locations skipped' : '') + '.');
      };
    }).catch(function (e) { xmsg(String(e && e.message || e)); inp.value = ''; });
  };
  if (isX) fr.readAsArrayBuffer(f); else fr.readAsText(f);
}
function billShops(rows, f, inp) {
  var B = XLSXLite.bill(rows), seen = {}, have = {}, add = [], known = 0;
  S.customers.forEach(function (c) { have[normKey(c.name)] = 1; });
  B.bills.forEach(function (b) { var k = normKey(b.party); if (seen[k]) return; seen[k] = 1; if (have[k]) known++; else add.push(b); });
  xmsg('');

      var m = L.circleMarker(ll, { radius: 8, color: '#ffffff', weight: 2, fillColor: col, fillOpacity: c.inactive ? 0.45 : 0.95 });
      m.bindTooltip(esc(c.name), { direction: 'top', offset: [0, -6] });
      m.bindPopup('<b>' + esc(c.name) + '</b><br>' + esc(c.code) + ' &middot; ' + esc(r ? r.name : 'No route') + (c.address ? '<br>' + esc(c.address) : '') + (c.phone ? '<br>' + esc(c.phone) : '') + '<br><a target="_blank" rel="noopener" href="' + mapLink(c.lat, c.lng) + '">Open in Google Maps</a>');
      m.addTo(CM.layer); pts.push(ll);
    });
    CM.map.invalidateSize(); CM.map.fitBounds(pts, { padding: [30, 30], maxZoom: 15 });
    $('cmInfo').textContent = pin.length + ' shops on the map' + (noPin ? ', ' + noPin + ' without a map location' : '') + '. Colours show the route. Tap a dot for details.';
    $('cmLegend').innerHTML = Object.keys(counts).sort(function (x, y) { return x === '__none' ? 1 : y === '__none' ? -1 : counts[y].n - counts[x].n; }).map(function (k) { var o = counts[k]; return '<span style="display:inline-flex;align-items:center;gap:6px"><i style="width:11px;height:11px;border-radius:50%;background:' + o.col + ';display:inline-block"></i>' + esc(o.name) + ' (' + o.n + ')</span>'; }).join('');
  }, function () {
    cmEmpty('<div class="gtc-map-empty"><b>The map could not be loaded</b><span>Check the internet connection and open the Map tab again.</span></div>');
  });
}
function render() {
  installCustomerBindings();
  var rm=routeMap(), total=S.customers.length, active=S.customers.filter(function(c){return !c.inactive;}).length, inactive=total-active, pinned=S.customers.filter(hasPin).length, noPin=total-pinned;
  $('stats').innerHTML='<div class="gtc-stat"><span class="gtc-stat-icon">\u2301</span><div><b>'+total+'</b><span>Total customers</span></div></div><div class="gtc-stat"><span class="gtc-stat-icon success">\u2713</span><div><b>'+active+'</b><span>Active</span></div></div><div class="gtc-stat"><span class="gtc-stat-icon danger">\u00D7</span><div><b>'+inactive+'</b><span>Inactive</span></div></div><div class="gtc-stat"><span class="gtc-stat-icon info">\u2316</span><div><b>'+pinned+'</b><span>With location</span></div></div><div class="gtc-stat"><span class="gtc-stat-icon muted">\u25CB</span><div><b>'+noPin+'</b><span>Without location</span></div></div>';
  areaOptions();
  var rv=$('cRoute').value; $('cRoute').innerHTML='<option value="">All routes</option><option value="__none">No route ('+noRouteCount()+')</option>'+(S.routes||[]).slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name));}).map(function(r){return '<option value="'+esc(r.id)+'">'+esc(r.name)+' ('+r.codes.length+')</option>';}).join(''); $('cRoute').value=rv;
  var list=customerList();
  if($('cMapView') && !$('cMapView').hidden) renderCustomerMap(list);
  var pages=Math.max(1,Math.ceil(list.length/PS)); if(PG>pages)PG=pages; if(PG<1)PG=1; var from=(PG-1)*PS,part=list.slice(from,from+PS),sc=selCodes();
  $('cCount').textContent=list.length+' '+(list.length===1?'customer':'customers');
  handleCustomerDeepLink();
  $('cBody').innerHTML=part.map(function(c){var r=routeFor(c.code,rm),pin=hasPin(c);return '<tr class="'+(c.inactive?'is-inactive':'')+'"><td><input type="checkbox" data-sel="'+esc(c.code)+'" '+(SEL[c.code]?'checked':'')+'></td><td><button class="gtc-name" data-open="'+esc(c.code)+'" type="button"><b>'+esc(c.name||'Unnamed')+'</b><span>ID: '+esc(c.code||'')+'</span></button></td><td><a class="gtc-phone" href="tel:'+esc(c.phone||'')+'">'+esc(c.phone||'\u2014')+'</a></td><td>'+esc(c.area||'\u2014')+'</td><td>'+(r?'<span class="gtc-route-pill">'+esc(r.name)+'</span>':'<span class="gtc-muted-pill">No route</span>')+'</td><td class="gtc-address">'+esc(c.address||'\u2014')+'</td><td>'+(pin?'<a class="gtc-location yes" target="_blank" rel="noopener" href="'+mapLink(c.lat,c.lng)+'">Located</a>':'<span class="gtc-location no">Missing</span>')+'</td><td><span class="gtc-status '+(c.inactive?'off':'on')+'">'+(c.inactive?'Inactive':'Active')+'</span></td><td>'+fmtLastVisit(c)+'</td><td class="a-act"><button class="gtc-more" data-menu="'+esc(c.code)+'" type="button" aria-label="Customer actions">\u2022\u2022\u2022</button></td></tr>';}).join('') || '<tr><td colspan="10"><div class="a-empty"><b>'+(S.customers.length?'No customers match':'No customers yet')+'</b><span>'+(S.customers.length?'Change the search or filters.':'Use Add customer or Import.')+'</span></div></td></tr>';
  var allOn=part.length&&part.every(function(c){return SEL[c.code];}); $('cAll').checked=!!allOn;
  $('cBulk').innerHTML=sc.length?'<div class="gtc-bulk"><b>'+sc.length+' selected</b>'+(sc.length<list.length?'<button id="bAll" type="button">Select all '+list.length+'</button>':'')+'<span class="grow"></span><div class="field a-f"><select id="bRoute"><option value="">Assign route\u2026</option>'+(S.routes||[]).map(function(x){return '<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>';}).join('')+'<option value="__new">+ New route\u2026</option><option value="__none">No route</option></select></div><button class="btn btn-secondary a-btn" id="bSt" type="button">'+(sc.some(function(k){return !cust(k).inactive;})?'Deactivate':'Activate')+'</button><button class="btn btn-secondary a-btn" id="bDel" type="button">Delete</button><button class="btn btn-secondary a-btn" id="bClr" type="button">Clear</button></div>':'';
  if(sc.length){$('bRoute').onchange=function(){bulkRoute(this.value);};$('bSt').onclick=bulkStatus;$('bDel').onclick=bulkDelete;$('bClr').onclick=function(){SEL={};render();};if($('bAll'))$('bAll').onclick=function(){list.forEach(function(c){SEL[c.code]=1;});render();};}
  $('cAll').onchange=function(){var on=this.checked;part.forEach(function(c){if(on)SEL[c.code]=1;else delete SEL[c.code];});render();};
  document.querySelectorAll('#cBody [data-sel]').forEach(function(b){b.onchange=function(){if(b.checked)SEL[b.dataset.sel]=1;else delete SEL[b.dataset.sel];render();};});
  document.querySelectorAll('#cBody [data-open]').forEach(function(b){b.onclick=function(){openQuick(cust(b.dataset.open));};});
  document.querySelectorAll('#cBody [data-menu]').forEach(function(b){b.onclick=function(){var c=cust(b.dataset.menu); if(!c)return; openQuick(c);};});
  $('cCardsView').innerHTML=part.map(function(c){var r=routeFor(c.code,rm),pin=hasPin(c);return '<article class="gtc-customer-card"><div class="gtc-card-top"><input type="checkbox" data-card-sel="'+esc(c.code)+'" '+(SEL[c.code]?'checked':'')+'><span class="gtc-status '+(c.inactive?'off':'on')+'">'+(c.inactive?'Inactive':'Active')+'</span></div><button class="gtc-card-main" data-card-open="'+esc(c.code)+'" type="button"><b>'+esc(c.name||'Unnamed')+'</b><span>ID: '+esc(c.code||'')+'</span><span>'+esc(c.phone||'No phone')+' \u00B7 '+esc(c.area||'No area')+'</span><span>'+(r?esc(r.name):'No route')+' \u00B7 '+(pin?'Located':'Missing location')+'</span></button><div class="gtc-card-actions"><button class="btn btn-secondary a-btn" data-card-edit="'+esc(c.code)+'" type="button">Edit</button><button class="btn btn-secondary a-btn" data-card-menu="'+esc(c.code)+'" type="button">\u2022\u2022\u2022</button></div></article>';}).join('') || '<div class="a-empty"><b>No customers match</b><span>Change the search or filters.</span></div>';
  document.querySelectorAll('[data-card-sel]').forEach(function(b){b.onchange=function(){if(b.checked)SEL[b.dataset.cardSel]=1;else delete SEL[b.dataset.cardSel];render();};});
  document.querySelectorAll('[data-card-open]').forEach(function(b){b.onclick=function(){openQuick(cust(b.dataset.cardOpen));};});
  document.querySelectorAll('[data-card-edit]').forEach(function(b){b.onclick=function(){form(cust(b.dataset.cardEdit));};});
  document.querySelectorAll('[data-card-menu]').forEach(function(b){b.onclick=function(){openQuick(cust(b.dataset.cardMenu));};});
  $('cPager').innerHTML=list.length?'<span>Showing '+(from+1)+'\u2013'+(from+part.length)+' of '+list.length+' customers</span><span class="grow"></span><label>Rows <select id="cPS">'+[25,50,100,200].map(function(n){return '<option value="'+n+'" '+(n===PS?'selected':'')+'>'+n+'</option>';}).join('')+'</select></label><button class="btn btn-secondary a-btn" id="cPrev" '+(PG<=1?'disabled':'')+'>Previous</button><span>Page '+PG+' of '+pages+'</span><button class="btn btn-secondary a-btn" id="cNext" '+(PG>=pages?'disabled':'')+'>Next</button></label>':'<span></span>';
  if(list.length){$('cPrev').onclick=function(){PG--;render();};$('cNext').onclick=function(){PG++;render();};$('cPS').onchange=function(){PS=+this.value;PG=1;render();};}
}
function areaOptions() {
  var sel=$('cArea'),v=sel.value,a={}; S.customers.forEach(function(c){if(c.area)a[c.area]=(a[c.area]||0)+1;});
  sel.innerHTML='<option value="">All areas</option>'+Object.keys(a).sort().map(function(k){return '<option value="'+esc(k)+'">'+esc(k)+' ('+a[k]+')</option>';}).join(''); sel.value=a[v]?v:'';
}function autoRoutes() { var r = O.syncRoutes(S); if (r.moved) { save(); pmsg(r.moved + ' shops were put on routes by their area' + (r.made ? ' (' + r.made + ' new routes)' : '') + '.', true); } }
(function(){
  var p=new URLSearchParams(location.search), code=p.get('code'), edit=p.get('edit')==='1';
  if(code){ setTimeout(function(){ var c=cust(code); if(c){ openQuick(c); if(edit){ closeQuick(); form(c); } } }, 80); }
})();
autoRoutes();
mergeWorkerPins(); areaOptions(); render();
/* GM routes deep link: customers.html?code=C001 shows that shop; add &edit=1 to open its Edit form (used by the Routes page) */
(function () {
  try {
    var qp = new URLSearchParams(location.search), dl = qp.get('code'); if (!dl) return;
    var dc = cust(dl); if (!dc) return;
    $('cSearch').value = dl; if (dc.inactive) $('cSt').value = 'all'; render();
    if (qp.get('edit') === '1') form(dc);
  } catch (e) {}
})();
