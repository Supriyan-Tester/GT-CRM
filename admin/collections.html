<!doctype html>
<html lang="en">
  <head>
    <script src="../shared/loading.js"></script>
    <script src="../assets/icons.js"></script>
    <script src="../shared/sync.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collections - General Traders</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/admin.css" />
    <script src="../shared/theme.js"></script>
    <style>.co-loading{opacity:.45;pointer-events:none;transition:opacity .15s}
      .co-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 14px;
      }
      .co-bar .grow {
        flex: 1 1 220px;
        min-width: 0;
      }
      .co-bar input,
      .co-bar select {
        height: 40px;
        border: 1px solid var(--border);
        border-radius: var(--radius-btn);
        background: var(--card);
        color: var(--text);
        padding: 0 12px;
        font: inherit;
        max-width: 100%;
      }
      .co-bar input[type="search"] {
        width: 100%;
      }
      .co-seg {
        overflow-x: auto;
        max-width: 100%;
      }
      .co-seg button {
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        flex: none;
      }
      .co-f {
        flex: 0 1 170px;
        min-width: 140px;
      }
      @media (max-width: 560px) {
        .co-f {
          flex: 1 1 140px;
        }
      }
      .co-seg .n {
        margin-left: 6px;
        font-size: 11px;
        opacity: 0.85;
      }
      .co-id {
        font-weight: 700;
      }
      .co-id small,
      .co-cust small {
        display: block;
        color: var(--muted);
        font-weight: 400;
      }
      .co-cust {
        font-weight: 600;
      }
      .co-thumbs {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .co-thumbs img {
        width: 38px;
        height: 38px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid var(--border);
        cursor: zoom-in;
        background: var(--border);
      }
      .co-thumbs span {
        font-size: 12px;
        color: var(--muted);
      }
      td.co-r,
      th.co-r {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .co-sel {
        width: 18px;
        height: 18px;
        cursor: pointer;
      }
      .co-inv b {
        display: block;
      }
      .co-inv small {
        display: block;
        color: var(--muted);
      }
      .co-thumbs .cnt {
        font-size: 11px;
        font-weight: 700;
        color: var(--on-primary);
        background: var(--primary);
        border-radius: 999px;
        padding: 1px 7px;
      }
      .co-rowacts {
        display: flex;
        gap: 6px;
        flex-wrap: nowrap;
        align-items: center;
      }
      .co-rowacts .btn {
        width: auto;
        padding-left: 10px;
        padding-right: 10px;
        white-space: nowrap;
      }
      @media (max-width: 800px) {
        .co-rowacts {
          flex-wrap: wrap;
        }
      }
      .co-bulk {
        display: none;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin: 0 0 12px;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--t-primary);
        font-weight: 600;
      }
      .co-bulk.show {
        display: flex;
      }
      .co-bulk .btn {
        width: auto;
        padding-left: 16px;
        padding-right: 16px;
      }
      .co-pg {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
      }
      .co-pg .btn {
        width: auto;
        padding-left: 16px;
        padding-right: 16px;
      }
      .co-pg .btns {
        display: flex;
        gap: 8px;
      }
      .co-modal {
        position: fixed;
        inset: 0;
        z-index: 120;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(15, 23, 42, 0.55);
      }
      .co-modal.open {
        display: flex;
      }
      .co-card {
        background: var(--card);
        color: var(--text);
        border-radius: 16px;
        width: 100%;
        max-width: 720px;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        padding: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
      .co-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 14px;
      }
      .co-head h2 {
        font-size: 20px;
        margin: 0 10px 0 0;
        display: inline-block;
      }
      .co-kv {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 18px;
        margin-bottom: 16px;
        padding: 14px;
        border-radius: 12px;
        background: var(--t-info);
        border: 1px solid var(--border);
      }
      .co-kv > div:first-child {
        grid-column: 1 / -1;
      }
      .co-kv > div:nth-child(2) b {
        font-size: 20px;
      }
      .co-kv div {
        min-width: 0;
      }
      .co-kv small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .co-kv b {
        overflow-wrap: anywhere;
      }
      .co-sec {
        font-weight: 700;
        margin: 16px 0 8px;
      }
      .co-photos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .co-ph {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 8px;
        background: var(--card);
      }
      .co-ph > a {
        display: block;
      }
      .co-ph .co-pf {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
      }
      .co-ph .co-pf b {
        font-size: 13px;
      }
      .co-openbtn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 6px 10px;
        border: 1px solid var(--primary);
        border-radius: 10px;
        color: var(--primary);
        font-size: 12.5px;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
      }
      .co-openbtn:hover {
        background: var(--t-primary);
      }
      button.co-openbtn {
        background: transparent;
        cursor: pointer;
        font-family: inherit;
      }
      .co-photos img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--border);
      }
      .co-photos small {
        display: block;
        color: var(--muted);
        margin-top: 4px;
      }
      .co-note {
        padding: 12px;
        border-radius: 12px;
        background: var(--t-accent);
        font-size: 13px;
        margin: 14px 0;
      }
      .co-note.bad {
        background: var(--t-danger);
      }
      .co-nh {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .co-nh span {
        font-size: 12.5px;
        color: var(--muted);
      }
      .co-why,
      .co-next {
        margin-top: 10px;
      }
      .co-why small,
      .co-next small {
        display: block;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--muted);
        margin-bottom: 3px;
      }
      .co-next {
        padding-top: 10px;
        border-top: 1px solid rgba(0, 0, 0, 0.1);
      }
      .co-next ul {
        margin: 4px 0 0;
        padding-left: 18px;
      }
      .co-next li {
        margin: 4px 0;
      }
      .co-chk {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin: 14px 0;
        font-size: 14px;
        cursor: pointer;
      }
      .co-chk input {
        margin-top: 3px;
        width: 18px;
        height: 18px;
        flex: none;
      }
      .co-acts {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
      }
      .co-acts .btn {
        width: auto;
        padding-left: 18px;
        padding-right: 18px;
      }
      .co-reject {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
      }
      .co-reject textarea {
        width: 100%;
        min-height: 70px;
        border: 1px solid var(--border);
        border-radius: var(--radius-btn);
        background: var(--card);
        color: var(--text);
        padding: 10px 12px;
        font: inherit;
        resize: vertical;
        margin: 8px 0;
      }
      .co-err {
        color: var(--danger);
        font-size: 13px;
        min-height: 18px;
      }
      .co-zoom {
        z-index: 140;
        cursor: zoom-out;
      }
      .co-zoom img {
        max-width: 100%;
        max-height: calc(100vh - 32px);
        border-radius: 12px;
        background: #fff;
      }
      .co-split {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .co-selall {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: var(--muted);
        margin: 0 0 8px 10px;
        cursor: pointer;
      }
      .co-lst {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: calc(100vh - 300px);
        min-height: 260px;
        overflow-y: auto;
        padding-right: 4px;
      }
      .co-li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        border-radius: 12px;
        border: 1px solid transparent;
        cursor: pointer;
      }
      .co-li:hover {
        background: var(--t-primary);
      }
      .co-li.sel {
        background: var(--t-primary);
        border-color: var(--primary);
      }
      .co-nosel {
        width: 18px;
        flex: none;
      }
      .co-li .th {
        width: 42px;
        height: 42px;
        border-radius: 9px;
        object-fit: cover;
        background: var(--border);
        flex: none;
      }
      .co-li .mid {
        flex: 1;
        min-width: 0;
      }
      .co-li .mid b {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .co-li .mid small {
        display: block;
        color: var(--muted);
        font-size: 12.5px;
      }
      .co-li .rt {
        text-align: right;
        flex: none;
      }
      .co-pane {
        position: sticky;
        top: 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        padding: 16px;
        max-height: calc(100vh - 40px);
        overflow-y: auto;
      }
      .co-pane .co-card {
        background: none;
        box-shadow: none;
        padding: 0;
        max-height: none;
        max-width: none;
        border-radius: 0;
        overflow: visible;
      }
      .co-empty-pane {
        color: var(--muted);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: calc(100vh - 380px);
      }
      #coTabs.co-seg {
        background: none;
        border: 0;
        padding: 0;
        gap: 6px;
        flex-wrap: wrap;
        overflow: visible;
      }
      #coTabs.co-seg button {
        background: rgba(100, 116, 139, 0.1);
        color: var(--muted);
        padding: 8px 16px;
        border-radius: 999px;
        font-weight: 700;
      }
      #coTabs.co-seg button:not(.on):hover {
        background: rgba(100, 116, 139, 0.18);
      }
      #coTabs.co-seg button.on {
        background: var(--primary);
        color: var(--on-primary);
      }
      #coTabs.co-seg .n {
        margin-left: 8px;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 12px;
        opacity: 1;
        background: rgba(0, 0, 0, 0.08);
      }
      #coTabs.co-seg button.on .n {
        background: rgba(255, 255, 255, 0.25);
      }
      @media (max-width: 900px) {
        .co-split {
          grid-template-columns: 1fr;
        }
        .co-pane {
          display: none;
        }
        .co-pane.open {
          display: block;
          position: fixed;
          inset: 12px;
          z-index: 120;
          max-height: none;
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }
      }
      @media (max-width: 560px) {
        .co-kv {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/admin.js"></script>
    <script>
      (function () {
        "use strict";
        GA.guard();
        var pg = GA.mount("collections.html", "Collections"),
          esc = GA.esc;
        var $ = function (id) {
          return document.getElementById(id);
        };
        function money(v) {
          var n = Math.round((Number(v) || 0) * 100) / 100;
          return (
            "₹" +
            n.toLocaleString("en-IN", {
              minimumFractionDigits: Number.isInteger(n) ? 0 : 2,
              maximumFractionDigits: 2,
            })
          );
        }
        function when(iso) {
          var d = new Date(iso);
          return isNaN(d)
            ? ""
            : d.toLocaleString("en-IN", {
                day: "numeric",
                month: "short",
                year: "numeric",
                hour: "numeric",
                minute: "2-digit",
                timeZone: "Asia/Kolkata",
              });
        }
        var METHOD = { cash: "Cash", upi: "UPI", bank_transfer: "Bank transfer" };
        var STATUS = {
          approved: ["b-success", "Approved"],
          pending_approval: ["b-accent", "Pending approval"],
          rejected: ["b-danger", "Rejected"],
          correction_requested: ["b-info", "Correction requested"],
          reversed: ["b-muted", "Reversed"],
        };
        var TABS = [
          ["", "All"],
          ["pending_approval", "Pending"],
          ["approved", "Approved"],
          ["rejected", "Rejected"],
          ["correction_requested", "Correction"],
        ];
        var params = new URLSearchParams(location.search);
        var st = {
          status: TABS.some(function (t) {
            return t[0] === params.get("status");
          })
            ? params.get("status")
            : "",
          q: "",
          method: "",
          from: "",
          to: "",
          page: 1,
        };
        var data = null,
          selId = null,
          busy = false;

        function toast(msg) {
          var t = document.createElement("div");
          t.className = "a-toast";
          t.innerHTML = "<div><b>" + esc(msg) + "</b></div>";
          document.body.appendChild(t);
          setTimeout(function () {
            t.classList.add("out");
          }, 2600);
          setTimeout(function () {
            t.remove();
          }, 3200);
        }
        function api(url, opts) {
          return fetch(
            url,
            Object.assign({ credentials: "same-origin", headers: { "Content-Type": "application/json" } }, opts || {}),
          ).then(function (r) {
            return r
              .json()
              .catch(function () {
                return {};
              })
              .then(function (j) {
                if (!r.ok) throw new Error(j.error || "Something went wrong. Try again.");
                return j;
              });
          });
        }

        pg.innerHTML =
          '<div id="coStats"></div>' +
          '<div class="card">' +
          '<div class="co-bar"><div class="a-seg co-seg" id="coTabs"></div></div>' +
          '<div class="co-bar"><div class="grow"><input type="search" id="coQ" placeholder="Search customer name" aria-label="Search customer name"></div>' +
          '<div class="co-f"><select id="coMethod" aria-label="Payment method"><option value="">All methods</option><option value="cash">Cash</option><option value="upi">UPI</option><option value="bank_transfer">Bank transfer</option></select></div>' +
          '<div class="co-f"><input type="date" id="coFrom" aria-label="From date"></div><div class="co-f"><input type="date" id="coTo" aria-label="To date"></div>' +
          '<button class="btn btn-outline" id="coClear" type="button" style="width:auto;padding:0 16px">Clear</button>' +
          '<button class="btn btn-outline" id="coExport" type="button" style="width:auto;padding:0 16px">' + GA.icon("download") + " Export</button></div>" +
          '<div class="co-bulk" id="coBulk"><span id="coBulkTxt"></span><button class="btn btn-success" id="coBulkGo" type="button">Approve selected</button></div>' +
          '<div class="co-split"><div id="coList"><div class="a-empty">Loading collections…</div></div>' +
          '<aside class="co-pane" id="coModal" aria-live="polite"><div class="co-card" id="coCard"><div class="co-empty-pane"><b>Pick a collection</b><br>Click one on the left to see its details here.</div></div></aside></div></div>' +
          '<div class="co-modal co-zoom" id="coZoom"><img alt="Invoice photo" id="coZoomImg"></div>';

        function drawTabs() {
          $("coTabs").innerHTML = TABS.map(function (t) {
            var n = "";
            if (data && data.stats) {
              var s = data.stats;
              if (t[0] === "pending_approval") n = s.pendingCount;
              else if (t[0] === "approved") n = s.approvedCount;
              else if (t[0] === "rejected") n = s.rejectedCount;
              else if (t[0] === "correction_requested") n = s.correctionCount;
            }
            return (
              '<button type="button" data-st="' + t[0] + '" class="' + (st.status === t[0] ? "on" : "") + '">' +
              t[1] + (n !== "" && n !== undefined ? '<span class="n">' + n + "</span>" : "") + "</button>"
            );
          }).join("");
        }
        // Make the list and the details panel use all the free height under the filters

        function coFit() {

          var sp = document.querySelector(".co-split");

          if (!sp) return;

          if (window.innerWidth <= 900) { sp.style.height = ""; return; }

          sp.style.height = Math.max(380, window.innerHeight - sp.getBoundingClientRect().top - 66) + "px";

        }

        window.addEventListener("resize", coFit);

        function drawStats() {
          var s = data.stats;
          $("coStats").innerHTML =
            '<div class="a-stats">' +
            GA.tile("s-a", "clipboard-list", s.pendingCount, "Waiting for approval", money(s.pendingAmount)) +
            GA.tile("s-s", "check-circle", money(s.approvedMonthAmount), "Approved this month") +
            GA.tile("s-p", "receipt", s.approvedCount, "Approved in total") +
            GA.tile("s-i", "x-circle", s.rejectedCount, "Rejected in total") +
            "</div>";
        }
        function drawList() {
          var rows = data.rows;
          if (!rows.length) {
            $("coList").innerHTML =
              '<div class="a-empty"><b>No collections found</b>' +
              (st.status === "pending_approval" && !st.q && !st.method && !st.from && !st.to
                ? "Once a user submits a collection, it will appear here for you to review."
                : "Try a different name or filter.") +
              "</div>";
            return;
          }
          var from = (data.page - 1) * data.pageSize + 1,
            to = from + rows.length - 1,
            pages = Math.max(1, Math.ceil(data.total / data.pageSize));
          $("coList").innerHTML =
            '<div class="co-selall"><label title="Select all pending"><input type="checkbox" class="co-sel" id="coAll" aria-label="Select all pending"><span class="co-hl">Select all</span></label><span class="co-hi">ID</span><span class="co-hc">Customer</span><span class="co-hp">Invoice photo</span><span class="co-ha">Amount / Status</span></div>' +
            '<div class="co-lst">' +
            rows
              .map(function (x, i) {
                var s = STATUS[x.status] || ["b-muted", esc(x.status)],
                  pend = x.status === "pending_approval",
                  first = x.invoices[0] || {},
                  more = x.invoices.length > 1 ? " +" + (x.invoices.length - 1) + " more" : "";
                return (
                  '<div class="co-li' + (x.id === selId ? " sel" : "") + '" data-open="' + i + '" tabindex="0">' +
                  (pend ? '<input type="checkbox" class="co-sel" data-sel="' + i + '" aria-label="Select collection">' : '<span class="co-nosel"></span>') +
                  (first.evidenceUrl ? '<img class="th" loading="lazy" src="' + esc(first.evidenceUrl) + '" alt="">' : '<span class="th"></span>') +
                  '<span class="co-id">' + esc(x.customer_code || "") + '</span><div class="mid"><b>' + esc(x.customer_name_snapshot) + "</b><small>" + esc(when(x.received_at)) + " · " + esc(METHOD[x.method] || x.method) + (x.visit_ref ? " · Split" : "") + "</small>" +
                  "<small>Invoice " + esc(first.invoiceNo || "") + esc(more) + "</small></div>" +
                  '<div class="rt"><b>' + money(x.total_amount) + '</b><br><span class="badge ' + s[0] + '">' + s[1] + "</span></div></div>"
                );
              })
              .join("") +
            "</div>" +
            '<div class="co-pg"><span>Showing ' + from + "–" + to + " of " + data.total + "</span>" +
            '<div class="btns"><button class="btn btn-outline" id="coPrev" type="button"' + (data.page <= 1 ? " disabled" : "") + ">Previous</button>" +
            '<button class="btn btn-outline" id="coNext" type="button"' + (data.page >= pages ? " disabled" : "") + ">Next</button></div></div>";
          coFit();
          $("coAll").onchange = function () {
            var on = this.checked;
            [].forEach.call(document.querySelectorAll("[data-sel]"), function (c) {
              c.checked = on;
            });
            bulkUpdate();
          };
          $("coPrev").onclick = function () {
            st.page--;
            load();
          };
          $("coNext").onclick = function () {
            st.page++;
            load();
          };
        }
        function filterQuery(page) {
          var qs = new URLSearchParams();
          if (st.status) qs.set("status", st.status);
          if (st.q) qs.set("q", st.q);
          if (st.method) qs.set("method", st.method);
          if (st.from) qs.set("from", st.from);
          if (st.to) qs.set("to", st.to);
          qs.set("page", page);
          return qs.toString();
        }
        var cache = {}, reqN = 0;
        function load(fresh) {
          var key = filterQuery(st.page), n = ++reqN, hit = !fresh && cache[key];
          drawTabs();
          if (hit) {
            data = hit;
            drawStats(); drawList(); bulkUpdate();
          } else if (!data) $("coList").innerHTML = '<div class="a-empty">Loading collections…</div>';
          else $("coList").classList.add("co-loading");
          var skip = data && data.stats && !fresh ? "&nostats=1" : "";
          return api("/api/accounts/collections?" + key + skip)
            .then(function (j) {
              if (n !== reqN) return;
              if (!j.stats && data) j.stats = data.stats;
              cache[key] = j;
              data = j;
              $("coList").classList.remove("co-loading");
              drawTabs();
              drawStats();
              drawList();
              bulkUpdate();
              if (selId && !data.rows.some(function (r) { return r.id === selId; })) closeDetail();
              if (!selId && params.get("open")) {
                var want = params.get("open");
                params.delete("open");
                var hit2 = data.rows.filter(function (r) { return r.id === want; })[0];
                if (hit2) {
                  openDetail(hit2);
                  return;
                }
              }
              if (!selId && st.status === "pending_approval" && data.rows.length) openDetail(data.rows[0]);
            })
            .catch(function (e) {
              if (n !== reqN) return;
              $("coList").classList.remove("co-loading");
              $("coList").innerHTML =
                '<div class="a-empty"><b>Could not load collections</b>' + esc(e.message) +
                '<div style="margin-top:14px"><button class="btn" id="coRetry" type="button" style="width:auto;padding:0 18px">Try again</button></div></div>';
              $("coRetry").onclick = function () { load(true); };
            });
        }

        // ----- Details, approve and reject -----
        function openDetail(x) {
          var pending = x.status === "pending_approval",
            s = STATUS[x.status] || ["b-muted", esc(x.status)],
            inv = x.invoices
              .map(function (v) {
                return (
                  "<tr><td data-label=\"Invoice\"><b>" + esc(v.invoiceNo) + "</b></td><td data-label=\"Bill date\">" + esc(v.invoiceDate) +
                  '</td><td data-label="Bill amount" class="co-r">' + money(v.invoiceAmount) + '</td><td data-label="Collected now" class="co-r"><b>' + money(v.amount) + "</b></td></tr>"
                );
              })
              .join(""),
            photos = x.invoices
              .map(function (v) {
                return (
                  '<div class="co-ph"><img loading="lazy" src="' + esc(v.evidenceUrl) + '" alt="Bill photo for ' + esc(v.invoiceNo) + '" data-zoom="' + esc(v.evidenceUrl) + '" style="cursor:zoom-in" title="Click to enlarge"><div class="co-pf"><b>Invoice ' + esc(v.invoiceNo) + '</b><a class="co-openbtn" href="' + esc(v.evidenceUrl) + '" target="_blank" rel="noopener">View</a></div></div>'
                );
              })
              .join("");
          $("coCard").innerHTML =
            '<div class="co-head"><div><h2>Collection ' + esc(String(x.id).slice(0, 8).toUpperCase()) + '</h2><span class="badge ' + s[0] + '">' + s[1] + "</span></div>" +
            '<button class="btn btn-outline" id="coClose" type="button" style="width:auto;padding:0 16px">Close</button></div>' +
            '<div class="co-kv">' +
            "<div><small>Customer</small><b>" + esc(x.customer_name_snapshot) + " (" + esc(x.customer_code) + ")</b></div>" +
            "<div><small>Amount</small><b>" + money(x.total_amount) + "</b></div>" +
            "<div><small>Collected by</small><b>" + esc(x.collector_name_snapshot) + "</b></div>" +
            "<div><small>Method</small><b>" + esc(METHOD[x.method] || x.method) + "</b></div>" +
            "<div><small>Received</small><b>" + esc(when(x.received_at)) + "</b></div>" +
            (x.note ? "<div><small>Note</small><b>" + esc(x.note) + "</b></div>" : "") +
            (x.status === "approved" ? "<div><small>Approved by</small><b>" + esc(x.approved_by_name || x.approved_by || "") + "</b></div><div><small>Approved on</small><b>" + esc(when(x.approved_at)) + "</b></div>" : "") +
            "</div>" +
            (x.status === "rejected"
              ? '<div class="co-note bad"><div class="co-nh"><b>Rejected' + (x.rejected_by ? " by " + esc(x.rejected_by_name || x.rejected_by) : "") + "</b><span>" + (x.rejected_at ? esc(when(x.rejected_at)) : "") + "</span></div>" +
                '<div class="co-why"><small>Reason</small><div>' + esc(x.rejection_reason || "") + "</div></div>" +
                '<div class="co-next"><small>Next</small><ul>' +
                "<li>Customer balance is <b>not</b> reduced.</li>" +
                "<li>" + esc(x.collector_name_snapshot) + " still holds the " + money(x.total_amount) + ". Settle it with them.</li></ul></div></div>"
              : "") +
            (x.status === "correction_requested"
              ? '<div class="co-note"><div class="co-nh"><b>Correction requested' + (x.correction_requested_by ? " by " + esc(x.correction_requested_by_name || x.correction_requested_by) : "") + "</b><span>" + (x.correction_requested_at ? esc(when(x.correction_requested_at)) : "") + "</span></div>" +
                '<div class="co-why"><small>Note to employee</small><div>' + esc(x.correction_note || "") + "</div></div>" +
                '<div class="co-next"><small>Next</small><ul>' +
                "<li>" + esc(x.collector_name_snapshot) + " records a new collection with the fix.</li>" +
                "<li>This one stays on record.</li></ul></div></div>"
              : "") +
            (x.visit_ref ? '<div class="co-note" id="coSplitInfo">Split visit: this customer paid in more than one way. Loading the other parts...</div>' : "") +
            '<div class="co-sec">Invoices paid</div><div class="a-scroll"><table class="a-table"><thead><tr><th>Invoice</th><th>Bill date</th><th class="co-r">Bill amount</th><th class="co-r">Collected now</th></tr></thead><tbody>' + inv + "</tbody></table></div>" +
            '<div class="co-sec">Bill photos</div><div class="co-photos">' + (photos || '<span class="ad-note">No photos.</span>') + "</div>" +
            (pending
              ? '<div class="co-note">Approving reduces the customer’s outstanding and cannot be undone here. Check the bill photos and the cash or bank money first.</div>' +
                '<label class="co-chk"><input type="checkbox" id="coChecked"><span>I have checked the bill photos and the money received.</span></label>' +
                '<div class="co-acts"><button class="btn btn-success" id="coApprove" type="button" disabled>Approve collection</button></div>' +
                '<div class="co-reject"><b>Reject this collection</b><div class="ad-note" style="color:var(--muted);font-size:12px">The customer’s outstanding stays as it is. The employee will see it as rejected.</div>' +
                '<textarea id="coReason" maxlength="300" placeholder="Reason for rejecting (required)"></textarea>' +
                '<div class="co-acts"><button class="btn btn-danger" id="coReject" type="button">Reject collection</button></div></div>' +
                '<div class="co-reject"><b>Ask for a correction</b><div class="ad-note" style="color:var(--muted);font-size:12px">Use this when the details are wrong (invoice, amount or bill photo). The customer’s outstanding stays as it is, and the employee records the collection again.</div>' +
                '<textarea id="coNote" maxlength="300" placeholder="What should the employee correct? (required)"></textarea>' +
                '<div class="co-acts"><button class="btn btn-outline" id="coCorrect" type="button">Request correction</button></div></div>' +
                '<div class="co-err" id="coErr" role="alert"></div>'
              : "");
          $("coModal").classList.add("open");
          selId = x.id;
          markSel();
          $("coClose").onclick = closeDetail;
          if (x.visit_ref) {
            api("/api/accounts/collections?visit=" + encodeURIComponent(x.visit_ref)).then(function (d) {
              var el = $("coSplitInfo");
              if (!el) return;
              el.innerHTML = "<b>Split visit.</b> The customer paid this visit in more than one way. Each part is approved on its own:<br>" +
                d.rows.map(function (r) {
                  var st2 = STATUS[r.status] || ["b-muted", esc(r.status)];
                  return esc(METHOD[r.method] || r.method) + " " + money(r.total_amount) + ' <span class="badge ' + st2[0] + '">' + st2[1] + "</span>" + (r.id === x.id ? " (this one)" : "");
                }).join("<br>");
            }).catch(function () {
              var el = $("coSplitInfo");
              if (el) el.textContent = "Split visit: this customer paid in more than one way. The other parts could not be loaded.";
            });
          }
          if (pending) {
            $("coChecked").onchange = function () {
              $("coApprove").disabled = !this.checked || busy;
            };
            $("coApprove").onclick = function () {
              act(x, "approve", {}, "Collection approved.");
            };
            $("coReject").onclick = function () {
              var reason = $("coReason").value.trim();
              if (reason.length < 3) {
                $("coErr").textContent = "Enter a reason for rejecting (at least 3 characters).";
                $("coReason").focus();
                return;
              }
              act(x, "reject", { reason: reason }, "Collection rejected.");
            };
            $("coCorrect").onclick = function () {
              var note = $("coNote").value.trim();
              if (note.length < 3) {
                $("coErr").textContent = "Tell the employee what to correct (at least 3 characters).";
                $("coNote").focus();
                return;
              }
              act(x, "request-correction", { note: note }, "Correction requested.");
            };
          }
        }
        function selected() {
          return [].map
            .call(document.querySelectorAll("[data-sel]:checked"), function (c) {
              return data.rows[Number(c.getAttribute("data-sel"))];
            })
            .filter(Boolean);
        }
        function bulkUpdate() {
          var sel = selected(),
            sum = sel.reduce(function (n, x) {
              return n + Number(x.total_amount || 0);
            }, 0);
          $("coBulk").classList.toggle("show", sel.length > 0);
          $("coBulkTxt").textContent = sel.length + " selected \u00B7 " + money(sum);
        }
        // Show an approval on screen straight away (row and tiles), then confirm with the server in the background.
        function localApprove(x) {
          if (!data) return;
          var s = data.stats || (data.stats = {});
          var amt = Number(x.total_amount || 0);
          s.pendingCount = Math.max(0, Number(s.pendingCount || 0) - 1);
          s.pendingAmount = Math.max(0, Number(s.pendingAmount || 0) - amt);
          s.approvedCount = Number(s.approvedCount || 0) + 1;
          s.approvedMonthAmount = Number(s.approvedMonthAmount || 0) + amt;
          if (st.status === "pending_approval") {
            data.rows = data.rows.filter(function (r) {
              return r.id !== x.id;
            });
            data.total = Math.max(0, Number(data.total || 0) - 1);
          } else {
            data.rows.forEach(function (r) {
              if (r.id === x.id) r.status = "approved";
            });
          }
        }
        function approveMany(list) {
          if (busy || !list.length) return;
          busy = true;
          var ok = 0,
            failed = [],
            next = 0;
          function worker() {
            if (next >= list.length) return Promise.resolve();
            var x = list[next++];
            return api("/api/accounts/collections/" + encodeURIComponent(x.id) + "/approve", { method: "POST", body: "{}" })
              .then(
                function () {
                  ok++;
                  localApprove(x);
                },
                function (e) {
                  failed.push(x.customer_name_snapshot + ": " + e.message);
                },
              )
              .then(worker);
          }
          Promise.all([worker(), worker(), worker()])
            .then(function () {
              busy = false;
              drawTabs();
              drawStats();
              drawList();
              bulkUpdate();
              toast(ok + (ok === 1 ? " collection approved." : " collections approved.") + (failed.length ? " " + failed.length + " failed." : ""));
              if (failed.length) alert("Some could not be approved:\n\n" + failed.join("\n"));
              load(true);
            });
        }
        function csvCell(v) {
          v = String(v == null ? "" : v);
          if (/^[=+\-@]/.test(v)) v = "'" + v;
          return '"' + v.replace(/"/g, '""') + '"';
        }
        function exportCsv() {
          var btn = $("coExport");
          btn.disabled = true;
          var out = [["Collection", "Date", "Customer", "Customer code", "Invoices", "Collected by", "Method", "Amount", "Status"]],
            n = 1;
          function next() {
            var qs = filterQuery(n);
            return api("/api/accounts/collections?" + qs).then(function (j) {
              j.rows.forEach(function (x) {
                out.push([
                  String(x.id).slice(0, 8).toUpperCase(),
                  when(x.received_at),
                  x.customer_name_snapshot,
                  x.customer_code,
                  x.invoices.map(function (v) {
                    return v.invoiceNo;
                  }).join(" / "),
                  x.collector_name_snapshot,
                  METHOD[x.method] || x.method,
                  x.total_amount,
                  (STATUS[x.status] || [0, x.status])[1],
                ]);
              });
              if (n * j.pageSize < j.total && n < 40) {
                n++;
                return next();
              }
            });
          }
          next()
            .then(function () {
              var blob = new Blob(["\uFEFF" + out.map(function (r) {
                return r.map(csvCell).join(",");
              }).join("\r\n")], { type: "text/csv;charset=utf-8" });
              var a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download = "collections-" + new Date().toISOString().slice(0, 10) + ".csv";
              document.body.appendChild(a);
              a.click();
              a.remove();
              toast("Exported " + (out.length - 1) + " collections.");
            })
            .catch(function (e) {
              toast(e.message);
            })
            .then(function () {
              btn.disabled = false;
            });
        }
        function markSel() {
          [].forEach.call(document.querySelectorAll(".co-li"), function (el) {
            var r = data && data.rows[Number(el.getAttribute("data-open"))];
            el.classList.toggle("sel", !!r && r.id === selId);
          });
        }
        function closeDetail() {
          $("coModal").classList.remove("open");
          selId = null;
          $("coCard").innerHTML = '<div class="co-empty-pane"><b>Pick a collection</b><br>Click one on the left to see its details here.</div>';
          markSel();
        }
        // After approving or rejecting, open the next one waiting, so you can keep going.
        function pickNext(at) {
          if (!data || (st.status !== "pending_approval" && st.status !== "")) return;
          var rows = data.rows,
            start = Math.max(0, at);
          for (var k = 0; k < rows.length; k++) {
            var r = rows[(start + k) % rows.length];
            if (r.status === "pending_approval") {
              openDetail(r);
              return;
            }
          }
        }
        function act(x, what, body, done) {
          if (busy) return;
          busy = true;
          var b = $(what === "approve" ? "coApprove" : what === "reject" ? "coReject" : "coCorrect");
          b.disabled = true;
          $("coErr").textContent = "";
          api("/api/accounts/collections/" + encodeURIComponent(x.id) + "/" + what, { method: "POST", body: JSON.stringify(body) })
            .then(function () {
              busy = false;
              var at = data
                ? data.rows.findIndex(function (r) {
                    return r.id === x.id;
                  })
                : -1;
              closeDetail();
              toast(done);
              if (what === "approve") {
                localApprove(x);
                drawTabs();
                drawStats();
                drawList();
                bulkUpdate();
                pickNext(at);
              }
              load(true).then(function () {
                if (what !== "approve") pickNext(at);
              });
            })
            .catch(function (e) {
              busy = false;
              b.disabled = what === "approve" && !$("coChecked").checked;
              $("coErr").textContent = e.message;
            });
        }

        // ----- Events -----
        $("coTabs").onclick = function (e) {
          var b = e.target.closest("button[data-st]");
          if (!b) return;
          st.status = b.getAttribute("data-st");
          st.page = 1;
          load();
        };
        var timer;
        $("coQ").oninput = function () {
          clearTimeout(timer);
          var v = this.value;
          timer = setTimeout(function () {
            st.q = v.trim();
            st.page = 1;
            load();
          }, 350);
        };
        $("coMethod").onchange = function () {
          st.method = this.value;
          st.page = 1;
          load();
        };
        $("coFrom").onchange = function () {
          st.from = this.value;
          st.page = 1;
          load();
        };
        $("coTo").onchange = function () {
          st.to = this.value;
          st.page = 1;
          load();
        };
        $("coClear").onclick = function () {
          st.q = st.method = st.from = st.to = "";
          st.page = 1;
          $("coQ").value = $("coMethod").value = $("coFrom").value = $("coTo").value = "";
          load();
        };
        $("coList").addEventListener("keydown", function (e) {
          if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("co-li")) {
            e.preventDefault();
            openDetail(data.rows[Number(e.target.getAttribute("data-open"))]);
          }
        });
        $("coList").onclick = function (e) {
          if (e.target.closest("[data-sel]") || e.target.closest(".co-selall")) return;
          var z = e.target.closest("[data-zoom]");
          if (z) {
            $("coZoomImg").src = z.getAttribute("data-zoom");
            $("coZoom").classList.add("open");
            return;
          }
          var ok = e.target.closest("[data-ok]");
          if (ok) {
            var x = data.rows[Number(ok.getAttribute("data-ok"))];
            if (confirm("Approve " + money(x.total_amount) + " from " + x.customer_name_snapshot + "?\n\nHave you checked the bill photo and the money received? Approving reduces the customer's outstanding.")) approveMany([x]);
            return;
          }
          var no = e.target.closest("[data-no]");
          if (no) {
            openDetail(data.rows[Number(no.getAttribute("data-no"))]);
            if ($("coReason")) $("coReason").focus();
            return;
          }
          var o = e.target.closest("[data-open]");
          if (o) openDetail(data.rows[Number(o.getAttribute("data-open"))]);
        };
        $("coList").onchange = function (e) {
          if (e.target.matches("[data-sel]")) bulkUpdate();
        };
        $("coBulkGo").onclick = function () {
          var sel = selected();
          if (!sel.length) return;
          var sum = sel.reduce(function (n, x) {
            return n + Number(x.total_amount || 0);
          }, 0);
          if (confirm("Approve " + sel.length + " collections totalling " + money(sum) + "?\n\nOnly do this after checking every bill photo and the money received.")) approveMany(sel);
        };
        $("coExport").onclick = exportCsv;
        // Tap a bill photo in the details pop-up: it opens bigger in a pop-up here, not in a new tab.
        $("coCard").addEventListener("click", function (e) {
          var z = e.target.closest("[data-zoom]");
          if (!z) return;
          e.preventDefault();
          $("coZoomImg").src = z.getAttribute("data-zoom");
          $("coZoom").classList.add("open");
        });
        $("coZoom").onclick = function () {
          this.classList.remove("open");
        };
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            $("coZoom").classList.remove("open");
            closeDetail();
          }
        });
        load();
      })();
    </script>
  </body>
</html>
