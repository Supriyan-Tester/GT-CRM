<!doctype html>
<html lang="en">
  <head>
    <script src="../shared/loading.js"></script>
    <script src="../assets/icons.js"></script>
    <script src="../shared/sync.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collections - General Traders</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/admin.css" />
    <script src="../shared/theme.js"></script>
    <style>
      .co-loading {
        opacity: 0.45;
        pointer-events: none;
        transition: opacity 0.15s;
      }
      .co-seg {
        overflow-x: auto;
        max-width: 100%;
      }
      .co-seg button {
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        flex: none;
      }
      .co-seg .n {
        margin-left: 6px;
        font-size: 11px;
        opacity: 0.85;
      }
      .co-id {
        font-weight: 700;
      }
      .co-id small,
      .co-cust small {
        display: block;
        color: var(--muted);
        font-weight: 400;
      }
      .co-cust {
        font-weight: 600;
      }
      .co-thumbs {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .co-thumbs img {
        width: 38px;
        height: 38px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid var(--border);
        cursor: zoom-in;
        background: var(--border);
      }
      .co-thumbs span {
        font-size: 12px;
        color: var(--muted);
      }
      td.co-r,
      th.co-r {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .co-sel {
        width: 18px;
        height: 18px;
        cursor: pointer;
      }
      .co-inv b {
        display: block;
      }
      .co-inv small {
        display: block;
        color: var(--muted);
      }
      .co-thumbs .cnt {
        font-size: 11px;
        font-weight: 700;
        color: var(--on-primary);
        background: var(--primary);
        border-radius: 999px;
        padding: 1px 7px;
      }
      .co-rowacts {
        display: flex;
        gap: 6px;
        flex-wrap: nowrap;
        align-items: center;
      }
      .co-rowacts .btn {
        width: auto;
        padding-left: 10px;
        padding-right: 10px;
        white-space: nowrap;
      }
      @media (max-width: 800px) {
        .co-rowacts {
          flex-wrap: wrap;
        }
      }
      .co-bulk {
        display: none;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin: 0 0 12px;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--t-primary);
        font-weight: 600;
      }
      .co-bulk.show {
        display: flex;
      }
      .co-bulk .btn {
        width: auto;
        padding-left: 16px;
        padding-right: 16px;
      }
      .co-pg {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
      }
      .co-pg .btn {
        width: auto;
        padding-left: 16px;
        padding-right: 16px;
      }
      .co-pg .btns {
        display: flex;
        gap: 8px;
      }
      .co-modal {
        position: fixed;
        inset: 0;
        z-index: 120;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(15, 23, 42, 0.55);
      }
      .co-modal.open {
        display: flex;
      }
      .co-card {
        background: var(--card);
        color: var(--text);
        border-radius: 16px;
        width: 100%;
        max-width: 720px;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        padding: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
      .co-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 14px;
      }
      .co-head h2 {
        font-size: 20px;
        margin: 0 10px 0 0;
        display: inline-block;
      }
      .co-kv {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 18px;
        margin-bottom: 16px;
        padding: 14px;
        border-radius: 12px;
        background: var(--t-info);
        border: 1px solid var(--border);
      }
      .co-kv > div:first-child {
        grid-column: 1 / -1;
      }
      .co-kv > div:nth-child(2) b {
        font-size: 20px;
      }
      .co-kv div {
        min-width: 0;
      }
      .co-kv small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .co-kv b {
        overflow-wrap: anywhere;
      }
      .co-sec {
        font-weight: 700;
        margin: 16px 0 8px;
      }
      .co-photos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .co-ph {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 8px;
        background: var(--card);
      }
      .co-ph > a {
        display: block;
      }
      .co-ph .co-pf {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
      }
      .co-ph .co-pf b {
        font-size: 13px;
      }
      .co-openbtn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 6px 10px;
        border: 1px solid var(--primary);
        border-radius: 10px;
        color: var(--primary);
        font-size: 12.5px;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
      }
      .co-openbtn:hover {
        background: var(--t-primary);
      }
      button.co-openbtn {
        background: transparent;
        cursor: pointer;
        font-family: inherit;
      }
      .co-photos img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--border);
      }
      .co-photos small {
        display: block;
        color: var(--muted);
        margin-top: 4px;
      }
      .co-note {
        padding: 12px;
        border-radius: 12px;
        background: var(--t-accent);
        font-size: 13px;
        margin: 14px 0;
      }
      .co-note.bad {
        background: var(--t-danger);
      }
      .co-nh {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .co-nh span {
        font-size: 12.5px;
        color: var(--muted);
      }
      .co-why,
      .co-next {
        margin-top: 10px;
      }
      .co-why small,
      .co-next small {
        display: block;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--muted);
        margin-bottom: 3px;
      }
      .co-next {
        padding-top: 10px;
        border-top: 1px solid rgba(0, 0, 0, 0.1);
      }
      .co-next ul {
        margin: 4px 0 0;
        padding-left: 18px;
      }
      .co-next li {
        margin: 4px 0;
      }
      .co-chk {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin: 12px 0;
        font-size: 13.5px;
        cursor: pointer;
      }
      .co-chk input {
        margin-top: 2px;
        width: 18px;
        height: 18px;
        flex: none;
      }
      .co-acts {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
      }
      .co-acts .btn {
        width: auto;
        padding-left: 18px;
        padding-right: 18px;
      }

      /* Streamlined action switcher & panels */
      .co-actbox {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
      }
      .co-modes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: 4px;
        border-radius: 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        margin-bottom: 12px;
      }
      .co-modes button {
        height: 36px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s;
      }
      .co-modes button.on {
        background: var(--card);
        color: var(--text);
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
      }
      .co-modes button[data-mode="approve"].on {
        color: var(--success, #16a34a);
      }
      .co-modes button[data-mode="reject"].on {
        color: var(--danger, #dc2626);
      }
      .co-modes button[data-mode="correct"].on {
        color: var(--primary);
      }
      .co-mpane {
        display: none;
      }
      .co-mpane.on {
        display: block;
      }
      .co-mpane textarea {
        width: 100%;
        min-height: 70px;
        border: 1px solid var(--border);
        border-radius: var(--radius-btn);
        background: var(--card);
        color: var(--text);
        padding: 10px 12px;
        font: inherit;
        resize: vertical;
        margin: 6px 0 8px;
        box-sizing: border-box;
      }
      .co-err {
        color: var(--danger);
        font-size: 13px;
        min-height: 18px;
        margin-top: 6px;
      }
      .co-zoom {
        z-index: 140;
        cursor: zoom-out;
      }
      .co-zoom img {
        max-width: 100%;
        max-height: calc(100vh - 32px);
        border-radius: 12px;
        background: #fff;
      }
      .co-split {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .co-selall {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: var(--muted);
        margin: 0 0 8px 10px;
        cursor: pointer;
      }
      .co-lst {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: calc(100vh - 300px);
        min-height: 260px;
        overflow-y: auto;
        padding-right: 4px;
      }
      .co-li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        border-radius: 12px;
        border: 1px solid transparent;
        cursor: pointer;
      }
      .co-li:hover {
        background: var(--t-primary);
      }
      .co-li.sel {
        background: var(--t-primary);
        border-color: var(--primary);
      }
      .co-nosel {
        width: 18px;
        flex: none;
      }
      .co-li .th {
        width: 42px;
        height: 42px;
        border-radius: 9px;
        object-fit: cover;
        background: var(--border);
        flex: none;
      }
      .co-li .mid {
        flex: 1;
        min-width: 0;
      }
      .co-li .mid b {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .co-li .mid small {
        display: block;
        color: var(--muted);
        font-size: 12.5px;
      }
      .co-li .rt {
        text-align: right;
        flex: none;
      }
      .co-pane {
        position: sticky;
        top: 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        padding: 16px;
        max-height: calc(100vh - 40px);
        overflow-y: auto;
      }
      .co-pane .co-card {
        background: none;
        box-shadow: none;
        padding: 0;
        max-height: none;
        max-width: none;
        border-radius: 0;
        overflow: visible;
      }
      .co-empty-pane {
        color: var(--muted);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: calc(100vh - 380px);
      }
      #coTabs.co-seg {
        background: none;
        border: 0;
        padding: 0;
        gap: 6px;
        flex-wrap: wrap;
        overflow: visible;
      }
      #coTabs.co-seg button {
        background: var(--card);
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
        color: var(--muted);
        padding: 8px 16px;
        border-radius: 999px;
        font-weight: 700;
      }
      #coTabs.co-seg button:not(.on):hover {
        background: var(--t-primary);
      }
      #coTabs.co-seg button.on {
        background: var(--primary);
        color: var(--on-primary);
        box-shadow: none;
      }
      #coTabs.co-seg .n {
        margin-left: 8px;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 12px;
        opacity: 1;
        background: rgba(0, 0, 0, 0.08);
      }
      #coTabs.co-seg button.on .n {
        background: rgba(255, 255, 255, 0.25);
      }

      @media (max-width: 900px) {
        .co-split {
          grid-template-columns: 1fr;
        }
        .co-pane {
          display: none;
        }
        .co-pane.open {
          display: block;
          position: fixed;
          inset: 12px;
          z-index: 120;
          max-height: none;
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }
      }
      @media (max-width: 560px) {
        .co-kv {
          grid-template-columns: 1fr;
        }
        .co-modes {
          grid-template-columns: 1fr;
        }
      }

      /* Slim toolbar, filters popover, active chips */
      .co-tb { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
      .co-s {
        flex: 1 1 240px; max-width: 360px; min-width: 0; height: 40px; display: flex; align-items: center; gap: 8px;
        padding: 0 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); color: var(--muted);
      }
      .co-s svg { width: 16px; height: 16px; flex: none; }
      .co-s input[type="search"] {
        flex: 1; min-width: 0; width: auto; height: 36px; min-height: 0; padding: 0; margin: 0; border: 0;
        outline: 0; box-shadow: none; background: none; font: inherit; font-size: 14px; color: var(--text);
      }
      .co-tbr { margin-left: auto; display: flex; align-items: center; gap: 8px; }
      .co-fw { position: relative; }
      .co-btn {
        height: 40px; padding: 0 18px; display: inline-flex; align-items: center; gap: 8px; width: auto;
        border: 1.5px solid var(--primary); border-radius: 999px; background: var(--t-primary);
        color: var(--primary); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
      }
      .co-btn svg { width: 16px; height: 16px; flex: none; }
      .co-btn:hover { filter: brightness(0.97); }
      .co-btn-p { background: var(--primary); color: var(--on-primary); }
      .co-btn-p:hover { filter: brightness(1.08); }
      .co-btn:disabled { opacity: 0.55; cursor: default; }
      .co-badge {
        min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--primary);
        color: var(--on-primary); font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
      }
      .co-badge[hidden] { display: none; }
      .co-pop {
        display: none; position: absolute; top: calc(100% + 8px); right: 0; z-index: 60; width: 380px;
        max-width: calc(100vw - 32px); background: var(--card); border: 1px solid var(--border);
        border-radius: 20px; padding: 16px; box-shadow: 0 16px 40px rgba(15, 23, 42, 0.18);
      }
      .co-pop.open { display: block; }
      .co-pf1 { margin-bottom: 12px; min-width: 0; }
      .co-pf1 label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
      .co-pf2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .co-pop .field, .co-pop select, .co-pop input[type="date"] {
        width: 100%;
        height: 40px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        color: var(--text);
        padding: 0 12px;
        font: inherit;
        font-size: 13.5px;
        box-sizing: border-box;
      }
      .co-pop .field select, .co-pop .field input[type="date"] {
        border: 0; background: transparent; height: 38px; padding: 0 4px; outline: none; cursor: pointer;
      }
      .co-pop .field { display: flex; align-items: center; padding: 0 8px; }
      .co-dd .gt-dd-menu { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 70; max-height: 210px; }
      .co-dd .gt-dd-trigger { min-height: 40px; }
      .co-pact { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 4px; }
      .co-link { border: 0; background: none; color: var(--primary); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; padding: 8px 10px; white-space: nowrap; }
      .co-pact .co-link { color: var(--text); }
      .co-apply {
        height: 40px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--primary);
        color: var(--on-primary); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; width: auto;
      }
      .co-active { display: none; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
      .co-al { color: var(--muted); font-size: 13px; }
      .co-ac {
        display: inline-flex; align-items: center; gap: 2px; height: 32px; padding: 0 4px 0 12px; border-radius: 999px;
        background: var(--card); border: 1px solid var(--border); font-size: 13px; font-weight: 600;
      }
      .co-ac button { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; padding: 4px 8px; }
      .co-ac button:hover { color: var(--text); }
      .co-chips { display: flex; align-items: center; margin-bottom: 12px; }
      #coTabs.co-seg button { padding: 6px 14px; font-size: 13px; }
      #coTabs.co-seg .n { font-size: 11px; padding: 0 6px; margin-left: 6px; }
      @media (max-width: 560px) {
        .co-s { max-width: none; flex-basis: 100%; }
        .co-tbr { margin-left: 0; width: 100%; justify-content: flex-end; }
      }
      .co-tb-hd { flex: 1; margin: 0 12px 0 20px; flex-wrap: nowrap; min-width: 0; }
      .co-tb-hd .co-s { flex: 1 1 200px; max-width: 320px; }
      .co-tb-hd .co-tbr { margin-left: auto; }
      .a-acts .co-tb { margin: 0; flex-wrap: nowrap; gap: 8px; }
      .a-acts .co-s { flex: 0 1 240px; max-width: 240px; height: 40px; }
      .a-acts .co-tbr { margin-left: 0; width: auto; }
      @media (max-width: 900px) {
        .a-acts .co-s { display: none; }
      }
      .ac-col-btn{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:4px 10px;border:1px solid var(--success);border-radius:999px;background:var(--t-success);color:var(--success);font:inherit;font-size:11.5px;font-weight:700;line-height:1.2;cursor:pointer;white-space:nowrap;vertical-align:middle;transition:all .15s}
      .ac-col-btn:hover{background:var(--success);color:#fff}
      .ac-seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
      .ac-seg3 button{height:40px;padding:0 10px;border-radius:var(--radius-btn);border:1px solid var(--border);background:transparent;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
      .ac-seg3 button.on{background:var(--primary);border-color:var(--primary);color:#fff}
    </style>
  </head>
  <body>
    <script src="../shared/admin.js"></script>
    <script>
      (function () {
        "use strict";
        GA.guard();
        var pg = GA.mount("collections.html", "Collections"),
          esc = GA.esc;
        var $ = function (id) {
          return document.getElementById(id);
        };
        function money(v) {
          var n = Math.round((Number(v) || 0) * 100) / 100;
          return (
            "₹" +
            n.toLocaleString("en-IN", {
              minimumFractionDigits: Number.isInteger(n) ? 0 : 2,
              maximumFractionDigits: 2,
            })
          );
        }
        function when(iso) {
          var d = new Date(iso);
          return isNaN(d)
            ? ""
            : d.toLocaleString("en-IN", {
                day: "numeric",
                month: "short",
                year: "numeric",
                hour: "numeric",
                minute: "2-digit",
                timeZone: "Asia/Kolkata",
              });
        }
        var SEARCH_SVG =
          '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
        var DL_SVG =
          '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 20h16"/></svg>';
        var FILTER_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"/><path d="M7 12h10"/><path d="M10 17h4"/></svg>';
        function ico(n) {
          if (n === "search") return SEARCH_SVG;
          if (n === "filter") return FILTER_SVG;
          try {
            var h = GA.icon(n);
            if (h) return h;
          } catch (e) {}
          return n === "download" ? DL_SVG : "";
        }
        var METHOD = {
          cash: "Cash",
          upi: "UPI",
          bank_transfer: "Bank transfer",
          credit: "Pay later",
        };
        var STATUS = {
          approved: ["b-success", "Approved"],
          pending_approval: ["b-accent", "Pending approval"],
          rejected: ["b-danger", "Rejected"],
          correction_requested: ["b-info", "Correction requested"],

            if (next >= list.length) return Promise.resolve();
            var x = list[next++];
            return api(
              "/api/accounts/collections/" +
                encodeURIComponent(x.id) +
                "/approve",
              { method: "POST", body: "{}" },
            )
              .then(
                function () {
                  ok++;
                  localApprove(x);
                },
                function (e) {
                  failed.push(x.customer_name_snapshot + ": " + e.message);
                },
              )
              .then(worker);
          }
          Promise.all([worker(), worker(), worker()]).then(function () {
            busy = false;
            drawTabs();
            drawStats();
            drawList();
            bulkUpdate();
            toast(
              ok +
                (ok === 1
                  ? " collection approved."
                  : " collections approved.") +
                (failed.length ? " " + failed.length + " failed." : ""),
            );
            if (failed.length)
              alert("Some could not be approved:\n\n" + failed.join("\n"));
            load(true);
          });
        }
        function csvCell(v) {
          v = String(v == null ? "" : v);
          if (/^[=+\-@]/.test(v)) v = "'" + v;
          return '"' + v.replace(/"/g, '""') + '"';
        }
        function exportCsv() {
          var btn = $("coExport");
          btn.disabled = true;
          var out = [
              [
                "Collection",
                "Date",
                "Customer",
                "Customer code",
                "Invoices",
                "Collected by",
                "Method",
                "Amount",
                "Status",
              ],
            ],
            n = 1;
          function next() {
            var qs = filterQuery(n);
            return api("/api/accounts/collections?" + qs).then(function (j) {
              j.rows.forEach(function (x) {
                out.push([
                  String(x.id).slice(0, 8).toUpperCase(),
                  when(x.received_at),
                  x.customer_name_snapshot,
                  x.customer_code,
                  x.invoices
                    .map(function (v) {
                      return v.invoiceNo;
                    })
                    .join(" / "),
                  x.collector_name_snapshot,
                  METHOD[x.method] || x.method,
                  x.total_amount,
                  (STATUS[x.status] || [0, x.status])[1],
                ]);
              });
              if (n * j.pageSize < j.total && n < 40) {
                n++;
                return next();
              }
            });
          }
          next()
            .then(function () {
              var blob = new Blob(
                [
                  "\uFEFF" +
                    out
                      .map(function (r) {
                        return r.map(csvCell).join(",");
                      })
                      .join("\r\n"),
                ],
                { type: "text/csv;charset=utf-8" },
              );
              var a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download =
                "collections-" + new Date().toISOString().slice(0, 10) + ".csv";
              document.body.appendChild(a);
              a.click();
              a.remove();
              toast("Exported " + (out.length - 1) + " collections.");
            })
            .catch(function (e) {
              toast(e.message);
            })
            .then(function () {
              btn.disabled = false;
            });
        }
        function markSel() {
          [].forEach.call(document.querySelectorAll(".co-li"), function (el) {
            var r = data && data.rows[Number(el.getAttribute("data-open"))];
            el.classList.toggle("sel", !!r && r.id === selId);
          });
        }
        function closeDetail() {
          $("coModal").classList.remove("open");
          selId = null;
          $("coCard").innerHTML =
            '<div class="co-empty-pane"><b>Pick a collection</b><br>Click one on the left to see its details here.</div>';
          markSel();
        }
        function pickNext(at) {
          if (!data || (st.status !== "pending_approval" && st.status !== ""))
            return;
          var rows = data.rows,
            start = Math.max(0, at);
          for (var k = 0; k < rows.length; k++) {
            var r = rows[(start + k) % rows.length];
            if (r.status === "pending_approval") {
              openDetail(r);
              return;
            }
          }
        }
        function act(x, what, body, done) {
          if (busy) return;
          busy = true;
          var b = $(
            what === "approve"
              ? "coApprove"
              : what === "reject"
                ? "coReject"
                : "coCorrect",
          );
          b.disabled = true;
          $("coErr").textContent = "";
          api(
            "/api/accounts/collections/" +
              encodeURIComponent(x.id) +
              "/" +
              what,
            { method: "POST", body: JSON.stringify(body) },
          )
            .then(function () {
              busy = false;
              var at = data
                ? data.rows.findIndex(function (r) {
                    return r.id === x.id;
                  })
                : -1;
              closeDetail();
              toast(done);
              if (what === "approve") {
                localApprove(x);
                drawTabs();
                drawStats();
                drawList();
                bulkUpdate();
                pickNext(at);
              }
              load(true).then(function () {
                if (what !== "approve") pickNext(at);
              });
            })
            .catch(function (e) {
              busy = false;
              b.disabled = what === "approve" && !$("coChecked").checked;
              $("coErr").textContent = e.message;
            });
        }

        // ----- Events -----
        $("coTabs").onclick = function (e) {
          var b = e.target.closest("button[data-st]");
          if (!b) return;
          st.status = b.getAttribute("data-st");
          st.page = 1;
          load();
        };
        var timer;
        $("coQ").oninput = function () {
          clearTimeout(timer);
          var v = this.value;
          timer = setTimeout(function () {
            st.q = v.trim();
            st.page = 1;
            load();
          }, 350);
        };
        function fmtD(v) {
          var d = new Date(v + "T00:00:00");
          return isNaN(d) ? v : d.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
        }
        function empName(id) {
          var o = [].filter.call($("coEmp").options, function (x) { return x.value === id; })[0];
          return o ? o.textContent : "Employee";
        }
        function drawActive() {
          var chips = [];
          if (st.method) chips.push(["method", "Method: " + (METHOD[st.method] || st.method)]);
          if (st.collector) chips.push(["collector", "Employee: " + empName(st.collector)]);
          if (st.from || st.to) chips.push(["date", st.from && st.to ? fmtD(st.from) + " – " + fmtD(st.to) : st.from ? "From " + fmtD(st.from) : "Until " + fmtD(st.to)]);
          var n = chips.length;
          $("coFcount").textContent = n;
          $("coFcount").hidden = !n;
          var box = $("coActive");
          box.style.display = n ? "flex" : "none";
          box.innerHTML = n
            ? '<span class="co-al">Active filters</span>' +
              chips.map(function (c) {
                return '<span class="co-ac">' + esc(c[1]) + '<button type="button" data-rm="' + c[0] + '" aria-label="Remove filter">×</button></span>';
              }).join("") +
              '<button class="co-link" type="button" data-clearall>Clear all</button>'
            : "";
        }
        function syncFields() {
          $("coMethod").value = st.method;
          $("coEmp").value = st.collector;
          $("coFrom").value = st.from;
          $("coTo").value = st.to;
          ["coMethod", "coEmp"].forEach(function (id) {
            var el = $(id);
            if (el) el.dispatchEvent(new Event("change", { bubbles: true }));
          });
        }
        function setPop(open) {
          if (open) syncFields();
          if (!open) closeAllDd();
          $("coPop").classList.toggle("open", open);
          $("coFbtn").setAttribute("aria-expanded", open ? "true" : "false");
        }
        function applyFilters() {
          st.page = 1;
          drawActive();
          load(true);
        }
        function clearFilters() {
          st.method = st.collector = st.from = st.to = "";
          syncFields();
          applyFilters();
        }
        $("coFbtn").onclick = function (e) {
          e.stopPropagation();
          setPop(!$("coPop").classList.contains("open"));
        };
        $("coPop").addEventListener("click", function (e) {
          e.stopPropagation();
          if (!e.target.closest || !e.target.closest(".co-dd")) closeAllDd();
        });
        document.addEventListener("click", function (e) {
          var t = e.target;
          if (!t || !t.isConnected) return;
          if (t.closest(".co-fw, .gt-dd-menu, .gt-dd, .gtp-pop, .gtp-back, .gt-calendar-popup, .gt-cal-pop")) return;
          setPop(false);
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            if (closeAllDd()) return;
            setPop(false);
          }
        });
        $("coApply").onclick = function (e) {
          e.preventDefault();
          st.method = $("coMethod").value;
          st.collector = $("coEmp").value;
          st.from = $("coFrom").value;
          st.to = $("coTo").value;
          setPop(false);
          applyFilters();
        };
        $("coPClear").onclick = function (e) {
          e.preventDefault();
          setPop(false);
          clearFilters();
        };
        $("coActive").onclick = function (e) {
          if (e.target.closest("[data-clearall]")) {
            clearFilters();
            return;
          }
          var r = e.target.closest("[data-rm]");
          if (!r) return;
          var k = r.getAttribute("data-rm");
          if (k === "method") st.method = "";
          else if (k === "collector") st.collector = "";
          else st.from = st.to = "";
          syncFields();
          applyFilters();
        };
        var ddAll = [];
        function closeAllDd() {
          var any = false;
          ddAll.forEach(function (d) {
            if (d.isOpen()) any = true;
            d.setOpen(false);
          });
          return any;
        }
        function ddBuild(sel) {
          var wrap = sel.parentNode;
          wrap.classList.add("gt-dd", "co-dd");
          sel.style.display = "none";
          var trg = document.createElement("button");
          trg.type = "button";
          trg.className = "gt-dd-trigger";
          trg.setAttribute("aria-haspopup", "listbox");
          trg.setAttribute("aria-expanded", "false");
          trg.innerHTML = '<span class="gt-dd-label"></span><span class="gt-dd-chevron" aria-hidden="true"></span>';
          var menu = document.createElement("div");
          menu.className = "gt-dd-menu";
          menu.setAttribute("role", "listbox");
          wrap.appendChild(trg);
          wrap.appendChild(menu);
          function paint() {
            var cur = sel.options[sel.selectedIndex];
            trg.firstChild.textContent = cur ? cur.textContent : "";
            menu.innerHTML = [].map.call(sel.options, function (o, i) {
              return '<button type="button" class="gt-dd-option' + (i === sel.selectedIndex ? " selected" : "") +
                '" role="option" data-i="' + i + '"><span>' + esc(o.textContent) + '</span><span class="gt-dd-check" aria-hidden="true">\u2713</span></button>';
            }).join("");
          }
          function setOpen(o) {
            wrap.classList.toggle("open", o);
            menu.classList.toggle("open", o);
            trg.setAttribute("aria-expanded", o ? "true" : "false");
          }
          trg.onclick = function (e) {
            e.preventDefault();
            var o = !menu.classList.contains("open");
            closeAllDd();
            setOpen(o);
            var cur = menu.querySelector(".selected");
            if (o && cur) cur.scrollIntoView({ block: "nearest" });
          };
          menu.onclick = function (e) {
            var b = e.target.closest(".gt-dd-option");
            if (!b) return;
            sel.selectedIndex = Number(b.getAttribute("data-i"));
            paint();
            setOpen(false);
          };
          sel.addEventListener("change", paint);
          new MutationObserver(paint).observe(sel, { childList: true });
          paint();
          ddAll.push({
            setOpen: setOpen,
            isOpen: function () { return menu.classList.contains("open"); },
          });
        }
        ddBuild($("coMethod"));
        ddBuild($("coEmp"));
        api("/api/accounts/collectors")
          .then(function (j) {
            var list = j.collectors || [];
            $("coEmp").innerHTML =
              '<option value="">All employees</option>' +
              list
                .map(function (c) {
                  return (
                    '<option value="' +
                    esc(c.id || c.name) +
                    '">' +
                    esc(c.name) +
                    "</option>"
                  );
                })
                .join("");
            $("coEmp").value = st.collector;
            drawActive();
          })
          .catch(function () {});
        drawActive();
        $("coList").addEventListener("keydown", function (e) {
          if (
            (e.key === "Enter" || e.key === " ") &&
            e.target.classList &&
            e.target.classList.contains("co-li")
          ) {
            e.preventDefault();
            openDetail(data.rows[Number(e.target.getAttribute("data-open"))]);
          }
        });
        $("coList").onclick = function (e) {
          if (e.target.closest("[data-sel]") || e.target.closest(".co-selall"))
            return;
          var z = e.target.closest("[data-zoom]");
          if (z) {
            $("coZoomImg").src = z.getAttribute("data-zoom");
            $("coZoom").classList.add("open");
            return;
          }
          var ok = e.target.closest("[data-ok]");
          if (ok) {
            var x = data.rows[Number(ok.getAttribute("data-ok"))];
            if (
              confirm(
                "Approve " +
                  money(x.total_amount) +
                  " from " +
                  x.customer_name_snapshot +
                  "?\n\nHave you checked the bill photo and the money received? Approving reduces the customer's outstanding.",
              )
            )
              approveMany([x]);
            return;
          }
          var no = e.target.closest("[data-no]");
          if (no) {
            openDetail(data.rows[Number(no.getAttribute("data-no"))], "reject");
            return;
          }
          var o = e.target.closest("[data-open]");
          if (o) openDetail(data.rows[Number(o.getAttribute("data-open"))]);
        };
        $("coList").onchange = function (e) {
          if (e.target.matches("[data-sel]")) bulkUpdate();
        };
        $("coBulkGo").onclick = function () {
          var sel = selected();
          if (!sel.length) return;
          var sum = sel.reduce(function (n, x) {
            return n + Number(x.total_amount || 0);
          }, 0);
          if (
            confirm(
              "Approve " +
                sel.length +
                " collections totalling " +
                money(sum) +
                "?\n\nOnly do this after checking every bill photo and the money received.",
            )
          )
            approveMany(sel);
        };
        $("coExport").onclick = exportCsv;
        $("coCard").addEventListener("click", function (e) {
          var z = e.target.closest("[data-zoom]");
          if (!z) return;
          e.preventDefault();
          $("coZoomImg").src = z.getAttribute("data-zoom");
          $("coZoom").classList.add("open");
        });
        $("coZoom").onclick = function () {
          this.classList.remove("open");
        };
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            $("coZoom").classList.remove("open");
            closeDetail();
          }
        });
        load();
      })();
    </script>
  </body>
</html>
