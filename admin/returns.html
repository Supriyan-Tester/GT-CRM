<!doctype html>
<html lang="en"><head>
<script src="../shared/loading.js"></script><script src="../assets/icons.js"></script><script src="../shared/sync.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Returns & Reconciliation - General Traders</title>
<link rel="stylesheet" href="../shared/theme.css"><link rel="stylesheet" href="../shared/admin.css"><script src="../shared/theme.js"></script>
<style>
.ret-wrap{display:grid;gap:14px}.ret-intro{color:var(--muted);font-size:13px;margin-top:4px}.ret-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;display:grid;gap:12px}.ret-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.ret-title{font-weight:800}.ret-meta{font-size:12px;color:var(--muted);margin-top:4px}.ret-pill{font-size:11px;padding:5px 9px;border-radius:20px;background:var(--soft);color:var(--muted);white-space:nowrap}.ret-items{display:grid;gap:10px}.ret-item{border:1px solid var(--border);border-radius:12px;padding:12px;display:grid;gap:10px}.ret-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.ret-grid label,.ret-field{font-size:11px;color:var(--muted);display:grid;gap:5px}.ret-grid input,.ret-field input,.ret-field select,.ret-field textarea{width:100%;min-width:0;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px;padding:9px;font:inherit;font-size:13px}.ret-actions{display:flex;gap:8px;flex-wrap:wrap}.ret-btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 13px;border-radius:9px;font-weight:700;cursor:pointer}.ret-btn.primary{background:var(--primary);color:white;border-color:var(--primary)}.ret-empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:14px}.ret-warning{font-size:12px;color:var(--muted)}@media(max-width:600px){.ret-grid{grid-template-columns:1fr 1fr}.ret-grid label:last-child{grid-column:1/-1}}
</style></head><body>
<script src="../shared/mock-data.js"></script><script src="../shared/admin.js"></script><script>
GA.guard();
(function(){
 var root=GA.mount('returns.html','Returns & reconciliation'), rows=[];
 root.innerHTML='<div class="ret-wrap"><div><div class="ret-title">Returned stock inspection</div><div class="ret-intro">Delivery returns stay quarantined until inspected. Only the reusable quantity you approve is added to available stock.</div></div><div id="retList"><div class="ret-empty">Loading return records…</div></div></div>';
 var esc=GA.esc||function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
 function api(path,method,data){return fetch(path,{method:method||'GET',credentials:'same-origin',headers:data?{'Content-Type':'application/json'}:undefined,body:data?JSON.stringify(data):undefined}).then(function(r){return r.json().then(function(x){if(!r.ok)throw Error(x.error||'Request failed');return x})})}
 function render(){var el=document.getElementById('retList');if(!rows.length){el.innerHTML='<div class="ret-empty">No returns are waiting for inspection or company reconciliation.</div>';return;}
 el.innerHTML=rows.slice().reverse().map(function(r){var inspected=!!r.inspectedAt;return '<section class="ret-card" data-ret="'+esc(r.id)+'"><div class="ret-top"><div><div class="ret-title">'+esc(r.id)+' · '+esc(r.orderCode)+'</div><div class="ret-meta">'+esc(r.shop||'Customer not listed')+' · '+esc(r.workerName)+' · '+new Date(r.createdAt).toLocaleString()+'</div></div><span class="ret-pill">'+esc((r.status||'pending_inspection').replace(/_/g,' '))+'</span></div><div class="ret-items">'+r.items.map(function(i){return '<div class="ret-item" data-product="'+esc(i.productId)+'"><div><b>'+esc(i.productName)+'</b><div class="ret-meta">Returned: '+esc(i.returnedQty)+' · Reason: '+esc(i.returnReason)+'</div></div>'+(inspected?(i.companyQty>0?'<div class="ret-meta">Reusable: '+esc(i.restockQty)+' · Company: '+esc(i.companyQty)+' · Damaged: '+esc(i.damagedQty)+'</div><div class="ret-field"><label>Company reconciliation</label><select class="company-status"><option value="awaiting_dispatch" '+(i.companyStatus==='awaiting_dispatch'?'selected':'')+'>Awaiting dispatch</option><option value="dispatched" '+(i.companyStatus==='dispatched'?'selected':'')+'>Dispatched</option><option value="acknowledged" '+(i.companyStatus==='acknowledged'?'selected':'')+'>Acknowledged</option><option value="replacement_received" '+(i.companyStatus==='replacement_received'?'selected':'')+'>Replacement received</option><option value="credit_note_issued" '+(i.companyStatus==='credit_note_issued'?'selected':'')+'>Credit note issued</option><option value="refund_received" '+(i.companyStatus==='refund_received'?'selected':'')+'>Refund received</option><option value="rejected_by_company" '+(i.companyStatus==='rejected_by_company'?'selected':'')+'>Rejected by company</option></select></div><div class="ret-grid"><label>Dispatch / response reference<input class="company-ref" value="'+esc(i.dispatchRef||i.acknowledgementRef||i.companyResponseRef||'')+'" placeholder="Reference number"></label><label>Credit / refund amount<input class="company-amount" type="number" min="0" step="0.01" value="'+(i.companyAmount==null?'':Number(i.companyAmount))+'" placeholder="0.00"></label><label>Replacement qty received<input class="company-qty" type="number" min="0" step="0.001" value="'+(i.replacementReceivedQty==null?'':Number(i.replacementReceivedQty))+'" placeholder="0"></label></div><div class="ret-field"><label>Company note<input class="company-note" value="'+esc(i.companyResponseNote||'')+'" placeholder="Acknowledgement or response details"></label></div><button class="ret-btn company-save" type="button">Save company update</button>'+ (i.replacementStockPending?'<div class="ret-meta">Replacement received: '+esc(i.replacementReceivedQty)+' · Stock is still pending inspection</div><div class="ret-grid"><label>Accept into stock<input class="replacement-accepted" type="number" min="0" max="'+Number(i.replacementReceivedQty)+'" step="0.001" value="'+Number(i.replacementReceivedQty)+'"></label><label>Damaged / reject<input class="replacement-damaged" type="number" min="0" max="'+Number(i.replacementReceivedQty)+'" step="0.001" value="0"></label></div><button class="ret-btn primary replacement-inspect" type="button">Inspect replacement & update stock</button>':(i.replacementInspectedAt?'<div class="ret-meta">Replacement inspected · Accepted: '+esc(i.replacementStockAcceptedQty)+' · Damaged: '+esc(i.replacementDamagedQty)+'</div>':'')):'<div class="ret-warning">No supplier return allocated for this item.</div>'):'<div class="ret-grid"><label>Reusable / add to stock<input class="restock" type="number" min="0" max="'+Number(i.returnedQty)+'" step="0.001" value="0"></label><label>Return to company<input class="company" type="number" min="0" max="'+Number(i.returnedQty)+'" step="0.001" value="0"></label><label>Damaged / reject<input class="damaged" type="number" min="0" max="'+Number(i.returnedQty)+'" step="0.001" value="'+Number(i.returnedQty)+'"></label></div><div class="ret-field"><label>Company / supplier (required when company qty is above 0)<input class="company-name" placeholder="Company name"></label></div><div class="ret-field"><label>Inspection note<input class="inspection-note" placeholder="Condition, packaging, expiry, etc."></label></div>')+'</div>'}).join('')+'</div>'+(inspected?'':'<div class="ret-warning">The three quantities must total exactly '+r.items.reduce(function(n,i){return n+Number(i.returnedQty)},0)+' units for this return.</div><div class="ret-actions"><button class="ret-btn primary inspect" type="button">Save inspection & apply stock</button></div>')+'</section>'}).join('');
 }
 function load(){api('/api/inventory/returns').then(function(x){rows=(x.returns||[]).filter(function(r){return r.status!=='closed'&&r.status!=='reconciliation_complete'});render()}).catch(function(e){document.getElementById('retList').innerHTML='<div class="ret-empty">'+esc(e.message)+'</div>'})}
 root.addEventListener('click',function(e){var card=e.target.closest('[data-ret]');if(!card)return;var ret=rows.find(function(x){return x.id===card.dataset.ret});if(!ret)return;
 if(e.target.classList.contains('inspect')){var items=Array.prototype.map.call(card.querySelectorAll('[data-product]'),function(el){return {productId:el.dataset.product,restockQty:Number(el.querySelector('.restock').value),companyQty:Number(el.querySelector('.company').value),damagedQty:Number(el.querySelector('.damaged').value),companyName:el.querySelector('.company-name').value,inspectionNote:el.querySelector('.inspection-note').value}});e.target.disabled=true;api('/api/inventory/returns/inspect','POST',{returnId:ret.id,items:items}).then(load).catch(function(err){alert(err.message);e.target.disabled=false})}
 if(e.target.classList.contains('replacement-inspect')){var el=e.target.closest('[data-product]'),accepted=Number(el.querySelector('.replacement-accepted').value),damaged=Number(el.querySelector('.replacement-damaged').value);e.target.disabled=true;api('/api/inventory/returns/replacement-inspect','POST',{returnId:ret.id,productId:el.dataset.product,acceptedQty:accepted,damagedQty:damaged}).then(load).catch(function(err){alert(err.message);e.target.disabled=false})}
 if(e.target.classList.contains('company-save')){var el=e.target.closest('[data-product]'),status=el.querySelector('.company-status').value;var data={returnId:ret.id,productId:el.dataset.product,companyStatus:status,dispatchRef:el.querySelector('.company-ref').value,reference:el.querySelector('.company-ref').value,amount:el.querySelector('.company-amount').value,receivedQty:el.querySelector('.company-qty').value,note:el.querySelector('.company-note').value};e.target.disabled=true;api('/api/inventory/returns/company','POST',data).then(load).catch(function(err){alert(err.message);e.target.disabled=false})}
 });load();
})();
</script></body></html>
