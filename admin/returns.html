<!doctype html>
<html lang="en">
  <head>
    <script src="../shared/loading.js"></script>
    <script src="../assets/icons.js"></script>
    <script src="../shared/sync.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Returns & Reconciliation - General Traders</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/admin.css" />
    <script src="../shared/theme.js"></script>
    <style>
      .ret-wrap {
        display: grid;
        gap: 14px;
      }
      .ret-intro {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }
      .ret-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        display: grid;
        gap: 12px;
      }
      .ret-top {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .ret-title {
        font-weight: 800;
      }
      .ret-meta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .ret-pill {
        font-size: 11px;
        padding: 5px 9px;
        border-radius: 20px;
        background: var(--soft);
        color: var(--muted);
        white-space: nowrap;
      }
      .ret-items {
        display: grid;
        gap: 10px;
      }
      .ret-item {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        display: grid;
        gap: 10px;
      }
      .ret-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .ret-grid label,
      .ret-field {
        font-size: 11px;
        color: var(--muted);
        display: grid;
        gap: 5px;
      }
      .ret-grid input,
      .ret-field input,
      .ret-field select,
      .ret-field textarea {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        border-radius: 9px;
        padding: 9px;
        font: inherit;
        font-size: 13px;
      }
      .ret-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .ret-btn {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        padding: 9px 13px;
        border-radius: 9px;
        font-weight: 700;
        cursor: pointer;
      }
      .ret-btn.primary {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }
      .ret-empty {
        padding: 28px;
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--border);
        border-radius: 14px;
      }
      .ret-warning {
        font-size: 12px;
        color: var(--muted);
      }
      .ret-ledger {
        border: 1px solid var(--primary);
        background: var(--t-primary);
        border-radius: 12px;
        padding: 12px;
        display: grid;
        gap: 10px;
      }
      .ret-ledger-title {
        font-size: 13px;
        font-weight: 800;
        color: var(--primary);
      }
      .ret-ledger-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr 1.2fr;
        gap: 8px;
      }
      .ret-credit {
        border-top: 1px dashed var(--border);
        padding-top: 10px;
        display: grid;
        gap: 8px;
      }
      .ret-credit-row {
        display: grid;
        grid-template-columns: 1fr 1.6fr;
        gap: 8px;
      }
      .ret-diff {
        font-size: 12px;
        font-weight: 700;
      }
      .ret-total {
        font-size: 14px;
        font-weight: 800;
      }
      @media (max-width: 700px) {
        .ret-ledger-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 600px) {
        .ret-grid {
          grid-template-columns: 1fr 1fr;
        }
        .ret-grid label:last-child {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/mock-data.js"></script>
    <script src="../shared/admin.js"></script>
    <script>
      GA.guard();

      (function () {
        const root = GA.mount("returns.html", "Returns & reconciliation");
        let rows = [];
        let all = [];
        let invCache = {};
        const sess = (GA.session && GA.session()) || {};
        const isSuper = sess.super === true;

        root.innerHTML = `
          <div class="ret-wrap">
            <div>
              <div class="ret-title">Returned stock inspection</div>
              <div class="ret-intro">
                Delivery returns stay quarantined until the Super Admin checks them. Good units return to stock, and the credit you confirm for each product is deducted from the customer's invoice.
              </div>
              <div class="ret-actions" style="align-items:center;margin-top:10px">
                <label class="ret-field" style="display:flex;gap:8px;align-items:center">
                  Date <input type="date" id="retDate" style="width:auto">
                </label>
                <button class="ret-btn" id="retClear" type="button">Open returns</button>
              </div>
            </div>
            <div id="retList"><div class="ret-empty">Loading return records…</div></div>
          </div>
        `;

        function esc(value) {
          if (GA.esc) return GA.esc(value);
          const div = document.createElement("div");
          div.textContent = value == null ? "" : String(value);
          return div.innerHTML;
        }

        function money(value) {
          return (
            "₹" +
            Number(value || 0).toLocaleString("en-IN", {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2,
            })
          );
        }

        function api(path, method, data) {
          return fetch(path, {
            method: method || "GET",
            credentials: "same-origin",
            headers: data ? { "Content-Type": "application/json" } : undefined,
            body: data ? JSON.stringify(data) : undefined,
          }).then(function (res) {
            return res.json().then(function (json) {
              if (!res.ok) throw new Error(json.error || "Request failed");
              return json;
            });
          });
        }

        function loadCustomerInvoices(code) {
          if (!code) return Promise.resolve([]);
          if (invCache[code]) return Promise.resolve(invCache[code]);

          return api("/api/accounts/customers/" + encodeURIComponent(code) + "/invoices")
            .then(function (data) {
              invCache[code] = (data.invoices || []).filter(function (inv) {
                return Number(inv.availableToCollect || 0) > 0;
              });
              return invCache[code];
            })
            .catch(function () {
              return [];
            });
        }

        function renderItem(item, inspected) {
          const suggested =
            Math.round(
              (Number(item.provisionalCredit != null ? item.provisionalCredit : item.returnedAmount) || 0) * 100
            ) / 100;
          const confirmedNote =
            inspected && item.creditAmount != null
              ? ` · Credit: ${money(item.creditAmount)}` +
                (Math.abs(Number(item.creditAmount) - suggested) > 0.009
                  ? ` (worker deducted ${money(suggested)}${item.creditReason ? ", " + esc(item.creditReason) : ""})`
                  : "")
              : "";
          const priceNote = item.unitPrice
            ? " × " + money(item.unitPrice) + " = " + money(item.returnedAmount || item.returnedQty * item.unitPrice)
            : "";

          if (!inspected && !isSuper) {
            return `
              <div class="ret-item" data-product="${esc(item.productId)}">
                <div>
                  <b>${esc(item.productName)}</b>
                  <div class="ret-meta">Returned: ${esc(item.returnedQty)}${priceNote} · Reason: ${esc(item.returnReason)} · Worker deducted ${money(suggested)}</div>
                </div>
              </div>
            `;
          }

          if (!inspected) {
            return `
              <div class="ret-item" data-product="${esc(item.productId)}">
                <div>
                  <b>${esc(item.productName)}</b>
                  <div class="ret-meta">Returned: ${esc(item.returnedQty)}${priceNote} · Reason: ${esc(item.returnReason)}</div>
                </div>
                <div class="ret-grid">
                  <label>Reusable / add to stock
                    <input class="restock" type="number" min="0" max="${Number(item.returnedQty)}" step="0.001" value="0">
                  </label>
                  <label>Return to company
                    <input class="company" type="number" min="0" max="${Number(item.returnedQty)}" step="0.001" value="0">
                  </label>
                  <label>Damaged / reject
                    <input class="damaged" type="number" min="0" max="${Number(item.returnedQty)}" step="0.001" value="${Number(item.returnedQty)}">
                  </label>
                </div>
                <div class="ret-field">
                  <label>Company / supplier (required when company qty is above 0)
                    <input class="company-name" placeholder="Company name">
                  </label>
                </div>
                <div class="ret-field">
                  <label>Inspection note
                    <input class="inspection-note" placeholder="Condition, packaging, expiry, etc.">
                  </label>
                </div>
                <div class="ret-credit">
                  <div class="ret-meta">Worker deducted at the door: <b>${money(suggested)}</b></div>
                  <div class="ret-credit-row">
                    <label class="ret-field">Confirmed credit (₹)
                      <input class="credit-amt" type="number" min="0" step="0.01" value="${suggested}" data-suggested="${suggested}">
                    </label>
                    <label class="ret-field">Reason (needed if changed)
                      <input class="credit-reason" maxlength="160" placeholder="e.g. heavily damaged, 40% credit">
                    </label>
                  </div>
                  <div class="ret-diff"></div>
                </div>
              </div>
            `;
          }

          if (!(item.companyQty > 0)) {
            return `
              <div class="ret-item" data-product="${esc(item.productId)}">
                <div>
                  <b>${esc(item.productName)}</b>
                  <div class="ret-meta">Returned: ${esc(item.returnedQty)}${priceNote} · Reason: ${esc(item.returnReason)}${confirmedNote}</div>
                </div>
                <div class="ret-warning">No supplier return allocated for this item.</div>
              </div>
            `;
          }

          const refValue = item.dispatchRef || item.acknowledgementRef || item.companyResponseRef || "";
          const amtValue = item.companyAmount == null ? "" : Number(item.companyAmount);
          const qtyValue = item.replacementReceivedQty == null ? "" : Number(item.replacementReceivedQty);

          let replacementHtml = "";
          if (item.replacementStockPending) {
            replacementHtml = `
              <div class="ret-meta">Replacement received: ${esc(item.replacementReceivedQty)} · Stock is still pending inspection</div>
              <div class="ret-grid">
                <label>Accept into stock
                  <input class="replacement-accepted" type="number" min="0" max="${Number(item.replacementReceivedQty)}" step="0.001" value="${Number(item.replacementReceivedQty)}">
                </label>
                <label>Damaged / reject
                  <input class="replacement-damaged" type="number" min="0" max="${Number(item.replacementReceivedQty)}" step="0.001" value="0">
                </label>
              </div>
              ${
                isSuper
                  ? '<button class="ret-btn primary replacement-inspect" type="button">Inspect replacement & update stock</button>'
                  : '<div class="ret-warning">Only the Super Admin can inspect the replacement.</div>'
              }
            `;
          } else if (item.replacementInspectedAt) {
            replacementHtml = `
              <div class="ret-meta">
                Replacement inspected · Accepted: ${esc(item.replacementStockAcceptedQty)} · Damaged: ${esc(item.replacementDamagedQty)}
              </div>
            `;
          }

          return `
            <div class="ret-item" data-product="${esc(item.productId)}">
              <div>
                <b>${esc(item.productName)}</b>
                <div class="ret-meta">Returned: ${esc(item.returnedQty)}${priceNote} · Reason: ${esc(item.returnReason)}</div>
              </div>
              <div class="ret-meta">
                Reusable: ${esc(item.restockQty)} · Company: ${esc(item.companyQty)} · Damaged: ${esc(item.damagedQty)}${confirmedNote}
              </div>
              <div class="ret-field">
                <label>Company reconciliation</label>
                <select class="company-status">
                  <option value="awaiting_dispatch" ${item.companyStatus === "awaiting_dispatch" ? "selected" : ""}>Awaiting dispatch</option>
                  <option value="dispatched" ${item.companyStatus === "dispatched" ? "selected" : ""}>Dispatched</option>
                  <option value="acknowledged" ${item.companyStatus === "acknowledged" ? "selected" : ""}>Acknowledged</option>
                  <option value="replacement_received" ${item.companyStatus === "replacement_received" ? "selected" : ""}>Replacement received</option>
                  <option value="credit_note_issued" ${item.companyStatus === "credit_note_issued" ? "selected" : ""}>Credit note issued</option>
                  <option value="refund_received" ${item.companyStatus === "refund_received" ? "selected" : ""}>Refund received</option>
                  <option value="rejected_by_company" ${item.companyStatus === "rejected_by_company" ? "selected" : ""}>Rejected by company</option>
                </select>
              </div>
              <div class="ret-grid">
                <label>Dispatch / response reference
                  <input class="company-ref" value="${esc(refValue)}" placeholder="Reference number">
                </label>
                <label>Credit / refund amount
                  <input class="company-amount" type="number" min="0" step="0.01" value="${amtValue}" placeholder="0.00">
                </label>
                <label>Replacement qty received
                  <input class="company-qty" type="number" min="0" step="0.001" value="${qtyValue}" placeholder="0">
                </label>
              </div>
              <div class="ret-field">
                <label>Company note
                  <input class="company-note" value="${esc(item.companyResponseNote || "")}" placeholder="Acknowledgement or response details">
                </label>
              </div>
              <button class="ret-btn company-save" type="button">Save company update</button>
              ${replacementHtml}
            </div>
          `;
        }

        function render() {
          const el = document.getElementById("retList");
          if (!rows.length) {
            const hasDate = Boolean(document.getElementById("retDate").value);
            el.innerHTML = `<div class="ret-empty">${
              hasDate
                ? "No returns on this date."
                : "No returns are waiting for inspection or company reconciliation."
            }</div>`;
            return;
          }

          el.innerHTML = rows
            .slice()
            .reverse()
            .map(function (r) {
              const inspected = Boolean(r.inspectedAt);
              const custCode = r.customerCode || r.orderCode || "";
              const openInvs = invCache[custCode] || [];
              const defaultAmt = Math.round(
                r.items.reduce(function (sum, i) {
                  return (
                    sum +
                    (Number(i.provisionalCredit != null ? i.provisionalCredit : i.returnedAmount) || 0)
                  );
                }, 0) * 100
              ) / 100;

              let invOptions = '<option value="">No open invoice found in Accounts</option>';
              if (openInvs.length) {
                invOptions =
                  '<option value="">-- Select open invoice --</option>' +
                  openInvs
                    .map(function (inv) {
                      const isMatch =
                        r.invoiceNo &&
                        String(inv.invoice_no).toLowerCase() === String(r.invoiceNo).toLowerCase();
                      const maxDue = Math.floor(Number(inv.availableToCollect || 0));
                      return `<option value="${esc(inv.id)}" data-invno="${esc(inv.invoice_no)}" data-max="${maxDue}" ${
                        isMatch ? "selected" : ""
                      }>#${esc(inv.invoice_no)} · Due ${money(inv.availableToCollect)}</option>`;
                    })
                    .join("");
              }

              const totalUnits = r.items.reduce(function (sum, i) {
                return sum + Number(i.returnedQty);
              }, 0);

              let footerHtml = "";
              if (inspected) {
                if (r.ledgerCreditApplied) {
                  const invLabel = r.ledgerInvoiceNo ? " (Invoice #" + esc(r.ledgerInvoiceNo) + ")" : "";
                  footerHtml = `<div class="ret-meta" style="color:var(--primary);font-weight:700">✓ Return credit of ${money(
                    r.ledgerCreditApplied
                  )} deducted from customer ledger${invLabel}.</div>`;
                }
              } else {
                footerHtml = isSuper
                  ? `
                  <div class="ret-ledger">
                    <div class="ret-ledger-title">Customer ledger credit</div>
                    <div class="ret-ledger-grid">
                      <label class="ret-field">Customer invoice to reduce
                        <select class="ledger-inv">${invOptions}</select>
                      </label>
                      <div class="ret-field">Total credit to post
                        <div class="ret-total ledger-total">${money(defaultAmt)}</div>
                      </div>
                    </div>
                    <div class="ret-warning">
                      The total of the confirmed credits above is deducted from the selected invoice when you approve. It cannot be edited afterwards, only reversed in Accounts. A credit cannot be more than what is still due on the invoice.
                    </div>
                  </div>
                  <div class="ret-warning">
                    The three quantities must total exactly ${totalUnits} units for each product.
                  </div>
                  <div class="ret-actions">
                    <button class="ret-btn primary inspect" type="button">Approve return, update stock & ledger</button>
                  </div>
                `
                  : `<div class="ret-warning">Waiting for the Super Admin to check the goods and confirm the credit.</div>`;
              }

              return `
                <section class="ret-card" data-ret="${esc(r.id)}">
                  <div class="ret-top">
                    <div>
                      <div class="ret-title">${esc(r.id)} · ${esc(r.orderCode)}</div>
                      <div class="ret-meta">${esc(r.shop || "Customer not listed")} · ${esc(r.workerName)} · ${new Date(
                r.createdAt
              ).toLocaleString()}</div>
                    </div>
                    <span class="ret-pill">${esc((r.status || "pending_inspection").replace(/_/g, " "))}</span>
                  </div>
                  <div class="ret-items">
                    ${r.items
                      .map(function (item) {
                        return renderItem(item, inspected);
                      })
                      .join("")}
                  </div>
                  ${footerHtml}
                </section>
              `;
            })
            .join("");
        }

        function localDateStr(ts) {
          const d = new Date(ts);
          return (
            d.getFullYear() +
            "-" +
            String(d.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(d.getDate()).padStart(2, "0")
          );
        }

        function apply() {
          const dateVal = document.getElementById("retDate").value;
          rows = dateVal
            ? all.filter(function (r) {
                return localDateStr(r.createdAt) === dateVal;
              })
            : all.filter(function (r) {
                const replacementWaiting = (r.items || []).some(function (i) {
                  return i.replacementStockPending;
                });
                return replacementWaiting || (r.status !== "closed" && r.status !== "reconciliation_complete");
              });

          const customerCodes = Array.from(
            new Set(
              rows
                .filter(function (r) {
                  return !r.inspectedAt;
                })
                .map(function (r) {
                  return r.customerCode || r.orderCode;
                })
                .filter(Boolean)
            )
          );

          Promise.all(customerCodes.map(loadCustomerInvoices)).then(render);
        }

        function load() {
          invCache = {};
          api("/api/inventory/returns")
            .then(function (data) {
              all = data.returns || [];
              apply();
            })
            .catch(function (err) {
              document.getElementById("retList").innerHTML = `<div class="ret-empty">${esc(err.message)}</div>`;
            });
        }

        document.getElementById("retDate").addEventListener("change", apply);
        document.getElementById("retClear").addEventListener("click", function () {
          document.getElementById("retDate").value = "";
          apply();
        });

        root.addEventListener("input", function (e) {
          if (!e.target.classList.contains("credit-amt")) return;
          const sug = Number(e.target.dataset.suggested) || 0;
          const diff = Math.round(((Number(e.target.value) || 0) - sug) * 100) / 100;
          const note = e.target.closest(".ret-credit").querySelector(".ret-diff");
          note.textContent =
            Math.abs(diff) < 0.01
              ? ""
              : diff < 0
                ? "₹" + Math.abs(diff) + " LESS than the worker deducted: this stays due from the customer."
                : "₹" + diff + " MORE than the worker deducted: it can only be posted up to what is still due on the invoice.";
          note.style.color = diff < 0 ? "var(--danger, #c0392b)" : "var(--primary)";
          const card = e.target.closest("[data-ret]");
          const total = Array.from(card.querySelectorAll(".credit-amt")).reduce(function (n, i) {
            return n + (Number(i.value) || 0);
          }, 0);
          card.querySelector(".ledger-total").textContent = money(total);
        });

        root.addEventListener("click", function (e) {
          const card = e.target.closest("[data-ret]");
          if (!card) return;
          const ret = rows.find(function (x) {
            return x.id === card.dataset.ret;
          });
          if (!ret) return;

          if (e.target.classList.contains("inspect")) {
            const items = Array.from(card.querySelectorAll("[data-product]")).map(function (el) {
              return {
                productId: el.dataset.product,
                restockQty: Number(el.querySelector(".restock").value),
                companyQty: Number(el.querySelector(".company").value),
                damagedQty: Number(el.querySelector(".damaged").value),
                companyName: el.querySelector(".company-name").value,
                inspectionNote: el.querySelector(".inspection-note").value,
                creditAmount: Number(el.querySelector(".credit-amt").value) || 0,
                creditReason: el.querySelector(".credit-reason").value,
              };
            });

            const invSel = card.querySelector(".ledger-inv");
            const invoiceId = invSel ? invSel.value : "";
            const creditAmount = items.reduce(function (n, i) {
              return n + i.creditAmount;
            }, 0);
            const selectedOpt = invSel && invSel.selectedOptions && invSel.selectedOptions[0];
            const invoiceNo = selectedOpt ? selectedOpt.getAttribute("data-invno") || "" : "";

            if (creditAmount > 0 && !invoiceId) {
              alert(
                "Select a customer invoice to apply the total credit of " +
                  money(creditAmount) +
                  ", or set the credits to 0."
              );
              return;
            }
            if (
              !confirm(
                "Approve this return?\n\nCustomer credit to post: " +
                  money(creditAmount) +
                  "\nThis cannot be edited afterwards."
              )
            )
              return;

            e.target.disabled = true;
            api("/api/inventory/returns/inspect", "POST", {
              returnId: ret.id,
              items: items,
              invoiceId: invoiceId,
              invoiceNo: invoiceNo,
            })
              .then(load)
              .catch(function (err) {
                alert(err.message);
                e.target.disabled = false;
              });
          }

          if (e.target.classList.contains("replacement-inspect")) {
            const el = e.target.closest("[data-product]");
            const accepted = Number(el.querySelector(".replacement-accepted").value);
            const damaged = Number(el.querySelector(".replacement-damaged").value);

            e.target.disabled = true;
            api("/api/inventory/returns/replacement-inspect", "POST", {
              returnId: ret.id,
              productId: el.dataset.product,
              acceptedQty: accepted,
              damagedQty: damaged,
            })
              .then(load)
              .catch(function (err) {
                alert(err.message);
                e.target.disabled = false;
              });
          }

          if (e.target.classList.contains("company-save")) {
            const el = e.target.closest("[data-product]");
            const payload = {
              returnId: ret.id,
              productId: el.dataset.product,
              companyStatus: el.querySelector(".company-status").value,
              dispatchRef: el.querySelector(".company-ref").value,
              reference: el.querySelector(".company-ref").value,
              amount: el.querySelector(".company-amount").value,
              receivedQty: el.querySelector(".company-qty").value,
              note: el.querySelector(".company-note").value,
            };

            e.target.disabled = true;
            api("/api/inventory/returns/company", "POST", payload)
              .then(load)
              .catch(function (err) {
                alert(err.message);
                e.target.disabled = false;
              });
          }
        });

        load();
      })();
    </script>
  </body>
</html>
