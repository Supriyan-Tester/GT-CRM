<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>New Order - General Traders Sales</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/icon-32.png"
    />
    <link rel="apple-touch-icon" href="/assets/icon-180.png" />
    <link rel="stylesheet" href="sales.css" />
    <link rel="stylesheet" href="../shared/dropdown.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="../assets/icons.js"></script>
    <script src="sales.js"></script>
    <script src="../shared/dropdown.js"></script>
    <script>
      Sales.start("order", function (me, hello, main) {
        var qs = new URLSearchParams(location.search),
          CODE = qs.get("c") || "",
          DRAFT = qs.get("d") || "",
          BACK = { href: "customers.html", label: "Customers" },
          REPL = qs.get("r") || "";
        if (!CODE) return location.replace("customers.html");
        hello.innerHTML = '<h1>New Order</h1><p id="sub">Loading…</p>';
        main.innerHTML = '<div class="empty"><b>Loading…</b></div>';

        var SHOP,
          PRODS = [],
          cart = {},
          cat = "",
          q = "",
          page = 1,
          STEP = 48,
          discount = 0,
          notes = "",
          discOn = false,
          draftId = "",
          busy = false,
          key =
            "k" +
            Date.now().toString(36) +
            Math.random().toString(36).slice(2, 8),
          placed = false;
        var byId = {},
          LIST = [];
        function norm(s) {
          return String(s || "")
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, " ")
            .trim();
        }
        function pic(p, cls) {
          var ini = Sales.esc(
            String(p.name || "?")
              .trim()
              .slice(0, 2)
              .toUpperCase(),
          );
          return (
            '<div class="' +
            cls +
            '"><img loading="lazy" alt="" src="/api/pfile?p=' +
            encodeURIComponent(p.id) +
            '&i=0"><span hidden>' +
            ini +
            "</span></div>"
          );
        }
        function totals() {
          var n = 0,
            sub = 0;
          Object.keys(cart).forEach(function (id) {
            var p = byId[id];
            if (!p) return;
            n += Sales.isKg(p) ? 1 : cart[id];
            sub += (Number(p.price) || 0) * cart[id];
          });
          var d = Math.min(sub, Math.max(0, Number(discount) || 0));
          return {
            lines: Object.keys(cart).length,
            units: n,
            sub: sub,
            disc: d,
            total: sub - d,
          };
        }

        function shell() {
          var S = SHOP,
            t = 0;
          main.innerHTML =
            '<a class="back" href="' +
            BACK.href +
            '">' +
            Sales.ic("chevron-left") +
            BACK.label +
            "</a>" +
            '<div class="ord"><div class="left">' +
            '<div class="card shead"><button class="sw" id="swp" type="button" aria-label="Previous customer">' +
            Sales.ic("chevron-left") +
            '</button><div class="tile t0">' +
            Sales.esc(Sales.init(S.name)) +
            '</div><div class="info"><h2>' +
            Sales.esc(S.name) +
            "<em>" +
            Sales.esc(S.code) +
            "</em></h2><small>" +
            Sales.esc(
              [S.area, S.address].filter(Boolean).join(" · ") ||
                "No address yet",
            ) +
            "</small>" +
            (S.phone
              ? '<a class="ph" href="tel:' +
                Sales.esc(S.phone) +
                '">' +
                Sales.ic("phone") +
                Sales.esc(S.phone) +
                "</a>"
              : "") +
            "</div>" +
            '<a class="btn soft sm" href="shop.html?c=' +
            encodeURIComponent(S.code) +
            Sales.fromQ() +
            '">View Details</a><button class="sw" id="swn" type="button" aria-label="Next customer">' +
            Sales.ic("chevron-right") +
            "</button></div>" +
            '<div class="osrow"><label class="search"><span class="sr">Search products</span>' +
            Sales.ic("search") +
            '<input id="q" type="search" placeholder="Search products by name, code or brand…" autocomplete="off" /></label>' +
            '<button class="btn line scanb" id="scan" type="button">' +
            Sales.ic("scan") +
            "<span>Scan</span></button></div>" +
            '<div class="cats" id="cats" role="tablist" aria-label="Category"></div>' +
            '<div class="boxtip" id="boxtip" hidden><span><b>Selling by the box?</b> Tap <b>+ Box</b> to add a full box in one tap. To type a number, open the cart and tap the quantity.</span><button type="button" id="boxtipx" aria-label="Got it">Got it</button></div>' +
            '<div class="pgrid" id="grid"></div><div class="more" id="more" hidden></div></div>' +
            '<aside class="card cart" id="cart" aria-label="Order items"></aside></div>' +
            '<div class="cback" id="cback"></div><button class="cbar" id="cbar" type="button" hidden></button>';
          document.getElementById("sub").textContent = S.name;
          var qi = document.getElementById("q"),
            tm;
          qi.oninput = function () {
            clearTimeout(tm);
            tm = setTimeout(function () {
              q = qi.value;
              page = 1;
              drawGrid();
            }, 120);
          };
          document.getElementById("cats").onclick = function (e) {
            var b = e.target.closest && e.target.closest(".cat");
            if (!b) return;
            cat = b.getAttribute("data-c");
            page = 1;
            drawCats();
            drawGrid();
          };
          var grid = document.getElementById("grid");
          grid.onclick = function (e) {
            var c = e.target.closest && e.target.closest(".pc");
            if (!c) return;
            var id = c.getAttribute("data-id"),
              p = byId[id],
              isBox = !!(e.target.closest && e.target.closest(".boxb"));
            if (e.target.closest && e.target.closest(".fav")) {
              toggleFav(id);
              return;
            }
            if (e.target.closest && e.target.closest("input")) return;
            var sb = e.target.closest && e.target.closest("[data-s]");
            if (sb && !isBox) {
              if (sb.getAttribute("data-s") === "-")
                setQty(id, (cart[id] || 0) - 1);
              else if (p && p.stock != null && p.stock <= 0) notifyOut(p, id);
              else setQty(id, (cart[id] || 0) + 1);
              return;
            }
            if (p && p.stock != null && p.stock <= 0) return notifyOut(p, id);
            setQty(
              id,
              (cart[id] || 0) +
                (isBox && p.boxQty ? p.boxQty : 1),
            );
          };
          grid.onchange = function (e) {
            var c = e.target.closest && e.target.closest(".pc");
            if (c && e.target.tagName === "INPUT") {
              var gid = c.getAttribute("data-id"),
                gv = Number(e.target.value) || 0;
              setQty(gid, Sales.isKg(byId[gid]) ? gv : Math.floor(gv));
            }
          };
          document.getElementById("scan").onclick = scan;
          document.getElementById("swp").onclick = function () {
            goShop(-1);
          };
          document.getElementById("swn").onclick = function () {
            goShop(1);
          };
          document.getElementById("cback").onclick = function () {
            document.getElementById("cart").classList.remove("open");
            document.getElementById("cback").classList.remove("on");
          };
          grid.addEventListener("error", imgErr, true);
          document
            .getElementById("cart")
            .addEventListener("error", imgErr, true);
          document.getElementById("cbar").onclick = function () {
            document.getElementById("cart").classList.add("open");
            document.getElementById("cback").classList.add("on");
          };
          var tip = document.getElementById("boxtip"),
            seen = false;
          try {
            seen = localStorage.getItem("gm_box_tip") === "1";
          } catch (e) {}
          tip.hidden =
            seen ||
            !PRODS.some(function (p) {
              return p.boxQty;
            });
          document.getElementById("boxtipx").onclick = function () {
            tip.hidden = true;
            try {
              localStorage.setItem("gm_box_tip", "1");
            } catch (e) {}
          };
          drawCats();
          drawGrid();
          drawCart();
        }
        // Favourites are remembered on this phone only (no server change needed)
        var FAV = {};
        try {
          FAV = JSON.parse(localStorage.getItem("gm_fav") || "{}") || {};
        } catch (e) {}
        function toggleFav(id) {
          if (FAV[id]) delete FAV[id];
          else FAV[id] = 1;
          try {
            localStorage.setItem("gm_fav", JSON.stringify(FAV));
          } catch (e) {}
          drawGrid();
        }
        // previous / next customer (same order as My Customers)
        function goShop(d) {
          var i = -1;
          LIST.forEach(function (c, k) {
            if (c.code === CODE) i = k;
          });
          if (i < 0 || LIST.length < 2) return;
          var t = LIST[(i + d + LIST.length) % LIST.length];
          if (
            Object.keys(cart).length &&
            !confirm("Leave this order? Items not saved as a draft will be lost.")
          )
            return;
          placed = true;
          location.href =
            "order.html?c=" + encodeURIComponent(t.code) + Sales.fromQ();
        }
        function notifyOut(p, id) {
          Sales.watch(id, true)
            .then(function () {
              Sales.toast(
                p.name +
                  " is out of stock. You will see it on Home when it is back.",
              );
            })
            .catch(function () {});
        }
        // Scan a barcode with the camera; matches the product barcode or code
        function scan() {
          if (!("BarcodeDetector" in window) || !navigator.mediaDevices) {
            var t = prompt(
              "Camera scan is not supported here. Type the barcode or product code:",
            );
            if (t) found(t);
            return;
          }
          var ov = document.createElement("div");
          ov.className = "scanov";
          ov.innerHTML =
            '<video playsinline muted></video><button type="button" class="btn line">Cancel</button>';
          document.body.appendChild(ov);
          var v = ov.querySelector("video"),
            stream,
            stop = false,
            det = new BarcodeDetector();
          function close() {
            stop = true;
            if (stream)
              stream.getTracks().forEach(function (t) {
                t.stop();
              });
            ov.remove();
          }
          ov.querySelector("button").onclick = close;
          navigator.mediaDevices
            .getUserMedia({ video: { facingMode: "environment" } })
            .then(function (s) {
              stream = s;
              v.srcObject = s;
              v.play();
              (function tick() {
                if (stop) return;
                det
                  .detect(v)
                  .then(function (r) {
                    if (r && r.length) {
                      close();
                      found(r[0].rawValue);
                    } else setTimeout(tick, 250);
                  })
                  .catch(function () {
                    setTimeout(tick, 400);
                  });
              })();
            })
            .catch(function () {
              close();
              Sales.toast("Could not open the camera", true);
            });
        }
        function found(raw) {
          var t = String(raw || "").trim().toLowerCase(),
            p = PRODS.filter(function (x) {
              return (
                String(x.barcode || "").toLowerCase() === t ||
                String(x.code || "").toLowerCase() === t
              );
            })[0];
          if (!p) return Sales.toast("No product found for " + raw, true);
          if (p.stock != null && p.stock <= 0) return notifyOut(p, p.id);
          setQty(p.id, (cart[p.id] || 0) + 1);
          Sales.toast("Added " + p.name);
        }
        function imgErr(e) {
          var im = e.target;
          if (im && im.tagName === "IMG") {
            im.style.display = "none";
            if (im.nextElementSibling) im.nextElementSibling.hidden = false;
          }
        }
        function drawCats() {
          var c = {};
          PRODS.forEach(function (p) {
            if (p.category) c[p.category] = 1;
          });
          document.getElementById("cats").innerHTML =
            '<button class="cat' +
            (cat ? "" : " on") +
            '" type="button" data-c="">All</button>' +
            Object.keys(c)
              .sort()
              .map(function (n) {
                return (
                  '<button class="cat' +
                  (cat === n ? " on" : "") +
                  '" type="button" data-c="' +
                  Sales.esc(n) +
                  '">' +
                  Sales.esc(n) +
                  "</button>"
                );
              })
              .join("");
        }
        function rows() {
          var t = norm(q);
          return PRODS.filter(function (p) {
            return (!cat || p.category === cat) && (!t || p._k.indexOf(t) > -1);
          });
        }
        function drawGrid() {
          var R = rows(),
            g = document.getElementById("grid");
          g.innerHTML = R.length
            ? R.slice((page - 1) * STEP, page * STEP)
                .map(function (p) {
                  var n = cart[p.id];
                  return (
                    '<div class="pc' +
                    (p.stock != null && p.stock <= 0 ? " oos" : "") +
                    '" role="button" tabindex="0" data-id="' +
                    Sales.esc(p.id) +
                    '">' +
                    '<button class="fav' +
                    (FAV[p.id] ? " on" : "") +
                    '" type="button" tabindex="-1" aria-label="Favourite">' +
                    Sales.ic("heart") +
                    "</button>" +
                    pic(p, "pic") +
                    Sales.stockHtml(p) +
                    "<b>" +
                    Sales.esc(p.name) +
                    "</b><small>" +
                    Sales.esc(p.code || "") +
                    (p.unit ? " · per " + Sales.esc(p.unit) : "") +
                    (Sales.isKg(p) ? " · in Kg, e.g. 0.5" : "") +
                    "</small>" +
                    '<div class="pr2"><b>' +
                    Sales.money(p.price) +
                    "</b></div>" +
                    '<div class="pstep"><button type="button" data-s="-" tabindex="-1" aria-label="Less"' +
                    (n ? "" : " disabled") +
                    ">" +
                    Sales.ic("minus") +
                    '</button><input type="number" min="0" max="9999" step="' +
                    (Sales.isKg(p) ? "0.1" : "1") +
                    '" inputmode="' +
                    (Sales.isKg(p) ? "decimal" : "numeric") +
                    '" value="' +
                    (n || 0) +
                    '" aria-label="' +
                    (Sales.isKg(p) ? "Quantity in Kg" : "Quantity") +
                    '"><button class="add" type="button" data-s="+" tabindex="-1" aria-label="Add ' +
                    Sales.esc(p.name) +
                    '">' +
                    Sales.ic("plus") +
                    "</button></div>" +
                    boxBtn(p) +
                    "</div>"
                  );
                })
                .join("")
            : '<div class="empty" style="grid-column:1/-1"><i>' +
              Sales.ic("search") +
              "</i><b>No products found</b><span>Try a different name or category.</span></div>";
          Sales.pager(
            document.getElementById("more"),
            R.length,
            page,
            STEP,
            function (p) {
              page = p;
              drawGrid();
              document
                .getElementById("grid")
                .scrollIntoView({ block: "start" });
            },
          );
        }
        // Box helpers: boxQty = pieces in one box (null when the product is not sold by the box)
        function boxBtn(p) {
          return p.boxQty
            ? '<button class="boxb" type="button" tabindex="-1">+ Box <small>(' +
                p.boxQty +
                " " +
                Sales.esc(p.unit || "pcs") +
                ")</small></button>"
            : "";
        }
        function boxText(p, n) {
          if (!p.boxQty || n < p.boxQty) return "";
          var b = Math.floor(n / p.boxQty),
            r = n % p.boxQty;
          return (
            b + (b === 1 ? " box" : " boxes") + (r ? " + " + r + " loose" : "")
          );
        }
        function drawCart() {
          var T = totals(),
            el = document.getElementById("cart"),
            ids = Object.keys(cart).filter(function (id) {
              return byId[id];
            });
          var items = ids.length
            ? ids
                .map(function (id) {
                  var p = byId[id],
                    n = cart[id];
                  return (
                    '<div class="ci" data-id="' +
                    Sales.esc(id) +
                    '">' +
                    pic(p, "pic") +
                    "<div><b>" +
                    Sales.esc(p.name) +
                    "</b><small>" +
                    Sales.esc(p.code || "") +
                    " · " +
                    Sales.money(p.price) +
                    (Sales.isKg(p) ? " / Kg" : "") +
                    "</small>" +
                    (p.boxQty
                      ? '<div class="bxr"><span>' +
                        (boxText(p, n) || "Less than 1 box") +
                        '</span><button type="button" data-a="boxdec" aria-label="Remove one box">− Box</button><button type="button" data-a="boxinc" aria-label="Add one box">+ Box</button></div>'
                      : "") +
                    "</div>" +
                    '<div class="ctl"><div class="step"><button type="button" data-a="dec" aria-label="Less">' +
                    Sales.ic(n > 1 ? "minus" : "trash") +
                    '</button><input type="number" min="0.001" max="9999" step="' +
                    (Sales.isKg(p) ? "0.1" : "1") +
                    '" inputmode="' +
                    (Sales.isKg(p) ? "decimal" : "numeric") +
                    '" value="' +
                    n +
                    '" aria-label="' +
                    (Sales.isKg(p) ? "Quantity in Kg" : "Quantity") +
                    '"><button type="button" data-a="inc" aria-label="More">' +
                    Sales.ic("plus") +
                    '</button></div><div class="amt">' +
                    Sales.money((Number(p.price) || 0) * n) +
                    "</div></div></div>"
                  );
                })
                .join("")
            : '<div class="empty"><i>' +
              Sales.ic("cart") +
              "</i><b>No items yet</b><span>Tap a product to add it.</span></div>";
          el.innerHTML =
            '<h2><span><button class="back mclose" id="cclose" type="button" style="display:none">' +
            Sales.ic("chevron-left") +
            "</button>Order Items (" +
            T.lines +
            ')</span><button type="button" id="clear"' +
            (T.lines ? "" : " hidden") +
            ">Clear All</button></h2>" +
            '<div class="cl">' +
            items +
            "</div>" +
            '<div class="sum"><div><span>Items (' +
            T.units +
            ")</span><span>" +
            Sales.money(T.sub) +
            "</span></div>" +
            "<div><span>Discount</span><span>" +
            (T.disc ? "− " + Sales.money(T.disc) : "₹0") +
            "</span></div>" +
            (discOn
              ? '<div class="disc"><label for="dsc">Discount (₹)</label><input id="dsc" type="number" min="0" inputmode="decimal" value="' +
                (discount || "") +
                '" placeholder="0"></div>'
              : '<button class="btn tsoft sm" id="adsc" type="button">' +
                Sales.ic("plus") +
                "Add Discount</button>") +
            '<div class="tot"><span>Total Amount</span><span>' +
            Sales.money(T.total) +
            "</span></div></div>" +
            '<div><label for="nt">Notes (optional)</label><textarea class="notes" id="nt" maxlength="500" placeholder="Add order notes…">' +
            Sales.esc(notes) +
            "</textarea></div>" +
            '<div class="cbtns"><button class="btn line" id="draft" type="button"' +
            (T.lines ? "" : " disabled") +
            '>Save as Draft</button><button class="btn teal" id="place" type="button"' +
            (T.lines ? "" : " disabled") +
            ">" +
            Sales.ic("check") +
            "Place Order</button></div>";
          var bar = document.getElementById("cbar");
          bar.hidden = !T.lines;
          document.getElementById("main").classList.toggle("hascbar", !!T.lines);
          bar.innerHTML =
            "<span>" +
            Sales.ic("cart").replace(
              "<svg",
              '<svg style="vertical-align:-5px;margin-right:8px"',
            ) +
            "View Cart (" +
            T.lines +
            ")</span><span>" +
            Sales.money(T.total) +
            "</span>";
          var cc = document.getElementById("cclose");
          if (matchMedia("(max-width:900px)").matches)
            cc.style.display = "inline-flex";
          cc.onclick = function () {
            el.classList.remove("open");
            document.getElementById("cback").classList.remove("on");
          };
          el.querySelector(".cl").onclick = function (e) {
            var b = e.target.closest && e.target.closest("button[data-a]"),
              row = e.target.closest && e.target.closest(".ci");
            if (!b || !row) return;
            var id = row.getAttribute("data-id");
            var act = b.getAttribute("data-a"),
              bq = (byId[id] && byId[id].boxQty) || 1,
              step =
                act === "inc"
                  ? 1
                  : act === "dec"
                    ? -1
                    : act === "boxinc"
                      ? bq
                      : -bq;
            setQty(id, (cart[id] || 0) + step);
          };
          el.querySelector(".cl").onchange = function (e) {
            var row = e.target.closest && e.target.closest(".ci");
            if (row && e.target.tagName === "INPUT") {
              var cid = row.getAttribute("data-id"),
                cv = Number(e.target.value) || 0;
              setQty(cid, Sales.isKg(byId[cid]) ? cv : Math.floor(cv));
            }
          };
          var cl = document.getElementById("clear");
          cl.onclick = function () {
            if (confirm("Remove all items from this order?")) {
              cart = {};
              refresh();
            }
          };
          var a = document.getElementById("adsc");
          if (a)
            a.onclick = function () {
              discOn = true;
              drawCart();
              document.getElementById("dsc").focus();
            };
          var d = document.getElementById("dsc");
          if (d)
            d.onchange = function () {
              discount = Math.max(0, Number(d.value) || 0);
              drawCart();
            };
          document.getElementById("nt").oninput = function () {
            notes = this.value;
          };
          document.getElementById("draft").onclick = function () {
            send(true);
          };
          document.getElementById("place").onclick = function () {
            send(false);
          };
        }
        function setQty(id, n) {
          n = Math.min(9999, Math.max(0, Math.round(n * 1000) / 1000));
          var sp = byId[id];
          if (sp && sp.stock != null && n > sp.stock) {
            n = Math.max(0, sp.stock);
            Sales.toast(
              "Only " +
                sp.stock +
                (sp.unit ? " " + sp.unit : "") +
                " of " +
                sp.name +
                " available",
            );
          }
          if (n) cart[id] = n;
          else delete cart[id];
          refresh();
        }
        function refresh() {
          drawGrid();
          drawCart();
        }
        function payload(draft) {
          return {
            code: CODE,
            items: Object.keys(cart).map(function (id) {
              return { id: id, qty: cart[id] };
            }),
            discount: totals().disc,
            notes: notes,
            draft: draft,
            id: draftId || undefined,
            k: key,
            replaces: REPL || undefined,
          };
        }
        function send(draft) {
          if (busy || !Object.keys(cart).length) return;
          busy = true;
          var b = document.getElementById(draft ? "draft" : "place");
          if (b) b.disabled = true;
          // the phone's position is only recorded for the admin; it never blocks the order
          (draft ? Promise.resolve({}) : Sales.locateSoft())
            .then(function (loc) {
              var pl = payload(draft);
              pl.lat = loc.lat;
              pl.lng = loc.lng;
              pl.acc = loc.acc;
              pl.lerr = loc.err;
              return Sales.api("/api/sales/order", pl);
            })
            .then(function (j) {
              busy = false;
              if (draft) {
                draftId = j.order.id;
                key =
                  "k" +
                  Date.now().toString(36) +
                  Math.random().toString(36).slice(2, 8);
                Sales.toast("Draft saved");
                drawCart();
              } else {
                placed = true;
                success(j.order);
              }
            })
            .catch(function (e) {
              busy = false;
              drawCart();
              Sales.toast(e.message || "Could not save. Try again.", true);
            });
        }
        function success(o) {
          document.getElementById("hello").innerHTML = "<h1>New Order</h1>";
          var t = new Date(o.t);
          main.innerHTML =
            '<div class="done"><div class="ring">' +
            Sales.ic("check") +
            "</div><h1>Order Placed Successfully!</h1>" +
            '<div class="card oc"><div class="tile t0">' +
            Sales.esc(Sales.init(o.shop)) +
            "</div><div><b>Order #" +
            Sales.esc(o.id) +
            '</b><br><span style="color:var(--muted)">' +
            Sales.esc(o.shop) +
            "<br>" +
            o.items.length +
            (o.items.length === 1 ? " item" : " items") +
            " · " +
            Sales.money(o.total) +
            "<br>" +
            Sales.esc(Sales.dateLabel(o.date)) +
            " · " +
            Sales.esc(Sales.time(o.t)) +
            "</span></div></div>" +
            '<div class="grid2"><a class="btn wide" href="orders.html?o=' +
            encodeURIComponent(o.id) +
            '">View Order Details</a>' +
            '<a class="btn line wide" href="route.html">Back to My Route</a><a class="btn line wide" href="home.html">Back to Home</a></div></div>';
          window.scrollTo(0, 0);
        }
        window.addEventListener("beforeunload", function (e) {
          if (!placed && Object.keys(cart).length) {
            e.preventDefault();
            e.returnValue = "";
          }
        });

        Promise.all([
          Sales.data(),
          // today's route decides where the back arrow goes; only a draft needs it to succeed
          DRAFT
            ? Sales.mine()
            : Sales.mine().catch(function () {
                return null;
              }),
        ])
          .then(function (r) {
            var d = r[0];
            SHOP = d.customers.filter(function (c) {
              return c.code === CODE;
            })[0];
            if (!SHOP) {
              main.innerHTML =
                '<div class="card empty"><b>Shop not found</b><span><a class="link" href="customers.html">Back to My Customers</a></span></div>';
              return;
            }
            LIST = d.customers.filter(function (c) {
              return c && c.code;
            });
            PRODS = d.products.filter(function (p) {
              return p && p.id;
            });
            PRODS.forEach(function (p) {
              byId[p.id] = p;
              p._k = norm(
                [p.name, p.alias, p.code, p.barcode, p.category].join(" "),
              );
            });
            PRODS.sort(function (a, b) {
              return String(a.name).localeCompare(String(b.name), "en", {
                sensitivity: "base",
                numeric: true,
              });
            });
            BACK = Sales.backTo(r[1], d);
            if (r[1] && DRAFT) {
              var o = r[1].orders.filter(function (x) {
                return (
                  x.id === DRAFT && x.status === "draft" && x.code === CODE
                );
              })[0];
              if (o) {
                draftId = o.id;
                notes = o.notes || "";
                discount = o.discount || 0;
                discOn = !!discount;
                o.items.forEach(function (it) {
                  if (byId[it.id]) cart[it.id] = it.qty;
                });
              }
            }
            shell();
          })
          .catch(function () {
            main.innerHTML =
              '<div class="card empty"><b>Could not load products</b><span>Check your connection and refresh.</span></div>';
          });
      });
    </script>
  </body>
</html>
