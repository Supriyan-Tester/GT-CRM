<!doctype html>
<html lang="en">
<head>
  <script src="../shared/loading.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Collect payment - General Traders Sales</title><link rel="stylesheet" href="sales.css"><link rel="stylesheet" href="../shared/dropdown.css">
  <style>
    .cs-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:13px;display:grid;gap:10px}
    .cs-card h3{font-size:15px;margin:0}
    .cs-hint{font-size:12px;color:var(--muted);line-height:1.5}
    .cs-shop b{font-size:17px}.cs-shop small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
    #csBills{background:none;border:0;padding:0}
    .cs-hero{background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff;border-radius:18px;padding:18px 20px;display:grid;gap:4px}
    .cs-hero span{font-size:14px;opacity:.9}.cs-hero b{font-size:34px;line-height:1.15;font-weight:800}.cs-hero small{font-size:14px;opacity:.9}

    .cs-bill .amt{font-size:20px;font-weight:800;color:#d97706;text-align:right}.cs-bill.late .amt{color:#dc2626}
    .cs-bill .tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .cs-bill .hist{grid-column:1/-1;background:var(--bg);border-radius:10px;padding:10px 12px;display:grid;gap:10px;margin-top:4px}
    .cs-tag{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:rgba(217,119,6,.14);color:#d97706}.cs-tag.red{background:rgba(220,38,38,.12);color:#dc2626}
    .cs-bill .act{grid-column:1/-1;justify-self:end}.cs-bill .cs-pick{background:#0d9488;color:#fff;border-color:#0d9488;padding:11px 20px;font-size:15px;border-radius:12px}.cs-bill .cs-pick.on{background:#0f766e;border-color:#0f766e}
    .cs-order{background:rgba(34,197,94,.14);color:#15803d;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
    .cs-fix{background:rgba(13,148,136,.1);border:1px solid rgba(13,148,136,.35);border-radius:12px;padding:12px 14px;display:grid;gap:4px;font-size:13px}
    .cs-fix b{color:#0f766e}
    .cs-bill .top b{font-size:14px}.cs-bill small{display:block;color:var(--muted);font-size:12px}
    .cs-more{display:none;gap:9px}.cs-more.open{display:grid}
    .cs-more input[type=number],.cs-sp input,.cs-note{width:100%;min-height:44px;border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:var(--bg);color:var(--text);font:inherit;min-width:0}
    .cs-note{min-height:72px;resize:vertical}
    .cs-amt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px}
    .cs-pick{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:9px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
    .cs-pick.on{background:var(--pri,var(--primary));color:#fff;border-color:var(--pri,var(--primary))}
    .cs-photo{display:flex;gap:10px;align-items:center}.cs-bill .cs-cam{flex:1;min-height:52px;background:var(--card);color:var(--text);border:1.5px dashed var(--border);font-size:15px;padding:9px 14px}.cs-bill .cs-cam.done{border:1.5px solid #0d9488;background:rgba(13,148,136,.12);color:#0f766e}.cs-warn{font-size:13px;font-weight:700;color:#b45309}
    .cs-thumb{position:relative;flex:0 0 52px;width:52px;height:52px;border:1.5px dashed var(--border);border-radius:12px;display:grid;place-items:center;font-size:11px;color:var(--muted);overflow:hidden;text-align:center;background:var(--bg)}
    .cs-thumb img{width:100%;height:100%;object-fit:cover}.cs-x{position:absolute;top:0;right:0;width:20px;height:20px;border:0;border-radius:0 0 0 8px;background:#111;color:#fff;font-size:13px;line-height:1;padding:0;cursor:pointer}
    .cs-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cs-tile span{display:block;font-size:20px;margin-bottom:2px}
    .cs-tile{border:1px solid var(--border);border-radius:12px;padding:12px 6px;text-align:center;background:var(--card);color:var(--text);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
    .cs-tile.on{border:2px solid var(--pri,var(--primary));background:var(--t-info)}
    .cs-seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:999px;padding:3px;background:var(--bg)}
    .cs-seg button{border:0;border-radius:999px;padding:9px;font:inherit;font-size:14px;font-weight:700;background:none;color:var(--text);cursor:pointer}
    .cs-seg button.on{background:var(--pri,var(--primary));color:#fff}
    .cs-sp{display:none;gap:8px}.cs-sp.open{display:grid}.cs-sp label{font-size:12px;color:var(--muted);font-weight:700;display:grid;gap:4px}
    .cs-notebtn{display:flex;justify-content:space-between;align-items:center;min-height:44px;width:100%;border:0;background:none;color:var(--text);font:inherit;font-size:14px;font-weight:700;padding:0;cursor:pointer}.cs-notebtn small{font-weight:500;color:var(--muted);margin-left:6px}.cs-notebtn i{font-style:normal;color:var(--muted);transition:transform .15s}.cs-notebtn.open i{transform:rotate(180deg)}
    .cs-total{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:20px;padding-top:6px}
    .cs-err{color:var(--danger,#dc2626);font-size:13px;min-height:16px}
    .cs-bad{border-color:var(--danger,#dc2626)!important;box-shadow:0 0 0 3px rgba(220,38,38,.16)}
    .cs-done{text-align:center;display:grid;gap:12px;justify-items:center}
    .cs-tick{width:62px;height:62px;border-radius:50%;background:#16a34a;color:#fff;font-size:32px;display:grid;place-items:center}
    .cs-sum{width:100%;border:1px solid var(--border);border-radius:12px;padding:2px 12px;text-align:left}.cs-sum div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:14px}.cs-sum div:first-child{border-top:0}
  /* Old-credit bill card: same layout as the delivery app's collect screen */
.oc{background:#fff8ec;color:#3b2a0a;border:1px solid #f59e0b;border-radius:14px;padding:12px;display:grid;gap:10px}
.oc-ch{display:flex;align-items:center;gap:10px;cursor:pointer;justify-content:space-between}
.oc-ch:after{content:"\25BE";color:#8a6d3b;transition:transform .15s}.oc.open>.oc-ch:after{transform:rotate(180deg)}
.oc-ch>div:nth-child(2){flex:1}.oc-ico{font-size:22px}.oc small{display:block;color:#7a6a4a;font-size:12px}.oc-tot{color:#d97706;font-size:16px}
.oc>.oc-cb{display:none}.oc.open>.oc-cb{display:grid;gap:10px}
.oc-row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;border-top:1px solid rgba(217,119,6,.25);padding-top:10px}
.oc-th{width:56px;height:56px;border-radius:10px;background:#fff;border:1px solid #e5d9c3;display:grid;place-items:center;font-size:10px;color:#6b7280;text-align:center;cursor:pointer;overflow:hidden}
.oc-th img{width:100%;height:100%;object-fit:cover}
.oc-row b{font-size:14px}.oc-row small{font-size:12px}
.oc-due{display:inline-block;background:rgba(220,38,38,.1);color:#dc2626;font-weight:700;font-size:12px;border-radius:8px;padding:2px 8px;margin-top:3px}
.oc-late{display:inline-block;background:#dc2626;color:#fff;font-weight:700;font-size:11px;border-radius:8px;padding:2px 7px;margin-left:4px}
.oc-btn{border:1px solid #f59e0b;background:#fff;color:#d97706;border-radius:10px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.oc-btn.on{background:#0b7a55;color:#fff;border-color:#0b7a55}
.oc-more{grid-column:1/-1;display:none;gap:12px}.oc-more.open{display:grid}
.oc-amt{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:8px;align-items:center}
.oc-in{display:flex;align-items:center;gap:8px;height:52px;padding:0 12px;border:1px solid #e5d9c3;border-radius:12px;background:#fff;color:#1f2937;font-size:20px;font-weight:700}
.oc-in span{color:#6b7280}.oc-in input{flex:1;min-width:0;width:100%;min-height:0;height:100%;border:0;padding:0;background:transparent;color:inherit;font:inherit;outline:0}
.oc-cam{position:relative;width:52px;height:52px;border-radius:12px;border:1.5px dashed #c9b88f;background:#fff;font-size:22px;cursor:pointer;padding:0;display:grid;place-items:center;overflow:hidden}
.oc-cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.oc-cam.done{border:1px solid #0b7a55}
.oc-cam.done:after{content:"\2713";position:absolute;top:0;right:0;width:18px;height:18px;border-radius:0 0 0 8px;background:#0b7a55;color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center}
.oc-pbar{height:8px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden}.oc-pbar i{display:block;height:100%;width:0;background:#0b7a55;transition:width .15s}
.oc-rc{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#6b5a3a}
.oc-more .cs-warn,.oc-more .cs-hint{margin:0;font-size:13px;font-weight:700;color:#b45309}
.oc-okrow{display:flex;justify-content:flex-end;gap:8px}.oc-okrow .oc-btn{height:34px;padding:0 18px;font-size:14px}
.oc-okrow .oc-ok{background:#0b7a55;color:#fff;border-color:#0b7a55}.oc-okrow .oc-ok:disabled{opacity:.4;cursor:not-allowed}
.oc-sm{grid-column:1/-1;display:none;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#e4f5ee;border:1px solid #10b981;border-radius:14px;padding:10px 12px;color:#10231b}.oc-sm.open{display:grid}
.oc-sm .t{width:28px;height:28px;border-radius:50%;background:#0b7a55;color:#fff;display:grid;place-items:center;font-size:15px;font-weight:900}
.oc-sm p{margin:0;font-size:14px;font-weight:700}.oc-sm small{font-size:12px;color:#4b5f55}
.oc-ed{border:0;background:none;color:#2563eb;font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:4px}
#ocView{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99}#ocView img{max-width:94%;max-height:90%;border-radius:8px}
</style>
</head><body><div id="app"></div><script src="../assets/icons.js"></script><script src="sales.js"></script><script src="../shared/dropdown.js"></script>
<script>
Sales.start("payments",function(me,hello,main){
  var Q=new URLSearchParams(location.search),CODE=Q.get("c")||"",ORDER=Q.get("o")||"",FIX=Q.get("fix")||"";
  var PRE_AMT=Number(Q.get("amt")||0),PRE_METHOD=Q.get("method")||"",PRE_NOTE=Q.get("note")||"",PRE_REASON=Q.get("reason")||"",PRE_INV=Q.get("inv")||"";
  if(!CODE)return location.replace("customers.html");
  hello.innerHTML=FIX?"<h1>Correct bill collection</h1><p>Fix the details requested by office and resubmit</p>":"<h1>Collect payment</h1><p>Record money received from this shop</p>";
  var esc=Sales.esc,SPN={cash:"Cash",upi:"UPI",bank_transfer:"Bank transfer"};
  var S={method:"cash",split:false,bills:[],sel:{},files:{},ev:{},evp:{},evState:{},key:null,busy:false,total:0,shop:null};
  function dirty(){S.key=null}
  function $(s){return document.querySelector(s)}
  function money(v){return "₹"+Number(v||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
  function dmy(d){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||"");return m?m[3]+"/"+m[2]+"/"+m[1]:esc(d)}
  function hist(x){var M={cash:"Cash",upi:"UPI",bank_transfer:"Bank"};if(!x.payments)return "";if(!x.payments.length)return '<small class="muted" style="display:block">No payments yet</small>';return (x.payments).map(function(p){var d=p.at?new Date(p.at).toLocaleDateString("en-IN",{day:"numeric",month:"short",timeZone:"Asia/Kolkata"}):"",ap=p.status==="approved";return '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;font-size:12px;color:var(--muted);line-height:1.35"><span><b style="color:var(--text)">'+money(p.amount).replace(/\.00$/,"")+"</b>"+(d?" \u00b7 "+d:"")+(p.by?" \u00b7 "+esc(p.by):"")+(M[p.method]?" \u00b7 "+M[p.method]:"")+'</span><span style="font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:'+(ap?"rgba(22,163,74,.14)":"rgba(217,119,6,.14)")+";color:"+(ap?"#16a34a":"#d97706")+'">'+(ap?"Approved":"Waiting for approval")+"</span></div>"}).join("")}
  function pz(v){return Math.round(Number(v)*100)}
  function fe(msg,sel){var e=new Error(msg);e.sel=sel;return e}
  function rawUrl(f){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(r.result)};r.onerror=no;r.readAsDataURL(f)})}
  // Phone photos are shrunk to at most 1600 px (JPEG) before upload so they stay well under the 5 MB limit.
  function dataUrl(f){return new Promise(function(ok){var url=URL.createObjectURL(f),img=new Image();
    img.onload=function(){try{var k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL("image/jpeg",0.72))}catch(e){URL.revokeObjectURL(url);rawUrl(f).then(ok)}};
    img.onerror=function(){URL.revokeObjectURL(url);rawUrl(f).then(ok)};img.src=url})}

  main.innerHTML=
    (FIX?'<div class="cs-fix"><b>Correction requested</b>'+(PRE_REASON?'<span>Note: '+esc(PRE_REASON)+'</span>':"")+'<span>Update the bill amount or photo below and save.</span></div>':"")+
    (ORDER?'<div class="cs-order">Order #'+esc(ORDER)+' placed. You can collect any unpaid bills from this shop below.</div>':"")+
    '<div class="cs-card cs-shop" id="csShop"><b>Loading shop...</b></div>'+
    '<div class="cs-card" id="csPay" style="display:none"><h3>Payment method</h3><div class="cs-tiles" id="csTiles"><button type="button" class="cs-tile on" data-m="cash" aria-pressed="true"><span>💵</span>Cash</button><button type="button" class="cs-tile" data-m="upi" aria-pressed="false"><span>📱</span>UPI</button><button type="button" class="cs-tile" data-m="bank_transfer" aria-pressed="false"><span>🏦</span>Bank</button></div>'+
      '<div class="cs-seg"><button type="button" class="on" id="csOne" aria-pressed="true">Single</button><button type="button" id="csSplit" aria-pressed="false">Split</button></div>'+
      '<div class="cs-sp" id="csSpBox"><label>Cash amount<input id="sp_cash" type="number" min="0" step="0.01" placeholder="0.00"></label><label>UPI amount<input id="sp_upi" type="number" min="0" step="0.01" placeholder="0.00"></label><label>Bank transfer amount<input id="sp_bank_transfer" type="number" min="0" step="0.01" placeholder="0.00"></label><div class="cs-hint" id="csSpMsg"></div></div></div>'+
    '<div class="cs-card" id="csBills"><h3>Unpaid bills</h3><div class="cs-hint">Loading bills...</div></div>'+
    '<div id="csRest" style="display:none"><div class="cs-card">'+
      '<button type="button" class="cs-notebtn" id="csNoteBtn" aria-expanded="false"><span>Add a note<small>Optional</small></span><i aria-hidden="true">▾</i></button>'+
      '<textarea class="cs-note" id="csNote" maxlength="250" placeholder="Reference or remarks" aria-label="Note" style="display:none"></textarea>'+
      '<div class="cs-total"><span>Total collected</span><b id="csTotal">₹0.00</b></div><div class="cs-err" id="csErr" role="status"></div>'+
      '<button class="btn" id="csGo" type="button" disabled style="width:100%">Save collection</button><p class="cs-hint">A bill photo is optional (uploaded in background when signal allows). The collection waits for Billing/Admin approval; the shop\'s balance changes only after approval.</p></div>'+
    '</div><div id="csDone"></div><div id="ocView"><img id="ocImg" alt="Bill photo"></div>';

  if(PRE_METHOD&&SPN[PRE_METHOD]){
    S.method=PRE_METHOD;
    document.querySelectorAll(".cs-tile").forEach(function(x){var on=x.getAttribute("data-m")===PRE_METHOD;x.classList.toggle("on",on);x.setAttribute("aria-pressed",String(on))});
  }
  if(PRE_NOTE){
    $("#csNote").value=PRE_NOTE;
    $("#csNote").style.display="";
    $("#csNoteBtn").setAttribute("aria-expanded","true");
    $("#csNoteBtn").classList.add("open");
  }

  function splitPayments(){var o=[];["cash","upi","bank_transfer"].forEach(function(m){var v=Number($("#sp_"+m).value);if(v>0)o.push({method:m,amount:v})});return o}
  function splitSum(){return splitPayments().reduce(function(n,p){return n+pz(p.amount)},0)}
  function amtOf(id){var i=$('[data-a="'+id+'"]');return i?Number(i.value)||0:0}
  function setPhotoStatus(id,state,text){
    S.evState[id]=state;
    var h=$('[data-hint="'+id+'"]');
    if(!h)return;
    h.textContent=text;
    h.style.display=text?"":"none";
    h.className=state==="err"?"cs-warn":"cs-hint";
  }
  function recalc(){
    var n=0;Object.keys(S.sel).forEach(function(id){if(S.sel[id])n+=amtOf(id)});
    S.total=Math.round(n*100)/100;$("#csTotal").textContent=money(S.total);
    var ready=true;
    Object.keys(S.sel).forEach(function(id){
      if(!S.sel[id])return;
      var h=$('[data-hint="'+id+'"]'),msg=(amtOf(id)>0?(S.files[id]?"":"Add the bill photo to continue."):"Enter the amount received.");
var okb=$('[data-ook="'+id+'"]');if(okb)okb.disabled=!(amtOf(id)>0&&S.files[id]);
      if(h){
        if(msg){h.textContent=msg;h.style.display="";h.className="cs-warn";}
        else if(!S.evState[id]){h.style.display="none";}
      }
      if(msg)ready=false;
    });
    var ok=S.total>0&&ready;
    $("#csOne").classList.toggle("on",!S.split);$("#csSplit").classList.toggle("on",S.split);$("#csOne").setAttribute("aria-pressed",String(!S.split));$("#csSplit").setAttribute("aria-pressed",String(S.split));
    $("#csSpBox").classList.toggle("open",S.split);$("#csTiles").style.display=S.split?"none":"grid";
    if(S.split){
      var p=splitPayments(),m=$("#csSpMsg"),rem=(pz(S.total)-splitSum())/100;
      if(!(S.total>0)){m.textContent="Select a bill and enter its amount first.";ok=false}
      else if(rem!==0){m.textContent="Total "+money(S.total)+" · "+(rem>0?"Remaining "+money(rem):"Over by "+money(-rem));ok=false}
      else if(p.length<2){m.textContent="Use at least two payment methods.";ok=false}
      else m.textContent="✓ Matches total: "+p.map(function(q){return SPN[q.method]+" "+money(q.amount)}).join(" + ");
    }
    $("#csGo").disabled=!ok||S.busy;
  }
  function evUrl(p){var t=String(p||"").split("/").pop().replace(/\.(jpg|png|webp)$/i,"");return t&&t!=="no-photo"?"/api/accounts/evidence/"+t:""}
function billX(id){return S.bills.filter(function(x){return String(x.id)===String(id)})[0]}
function showMore(id,open){$("#more_"+id).className="oc-more"+(open?" open":"")}
function showSum(id,open){$("#sm_"+id).className="oc-sm"+(open?" open":"")}
function ocUpdate(id){
var x=billX(id),inp=$('[data-a="'+id+'"]');if(!x||!inp)return;
var av=Number(x.availableToCollect),out=Number(x.outstanding),v=Number(inp.value)||0;
if(v>av){inp.value=av.toFixed(2);v=av}
$("#bar_"+id).style.width=(out>0?Math.min(100,v/out*100):0)+"%";
$("#rcv_"+id).textContent="Received "+money(v);
$("#stay_"+id).textContent="Stays on credit "+money(Math.max(0,out-v));
recalc();
}
function selectBill(id,presetAmt){
var b=$('[data-t="'+id+'"]');if(!b||S.sel[id])return;
S.sel[id]=true;dirty();b.className="oc-btn on";b.textContent="Selected";b.setAttribute("aria-pressed","true");
showMore(id,true);
var inp=$('[data-a="'+id+'"]');
if(inp&&presetAmt>0){var max=Number(inp.max)||presetAmt;inp.value=Math.min(max,presetAmt).toFixed(2)}
ocUpdate(id);
}
function drawBills(){
var due=S.bills.reduce(function(a,x){return a+Number(x.outstanding||0)},0);
if(!S.bills.length){$("#csBills").innerHTML='<h3>Unpaid bills</h3><div class="cs-hint">✓ This shop has no unpaid bill to collect.</div>';return}
var n=S.bills.length,now=new Date();
$("#csBills").innerHTML='<div class="oc open"><div class="oc-ch" id="ocTg"><div class="oc-ico">🗂</div><div><b>Old Credit</b><small>'+n+(n>1?" bills":" bill")+' · Outstanding</small></div><b class="oc-tot">'+money(due)+'</b></div><div class="oc-cb">'+
S.bills.map(function(x){
var u=evUrl(x.evidence_path),av=Number(x.availableToCollect),id=esc(x.id),
m=/^(\d{4})-(\d{2})-(\d{2})/.exec(x.invoice_date||""),age=m?Math.floor((now-new Date(+m[1],+m[2]-1,+m[3]))/864e5):0;
return '<div class="oc-row"><div class="oc-th" data-v="'+esc(u)+'">'+(u?'<img src="'+esc(u)+'" alt="Bill" onerror="this.parentNode.textContent=\'No photo\'">':"No photo")+'</div>'+
'<div><b>Invoice No. '+esc(x.invoice_no)+'</b><small class="muted" style="display:block">📅 '+dmy(x.invoice_date)+'</small><span class="oc-due">Due: '+money(x.outstanding)+'</span>'+(age>30?'<span class="oc-late">'+age+' days overdue</span>':"")+
(Number(x.pendingAmount)>0?'<small class="muted" style="display:block">'+money(x.pendingAmount)+' waiting for approval</small>':"")+'</div>'+
(av>0?'<button type="button" class="oc-btn" data-t="'+id+'" aria-pressed="false">Collect</button>':'<span class="muted">Collected</span>')+
(av>0?'<div class="oc-more" id="more_'+id+'"><div class="oc-amt"><div class="oc-in"><span>₹</span><input data-a="'+id+'" type="number" min="0" max="'+av.toFixed(2)+'" step="0.01" inputmode="decimal" placeholder="0.00" aria-label="Amount received"></div>'+
'<button type="button" class="oc-cam" data-add="'+id+'" aria-label="Add bill photo">📷</button></div>'+
'<div class="oc-pbar"><i id="bar_'+id+'"></i></div><div class="oc-rc"><span id="rcv_'+id+'">Received '+money(0)+'</span><span id="stay_'+id+'">Stays on credit '+money(x.outstanding)+'</span></div>'+
'<p class="cs-warn" data-hint="'+id+'">No bill photo yet. Tap the camera.</p>'+
'<div class="oc-okrow"><button type="button" class="oc-btn" data-ocancel="'+id+'">Cancel</button><button type="button" class="oc-btn oc-ok" data-ook="'+id+'" disabled>OK</button></div>'+
'<input type="file" data-f="'+id+'" accept="image/jpeg,image/png,image/webp" capture="environment" style="display:none"></div>'+
'<div class="oc-sm" id="sm_'+id+'"><div class="t">✓</div><div><p id="smT_'+id+'"></p><small id="smS_'+id+'"></small></div><button type="button" class="oc-ed" data-oedit="'+id+'">Edit</button></div>':"")+'</div>';
}).join("")+'</div></div>';
$("#ocTg").onclick=function(){this.parentNode.classList.toggle("open")};
document.querySelectorAll("[data-v]").forEach(function(t){t.onclick=function(){var u=t.getAttribute("data-v");if(u){$("#ocImg").src=u;$("#ocView").style.display="flex"}}});
$("#ocView").onclick=function(){this.style.display="none"};
document.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){
var id=b.getAttribute("data-t"),on=!S.sel[id];S.sel[id]=on;dirty();b.className="oc-btn"+(on?" on":"");b.textContent=on?"Selected":"Collect";b.setAttribute("aria-pressed",String(on));
showMore(id,on);showSum(id,false);if(on)ocUpdate(id);else recalc()}});
document.querySelectorAll("[data-a]").forEach(function(i){i.oninput=function(){
var m=/^(-?\d*\.\d{2})\d+$/.exec(i.value);if(m)i.value=m[1];dirty();ocUpdate(i.getAttribute("data-a"))}});
document.querySelectorAll("[data-add]").forEach(function(b){var id=b.getAttribute("data-add"),f=$('[data-f="'+id+'"]');
b.onclick=function(){f.click()};
f.onchange=function(){var file=f.files[0];if(!file)return;
if(file.size>12*1024*1024){
delete S.files[id];delete S.ev[id];delete S.evp[id];f.value="";b.className="oc-cam";b.textContent="📷";
setPhotoStatus(id,"err","That photo is too large. Take it again.");
recalc();return;
}
S.files[id]=file;delete S.ev[id];dirty();
b.className="oc-cam done";b.innerHTML='<img src="'+URL.createObjectURL(file)+'" alt="Bill photo">';
setPhotoStatus(id,"uploading","Compressing & uploading photo in background...");
var upPromise=dataUrl(file).then(function(d){return Sales.api("/api/accounts/evidence",{data:d})});
S.evp[id]={file:file,p:upPromise};
upPromise.then(function(u){
if(S.files[id]!==file)return;
if(u&&u.evidencePath){S.ev[id]={file:file,path:u.evidencePath};setPhotoStatus(id,"done","✓ Bill photo uploaded")}
else{setPhotoStatus(id,"","Photo queued (will save with collection if network allows)")}
recalc();
}).catch(function(){
if(S.files[id]!==file)return;
setPhotoStatus(id,"","Low/no signal — collection can still be saved");
recalc();
});
recalc();
};
});
document.querySelectorAll("[data-ocancel]").forEach(function(b){b.onclick=function(){
var id=b.getAttribute("data-ocancel"),t=$('[data-t="'+id+'"]'),cam=$('[data-add="'+id+'"]');
S.sel[id]=false;delete S.files[id];delete S.ev[id];delete S.evp[id];delete S.evState[id];dirty();
$('[data-a="'+id+'"]').value="";$('[data-f="'+id+'"]').value="";cam.className="oc-cam";cam.textContent="📷";
t.className="oc-btn";t.textContent="Collect";t.setAttribute("aria-pressed","false");showMore(id,false);showSum(id,false);ocUpdate(id)}});
document.querySelectorAll("[data-ook]").forEach(function(b){b.onclick=function(){
var id=b.getAttribute("data-ook"),x=billX(id),v=amtOf(id);
if(!(v>0)||!S.files[id])return;
$("#smT_"+id).textContent="Invoice "+x.invoice_no+" · "+money(v)+" received";
$("#smS_"+id).textContent=money(Math.max(0,Number(x.outstanding)-v))+" stays on credit · 1 photo";
showMore(id,false);showSum(id,true)}});
document.querySelectorAll("[data-oedit]").forEach(function(b){b.onclick=function(){
var id=b.getAttribute("data-oedit");showSum(id,false);showMore(id,true)}});
if(PRE_INV||PRE_AMT>0){
var target=S.bills.filter(function(b){return Number(b.availableToCollect)>0&&(PRE_INV?String(b.invoice_no)===PRE_INV||String(b.id)===PRE_INV:true);})[0]||S.bills.filter(function(b){return Number(b.availableToCollect)>0;})[0];
if(target)selectBill(String(target.id),PRE_AMT);
}
}
function load(){
    Sales.data().then(function(d){
      var c=(d.customers||[]).filter(function(x){return String(x.code)===CODE})[0]||{code:CODE,name:CODE};S.shop=c;
      $("#csShop").innerHTML='<b>'+esc(c.name||c.shopName||CODE)+'</b><small>'+esc([c.code,c.area].filter(Boolean).join(" · "))+'</small>'+(c.phone?'<small>☎ '+esc(c.phone)+'</small>':"");
    }).catch(function(){$("#csShop").innerHTML="<b>"+esc(CODE)+"</b>"});
    Sales.api("/api/accounts/customers/"+encodeURIComponent(CODE)+"/invoices").then(function(d){
      S.bills=(d.invoices||[]).filter(function(x){return Number(x.outstanding)>0});
      drawBills();
      if(S.bills.some(function(x){return Number(x.availableToCollect)>0})){$("#csRest").style.display="";$("#csPay").style.display=""}
      recalc();
    }).catch(function(e){$("#csBills").innerHTML='<h3>Unpaid bills</h3><div class="cs-hint">'+esc(/not found/i.test(e.message)?"This shop has no bills in Accounts yet, or it is not assigned to you.":e.message)+"</div>"});
  }
  $("#csTiles").onclick=function(e){var t=e.target.closest("[data-m]");if(!t)return;S.method=t.getAttribute("data-m");dirty();document.querySelectorAll(".cs-tile").forEach(function(x){x.classList.toggle("on",x===t);x.setAttribute("aria-pressed",String(x===t))})};
  $("#csOne").onclick=function(){S.split=false;dirty();recalc()};$("#csSplit").onclick=function(){S.split=true;dirty();recalc()};
  ["cash","upi","bank_transfer"].forEach(function(m){$("#sp_"+m).oninput=function(){dirty();recalc()}});
  $("#csNote").oninput=dirty;
  $("#csNoteBtn").onclick=function(){var n=$("#csNote"),o=n.style.display==="none";n.style.display=o?"":"none";this.setAttribute("aria-expanded",String(o));this.classList.toggle("open",o);if(o)n.focus()};

  function showErr(e){
    $("#csErr").textContent=e.message||"Something went wrong";
    document.querySelectorAll(".cs-bad").forEach(function(x){x.classList.remove("cs-bad")});
    var el=e.sel&&$(e.sel);if(el){el.classList.add("cs-bad");try{el.scrollIntoView({block:"center",behavior:"smooth"})}catch(x){}}
  }
  $("#csGo").onclick=async function(){
    if(S.busy)return;var btn=this;$("#csErr").textContent="";
    document.querySelectorAll(".cs-bad").forEach(function(x){x.classList.remove("cs-bad")});
    S.busy=true;btn.disabled=true;btn.textContent="Saving...";
    try{
      var allocations=[];
      for(var id of Object.keys(S.sel)){
        if(!S.sel[id])continue;var a=amtOf(id),f=S.files[id];
        if(!(a>0))throw fe("Enter an amount for every bill you selected.",'[data-a="'+id+'"]');
        if(!f)throw fe("Add the bill photo for every selected bill.",'[data-add="'+id+'"]');
if(f.size>12*1024*1024)throw fe("That photo is too large. Take it again.",'[data-add="'+id+'"]');
        var ev=S.ev[id];
        if(f&&(!ev||ev.file!==f)){
          var pre=S.evp&&S.evp[id]&&S.evp[id].file===f?S.evp[id].p:null,u=null;
          if(pre){
            try{u=await Promise.race([pre,new Promise(function(res){setTimeout(function(){res(null);},2500);})]);}
            catch(e){u=null;}
          }
          if(u&&u.evidencePath){
            ev=S.ev[id]={file:f,path:u.evidencePath};
            setPhotoStatus(id,"done","✓ Bill photo uploaded");
          }
        }
        allocations.push({invoiceId:id,amount:a,evidencePath:f&&ev?ev.path:undefined});
      }
      if(!allocations.length)throw fe("Select a bill and enter the amount received.");
      if(!S.key)S.key=window.crypto&&crypto.randomUUID?crypto.randomUUID():"COL-"+Date.now()+"-"+Math.random().toString(36).slice(2);
      var key=S.key,label,note=$("#csNote").value;
      if(S.split){
        if(splitSum()!==pz(S.total)||splitPayments().length<2)throw fe("The payment amounts must add up to the total.");
        var sp=await Sales.api("/api/accounts/collections/split",{customerCode:CODE,payments:splitPayments(),allocations:allocations,requestKey:key,note:note,correctsId:FIX||undefined});
        label=(sp.parts||splitPayments()).map(function(q){return SPN[q.method]}).join(" + ");
      }else{
        await Sales.api("/api/accounts/collections",{customerCode:CODE,method:S.method,allocations:allocations,requestKey:key,note:note,correctsId:FIX||undefined});
        label=SPN[S.method];
      }
      var attachedCount=allocations.filter(function(x){return !!x.evidencePath;}).length;
      var when=new Date().toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",timeZone:"Asia/Kolkata"});
      S.key=null;$("#csRest").style.display="none";$("#csPay").style.display="none";$("#csBills").style.display="none";
      $("#csDone").innerHTML='<div class="cs-card cs-done"><div class="cs-tick">✓</div><h2 style="margin:0">'+(FIX?"Correction submitted!":"Payment collected!")+'</h2><b style="font-size:24px">'+money(S.total)+'</b>'+
        '<div class="cs-sum"><div><span>Shop</span><b>'+esc((S.shop&&S.shop.name)||CODE)+'</b></div><div><span>Method</span><b>'+esc(label)+'</b></div><div><span>Bill photos</span><b>'+attachedCount+' attached</b></div><div><span>Collected on</span><b>'+when+'</b></div><div><span>Status</span><b>Waiting for office approval</b></div></div>'+
        '<a class="btn wide" style="width:100%" href="shop.html?c='+encodeURIComponent(CODE)+'">Back to shop</a><a class="btn line wide" style="width:100%" href="collections-history.html">Collection history</a><a class="btn line wide" style="width:100%" href="customers.html">Next shop</a></div>';
      window.scrollTo(0,0);
    }catch(e){S.busy=false;btn.textContent="Save collection";showErr(e);recalc();return}
    S.busy=false;
  };
  load();
});
