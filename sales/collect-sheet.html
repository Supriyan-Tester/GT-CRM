<!doctype html>
<html lang="en">
<head>
  <script src="../shared/loading.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Collect payment - General Traders Sales</title><link rel="stylesheet" href="sales.css"><link rel="stylesheet" href="../shared/dropdown.css">
  <style>
    .cs-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:13px;display:grid;gap:10px}
    .cs-card h3{font-size:15px;margin:0}
    .cs-hint{font-size:12px;color:var(--muted);line-height:1.5}
    .cs-shop b{font-size:17px}.cs-shop small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
    #csBills{background:none;border:0;padding:0}
    .cs-hero{background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff;border-radius:18px;padding:18px 20px;display:grid;gap:4px}
    .cs-hero span{font-size:14px;opacity:.9}.cs-hero b{font-size:34px;line-height:1.15;font-weight:800}.cs-hero small{font-size:14px;opacity:.9}
    .cs-bill{border:1px solid var(--border);border-left:5px solid #d97706;border-radius:14px;padding:13px 14px;background:var(--card);display:grid;gap:10px}
    .cs-bill.late{border-left-color:#dc2626}
    .cs-bill .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 10px;align-items:center}
    .cs-bill .amt{font-size:20px;font-weight:800;color:#d97706;text-align:right}.cs-bill.late .amt{color:#dc2626}
    .cs-bill .tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .cs-bill .hist{grid-column:1/-1;background:var(--bg);border-radius:10px;padding:10px 12px;display:grid;gap:10px;margin-top:4px}
    .cs-tag{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:rgba(217,119,6,.14);color:#d97706}.cs-tag.red{background:rgba(220,38,38,.12);color:#dc2626}
    .cs-bill .act{grid-column:1/-1;justify-self:end}.cs-bill .cs-pick{background:#0d9488;color:#fff;border-color:#0d9488;padding:11px 20px;font-size:15px;border-radius:12px}.cs-bill .cs-pick.on{background:#0f766e;border-color:#0f766e}
    .cs-order{background:rgba(34,197,94,.14);color:#15803d;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
    .cs-fix{background:rgba(13,148,136,.1);border:1px solid rgba(13,148,136,.35);border-radius:12px;padding:12px 14px;display:grid;gap:4px;font-size:13px}
    .cs-fix b{color:#0f766e}
    .cs-bill .top b{font-size:14px}.cs-bill small{display:block;color:var(--muted);font-size:12px}
    .cs-more{display:none;gap:9px}.cs-more.open{display:grid}
    .cs-more input[type=number],.cs-sp input,.cs-note{width:100%;min-height:44px;border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:var(--bg);color:var(--text);font:inherit;min-width:0}
    .cs-note{min-height:72px;resize:vertical}
    .cs-amt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px}
    .cs-pick{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:9px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
    .cs-pick.on{background:var(--pri,var(--primary));color:#fff;border-color:var(--pri,var(--primary))}
    .cs-photo{display:flex;gap:10px;align-items:center}.cs-bill .cs-cam{flex:1;min-height:52px;background:var(--card);color:var(--text);border:1.5px dashed var(--border);font-size:15px;padding:9px 14px}.cs-bill .cs-cam.done{border:1.5px solid #0d9488;background:rgba(13,148,136,.12);color:#0f766e}.cs-warn{font-size:13px;font-weight:700;color:#b45309}
    .cs-thumb{position:relative;flex:0 0 52px;width:52px;height:52px;border:1.5px dashed var(--border);border-radius:12px;display:grid;place-items:center;font-size:11px;color:var(--muted);overflow:hidden;text-align:center;background:var(--bg)}
    .cs-thumb img{width:100%;height:100%;object-fit:cover}.cs-x{position:absolute;top:0;right:0;width:20px;height:20px;border:0;border-radius:0 0 0 8px;background:#111;color:#fff;font-size:13px;line-height:1;padding:0;cursor:pointer}
    .cs-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cs-tile span{display:block;font-size:20px;margin-bottom:2px}
    .cs-tile{border:1px solid var(--border);border-radius:12px;padding:12px 6px;text-align:center;background:var(--card);color:var(--text);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
    .cs-tile.on{border:2px solid var(--pri,var(--primary));background:var(--t-info)}
    .cs-seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:999px;padding:3px;background:var(--bg)}
    .cs-seg button{border:0;border-radius:999px;padding:9px;font:inherit;font-size:14px;font-weight:700;background:none;color:var(--text);cursor:pointer}
    .cs-seg button.on{background:var(--pri,var(--primary));color:#fff}
    .cs-sp{display:none;gap:8px}.cs-sp.open{display:grid}.cs-sp .sprow{display:grid;grid-template-columns:auto 1fr minmax(105px,40%) 24px;align-items:center;gap:8px;font-size:14px;color:var(--text);font-weight:700;border:1px solid var(--border);border-radius:12px;padding:8px 10px;background:var(--card,var(--bg))}
.cs-sp .sprow.on{border:2px solid var(--primary,var(--pri));padding:7px 9px}
.cs-sp .sprow .spic{font-size:20px}
.cs-sp .sprow input{min-width:0;width:100%;text-align:right}
.cs-sp .sprow .sptick{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--border);color:transparent}
.cs-sp .sprow.on .sptick{background:#16a34a;color:#fff}

    .cs-notebtn{display:flex;justify-content:space-between;align-items:center;min-height:44px;width:100%;border:0;background:none;color:var(--text);font:inherit;font-size:14px;font-weight:700;padding:0;cursor:pointer}.cs-notebtn small{font-weight:500;color:var(--muted);margin-left:6px}.cs-notebtn i{font-style:normal;color:var(--muted);transition:transform .15s}.cs-notebtn.open i{transform:rotate(180deg)}
    .cs-total{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:20px;padding-top:6px}
    .cs-err{color:var(--danger,#dc2626);font-size:13px;min-height:16px}
    .cs-bad{border-color:var(--danger,#dc2626)!important;box-shadow:0 0 0 3px rgba(220,38,38,.16)}
    .cs-done{text-align:center;display:grid;gap:12px;justify-items:center}
    .cs-tick{width:62px;height:62px;border-radius:50%;background:#16a34a;color:#fff;font-size:32px;display:grid;place-items:center}
    .cs-sum{width:100%;border:1px solid var(--border);border-radius:12px;padding:2px 12px;text-align:left}.cs-sum div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:14px}.cs-sum div:first-child{border-top:0}
  /* Old-credit bill card: same layout as the delivery app's collect screen */
.oc{background:#fff8ec;color:#3b2a0a;border:1px solid #f59e0b;border-radius:14px;padding:12px;display:grid;gap:10px}
.oc-ch{display:flex;align-items:center;gap:10px;cursor:pointer;justify-content:space-between}
.oc-ch:after{content:"\25BE";color:#8a6d3b;transition:transform .15s}.oc.open>.oc-ch:after{transform:rotate(180deg)}
.oc-ch>div:nth-child(2){flex:1}.oc-ico{font-size:22px}.oc small{display:block;color:#7a6a4a;font-size:12px}.oc-tot{color:#d97706;font-size:16px}
.oc>.oc-cb{display:none}.oc.open>.oc-cb{display:grid;gap:10px}
.oc-row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;border-top:1px solid rgba(217,119,6,.25);padding-top:10px}
.oc-th{width:56px;height:56px;border-radius:10px;background:#fff;border:1px solid #e5d9c3;display:grid;place-items:center;font-size:10px;color:#6b7280;text-align:center;cursor:pointer;overflow:hidden}
.oc-th img{width:100%;height:100%;object-fit:cover}
.oc-row b{font-size:14px}.oc-row small{font-size:12px}
.oc-due{display:inline-block;background:rgba(220,38,38,.1);color:#dc2626;font-weight:700;font-size:12px;border-radius:8px;padding:2px 8px;margin-top:3px}
.oc-late{display:inline-block;background:#dc2626;color:#fff;font-weight:700;font-size:11px;border-radius:8px;padding:2px 7px;margin-left:4px}
.oc-btn{border:1px solid #f59e0b;background:#fff;color:#d97706;border-radius:10px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.oc-btn.on{background:#0b7a55;color:#fff;border-color:#0b7a55}
.oc-more{grid-column:1/-1;display:none;gap:12px}.oc-more.open{display:grid}
.oc-amt{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:8px;align-items:center}
.oc-in{display:flex;align-items:center;gap:8px;height:52px;padding:0 12px;border:1px solid #e5d9c3;border-radius:12px;background:#fff;color:#1f2937;font-size:20px;font-weight:700}
.oc-in span{color:#6b7280}.oc-in input{flex:1;min-width:0;width:100%;min-height:0;height:100%;border:0;padding:0;background:transparent;color:inherit;font:inherit;outline:0}
.oc-cam{position:relative;width:52px;height:52px;border-radius:12px;border:1.5px dashed #c9b88f;background:#fff;font-size:22px;cursor:pointer;padding:0;display:grid;place-items:center;overflow:hidden}
.oc-cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.oc-cam.done{border:1px solid #0b7a55}
.oc-cam.done:after{content:"\2713";position:absolute;top:0;right:0;width:18px;height:18px;border-radius:0 0 0 8px;background:#0b7a55;color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center}
.oc-pbar{height:8px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden}.oc-pbar i{display:block;height:100%;width:0;background:#0b7a55;transition:width .15s}
.oc-rc{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#6b5a3a}
.oc-more .cs-warn,.oc-more .cs-hint{margin:0;font-size:13px;font-weight:700;color:#b45309}
.oc-okrow{display:flex;justify-content:flex-end;gap:8px}.oc-okrow .oc-btn{height:34px;padding:0 18px;font-size:14px}
.oc-okrow .oc-ok{background:#0b7a55;color:#fff;border-color:#0b7a55}.oc-okrow .oc-ok:disabled{opacity:.4;cursor:not-allowed}
.oc-sm{grid-column:1/-1;display:none;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#e4f5ee;border:1px solid #10b981;border-radius:14px;padding:10px 12px;color:#10231b}.oc-sm.open{display:grid}
.oc-sm .t{width:28px;height:28px;border-radius:50%;background:#0b7a55;color:#fff;display:grid;place-items:center;font-size:15px;font-weight:900}
.oc-sm p{margin:0;font-size:14px;font-weight:700}.oc-sm small{font-size:12px;color:#4b5f55}
.oc-ed{border:0;background:none;color:#2563eb;font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:4px}
#ocView{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99}#ocView img{max-width:94%;max-height:90%;border-radius:8px}
    .bl-row .btn{width:auto!important;flex:none;min-height:44px;padding:0 18px}
    .bl-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
    .bl-info{flex:1;display:grid;gap:2px;min-width:0}.bl-info small{color:var(--muted);font-size:12px}
    .bl-done{color:var(--teal)!important;font-weight:700}
    .bl-thumb{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;font-size:10px;color:var(--muted);flex:none;text-align:center;cursor:pointer}.bl-thumb img{width:100%;height:100%;object-fit:cover}
    .bl-total{display:flex;justify-content:space-between;align-items:center;font-size:18px}
    .bl-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
</style>
</head><body><div id="app"></div><script src="../assets/icons.js"></script><script src="sales.js"></script><script src="../shared/dropdown.js"></script><script src="../shared/collect-popup.js"></script>
<script>
Sales.start("payments",function(me,hello,main){
  var Q=new URLSearchParams(location.search),CODE=Q.get("c")||"",ORDER=Q.get("o")||"",FIX=Q.get("fix")||"";
  var PRE_AMT=Number(Q.get("amt")||0),PRE_METHOD=Q.get("method")||"",PRE_NOTE=Q.get("note")||"",PRE_REASON=Q.get("reason")||"",PRE_INV=Q.get("inv")||"";
  if(!CODE)return location.replace("customers.html");
  hello.innerHTML=FIX?"<h1>Correct bill collection</h1><p>Fix the details requested by office and resubmit</p>":"<h1>Collect payment</h1><p>Record money received from this shop</p>";
  var esc=Sales.esc,SPN={cash:"Cash",upi:"UPI",bank_transfer:"Bank transfer"};
  var S={method:"cash",split:false,bills:[],sel:{},files:{},ev:{},evp:{},evState:{},key:null,busy:false,total:0,shop:null};
  function dirty(){S.key=null}
  function $(s){return document.querySelector(s)}
  function money(v){return "₹"+Number(v||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
  function dmy(d){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||"");return m?m[3]+"/"+m[2]+"/"+m[1]:esc(d)}
  function hist(x){var M={cash:"Cash",upi:"UPI",bank_transfer:"Bank"};if(!x.payments)return "";if(!x.payments.length)return '<small class="muted" style="display:block">No payments yet</small>';return (x.payments).map(function(p){var d=p.at?new Date(p.at).toLocaleDateString("en-IN",{day:"numeric",month:"short",timeZone:"Asia/Kolkata"}):"",ap=p.status==="approved";return '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;font-size:12px;color:var(--muted);line-height:1.35"><span><b style="color:var(--text)">'+money(p.amount).replace(/\.00$/,"")+"</b>"+(d?" \u00b7 "+d:"")+(p.by?" \u00b7 "+esc(p.by):"")+(M[p.method]?" \u00b7 "+M[p.method]:"")+'</span><span style="font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:'+(ap?"rgba(22,163,74,.14)":"rgba(217,119,6,.14)")+";color:"+(ap?"#16a34a":"#d97706")+'">'+(ap?"Approved":"Waiting for approval")+"</span></div>"}).join("")}
  var S={bills:[],visit:[],shop:null,fixPending:FIX};

  main.innerHTML=
    (FIX?'<div class="cs-fix"><b>Correction requested</b>'+(PRE_REASON?'<span>Note: '+esc(PRE_REASON)+'</span>':"")+'<span>Collect the bill again below with the right amount or photo.</span></div>':"")+
    (ORDER?'<div class="cs-order">Order #'+esc(ORDER)+' placed. You can collect any unpaid bills from this shop below.</div>':"")+
    '<div class="cs-card cs-shop" id="csShop"><b>Loading shop...</b></div>'+
    '<div id="csBills"><div class="cs-card"><div class="cs-hint">Loading bills...</div></div></div>'+
    '<div id="ocView"><img id="ocImg" alt="Bill photo"></div>';
  $("#ocView").onclick=function(){this.style.display="none"};

  function evUrl(p){var t=String(p||"").split("/").pop().replace(/\.(jpg|png|webp)$/i,"");return t&&t!=="no-photo"?"/api/accounts/evidence/"+t:""}

  // ---- bills list: every bill has its own Collect button that opens the payment popup
  function billById(id){return S.bills.filter(function(bill){return String(bill.id)===String(id)})[0]}
  function collectedFor(id){
    return S.visit.filter(function(entry){return String(entry.billId)===String(id)}).reduce(function(sum,entry){return sum+entry.amount},0);
  }
  function visitTotal(){return S.visit.reduce(function(sum,entry){return sum+entry.amount},0)}

  function drawBills(){
    var html='<div class="cs-card"><h3>Unpaid bills</h3>';
    if(!S.bills.length)html+='<div class="cs-hint">✓ This shop has no unpaid bill to collect.</div>';
    S.bills.forEach(function(bill){
      var collected=collectedFor(bill.id);
      var remaining=Math.round((Number(bill.availableToCollect)-collected)*100)/100;
      var entries=S.visit.filter(function(entry){return String(entry.billId)===String(bill.id)});
      var photoUrl=evUrl(bill.evidence_path);
      html+='<div class="bl-row">'+
        '<div class="bl-thumb" data-view="'+esc(photoUrl)+'">'+(photoUrl?'<img src="'+esc(photoUrl)+'" alt="">':"No photo")+'</div>'+
        '<div class="bl-info"><b>Invoice No. '+esc(bill.invoice_no)+'</b><small>📅 '+dmy(bill.invoice_date)+'</small>'+
        '<small>Due: '+money(bill.outstanding)+'</small>'+
        (Number(bill.pendingAmount)>0?'<small>'+money(bill.pendingAmount)+' waiting for approval</small>':"")+
        (collected>0?'<small class="bl-done">✓ '+money(collected)+' · '+esc(entries[entries.length-1].label)+'</small>':"")+
        hist(bill)+'</div>'+
        (remaining>0.004
          ?'<button type="button" class="btn" data-bill="'+esc(bill.id)+'">'+(collected>0?"Collect rest":"Collect")+'</button>'
          :'<span class="cs-hint">'+(collected>0?"Done":"Collected")+'</span>')+
      '</div>';
    });
    html+='</div>';
    if(S.visit.length){
      html+='<div class="cs-card"><div class="bl-total"><span>Total collected</span><b>'+money(visitTotal())+'</b></div>'+
        S.visit.map(function(entry){return '<div class="bl-line"><span>Invoice '+esc(entry.invoiceNumber)+' · '+esc(entry.label)+'</span><span>'+money(entry.amount)+'</span></div>'}).join("")+
        '<div class="cs-hint">Waiting for Billing/Admin approval. The shop\'s balance changes only after approval.</div></div>';
    }
    html+='<div class="cs-card" style="gap:8px">'+
      '<a class="btn wide" style="width:100%" href="shop.html?c='+encodeURIComponent(CODE)+'">Back to shop</a>'+
      '<a class="btn line wide" style="width:100%" href="collections-history.html">Collection history</a>'+
      '<a class="btn line wide" style="width:100%" href="customers.html">Next shop</a></div>';
    $("#csBills").innerHTML=html;
    document.querySelectorAll("[data-bill]").forEach(function(button){
      button.onclick=function(){openBillPopup(billById(button.getAttribute("data-bill")))};
    });
    document.querySelectorAll("[data-view]").forEach(function(thumb){
      thumb.onclick=function(){
        var source=thumb.getAttribute("data-view");
        if(source){$("#ocImg").src=source;$("#ocView").style.display="flex"}
      };
    });
  }

  function openBillPopup(bill,presetAmount){
    if(!bill)return;
    var remaining=Math.round((Number(bill.availableToCollect)-collectedFor(bill.id))*100)/100;
    CollectPopup.open({
      customerCode:CODE,
      invoiceNumber:bill.invoice_no,
      invoiceId:bill.id,
      maxAmount:remaining,
      startAmount:presetAmount||0,
      startMethod:PRE_METHOD&&SPN[PRE_METHOD]?PRE_METHOD:"",
      startNote:presetAmount?PRE_NOTE:"",
      photoRequired:true,
      allowPayLater:false,
      correctsId:S.fixPending||undefined,
      callApi:function(path,body){return Sales.api(path,body)},
      onSaved:function(result){
        S.fixPending="";
        S.visit.push({billId:bill.id,invoiceNumber:bill.invoice_no,amount:result.amount,label:result.label});
        drawBills();
        window.scrollTo(0,0);
      }
    });
  }

  function load(){
    Sales.data().then(function(d){
      var c=(d.customers||[]).filter(function(x){return String(x.code)===CODE})[0]||{code:CODE,name:CODE};S.shop=c;
      $("#csShop").innerHTML='<b>'+esc(c.name||c.shopName||CODE)+'</b><small>'+esc([c.code,c.area].filter(Boolean).join(" · "))+'</small>'+(c.phone?'<small>☎ '+esc(c.phone)+'</small>':"");
    }).catch(function(){$("#csShop").innerHTML="<b>"+esc(CODE)+"</b>"});
    Sales.api("/api/accounts/customers/"+encodeURIComponent(CODE)+"/invoices").then(function(d){
      S.bills=(d.invoices||[]).filter(function(x){return Number(x.outstanding)>0});
      drawBills();
      if(PRE_INV||PRE_AMT>0){
        var collectable=S.bills.filter(function(bill){return Number(bill.availableToCollect)>0});
        var target=collectable.filter(function(bill){return PRE_INV&&(String(bill.invoice_no)===PRE_INV||String(bill.id)===PRE_INV)})[0]||collectable[0];
        if(target)openBillPopup(target,PRE_AMT);
      }
    }).catch(function(e){$("#csBills").innerHTML='<div class="cs-card"><h3>Unpaid bills</h3><div class="cs-hint">'+esc(/not found/i.test(e.message)?"This shop has no bills in Accounts yet, or it is not assigned to you.":e.message)+"</div></div>"});
  }
  load();
});
</script><script src="../shared/upi-qr.js"></script></body></html>
