<!doctype html><html lang="en"><head><script src="../shared/loading.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cash Handover - General Traders</title><link rel="stylesheet" href="../shared/theme.css"><style>
body{background:var(--bg)}.app{max-width:760px;margin:auto;padding:18px 14px 90px;display:grid;gap:14px}.head h1{font-size:20px}.head p,.muted{font-size:12px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:15px;display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;min-height:42px;border:1px solid var(--border);border-radius:10px;padding:9px;background:var(--bg);color:var(--text);font:inherit}.denoms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.denom{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:9px}.denom input{width:100%;min-height:38px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);padding:7px}.total{display:flex;justify-content:space-between;font-weight:800;padding-top:10px;border-top:1px solid var(--border)}.btn{border:0;border-radius:10px;background:var(--primary);color:var(--on-primary);padding:12px;font-weight:750}.btn:disabled{opacity:.5}.movement{border-top:1px solid var(--border);padding:12px 0;display:grid;gap:7px}.movement:first-child{border-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);padding:8px 10px}.status{font-size:11px;font-weight:750;color:var(--primary)}@media(max-width:420px){.denoms{grid-template-columns:1fr}}
</style><script src="../shared/form-check.js"></script></head><body><main class="app"><header class="head"><h1>Cash Custody & Handover</h1><p>Transfer physical cash to another employee with denomination verification.</p></header><section class="card"><div><b>My cash custody</b><div class="muted">Current posted balance</div><div id="balance" style="font-size:25px;font-weight:850;margin-top:4px">₹—</div></div></section><section class="card"><b>New cash handover</b><div class="field"><label>Hand over to <span class="fc-star">*</span></label><select id="recipient"><option value="">Loading employees…</option></select></div><div class="field"><label>Cash denominations (number of notes)</label><div class="denoms" id="denoms"></div></div><div class="total"><span>Denomination total</span><b id="total">₹0.00</b></div><div class="field"><label>Note (optional)</label><textarea id="note" rows="2" maxlength="300"></textarea></div><button class="btn" id="submit" disabled>Record handover</button><p class="muted" id="message" role="status"></p></section><section class="card"><b>Recent handovers</b><div id="movements" class="muted">Loading…</div></section></main><script src="../shared/theme.js"></script><script>
(function(){const $=id=>document.getElementById(id),denoms=[500,200,100,50,20,10];function money(n){return "₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}function api(path,data){return fetch(path,{method:data?"POST":"GET",credentials:"same-origin",headers:data?{"Content-Type":"application/json"}:{},body:data?JSON.stringify(data):undefined}).then(r=>r.json().then(j=>{if(!r.ok)throw Error(j.error||"Request failed");return j;}));}function say(s){$("message").textContent=s;}function total(){let n=0;denoms.forEach(d=>n+=d*(Number($("d"+d).value)||0));$("total").textContent=money(n);return n;}$ ("denoms").innerHTML=denoms.map(d=>'<label class="denom"><span>₹'+d+' notes</span><input id="d'+d+'" type="number" min="0" step="1" value="0" inputmode="numeric"></label>').join("");denoms.forEach(d=>$("d"+d).addEventListener("input",total));
function load(){api("/api/accounts/cash-custody").then(d=>{$("balance").textContent=money(d.ownBalance);const rows=d.movements||[];$ ("movements").innerHTML=rows.length?rows.map(m=>{const incoming=m.to_employee_id===d.employeeId;const label=incoming?"From "+m.from_employee_id:"To "+m.to_employee_id;const actions=incoming&&m.status==="recorded"?'<div class="actions"><button data-confirm="'+m.id+'">Confirm receipt</button><button data-dispute="'+m.id+'">Dispute</button></div>':'';return '<div class="movement"><div><b>'+label+'</b> · '+money(m.amount)+'</div><div class="muted">'+new Date(m.recorded_at).toLocaleString()+ '</div><div class="status">'+m.status.toUpperCase()+'</div>'+actions+'</div>';}).join(""):'No cash handovers yet.';document.querySelectorAll("[data-confirm]").forEach(b=>b.onclick=()=>api("/api/accounts/cash-handover/"+b.dataset.confirm+"/confirm",{}).then(()=>load()).catch(e=>say(e.message)));document.querySelectorAll("[data-dispute]").forEach(b=>b.onclick=()=>{const reason=prompt("Reason for disputing this cash handover:");if(reason)api("/api/accounts/cash-handover/"+b.dataset.dispute+"/dispute",{reason}).then(()=>load()).catch(e=>say(e.message));});}).catch(e=>say(e.message));}
api("/api/accounts/cash-recipients").then(d=>{$("recipient").innerHTML='<option value="">Select employee</option>'+(d.employees||[]).map(x=>'<option value="'+String(x.id).replace(/[&<>"']/g,'')+'">'+String(x.name).replace(/[&<>"']/g,'')+'</option>').join("");}).catch(e=>say(e.message));
$("submit").onclick=async()=>{const amount=total(),recipient=$("recipient").value;say("");FC.clear();if(!recipient)return FC.fail("recipient","Select the receiving employee.");if(!amount)return FC.fail("d500","Enter the number of notes you are handing over.");const denominations=denoms.map(d=>({denomination:d,pieceCount:Number($("d"+d).value)||0}));$("submit").disabled=true;say("Recording handover request…");try{const key="HND-"+(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2));const r=await api("/api/accounts/cash-handover",{toEmployeeId:recipient,amount,denominations,requestKey:key,note:$("note").value});say("Handover recorded. It will transfer custody only after "+recipient+" confirms receipt.");denoms.forEach(d=>$("d"+d).value=0);$("note").value="";total();load();}catch(e){say(e.message);$("submit").disabled=false;}};load();})();</script></body></html>
