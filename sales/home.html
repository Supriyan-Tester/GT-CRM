<!doctype html>
<html lang="en">
  <head>
    <script src="../shared/loading.js"></script>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>Home - General Traders Sales</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/icon-32.png"
    />
    <link rel="apple-touch-icon" href="/assets/icon-180.png" />
    <link rel="stylesheet" href="sales.css" />
    <link rel="stylesheet" href="../shared/dropdown.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="../assets/icons.js"></script>
    <script src="sales.js"></script>
    <script src="../shared/dropdown.js"></script>
    <script>
      Sales.start("home", function (me, hello, main) {
        var h = new Date().getHours(),
          g =
            h < 12
              ? "Good Morning"
              : h < 17
                ? "Good Afternoon"
                : "Good Evening",
          first =
            String(me.name || "")
              .trim()
              .split(/\s+/)[0] || "there";
        hello.innerHTML =
          "<h1>" +
          g +
          ", " +
          Sales.esc(first) +
          "!</h1><p>" +
          new Date().toLocaleDateString("en-IN", {
            weekday: "short",
            day: "numeric",
            month: "short",
            year: "numeric",
          }) +
          "</p>";
        function kpi(cls, ic, id, label, href) {
          return (
            '<a class="card kpi ' +
            cls +
            '" href="' +
            href +
            '"><i>' +
            Sales.ic(ic) +
            '</i><div><b id="' +
            id +
            '">-</b><span>' +
            label +
            "</span></div></a>"
          );
        }
        main.innerHTML =
          '<div class="card pl"><div class="pl-top"><i class="pl-ic">' +
          Sales.ic("rupee") +
          '</i><div class="pl-tx"><div class="pl-hd"><h2>Price list</h2><a class="pl-view" href="products.html">View Products' +
          Sales.ic("arrow-right") +
          "</a></div><p>Manage your products and categories</p></div></div>" +
          '<div class="pl-mid"><div class="pl-stats">' +
          '<div class="pl-st"><i>' +
          Sales.ic("box") +
          '</i><div><b id="nProd">-</b><span>Products</span></div></div>' +
          '<div class="pl-st"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.4"/></svg></i><div><b id="nCat">-</b><span>Categories</span></div></div>' +
          '</div></div>' +
          '<form class="pl-form" id="qf" action="products.html"><label class="pl-search"><span class="sr">Search products</span>' +
          Sales.ic("search") +
          '<input name="q" type="search" placeholder="Search product name or code..." autocomplete="off" /></label>' +
          '<button class="pl-btn" type="submit">Search</button></form></div>' +
          '<div class="kpis">' +
          kpi("k-teal", "check-circle", "kV", "Shops Visited", "route.html?f=visited") +
          kpi("k-pri", "cart", "kO", "Orders Taken", "orders.html?f=today") +
          kpi("k-blue", "rupee", "kT", "Order Value", "orders.html?f=today") +
          kpi("k-amber", "hourglass", "kP", "Shops Pending", "route.html?f=pending") +
          "</div>" +
          '<div class="cols"><div class="card"><h2>Today\'s Shops</h2><div id="today"></div></div>' +
          '<div class="stack"><div class="card"><h2 style="margin-bottom:12px">Current Shop</h2><div id="cur"></div></div></div></div>';
        function soon(ic, title, text, href, btn) {
          return (
            '<div class="empty"><i>' +
            Sales.ic(ic) +
            "</i><b>" +
            title +
            "</b><span>" +
            text +
            "</span>" +
            (href
              ? '<a class="btn teal sm" style="margin-top:8px" href="' +
                href +
                '">' +
                btn +
                "</a>"
              : "") +
            "</div>"
          );
        }
        // Shops the office asked this person to save the location of: shown at the top of Home until each one is saved
        Sales.api("/api/sales/pintasks")
          .then(function (j) {
            var L = (j && j.tasks) || [];
            if (!L.length) return;
            var box = document.createElement("div");
            box.className = "card";
            box.innerHTML =
              '<h2 style="margin-bottom:4px">Save shop locations (' +
              L.length +
              ")</h2>" +
              '<p style="margin:0 0 10px;color:var(--muted,#64748b);font-size:13px">The office asked you to save the location of these shops. Stand at the shop, open it and tap "Save shop location".</p>' +
              L.slice(0, 8)
                .map(function (t) {
                  return (
                    '<a class="oh" href="shop.html?c=' +
                    encodeURIComponent(t.code) +
                    '"><div class="grow"><b>' +
                    Sales.esc(t.name) +
                    "</b><small>" +
                    Sales.esc([t.area, t.address].filter(Boolean).join(" · ") || t.code) +
                    "</small></div></a>"
                  );
                })
                .join("") +
              (L.length > 8
                ? '<p style="margin:8px 0 0;font-size:13px">+ ' + (L.length - 8) + " more shops. Open Customers to find them.</p>"
                : "");
            main.insertBefore(box, main.firstChild);
          })
          .catch(function () {});
        Promise.all([Sales.data(), Sales.mine()])
          .then(function (r) {
            var D = r[0],
              M = r[1],
              idx = {},
              route = D.routes.filter(function (x) {
                return x.id === M.route;
              })[0],
              stops;
            D.customers.forEach(function (c) {
              idx[c.code] = c;
            });
            stops = route
              ? (route.codes || [])
                  .map(function (k) {
                    return idx[k];
                  })
                  .filter(Boolean)
              : [];
            var placed = (M.orders || []).filter(function (o) {
              return o.status === "placed" && o.date === M.today;
            });
            function v(c) {
              return M.visits && M.visits[c.code];
            }
            var done = stops.filter(v).length,
              cur = stops.filter(function (c) {
                return !v(c);
              })[0];
            document.getElementById("kV").textContent = Object.keys(
              M.visits || {},
            ).length;
            document.getElementById("kO").textContent = placed.length;
            document.getElementById("kT").textContent = Sales.money(
              placed.reduce(function (t, o) {
                return t + o.total;
              }, 0),
            );
            document.getElementById("kP").textContent = route
              ? stops.length - done
              : "-";
            document.getElementById("today").innerHTML = stops.length
              ? '<div class="shops">' +
                stops
                  .slice(0, 8)
                  .map(function (c, i) {
                    var st = v(c)
                      ? "visited"
                      : cur && c.code === cur.code
                        ? "current"
                        : "pending";
                    return (
                      '<a class="shop" href="shop.html?c=' +
                      encodeURIComponent(c.code) +
                      '"><div class="tile t' +
                      (i % 4) +
                      '">' +
                      Sales.esc(Sales.init(c.name)) +
                      "</div><div><b>" +
                      Sales.esc(c.name) +
                      "</b><small>" +
                      Sales.esc(c.area || c.address || "") +
                      '</small></div><span class="pill ' +
                      st +
                      '">' +
                      (st === "visited"
                        ? "Visited"
                        : st === "current"
                          ? "Current"
                          : "Pending") +
                      "</span></a>"
                    );
                  })
                  .join("") +
                "</div>" +
                (stops.length > 8
                  ? '<a class="btn sm" href="route.html" style="display:flex;width:100%;margin-top:12px;background:transparent;color:var(--teal);border:1.5px solid var(--teal)">View All</a>'
                  : "")
              : soon(
                  "users",
                  "Pick today's route",
                  "Choose the route to show your shops here.",
                  "route.html",
                  "Choose route",
                );
            document.getElementById("cur").innerHTML = cur
              ? '<a class="shead" style="margin-bottom:12px" href="shop.html?c=' +
                encodeURIComponent(cur.code) +
                '"><div class="tile t0">' +
                Sales.esc(Sales.init(cur.name)) +
                '</div><div class="info"><h2 style="font-size:16px">' +
                Sales.esc(cur.name) +
                "</h2><small>" +
                Sales.esc(cur.area || cur.address || "") +
                '</small></div>' +
                Sales.ic("chevron-right") +
                '</a><div class="rowh"><a class="btn teal sm" href="order.html?c=' +
                encodeURIComponent(cur.code) +
                '">' +
                Sales.ic("cart") +
                "Take Order</a>" +
                (Sales.navLink(cur)
                  ? '<a class="btn soft sm" target="_blank" rel="noopener" href="' +
                    Sales.esc(Sales.navLink(cur)) +
                    '">' +
                    Sales.ic("navigate") +
                    "Navigate</a>"
                  : "") +
                "</div>"
              : stops.length
                ? soon(
                    "check-circle",
                    "All shops visited",
                    "Your route for today is complete.",
                  )
                : soon(
                    "route",
                    "No shop selected",
                    "Take Order and Mark Visit will work from here.",
                  );
          })
          .catch(function () {
            document.getElementById("today").innerHTML =
              '<div class="empty"><b>Could not load today\'s shops</b><span>Check your connection and refresh.</span></div>';
          });
        Sales.products()
          .then(function (L) {
            var cats = {};
            L.forEach(function (p) {
              if (p && p.category) cats[p.category] = 1;
            });
            document.getElementById("nProd").textContent =
              L.length.toLocaleString("en-IN");
            document.getElementById("nCat").textContent =
              Object.keys(cats).length;
          })
          .catch(function () {});
      });
    </script>
  </body>
</html>
