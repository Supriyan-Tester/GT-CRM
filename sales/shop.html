<!doctype html>
<html lang="en">
  <head>
    <script src="../shared/loading.js"></script>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>Shop Details - General Traders Sales</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/icon-32.png"
    />
    <link rel="apple-touch-icon" href="/assets/icon-180.png" />
    <link rel="stylesheet" href="sales.css" />
    <link rel="stylesheet" href="../shared/dropdown.css" />
    <style>
      .gps-wait { display:flex; align-items:center; gap:8px; font-size:14px; }
      .gps-spin { width:16px; height:16px; flex:none; border:3px solid #cbd5e1; border-top-color:#2563eb; border-radius:50%; animation:gpsSpin .8s linear infinite; }
      @keyframes gpsSpin { to { transform:rotate(360deg); } }
      .gps-bar { height:6px; margin-top:8px; border-radius:3px; background:#e2e8f0; overflow:hidden; }
      .gps-bar i { display:block; height:100%; width:0; background:#2563eb; transition:width .5s linear; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="../assets/icons.js"></script>
    <script src="sales.js"></script>
    <script src="../shared/dropdown.js"></script>
    <script>
      Sales.start("shop", function (me, hello, main) {
        var CODE = new URLSearchParams(location.search).get("c") || "";
        if (!CODE) return location.replace("customers.html");
        hello.innerHTML = '<h1>Shop Details</h1><p id="sub"></p>';
        main.innerHTML = '<div class="empty"><b>Loading…</b></div>';
        var S,
          ORD = [],
          visited = false,
          BACK = { href: "customers.html", label: "Customers" },
          tab = location.hash === "#orders" ? "orders" : "overview";

        function kv(k, v) {
          return v ? "<span>" + k + "</span><b>" + v + "</b>" : "";
        }
        function overview() {
          var nav = Sales.navLink(S),
            a = Sales.esc;
          return (
            '<div class="kv">' +
            kv("Shop code", a(S.code)) +
            kv("Area", a(S.area)) +
            kv("Address", a(S.address)) +
            kv(
              "Phone",
              S.phone
                ? '<a href="tel:' +
                    a(S.phone) +
                    '" style="color:var(--pri)">' +
                    a(S.phone) +
                    "</a>"
                : "",
            ) +
            kv("GST", a(S.gstin)) +
            kv("Location", S.lat && S.lng ? "Pin saved" : "No pin saved yet") +
            "</div>" +
            (S.lat && S.lng
              ? ""
              : '<p class="note">This shop has no map pin yet. If you are at the shop, save its location.</p>' +
                '<button class="btn line" id="pinBtn" type="button" style="margin-top:8px;width:100%">Save shop location (stand at the shop)</button>' +
                '<p class="note" id="pinMsg"></p>')
          );
        }
        function history() {
          var R = ORD.filter(function (o) {
            return o.code === CODE && o.status === "placed";
          });
          return R.length
            ? R.map(function (o) {
                return (
                  '<a class="oh" href="orders.html?o=' +
                  encodeURIComponent(o.id) +
                  '"><div class="grow"><b>#' +
                  Sales.esc(o.id) +
                  "</b><small>" +
                  Sales.esc(Sales.dateLabel(o.date)) +
                  " · " +
                  o.items.length +
                  (o.items.length === 1 ? " item" : " items") +
                  '</small></div><div class="amt">' +
                  Sales.money(o.total) +
                  "</div></a>"
                );
              }).join("")
            : '<div class="empty"><i>' +
                Sales.ic("receipt") +
                "</i><b>No orders yet</b><span>Orders you place for this shop will show here.</span></div>";
        }
        function draw() {
          var nav = Sales.navLink(S);
          document.getElementById("sub").textContent = S.name;
          main.innerHTML =
            '<a class="back" href="' +
            BACK.href +
            '">' +
            Sales.ic("chevron-left") +
            BACK.label +
            "</a>" +
            '<div class="card"><div class="shead"><div class="tile t0">' +
            Sales.esc(Sales.init(S.name)) +
            '</div><div class="info"><h2>' +
            Sales.esc(S.name) +
            "<em>" +
            Sales.esc(S.code) +
            "</em></h2><small>" +
            Sales.esc(
              [S.area, S.address].filter(Boolean).join(" · ") ||
                "No address yet",
            ) +
            "</small>" +
            (visited
              ? '<span class="pill visited" style="margin-top:6px">' +
                Sales.ic("check").replace(
                  "<svg",
                  '<svg style="width:12px;height:12px"',
                ) +
                "Visited today</span>"
              : "") +
            "</div></div>" +
            '<div class="qa" style="margin-top:14px">' +
            (S.phone
              ? '<a href="tel:' +
                Sales.esc(S.phone) +
                '">' +
                Sales.ic("phone") +
                "Call</a>"
              : '<span style="opacity:.4;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px">' +
                Sales.ic("phone") +
                "Call</span>") +
            (nav
              ? '<a href="' +
                Sales.esc(nav) +
                '" target="_blank" rel="noopener">' +
                Sales.ic("navigate") +
                "Navigate</a>"
              : '<span style="opacity:.4;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px">' +
                Sales.ic("navigate") +
                "Navigate</span>") +
            '<button type="button" id="shr">' +
            Sales.ic("share") +
            "Share</button></div></div>" +
            '<div class="card"><div class="tabs"><button data-t="overview" class="' +
            (tab === "overview" ? "on" : "") +
            '">Overview</button><button data-t="orders" class="' +
            (tab === "orders" ? "on" : "") +
            '">Previous Orders</button></div><div style="padding-top:8px">' +
            (tab === "orders" ? history() : overview()) +
            "</div></div>" +
            '<div class="rowh"><a class="btn teal grow" href="order.html?c=' +
            encodeURIComponent(S.code) +
            Sales.fromQ() +
            '">' +
            Sales.ic("cart") +
            "Take Order</a>" +
            '<button class="btn line" id="vis" type="button"' +
            (visited ? " disabled" : "") +
            ">" +
            Sales.ic("check") +
            (visited ? "Visited" : "Mark visited") +
            "</button></div>";
          var pb = document.getElementById("pinBtn");
          if (pb)
            pb.onclick = function () {
              var pm = document.getElementById("pinMsg");
              pm.textContent = "";
              if (!navigator.geolocation) {
                pm.textContent = "This phone cannot give its location.";
                return;
              }
              pb.disabled = true;
              var best = null,
                fin = false,
                wid = null,
                tick = null,
                t0 = Date.now();
              function save(p) {
                pm.textContent = "Saving...";
                Sales.api("/api/sales/pin", {
                  code: S.code,
                  lat: p.coords.latitude,
                  lng: p.coords.longitude,
                  acc: Math.round(p.coords.accuracy || 0),
                })
                  .then(function () {
                    S.lat = p.coords.latitude;
                    S.lng = p.coords.longitude;
                    Sales.toast("Location saved. Thank you.");
                    draw();
                  })
                  .catch(function (e) {
                    pb.disabled = false;
                    pm.textContent = e.message || "Could not save the location.";
                  });
              }
              function stop() {
                fin = true;
                if (wid != null) navigator.geolocation.clearWatch(wid);
                clearInterval(tick);
              }
              // spinner + countdown + progress bar while the phone finds the location
              function show() {
                if (fin) return;
                if (!pm.querySelector(".gps-bar"))
                  pm.innerHTML =
                    '<div class="gps-wait"><span class="gps-spin"></span><b class="gps-t"></b></div>' +
                    '<div class="gps-bar"><i></i></div><div class="gps-s"></div>';
                var el = Math.min(30000, Date.now() - t0),
                  left = Math.max(0, Math.ceil((30000 - el) / 1000)),
                  acc = best ? Math.round(best.coords.accuracy || 0) : null;
                pm.querySelector(".gps-t").textContent =
                  "Getting your location... " + left + " s";
                pm.querySelector(".gps-bar i").style.width =
                  Math.round(el / 300) + "%";
                pm.querySelector(".gps-s").textContent =
                  (acc == null
                    ? "Searching for GPS. Stay at the shop front, in the open."
                    : "Signal about " + acc + " m. Waiting for a better signal.") +
                  " Please do not close this page.";
              }
              function done() {
                if (fin) return;
                stop();
                if (!best) {
                  pb.disabled = false;
                  pm.textContent =
                    "Could not get your location. Go outside the shop and try again.";
                  return;
                }
                var acc = Math.round(best.coords.accuracy || 0);
                if (acc <= 100) return save(best); // 100 m or better: save it
                if (acc > 500) {
                  pb.disabled = false;
                  pm.textContent =
                    "Signal too weak (about " +
                    acc +
                    " m). Go outside, stand at the shop front in the open and try again.";
                  return;
                }
                // 100 to 500 m: the person may choose to save it anyway
                pm.textContent =
                  "Signal weak (about " +
                  acc +
                  " m). Shops here are close together. Go outside and try again, or save it anyway. ";
                var u = document.createElement("button");
                u.type = "button";
                u.className = "btn line";
                u.style.cssText = "margin-top:8px;width:100%";
                u.textContent = "Use it anyway (about " + acc + " m)";
                u.onclick = function () {
                  u.disabled = true;
                  save(best);
                };
                pm.appendChild(u);
                pb.disabled = false;
              }
              show();
              wid = navigator.geolocation.watchPosition(
                function (pos) {
                  if (fin) return;
                  if (!best || pos.coords.accuracy < best.coords.accuracy)
                    best = pos;
                  if (best.coords.accuracy <= 10) return done();
                  show();
                },
                function (err) {
                  if (fin) return;
                  if (best) return done();
                  stop();
                  pb.disabled = false;
                  pm.textContent =
                    err && err.code === 1
                      ? "Location is blocked. Allow location for this site in the browser settings, then try again."
                      : "Could not get your location. Go outside the shop and try again.";
                },
                { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 },
              );
              tick = setInterval(function () {
                var el = Date.now() - t0;
                if (el >= 30000 || (el >= 10000 && best && best.coords.accuracy <= 20))
                  done();
                else show();
              }, 500);
            };
          main.querySelector(".tabs").onclick = function (e) {
            var b = e.target.closest("[data-t]");
            if (b) {
              tab = b.getAttribute("data-t");
              draw();
            }
          };
          document.getElementById("shr").onclick = function () {
            var text =
              S.name +
              (S.address ? ", " + S.address : "") +
              (S.phone ? " · " + S.phone : "") +
              (nav ? " " + nav : "");
            if (navigator.share)
              navigator
                .share({ title: S.name, text: text })
                .catch(function () {});
            else if (navigator.clipboard)
              navigator.clipboard.writeText(text).then(function () {
                Sales.toast("Shop details copied");
              });
          };
          // "Mark visited" = visited with no order: ask the reason, then save (an order marks the visit by itself)
          document.getElementById("vis").onclick = function () {
            Sales.visitSheet(S, function () {
              visited = true;
              draw();
            });
          };
        }
        Promise.all([Sales.data(), Sales.mine()])
          .then(function (r) {
            S = r[0].customers.filter(function (c) {
              return c.code === CODE;
            })[0];
            if (!S) {
              main.innerHTML =
                '<div class="card empty"><b>Shop not found</b><span><a class="link" href="customers.html">Back to My Customers</a></span></div>';
              return;
            }
            ORD = r[1].orders || [];
            BACK = Sales.backTo(r[1], r[0]);
            visited = !!(
              r[1].visits &&
              r[1].visits[CODE] &&
              r[1].date === r[1].today
            );
            draw();
          })
          .catch(function () {
            main.innerHTML =
              '<div class="card empty"><b>Could not load this shop</b><span>Check your connection and refresh.</span></div>';
          });
      });
    </script>
  </body>
</html>
