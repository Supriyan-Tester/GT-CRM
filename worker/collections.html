<!doctype html>
<html lang="en"><head><script src="../shared/loading.js"></script><script src="../shared/sync.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Collections - General Traders</title><link rel="stylesheet" href="../shared/theme.css"><style>
body{background:var(--bg)}.app{max-width:760px;margin:auto;padding:16px 14px 100px;display:grid;gap:13px}.head{display:flex;align-items:center;gap:12px}.head a{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);text-decoration:none}.head h1{font-size:19px;color:var(--text)}.head p{font-size:12px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px;display:grid;gap:10px}.muted{font-size:12px;color:var(--muted)}.alert{padding:11px;border-radius:10px;background:var(--t-info);font-size:12px}.field{display:grid;gap:6px;height:auto;border:0;background:none;align-items:stretch;box-shadow:none}.field:focus-within{border:0;box-shadow:none}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input[type=checkbox]{width:auto;min-height:0;flex:none}.field input,.field select,.field textarea{height:auto;flex:none;width:100%;min-height:42px;border:1px solid var(--border);border-radius:10px;padding:9px;background:var(--bg);color:var(--text);font:inherit}.field textarea{min-height:64px}.line{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;border-top:1px solid var(--border);padding:12px 0}.line small{display:block;color:var(--muted);font-size:11px}.line input[type=number]{width:100%;min-height:38px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);padding:7px}.photo{grid-column:1/-1}.total{display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:12px;font-weight:800}.submit,.refresh{border:0;border-radius:11px;padding:11px 14px;background:var(--primary);color:var(--on-primary);font-weight:750}.submit:disabled{opacity:.5}.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}.nav a{color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;padding:8px 14px;border-radius:10px}.nav a[aria-current=page]{color:var(--primary);background:var(--t-primary)}
body.embed .head,body.embed .nav,body.embed main.app>section.card:last-of-type{display:none}body.embed .app{padding-top:8px}body.embed #customer{pointer-events:none;opacity:.85}.sec{font-weight:700;font-size:13px;color:var(--muted);margin:2px 0 6px}body.embed #custField{display:none}#note{display:block;width:100%!important;box-sizing:border-box;min-height:80px;resize:vertical}.field{justify-items:stretch}#shopInfo:empty,.crbox:empty{display:none}.shopbox{padding:10px 12px;border-radius:12px;background:rgba(45,212,191,.12);display:grid;gap:3px}.shopbox b{font-size:16px}.shopbox small{color:var(--muted)}.crbox{padding:10px 12px;border-radius:12px;border:1px solid var(--border);display:grid;gap:8px;margin:10px 0}.crbox.has{border-color:#f59e0b;background:rgba(245,158,11,.10)}.crrow{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}.crrow small{color:var(--muted)}.crrow button{border:1px solid var(--border);background:transparent;color:inherit;border-radius:8px;padding:6px 12px;font-size:12px}#billView{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:12px}#billView img{max-width:100%;max-height:100%;border-radius:8px}
</style></head><body><main class="app"><header class="head"><a href="orders.html">←</a><div><h1>Customer Collections</h1><p>Collect against invoices assigned to your delivery account</p></div></header><section class="card"><div class="alert">Take a photo of each bill. The office will approve your collection.</div><div id="shopInfo"></div><div class="field" id="custField"><label>Assigned customer</label><select id="customer"><option>Loading...</option></select></div><div id="credit"></div><div id="invoices" class="muted">Select a customer.</div></section><section class="card"><div class="field"><label>Payment method</label><select id="method"><option value="cash">Cash</option><option value="upi">UPI</option><option value="bank_transfer">Bank transfer</option></select></div><div class="field"><label>Note (optional)</label><textarea id="note" maxlength="300"></textarea></div><div class="total"><span>Total collected</span><b id="total">₹0.00</b></div><button class="submit" id="submit" disabled>Save collection</button><p class="muted" id="message"></p></section></main><nav class="nav"><a href="home.html">Home</a><a href="route.html">Route</a><a href="orders.html">Orders</a><a href="collections.html" aria-current="page">Collections</a><a href="attendance.html">Attendance</a></nav><script src="../shared/theme.js"></script><script>
(function(){var $=function(id){return document.getElementById(id)||document.querySelector(id)}, inv=[];
document.querySelector("main.app").insertAdjacentHTML("beforeend",'<section class="card"><b>My recent collections</b><div id="mine" style="margin-top:6px;color:var(--muted)">Loading...</div></section>');
function api(path,data){return fetch(path,{method:data?"POST":"GET",credentials:"same-origin",headers:data?{"Content-Type":"application/json"}:{},body:data?JSON.stringify(data):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Request failed");return j;});});}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function money(v){return "₹"+Number(v||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});}
function say(t){$("message").textContent=t;}
var MINE={pending_approval:"Waiting for approval",approved:"Approved",rejected:"Rejected",correction_requested:"Correction needed",reversed:"Reversed"};function mineRow(x){var t=x.status==="rejected"?"Reason: "+(x.rejection_reason||""):x.status==="correction_requested"?(x.correction_note||"")+" — please record this collection again.":"";var d=new Date(x.received_at).toLocaleDateString("en-IN",{day:"2-digit",month:"short",timeZone:"Asia/Kolkata"});return '<div style="padding:10px 0;border-top:1px solid var(--border)"><div style="display:flex;justify-content:space-between;gap:10px"><b>'+esc(x.customer_name_snapshot)+'</b><b>'+money(x.total_amount)+'</b></div><div style="font-size:12px;color:var(--muted)">'+d+" · "+esc(MINE[x.status]||x.status)+'</div>'+(t?'<div style="margin-top:4px;font-size:13px;color:var(--danger)">'+esc(t)+'</div>':"")+'</div>'}function loadMine(){api("/api/accounts/my-collections").then(function(d){var r=d.collections||[];$("mine").innerHTML=r.length?r.map(mineRow).join(""):"No collections recorded yet."}).catch(function(){$("mine").textContent="Could not load your recent collections."})}
function total(){var n=0;document.querySelectorAll("[data-check]:checked").forEach(function(c){n+=Number($('[data-amount="'+c.value+'"]').value)||0;});$("total").textContent=money(n);lastTotal=n;$("submit").disabled=n<=0||!splitOk();updSplit();}
function load(code){if(!code){$("invoices").textContent="Select a customer.";return;} $("invoices").textContent="Loading...";api("/api/accounts/customers/"+encodeURIComponent(code)+"/invoices").then(function(d){showCredit(d.invoices||[]);inv=(d.invoices||[]).filter(function(x){return Number(x.availableToCollect)>0;});$("invoices").innerHTML=inv.length?inv.map(function(x){return '<div class="line"><div><label><input type="checkbox" data-check value="'+esc(x.id)+'"> <b>'+esc(x.invoice_no)+'</b></label><small>'+(Q.get("inv")?(x.invoice_no===Q.get("inv")?"Current bill · ":"Old credit · "):"")+esc(x.invoice_date)+' · Available '+money(x.availableToCollect)+'</small></div><input data-amount="'+esc(x.id)+'" type="number" min=".01" max="'+Number(x.availableToCollect).toFixed(2)+'" step=".01" placeholder="Amount" disabled><div class="photo"><small>Bill photo for this invoice</small><input data-photo="'+esc(x.id)+'" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" disabled></div></div>';}).join(""):'<p class="muted">Nothing to collect for this shop. If the shop paid you, tell the office.</p>';
document.querySelectorAll("[data-check]").forEach(function(c){c.onchange=function(){$('[data-amount="'+c.value+'"]').disabled=!c.checked;$('[data-photo="'+c.value+'"]').disabled=!c.checked;total();};});document.querySelectorAll("[data-amount]").forEach(function(a){a.oninput=total;});addNew(d.invoices||[]);}).catch(function(e){$("credit").className="";$("credit").innerHTML="";$("invoices").textContent=/not found/i.test(e.message)?"Nothing to collect for this shop. If the shop paid you, tell the office.":e.message;});}
function addNew(all){var n=Q.get("inv"),a=Number(Q.get("amt"));if(!n||!(a>0)||all.some(function(x){return String(x.invoice_no).trim().toLowerCase()===n.trim().toLowerCase()}))return;
var box=$("invoices");if(box.querySelector("p.muted"))box.innerHTML="";
box.insertAdjacentHTML("afterbegin",'<div class="sec">Current bill (this delivery)</div><div class="line"><div><label><input type="checkbox" data-check value="NEW"> <b>'+esc(n)+'</b></label><small>Current bill · \u20b9'+a.toFixed(2)+' to collect</small></div><input data-amount="NEW" type="number" min=".01" max="'+a.toFixed(2)+'" step=".01" placeholder="Cash received" disabled><div class="photo"><small>Photo of the bill</small><input data-photo="NEW" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" disabled></div></div>');
var c=box.querySelector('[data-check][value="NEW"]');c.onchange=function(){$('[data-amount="NEW"]').disabled=!c.checked;$('[data-photo="NEW"]').disabled=!c.checked;total();};$('[data-amount="NEW"]').oninput=total}
function evUrl(p){var t=String(p||"").split("/").pop().replace(/\.(jpg|png|webp)$/i,"");return t?"/api/accounts/evidence/"+t:""}
var Q=new URLSearchParams(location.search);
if(Q.get("inv")||Q.get("name"))$("shopInfo").innerHTML='<div class="shopbox"><b>'+esc(Q.get("name")||"")+'</b><small>Invoice '+esc(Q.get("inv")||"-")+(Q.get("amt")?" · Amount "+money(Q.get("amt")):"")+'</small></div>';
document.body.insertAdjacentHTML("beforeend",'<div id="billView"><img id="billImg" alt="Bill"></div>');$("billView").onclick=function(){this.style.display="none"};
function showCredit(all){var cur=Q.get("inv")||"",open=all.filter(function(x){return Number(x.outstanding)>0&&(!cur||x.invoice_no!==cur)}),sum=open.reduce(function(a,x){return a+Number(x.outstanding||0)},0);
$("credit").className=open.length?"crbox has":"crbox";
$("credit").innerHTML=open.length?'<div class="crrow"><b>Old credit: '+open.length+(open.length>1?" bills":" bill")+'</b><b>'+money(sum)+'</b></div>'+open.map(function(x){var u=evUrl(x.evidence_path);return '<div class="crrow"><span>'+esc(x.invoice_no)+(cur&&x.invoice_no===cur?" (this bill)":"")+" · "+esc(x.invoice_date)+'<br><small>Due '+money(x.outstanding)+(Number(x.pendingAmount)>0?" · "+money(x.pendingAmount)+" waiting for approval":"")+'</small></span>'+(u?'<button type="button" data-bill="'+esc(u)+'">View bill</button>':"")+'</div>'}).join(""):'<div class="crrow"><b>\u2713 No old credit from this shop</b></div>';
document.querySelectorAll("[data-bill]").forEach(function(b){b.onclick=function(){$("billImg").src=b.getAttribute("data-bill");$("billView").style.display="flex"}})}
function dataUrl(file){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(r.result);};r.onerror=no;r.readAsDataURL(file);});}

var lastTotal=0,SPN={cash:"Cash",upi:"UPI",bank_transfer:"Bank transfer"};
function splitOn(){return $("splitChk").checked}
function pz(v){return Math.round(Number(v)*100)}
function splitPayments(){var o=[];["cash","upi","bank_transfer"].forEach(function(m){var v=Number($("sp_"+m).value);if(v>0)o.push({method:m,amount:v})});return o}
function splitSum(){return splitPayments().reduce(function(n,p){return n+pz(p.amount)},0)}
function splitOk(){return !splitOn()||(splitPayments().length>=2&&splitSum()===pz(lastTotal))}
function updSplit(){var on=splitOn();$("splitBox").style.display=on?"":"none";$("method").parentNode.style.display=on?"none":"";if(!on)return;var p=splitPayments(),m=$("splitMsg");
 if(p.length<2){m.textContent="Enter amounts for at least two payment methods.";m.style.color="var(--muted)"}
 else if(splitSum()!==pz(lastTotal)){m.textContent="Paid "+money(splitSum()/100)+" but the invoice total is "+money(lastTotal)+".";m.style.color="var(--danger)"}
 else{m.textContent="Matches the invoice total: "+p.map(function(q){return SPN[q.method]+" "+money(q.amount)}).join(" + ");m.style.color="var(--muted)"}}
$("method").parentNode.insertAdjacentHTML("afterend",'<div class="field"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="splitChk"> Paid by more than one method (cash + UPI)</label></div><div id="splitBox" style="display:none"><div class="field"><label>Cash amount</label><input id="sp_cash" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field"><label>UPI amount</label><input id="sp_upi" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field"><label>Bank transfer amount</label><input id="sp_bank_transfer" type="number" min="0" step="0.01" placeholder="0.00"></div><p class="muted" id="splitMsg" role="status"></p></div>');
$("splitChk").onchange=function(){updSplit();total()};
["cash","upi","bank_transfer"].forEach(function(m){$("sp_"+m).oninput=total});
$("customer").onchange=function(){load(this.value);};
$("submit").onclick=async function(){var checks=Array.from(document.querySelectorAll("[data-check]:checked"));if(!checks.length)return;this.disabled=true;say("Uploading invoice photos...");
try{var allocations=[];for(var c of checks){var id=c.value,f=$('[data-photo="'+id+'"]').files[0],amount=Number($('[data-amount="'+id+'"]').value);if(!(amount>0)||!f)throw new Error("Enter an amount and bill photo for every selected invoice.");if(f.size>5*1024*1024)throw new Error("Each photo must be 5 MB or smaller.");var u=await api("/api/accounts/evidence",{data:await dataUrl(f)});if(id==="NEW"){say("Saving the bill...");var ci=await api("/api/accounts/delivery-invoice",{customerCode:$("customer").value,invoiceNo:Q.get("inv"),evidencePath:u.evidencePath});id=ci.invoiceId;}allocations.push({invoiceId:id,amount:amount,evidencePath:u.evidencePath});}
var key=crypto.randomUUID?crypto.randomUUID():"COL-"+Date.now()+"-"+Math.random().toString(36).slice(2);if(splitOn()){if(!splitOk())throw new Error("The payment amounts must add up to the invoice total.");var split=await api("/api/accounts/collections/split",{customerCode:$("customer").value,payments:splitPayments(),allocations:allocations,requestKey:key,note:$("note").value});say("Split collection recorded: "+(split.parts||[]).map(function(q){return SPN[q.method]+" "+money(q.total)}).join(" + ")+". Each part waits for Admin approval.");["cash","upi","bank_transfer"].forEach(function(m){$("sp_"+m).value=""});$("splitChk").checked=false;updSplit();}else{var result=await api("/api/accounts/collections",{customerCode:$("customer").value,method:$("method").value,allocations:allocations,requestKey:key,note:$("note").value});say("Collection recorded: "+result.status+". Customer balance updates after Admin approval.");}loadMine();load($("customer").value);
}catch(e){say(e.message);this.disabled=false;}};
loadMine();
api("/api/me").then(function(me){if(!me.ok||me.role!=="worker")throw new Error("Delivery employee login required.");return api("/api/accounts/collectible-customers");}).then(function(d){$("customer").innerHTML='<option value="">Select assigned customer</option>'+(d.customers||[]).map(function(c){return '<option value="'+esc(c.code)+'">'+esc(c.name)+' · '+esc(c.code)+'</option>';}).join("");}).then(function(){var q=new URLSearchParams(location.search),code=q.get("code");if(code){var sel=$("customer");if(![].some.call(sel.options,function(o){return o.value===code})){sel.insertAdjacentHTML("beforeend",'<option value="'+esc(code)+'">'+esc(code)+'</option>');}sel.value=code;load(code);}}).catch(function(e){$("customer").innerHTML='<option value="">Unable to load assigned customers</option>';say(e.message);});
if(new URLSearchParams(location.search).get("embed")){document.body.classList.add("embed");}
})();
</script></body></html>
