<html lang="en">
  <head>

    <title>General Traders - Account</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <style>
      .ac-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
      }
      .ac-head h1 {
        font-size: 22px;
        font-weight: 700;
        line-height: 1.2;
      }
      .ac-head p {
        font-size: 13px;
        color: var(--muted);
        margin-top: 3px;
      }
      .ac-month {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 6px;
        margin-bottom: 12px;
        box-shadow: var(--shadow);
      }
      .ac-month b {
        font-size: 14px;
      }
      .ac-month button {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 10px;
        background: var(--t-primary);
        color: var(--primary);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ac-month button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .ac-month svg {
        width: 18px;
        height: 18px;
      }
      .ac-tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        scrollbar-width: none;
        margin-bottom: 14px;
      }
      .ac-tab {
        flex-shrink: 0;
        padding: 8px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
      }
      .ac-tab.active {
        background: var(--primary);
        color: var(--on-primary);
        border-color: var(--primary);
      }
      .ac-hero {
        position: relative;
        overflow: hidden;
        border-radius: var(--radius-card);
        padding: 18px;
        margin-bottom: 12px;
        color: var(--on-hero);
        background: linear-gradient(135deg, var(--hero1), var(--hero2));
        box-shadow: 0 4px 12px rgba(15, 118, 110, 0.18);
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .ac-hero::after {
        content: "";
        position: absolute;
        width: 130px;
        height: 130px;
        border-radius: 50%;
        right: -30px;
        top: -45px;
        background: rgba(255, 255, 255, 0.12);
      }
      .ac-hero > * {
        position: relative;
        z-index: 1;
      }
      .ac-hero .ico {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .ac-hero .ico svg {
        width: 24px;
        height: 24px;
      }
      .ac-hero .txt {
        flex: 1;
        min-width: 0;
      }
      .ac-hero small {
        display: block;
        font-size: 12.5px;
        opacity: 0.9;
      }
      .ac-hero strong {
        display: block;
        font-size: 30px;
        font-weight: 800;
        line-height: 1.2;
      }
      .ac-hero button {
        border: 1.5px solid rgba(255, 255, 255, 0.7);
        background: transparent;
        color: inherit;
        border-radius: 10px;
        height: 36px;
        padding: 0 12px;
        font-weight: 700;
        font-size: 12.5px;
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap;
      }
      .ac-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }
      .ac-stat {
        display: flex;
        align-items: center;
        gap: 12px;
        border-radius: var(--radius-card);
        padding: 14px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      .ac-stat.a {
        background: linear-gradient(160deg, var(--t-accent), var(--card) 80%);
      }
      .ac-stat.d {
        background: linear-gradient(160deg, var(--t-danger), var(--card) 80%);
      }
      .ac-stat .chip {
        flex-shrink: 0;
      }
      .ac-stat small {
        display: block;
        font-size: 11.5px;
        color: var(--muted);
      }
      .ac-stat strong {
        display: block;
        font-size: 20px;
        font-weight: 800;
      }
      .ac-sec {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 0 8px;
      }
      .ac-sec b {
        font-size: 15px;
      }
      .ac-sec a {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--primary);
        cursor: pointer;
      }
      .ac-list {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow);
        overflow: hidden;
        margin-bottom: 14px;
      }
      .ac-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }
      .ac-row:last-child {
        border-bottom: 0;
      }
      .ac-row .chip {
        flex-shrink: 0;
      }
      .ac-row .mid {
        flex: 1;
        min-width: 0;
      }
      .ac-row .t {
        font-size: 14px;
        font-weight: 700;
      }
      .ac-row .s {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ac-row .amt {
        font-size: 15px;
        font-weight: 800;
        white-space: nowrap;
      }
      .ac-row .amt.pos {
        color: var(--success);
      }
      .ac-row .amt.neg {
        color: var(--danger);
      }
      .ac-row .amt.adv {
        color: var(--accent);
      }
      .ac-empty {
        text-align: center;
        padding: 28px 12px;
        color: var(--muted);
        font-size: 13.5px;
      }
      .ac-note {
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }

      /* GM-ACCOUNT-FULL-WIDTH-FIX-v2 */
      .app {
        width: 100% !important;
        max-width: none !important;
        box-sizing: border-box !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        min-height: 100vh;
      }

      @media (max-width: 640px) {
        .app {
          padding-left: 14px;
          padding-right: 14px;
        }
      }
    </style>
    <style>
      /* GM-WORKER-FULL-WIDTH-v1 */
      .app {
        width: 100% !important;
        max-width: none !important;
        box-sizing: border-box !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
      }

      /* GM-ACCOUNT-FULL-WIDTH-FIX-v1: expand Account content without changing shared worker pages */
      .app {
        width: 100% !important;
        max-width: none !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        box-sizing: border-box !important;
        min-height: calc(100vh - env(safe-area-inset-top, 0px));
      }

      /* Keep the full-width layout comfortable on smaller screens */
      @media (max-width: 640px) {
        .app {
          width: 100% !important;
          max-width: none !important;
          padding-left: 14px;
          padding-right: 14px;
          box-sizing: border-box !important;
        }

        .ac-hero {
          padding: 15px;
          gap: 10px;
        }

        .ac-hero strong {
          font-size: clamp(23px, 6vw, 30px);
        }

        .ac-stat {
          padding: 12px;
          gap: 8px;
          min-width: 0;
        }

        .ac-stat strong {
          font-size: 18px;
        }

        .ac-row {
          gap: 9px;
          padding: 12px;
        }

        .ac-row .s {
          white-space: normal;
          overflow-wrap: anywhere;
        }

        .ac-row .amt {
          font-size: 14px;
        }
      }
    </style>
    <style>
      /* Same look as Home and Route: plain background + logo at the top of the side menu */
      body {
        background: var(--bg);
      }
      html[data-theme="dark"] body {
        background: #0b1316;

          margin-bottom: 12px;
          border-radius: 0;
          border-bottom: 1px solid var(--border);
          color: var(--text);
          background: none;

        .nav a.brand-side:hover {
          background: none;
        }
        .brand-name {
          font:

          display: block;
        }
        .brand-sub {
          display: block;
          font-size: 11.5px;
          color: var(--muted);

        }
        .brand-logo {
          width: 44px;
          height: 44px;
          border-radius: 12px;
          background: #fff;
          border: 1px solid var(--border);
          display: grid;
          place-items: center;
          overflow: hidden;
          flex-shrink: 0;
        }
        .brand-logo img {
          width: 40px;
          display: block;
        }
      }
    </style>

    <script>
      if (!localStorage.getItem("gm_logged_in")) {
        window.location.href = "../login.html";
      }
      var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      var now = new Date(),
        cur = { y: now.getFullYear(), m: now.getMonth() },
        tab = "overview",
        showList = false;
      function esc(t) {
        return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }
      function inr(n) {
        return "\u20B9" + Math.abs(Number(n) || 0).toLocaleString("en-IN");
      }
      var EMO = { advance: "\ud83d\udc5b", deduction: "\u2796", payment: "\u2705" },
        LAB = { advance: "Advance", deduction: "Cut", payment: "Paid" };

      function row(it) {
        var cls = it.type === "payment" ? "pos" : it.type === "deduction" ? "neg" : "adv",
          bg = it.type === "payment" ? "rgba(34,197,94,.18)" : it.type === "deduction" ? "rgba(239,68,68,.15)" : "rgba(245,158,11,.2)",
          note = it.note && it.note !== "Added by Fleet Admin" ? " \u00b7 " + it.note : "";
        return '<div class="ma-row"><span class="ib" style="background:' + bg + '">' + (EMO[it.type] || "") + '</span><div class="mid"><div class="t">' + esc(it.title) +
          '</div><div class="s">' + (LAB[it.type] || "") + " \u00b7 " + esc(it.date) + esc(note) + '</div></div><div class="amt ' + cls + '">' + inr(it.amount) + "</div></div>";
      }

      function render() {
        var key = cur.y + "-" + String(cur.m + 1).padStart(2, "0"),
          isNow = cur.y === now.getFullYear() && cur.m === now.getMonth();
        document.getElementById("monthLabel").textContent = MONTHS[cur.m] + " " + cur.y;
        document.getElementById("nextM").disabled = isNow;
        var L = GM.getMonthlyAdvances(key) || [],
          adv = 0, ded = 0, nAdv = 0, nDed = 0;
        L.forEach(function (i) {
          var a = Number(i.amount) || 0;
          if (i.type === "advance") { adv += a; nAdv++; }
          else if (i.type === "deduction") { ded += a; nDed++; }
        });
        var cuts = adv + ded,
          salary = GM.getMySalary ? GM.getMySalary() : 0,
          payout = salary - cuts,
          html = "";

        if (tab === "overview") {
          html +=
            '<div class="ma-cut"><span class="em">\ud83d\udcb5</span><div><small>Will be cut from your salary' + (isNow ? "" : " \u00b7 " + MONTHS[cur.m]) + "</small><strong>" + inr(cuts) + '</strong></div><button type="button" id="seeDet">' + (showList ? "Hide details \u2191" : "See details \u2192") + '</button></div>' +
            '<div class="ma-two"><div class="ma-stat a"><span class="ib">\ud83d\udc5b</span><div><small>Advance you took</small><strong>' + inr(adv) + '</strong></div></div>' +
            '<div class="ma-stat d"><span class="ib">\u2796</span><div><small>Other cuts</small><strong>' + inr(ded) + "</strong></div></div></div>" +
            '<div class="ma-card ma-est"><span class="ib">\ud83d\udcb0</span><div style="flex:1"><small>Estimated salary</small>' +
            (salary > 0 ? "<strong>" + inr(payout) + "</strong><em>Based on current month (after deductions)</em>" : "<strong>Not set</strong><em>Ask the office to set your monthly salary</em>") + "</div></div>" +
            '<div class="ma-card"><div class="ma-h">\ud83d\udcca This month \u2013 summary</div><div class="ma-tbl">' +
            "<div><span>Base salary</span><b>" + (salary > 0 ? inr(salary) : "Not set") + "</b></div>" +
            '<div class="neg"><span>Total cuts</span><b>' + (cuts > 0 ? "- " : "") + inr(cuts) + "</b></div>" +
            '<div class="tot"><span>Estimated payout</span><b>' + (salary > 0 ? inr(payout) : "-") + "</b></div></div></div>" +
            '<div class="ma-card"><div class="ma-h">\ud83d\uddc2\ufe0f Cut &amp; advance breakdown</div>' +
            '<button type="button" class="ma-bk a" data-go="advance"><span class="ib">\ud83d\udc5b</span><span class="n">Advance (' + nAdv + ")</span><b>" + inr(adv) + '</b><span>\u203a</span></button>' +
            '<button type="button" class="ma-bk d" data-go="deduction"><span class="ib">\u2796</span><span class="n">Other cuts (' + nDed + ")</span><b>" + inr(ded) + '</b><span>\u203a</span></button></div>';
          if (showList)
            html += '<div class="ma-card" id="allEnt"><div class="ma-h">All entries</div>' + (L.length ? L.map(row).join("") : '<div class="ma-empty">Nothing in ' + MONTHS[cur.m] + " " + cur.y + ".</div>") + "</div>";
          html += '<div class="ma-card"><a class="ma-link" href="collections-history.html"><span class="ib">\ud83e\uddfe</span><span class="n">Collections history</span><span>\u203a</span></a></div>';
        } else {
          var F = L.filter(function (i) { return i.type === tab; }),
            tot = F.reduce(function (a, i) { return a + (Number(i.amount) || 0); }, 0),
            name = { advance: "Advance", deduction: "Cuts", payment: "Paid" }[tab];
          html += salary > 0
            ? '<div class="ma-card"><div class="ma-tbl"><div><span>Base salary</span><b>' + inr(salary) + '</b></div><div class="neg"><span>Total cuts so far</span><b>' + (cuts > 0 ? "- " : "") + inr(cuts) + '</b></div><div class="tot"><span>Estimated payout</span><b>' + inr(payout) + "</b></div></div></div>"
            : '<div class="ma-card"><div class="ma-empty" style="padding:4px 0">Salary not set. Ask the office to set it.</div></div>';
          html += '<div class="ma-card"><div class="ma-h" style="justify-content:space-between"><span>' + name + "</span><span>" + (F.length ? "Total " + inr(tot) : "") + "</span></div>" +
            (F.length ? F.map(row).join("") : '<div class="ma-empty">Nothing in ' + MONTHS[cur.m] + " " + cur.y + ".</div>") + "</div>";
        }
        document.getElementById("view").innerHTML = html;
        var sd = document.getElementById("seeDet");
        if (sd) sd.onclick = function () {
          showList = !showList;
          render();
          if (showList) {
            var ae = document.getElementById("allEnt");
            if (ae) ae.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        };
        document.querySelectorAll("[data-go]").forEach(function (b) {
          b.onclick = function () { setTab(b.getAttribute("data-go")); };
        });
      }
      function setTab(t) {
        tab = t;
        document.querySelectorAll(".ma-tab").forEach(function (x) { x.classList.toggle("active", x.getAttribute("data-t") === t); });
        render();
      }
      document.getElementById("prevM").onclick = function () {
        if (cur.m === 0) { cur.m = 11; cur.y--; } else cur.m--;
        showList = false; render();
      };
      document.getElementById("nextM").onclick = function () {
        if (cur.y === now.getFullYear() && cur.m === now.getMonth()) return;
        if (cur.m === 11) { cur.m = 0; cur.y++; } else cur.m++;
        showList = false; render();
      };
      document.querySelectorAll(".ma-tab").forEach(function (b) {
        b.onclick = function () { setTab(b.getAttribute("data-t")); };
      });
      window.addEventListener("gm-sync", render);
      render();
    </script>
  </body>
</html>
