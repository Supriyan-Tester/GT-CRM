<!DOCTYPE html>
<html lang="en">
<head><script src="../shared/sync.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>General Traders - Account</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  .ac-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .ac-head h1 { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .ac-head p { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .ac-month { display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 6px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .ac-month b { font-size: 14px; }
  .ac-month button { width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--t-primary); color: var(--primary); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .ac-month button:disabled { opacity: .35; cursor: default; }
  .ac-month svg { width: 18px; height: 18px; }
  .ac-tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; }
  .ac-tab { flex-shrink: 0; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .ac-tab.active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .ac-hero { position: relative; overflow: hidden; border-radius: var(--radius-card); padding: 18px; margin-bottom: 12px; color: var(--on-hero); background: linear-gradient(135deg, var(--hero1), var(--hero2)); box-shadow: 0 4px 12px rgba(15,118,110,.18); display: flex; align-items: center; gap: 14px; }
  .ac-hero::after { content: ""; position: absolute; width: 130px; height: 130px; border-radius: 50%; right: -30px; top: -45px; background: rgba(255,255,255,.12); }
  .ac-hero > * { position: relative; z-index: 1; }
  .ac-hero .ico { width: 46px; height: 46px; border-radius: 12px; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ac-hero .ico svg { width: 24px; height: 24px; }
  .ac-hero .txt { flex: 1; min-width: 0; }
  .ac-hero small { display: block; font-size: 12.5px; opacity: .9; }
  .ac-hero strong { display: block; font-size: 30px; font-weight: 800; line-height: 1.2; }
  .ac-hero button { border: 1.5px solid rgba(255,255,255,.7); background: transparent; color: inherit; border-radius: 10px; height: 36px; padding: 0 12px; font-weight: 700; font-size: 12.5px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .ac-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .ac-stat { display: flex; align-items: center; gap: 12px; border-radius: var(--radius-card); padding: 14px; border: 1px solid var(--border); box-shadow: var(--shadow); }
  .ac-stat.a { background: linear-gradient(160deg, var(--t-accent), var(--card) 80%); }
  .ac-stat.d { background: linear-gradient(160deg, var(--t-danger), var(--card) 80%); }
  .ac-stat .chip { flex-shrink: 0; }
  .ac-stat small { display: block; font-size: 11.5px; color: var(--muted); }
  .ac-stat strong { display: block; font-size: 20px; font-weight: 800; }
  .ac-sec { display: flex; justify-content: space-between; align-items: center; margin: 0 0 8px; }
  .ac-sec b { font-size: 15px; }
  .ac-sec a { font-size: 12.5px; font-weight: 700; color: var(--primary); cursor: pointer; }
  .ac-list { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px; }
  .ac-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .ac-row:last-child { border-bottom: 0; }
  .ac-row .chip { flex-shrink: 0; }
  .ac-row .mid { flex: 1; min-width: 0; }
  .ac-row .t { font-size: 14px; font-weight: 700; }
  .ac-row .s { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ac-row .amt { font-size: 15px; font-weight: 800; white-space: nowrap; }
  .ac-row .amt.pos { color: var(--success); }
  .ac-row .amt.neg { color: var(--danger); }
  .ac-row .amt.adv { color: var(--accent); }
  .ac-empty { text-align: center; padding: 28px 12px; color: var(--muted); font-size: 13.5px; }
  .ac-note { font-size: 12px; color: var(--muted); text-align: center; }


/* GM-ACCOUNT-FULL-WIDTH-FIX-v2 */
.app {
    width: 100% !important;
    max-width: none !important;
    box-sizing: border-box !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
    min-height: 100vh;
}

@media (max-width: 640px) {
    .app {
        padding-left: 14px;
        padding-right: 14px;
    }
}
</style>
<style>

/* GM-WORKER-FULL-WIDTH-v1 */
.app {
    width: 100% !important;
    max-width: none !important;
    box-sizing: border-box !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
}

  /* GM-ACCOUNT-FULL-WIDTH-FIX-v1: expand Account content without changing shared worker pages */
  .app {
    width: 100% !important;
    max-width: none !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
    box-sizing: border-box !important;
    min-height: calc(100vh - env(safe-area-inset-top, 0px));
  }

  /* Keep the full-width layout comfortable on smaller screens */
  @media (max-width: 640px) {
    .app {
      width: 100% !important;
      max-width: none !important;
      padding-left: 14px;
      padding-right: 14px;
      box-sizing: border-box !important;
    }

    .ac-hero {
      padding: 15px;
      gap: 10px;
    }

    .ac-hero strong {
      font-size: clamp(23px, 6vw, 30px);
    }

    .ac-stat {
      padding: 12px;
      gap: 8px;
      min-width: 0;
    }

    .ac-stat strong {
      font-size: 18px;
    }

    .ac-row {
      gap: 9px;
      padding: 12px;
    }

    .ac-row .s {
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .ac-row .amt {
      font-size: 14px;
    }
  }
</style>
<style>
/* Same look as Home and Route: plain background + logo at the top of the side menu */
body { background: var(--bg); }
html[data-theme="dark"] body { background: #0B1316; }
.app { background: none !important; }
.nav a.brand-side { display: none; }
@media (min-width: 900px) {
  .nav a.brand-side { display: flex; flex-direction: row; align-items: center; gap: 12px; min-height: 0; padding: 4px 8px 20px; margin-bottom: 12px; border-radius: 0; border-bottom: 1px solid var(--border); color: var(--text); background: none; }
  .nav a.brand-side:hover { background: none; }
  .brand-name { font: 800 16px 'Plus Jakarta Sans','Inter',sans-serif; display: block; }
  .brand-sub { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .brand-logo { width: 44px; height: 44px; border-radius: 12px; background: #fff; border: 1px solid var(--border); display: grid; place-items: center; overflow: hidden; flex-shrink: 0; }
  .brand-logo img { width: 40px; display: block; }
}
</style>
</head>
<body>
<main class="app">
  <header class="ac-head">
    <div><h1>My Account</h1><p>Advance, cuts and money you got</p></div>
    <button class="icon-btn" id="themeToggle" aria-label="Switch light or dark theme">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="ac-month">
    <button type="button" id="prevM" aria-label="Previous month"><svg class="icon" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <b id="monthLabel">&nbsp;</b>
    <button type="button" id="nextM" aria-label="Next month"><svg class="icon" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>

  <div class="ac-tabs" id="tabs">
    <button class="ac-tab active" data-t="overview">All</button>
    <button class="ac-tab" data-t="advance">Advance</button>
    <button class="ac-tab" data-t="deduction">Cuts</button>
    <button class="ac-tab" data-t="payment">Paid</button>
  </div>

  <div id="view"></div>
  <p class="ac-note">Advance and cuts are cut from your salary on salary day.</p>
</main>

<!-- Bottom Navigation Bar -->
<nav class="nav" aria-label="Main Navigation">
  <a href="home.html" class="brand-side" aria-label="General Traders">
    <span class="brand-logo"><img src="../assets/logo.png" alt=""></span>
    <span><b class="brand-name">General Traders</b><small class="brand-sub">Distribution &amp; Delivery</small></span>
  </a>
  <div>
    <a href="home.html">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="route.html">
      <svg class="icon" viewBox="0 0 24 24"><path d="M9 20l-6-2V4l6 2 6-2 6 2v14l-6-2-6 2zM9 6v14M15 4v14"/></svg>
      Route
    </a>
    <a href="advances.html" aria-current="page">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.8 9A2 2 0 0 0 13 8h-2a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4h-2a2 2 0 0 1-1.8-1M12 6v12"/></svg>
      Account
    </a>
    <a href="attendance.html">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Attendance
    </a>
    <a href="profile.html">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      Profile
    </a>
  </div>
</nav>

<script src="../shared/theme.js"></script>
<script src="../shared/mock-data.js"></script>
<script>
  if (!localStorage.getItem('gm_logged_in')) { window.location.href = 'login.html'; }
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var RS = '\u20B9', now = new Date();
  var cur = { y: now.getFullYear(), m: now.getMonth() }, tab = 'overview', showAll = false;
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function inr(n) { return RS + Math.abs(n).toLocaleString('en-IN'); }
  var ICON = {
    advance: '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>',
    deduction: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    payment: '<svg class="icon" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>'
  };
  var CHIP = { advance: 'c-a', deduction: 'c-d', payment: 'c-s' };

  function row(it) {
    var LAB = { advance: 'Advance', deduction: 'Cut', payment: 'Paid' }, cls = it.type === 'payment' ? 'pos' : it.type === 'deduction' ? 'neg' : 'adv';
    var note = it.note && it.note !== 'Added by Fleet Admin' ? ' \u00b7 ' + it.note : '';
    return '<div class="ac-row"><span class="chip ' + (CHIP[it.type] || 'c-p') + '">' + (ICON[it.type] || ICON.advance) + '</span>' +
      '<div class="mid"><div class="t">' + esc(it.title) + '</div><div class="s">' + (LAB[it.type] || '') + ' \u00b7 ' + esc(it.date) + esc(note) + '</div></div>' +
      '<div class="amt ' + cls + '">' + inr(Number(it.amount) || 0) + '</div></div>';
  }

  function render() {
    var key = cur.y + '-' + String(cur.m + 1).padStart(2, '0');
    var isNow = cur.y === now.getFullYear() && cur.m === now.getMonth();
    document.getElementById('monthLabel').textContent = MONTHS[cur.m] + ' ' + cur.y;
    document.getElementById('nextM').disabled = isNow;

    var L = GM.getMonthlyAdvances(key) || [], adv = 0, ded = 0;
    L.forEach(function (i) { var a = Number(i.amount) || 0; if (i.type === 'advance') adv += a; else if (i.type === 'deduction') ded += a; });
    var bal = adv + ded, v = document.getElementById('view'), html = '';

    if (tab === 'overview') {
      html += '<div class="ac-hero"><span class="ico"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></span>' +
        '<div class="txt"><small>' + 'Will be cut from your salary' + (isNow ? '' : ' \u00b7 ' + MONTHS[cur.m]) + '</small><strong>' + inr(bal) + '</strong></div>' +
        '<button type="button" id="viewDetails">See all</button></div>' +
        '<div class="ac-stats">' +
        '<div class="ac-stat a"><span class="chip c-a"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg></span><div><small>Advance you took</small><strong>' + inr(adv) + '</strong></div></div>' +
        '<div class="ac-stat d"><span class="chip c-d"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><div><small>Other cuts</small><strong>' + inr(ded) + '</strong></div></div></div>';
      var shown = showAll ? L : L.slice(0, 5);
      html += '<div class="ac-sec"><b>This month</b>' + (L.length > 5 ? '<a id="viewAll">' + (showAll ? 'Show less' : 'See all') + '</a>' : '') + '</div>' +
        '<div class="ac-list">' + (shown.length ? shown.map(row).join('') : '<div class="ac-empty">Nothing in ' + MONTHS[cur.m] + ' ' + cur.y + '.</div>') + '</div>';
    } else {
      var F = L.filter(function (i) { return i.type === tab; }), tot = F.reduce(function (a, i) { return a + (Number(i.amount) || 0); }, 0);
      var name = { advance: 'Advance', deduction: 'Cuts', payment: 'Paid' }[tab];
      html += '<div class="ac-sec"><b>' + name + '</b><span style="font-size:13px;font-weight:700">' + (F.length ? 'Total ' + inr(tot) : '') + '</span></div>' +
        '<div class="ac-list">' + (F.length ? F.map(row).join('') : '<div class="ac-empty">Nothing in ' + MONTHS[cur.m] + ' ' + cur.y + '.</div>') + '</div>';
    }
    v.innerHTML = html;
    var vd = document.getElementById('viewDetails'); if (vd) vd.onclick = function () { showAll = true; render(); };
    var va = document.getElementById('viewAll'); if (va) va.onclick = function () { showAll = !showAll; render(); };
  }

  document.getElementById('prevM').onclick = function () { if (cur.m === 0) { cur.m = 11; cur.y--; } else cur.m--; showAll = false; render(); };
  document.getElementById('nextM').onclick = function () { if (cur.y === now.getFullYear() && cur.m === now.getMonth()) return; if (cur.m === 11) { cur.m = 0; cur.y++; } else cur.m++; showAll = false; render(); };
  document.querySelectorAll('.ac-tab').forEach(function (b) {
    b.onclick = function () { document.querySelectorAll('.ac-tab').forEach(function (x) { x.classList.remove('active'); }); b.classList.add('active'); tab = b.getAttribute('data-t'); render(); };
  });
  window.addEventListener('gm-sync', render);
  render();
</script></body>
</html>
