<!DOCTYPE html>
<html lang="en">
<head><script src="../shared/sync.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>General Traders - Today's Route</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  .rt-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .rt-head h1 { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .rt-head p { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .rt-actions { display: flex; gap: 8px; align-items: center; }
  .rt-refresh { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--primary); font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: var(--shadow); }
  .rt-refresh svg { width: 16px; height: 16px; }
  .rt-refresh.spin svg { animation: rtspin .6s linear; }
  @keyframes rtspin { to { transform: rotate(360deg); } }

  .rt-card { background: linear-gradient(135deg, var(--t-primary), var(--card) 80%); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .rt-card-top { display: flex; align-items: center; gap: 12px; }
  .rt-card-top .chip { width: 44px; height: 44px; flex-shrink: 0; }
  .rt-card-info { flex: 1; min-width: 0; }
  .rt-name { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rt-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .rt-viewmap { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--primary); color: var(--primary); background: var(--card); font-size: 12.5px; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .rt-viewmap svg { width: 15px; height: 15px; }
  .rt-bar { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin: 12px 0 5px; }
  .rt-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), var(--success)); transition: width .3s; }
  .rt-barText { font-size: 12px; color: var(--muted); }

  .rt-list { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; }
  .rt-row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--border); cursor: pointer; text-decoration: none; color: var(--text); }
  .rt-row:last-child { border-bottom: 0; }
  .rt-row:active { background: var(--t-primary); }
  .rt-row.next { background: var(--t-primary); }
  .rt-num { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: var(--on-primary); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rt-num.done { background: var(--success); }
  .rt-num.retry { background: var(--accent); }
  .rt-num.cancelled { background: var(--danger); }
  .rt-info { flex: 1; min-width: 0; }
  .rt-shop { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rt-addr { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rt-pin { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--primary); flex-shrink: 0; }
  .rt-pin svg, .rt-go { width: 18px; height: 18px; }
  .rt-go { color: var(--muted); flex-shrink: 0; }
  .rt-empty { text-align: center; padding: 36px 16px; color: var(--muted); font-size: 14px; }
  .rt-open { display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: var(--radius-btn); background: linear-gradient(135deg, var(--hero1), var(--hero2)); color: var(--on-hero); font-weight: 700; font-size: 15px; text-decoration: none; box-shadow: 0 4px 12px rgba(15,118,110,.18); }
  .rt-open svg { width: 20px; height: 20px; }
</style></head>
<body>
<main class="app">
  <div id="leaveStrip"></div>
  <header class="rt-head">
    <div>
      <h1>Today's Route</h1>
      <p id="rtDate">&nbsp;</p>
    </div>
    <div class="rt-actions">
      <button class="rt-refresh" id="rtRefresh" type="button">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg> Refresh
      </button>
      <button class="icon-btn" id="themeToggle" aria-label="Switch light or dark theme">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <section class="rt-card" id="rtCard">
    <div class="rt-card-top">
      <span class="chip c-p"><svg class="icon" viewBox="0 0 24 24"><path d="M9 20l-6-2V4l6 2 6-2 6 2v14l-6-2-6 2zM9 6v14M15 4v14"/></svg></span>
      <div class="rt-card-info">
        <div class="rt-name" id="rtName">Route</div>
        <div class="rt-sub" id="rtSub">&nbsp;</div>
      </div>
      <a class="rt-viewmap" id="rtViewMap" href="#" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg> View Map
      </a>
    </div>
    <div class="rt-bar"><i id="rtFill"></i></div>
    <div class="rt-barText" id="rtBarText">&nbsp;</div>
  </section>

  <section class="rt-list" id="rtList"></section>

  <a class="rt-open" id="rtOpen" href="#" target="_blank" rel="noopener">
    <svg class="icon" viewBox="0 0 24 24"><path d="M9 20l-6-2V4l6 2 6-2 6 2v14l-6-2-6 2zM9 6v14M15 4v14"/></svg> Open Route in Maps
  </a>
</main>

<!-- Bottom Navigation Bar -->
<nav class="nav" aria-label="Main Navigation">
  <div>
    <a href="home.html">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="route.html" aria-current="page">
      <svg class="icon" viewBox="0 0 24 24"><path d="M9 20l-6-2V4l6 2 6-2 6 2v14l-6-2-6 2zM9 6v14M15 4v14"/></svg>
      Route
    </a>
    <a href="advances.html">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.8 9A2 2 0 0 0 13 8h-2a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4h-2a2 2 0 0 1-1.8-1M12 6v12"/></svg>
      Account
    </a>
    <a href="attendance.html">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Attendance
    </a>
    <a href="profile.html">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      Profile
    </a>
  </div>
</nav>

<script src="../shared/theme.js"></script>
<script src="../shared/mock-data.js"></script>
<script src="../shared/visit.js"></script>
<script>
  if (!localStorage.getItem('gm_logged_in')) { window.location.href = 'login.html'; }
  GMVisit.strip(document.getElementById('leaveStrip'));
  GM.applyTodayPlan();
  window.addEventListener('gm-sync', function () { if (GM.applyTodayPlan()) location.reload(); });

  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var $ = function (id) { return document.getElementById(id); };
  var BADGE = { pending: ['b-muted', 'Pending'], delivered: ['b-success', 'Delivered'], retry: ['b-accent', 'Retry later'], cancelled: ['b-danger', 'Cancelled'] };

  // Rough straight-line distance between consecutive pinned stops
  function km(a, b) {
    var R = 6371, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  // One Google Maps link through all stops still to visit (maps allows 9 stops in between)
  function routeUrl(list) {
    function pt(s) { var p = GM.shopPin(s); return p ? p.lat + ',' + p.lng : encodeURIComponent((s.name || '') + ' ' + (s.address || '')); }
    var todo = list.filter(function (s) { return s.status === 'pending' || s.status === 'retry'; });
    if (!todo.length) todo = list;
    if (!todo.length) return '#';
    todo = todo.slice(0, 10);
    var url = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + pt(todo[todo.length - 1]);
    if (todo.length > 1) url += '&waypoints=' + todo.slice(0, -1).map(pt).join('%7C');
    return url;
  }

  function render() {
    var shops = GM.getShops() || [], next = GM.getNextShop();
    var now = new Date();
    $('rtDate').textContent = now.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

    var done = shops.filter(function (s) { return s.status === 'delivered'; }).length;
    var pct = shops.length ? Math.round(done / shops.length * 100) : 0;
    $('rtName').textContent = (shops[0] && shops[0].owner) || 'No route today';

    var pins = shops.map(function (s) { return GM.shopPin(s); }).filter(Boolean), dist = 0;
    for (var i = 1; i < pins.length; i++) dist += km(pins[i - 1], pins[i]);
    $('rtSub').textContent = shops.length + (shops.length === 1 ? ' customer' : ' customers') + (pins.length > 1 ? ' \u00b7 ~' + dist.toFixed(1) + ' km' : '');
    $('rtFill').style.width = pct + '%';
    $('rtBarText').textContent = done + ' of ' + shops.length + ' delivered';

    var url = routeUrl(shops);
    $('rtViewMap').href = url; $('rtOpen').href = url;
    $('rtOpen').style.display = $('rtViewMap').style.display = shops.length ? '' : 'none';

    if (!shops.length) {
      $('rtList').innerHTML = '<div class="rt-empty">No deliveries planned for today.<br>Tap Refresh to check for a new plan.</div>';
      return;
    }
    $('rtList').innerHTML = shops.map(function (s, i) {
      var b = BADGE[s.status] || BADGE.pending;
      var numCls = s.status === 'delivered' ? 'done' : s.status === 'retry' ? 'retry' : s.status === 'cancelled' ? 'cancelled' : '';
      var numTxt = s.status === 'delivered' ? '\u2713' : (i + 1);
      return '<div class="rt-row' + (next && next.id === s.id ? ' next' : '') + '" data-id="' + esc(s.id) + '">' +
        '<span class="rt-num ' + numCls + '">' + numTxt + '</span>' +
        '<div class="rt-info"><div class="rt-shop">' + esc(s.name) + '</div><div class="rt-addr">' + esc(s.address) + '</div></div>' +
        '<a class="rt-pin" href="' + esc(GM.mapsUrl(s)) + '" target="_blank" rel="noopener" aria-label="Open in Maps"><svg class="icon" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></a>' +
        '<span class="badge ' + b[0] + '">' + b[1] + '</span>' +
        '<svg class="rt-go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>';
    }).join('');
  }

  $('rtList').addEventListener('click', function (e) {
    if (e.target.closest('.rt-pin')) return;
    var row = e.target.closest('.rt-row');
    if (row) location.href = 'delivery.html?id=' + encodeURIComponent(row.getAttribute('data-id'));
  });
  $('rtRefresh').addEventListener('click', function () {
    var btn = this; btn.classList.add('spin');
    if (GM.applyTodayPlan()) { location.reload(); return; }
    render(); setTimeout(function () { btn.classList.remove('spin'); }, 600);
  });
  render();
</script></body>
</html>
