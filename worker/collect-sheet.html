<!doctype html>
<html lang="en">
<head>
<script src="../shared/loading.js"></script>
<script src="../shared/sync.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Collect payment - General Traders</title>
<link rel="stylesheet" href="../shared/theme.css" />
<style>
:root{--primary:#0b7a55;--on-primary:#fff;--t-primary:#e4f5ee;--amber:#d97706}
html[data-theme="dark"]{--t-primary:#12332f}
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;margin:0;overflow-x:hidden;background:var(--bg);color:var(--text)}
.muted{font-size:12px;color:var(--muted)}
h3{font-size:14px;display:flex;align-items:center;gap:8px;margin:0}
.top{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--card);border-bottom:1px solid var(--border)}
.top h1{margin:0;font-size:19px}
.top button{border:0;background:none;color:var(--text);font-size:24px;line-height:1;cursor:pointer;padding:4px 8px}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:12px 12px 112px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;display:grid;gap:12px;min-width:0}
.card>*{min-width:0}
.shop{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center}
.shop .ic{width:48px;height:48px;border-radius:12px;background:var(--t-primary);display:grid;place-items:center;font-size:24px}
.shop b{font-size:16px;display:block}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.btn.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
/* bills */
.bills{display:grid;gap:10px}
.bl{border:1px solid var(--border);border-radius:14px;padding:12px;display:grid;gap:10px;background:var(--card)}
.bl.cur{border-color:var(--primary)}
.bl-h{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center}
.bl-h.nt{grid-template-columns:1fr auto}
.bl-h b{font-size:14px}.bl-h small{font-size:12px}
.bl .btn[data-t]{border-color:#f59e0b;color:var(--amber)}
.bl .btn[data-t].on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.th{width:56px;height:56px;border-radius:10px;background:var(--bg);border:1px solid var(--border);display:grid;place-items:center;font-size:10px;color:var(--muted);text-align:center;cursor:pointer;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.due{display:inline-block;background:rgba(220,38,38,.1);color:#dc2626;font-weight:700;font-size:12px;border-radius:8px;padding:2px 8px;margin-top:3px}
.tagn{display:inline-block;margin-left:6px;background:var(--t-primary);color:var(--primary);font-weight:700;font-size:11px;border-radius:8px;padding:2px 7px}
.cr{border:1px solid #f59e0b;border-radius:14px;padding:12px;display:grid;gap:10px;background:var(--card)}
.cr .ch{display:flex;align-items:center;gap:10px;cursor:pointer;justify-content:space-between}
.cr .ch:after{content:"\25BE";color:var(--muted);transition:transform .15s}
.cr.open>.ch:after{transform:rotate(180deg)}
.cr .ch>div:nth-child(2){flex:1}.cr .ico{font-size:22px}.cr small{display:block;color:var(--muted);font-size:12px}.cr .tot2{color:var(--amber);font-size:16px}
.cr>.cb{display:none}.cr.open>.cb{display:grid;gap:10px}
.cr .bl{border:0;border-top:1px solid var(--border);border-radius:0;padding:10px 0 0;background:none}
.more{display:none;gap:12px}.more.open{display:grid}
.amt2{display:grid;grid-template-columns:minmax(0,1fr) auto 52px;gap:8px;align-items:center}
.in{display:flex;align-items:center;gap:8px;height:52px;padding:0 12px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-size:20px;font-weight:700}
.in span{color:var(--muted)}
.in input{flex:1;min-width:0;width:100%;min-height:0;height:100%;border:0;padding:0;background:transparent;color:inherit;font:inherit;outline:0}
.amt2 .full{height:52px}
.in input[type=number]{border:0;background:transparent;min-height:0;padding:0;border-radius:0;box-shadow:none}
.cam{position:relative;width:52px;height:52px;border-radius:12px;border:1.5px dashed var(--border);background:var(--bg);color:var(--text);font-size:22px;cursor:pointer;padding:0;display:grid;place-items:center;overflow:hidden}
.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam.done{border:1px solid var(--primary)}
.cam.done:after{content:"\2713";position:absolute;top:0;right:0;width:18px;height:18px;border-radius:0 0 0 8px;background:var(--primary);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center}
.pbar{height:8px;border-radius:99px;background:rgba(128,128,128,.25);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--primary);transition:width .15s}
.rc{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.hint{margin:0;font-size:13px;font-weight:700;color:#b45309}
.okrow{display:flex;justify-content:flex-end;gap:8px}
.okrow .btn{height:34px;padding:0 18px;font-size:14px}
.okrow .okb{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.okrow .okb:disabled{opacity:.4;cursor:not-allowed}
.sm{display:none;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--t-primary);border:1px solid #10b981;border-radius:14px;padding:10px 12px;color:var(--text)}
.sm.open{display:grid}
.sm .t{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:900}
.sm p{margin:0;font-size:14px;font-weight:700}.sm small{font-size:12px;color:var(--muted)}
.sm .ed{border:0;background:none;color:#2563eb;font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:4px}
/* payment block (moves into the bill that is open) */
.more .pay{border:0;padding:0;background:none}
.pay{display:grid;gap:12px}
.nt2{display:grid;gap:8px;justify-items:start}
.notebtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:2px 0}
.notebtn i{width:22px;height:22px;border-radius:50%;color:var(--primary);display:grid;place-items:center;font-style:normal;font-size:16px;line-height:1}
.notebox{display:none;width:100%}.notebox.open{display:grid;gap:4px}
.notebox textarea{min-height:64px}
.oldpay{display:none;margin-top:4px;padding-top:12px;border-top:1px solid var(--border)}.oldpay.open{display:grid}
#bills.oldopen .bl.cur>.more{display:none}#bills.oldopen .bl.cur{cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border:1px solid var(--border);border-radius:12px;padding:8px 4px;min-height:64px;text-align:center;background:var(--card);color:var(--text);font:inherit;font-size:13px;font-weight:700;cursor:pointer;position:relative}
.tile span{display:block;font-size:22px}
.tile.on{border:2px solid var(--primary);background:var(--t-primary);color:var(--text)}
.tile.on:after{content:"\2713";position:absolute;top:4px;right:8px;color:var(--primary);font-weight:900}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:999px;padding:3px;background:var(--bg)}
.seg button{border:0;border-radius:999px;padding:9px;font:inherit;font-size:14px;font-weight:700;background:none;color:var(--text);cursor:pointer}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.split{display:none;gap:10px}.split.open{display:grid}
.split label{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:10px;font-size:14px;color:var(--text);font-weight:700}
.spn{display:flex;align-items:center;gap:8px}.spn i{font-style:normal;font-size:20px}
input[type=number],textarea,select{width:100%;min-height:44px;border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--bg);color:var(--text);font:inherit;min-width:0}
textarea#note{min-height:72px;resize:vertical}
.ch2{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.ch2:after{content:"\25BE";color:var(--muted);transition:transform .15s}
.coll.open .ch2:after{transform:rotate(180deg)}
.coll>.cb{display:none}.coll.open>.cb{display:grid;gap:10px}
.tot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:14px;border-radius:12px;background:var(--t-primary);color:var(--text)}
.tot small{display:block;color:var(--muted);font-size:13px}.tot b{font-size:28px}
.badge{padding:7px 12px;border-radius:12px;font-size:12px;font-weight:800;background:rgba(34,197,94,.18);color:#16a34a;margin-left:auto;text-align:center}
.badge.warn{background:rgba(245,158,11,.18);color:var(--amber)}
.err{color:var(--danger,#dc2626);font-size:13px;min-height:16px}
.bad{border-color:var(--danger,#dc2626)!important;box-shadow:0 0 0 3px rgba(220,38,38,.18)}
.go{border:0;border-radius:12px;min-height:48px;padding:10px 14px;background:var(--primary);color:var(--on-primary);font:inherit;font-size:15px;font-weight:700;cursor:pointer;width:100%}
.go:disabled{opacity:.45;cursor:not-allowed}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;gap:6px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--border)}
.bar .row2{display:flex;gap:10px}.bar .go{flex:1;width:auto}
.bar .hintbar{font-size:12px;font-weight:700;color:#b45309;min-height:0;text-align:center}.bar .hintbar:empty{display:none}
.cancel{flex:0 0 30%;min-height:48px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
#viewer,#ok{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;padding:14px}
#viewer{background:rgba(0,0,0,.9)}#viewer img{max-width:100%;max-height:100%;border-radius:10px}
#ok{background:rgba(0,0,0,.6)}
#ok .box{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:420px;display:grid;gap:12px;text-align:center}
#ok .tick{width:64px;height:64px;border-radius:50%;background:#16a34a;color:#fff;font-size:34px;display:grid;place-items:center;margin:auto}
#ok .sum{border:1px solid var(--border);border-radius:14px;padding:4px 12px;text-align:left}
#ok .sum div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:14px}
#ok .sum div:first-child{border-top:0}
#ok .big{display:flex;justify-content:center;padding:12px;border-radius:12px;background:var(--t-primary);font-size:26px}
</style>
</head>
<body>
<div class="top"><h1>Collect Payment</h1><button id="x" type="button" aria-label="Close">&times;</button></div>
<main class="wrap">
  <section class="card">
    <div class="shop"><div class="ic">&#127978;</div><div><b id="sName"></b><small class="muted" id="sArea"></small><small class="muted" id="sPhone" style="display:block"></small></div></div>
  </section>
  <section class="card" id="billsCard"><h3>&#129534; Bills</h3><div class="bills" id="bills"><div class="muted">Loading&hellip;</div></div></section>

  <section class="card" id="totCard">
    <div class="tot"><div><small>Total Amount</small><b id="total">&#8377;0.00</b></div><span class="badge warn" id="match" style="display:none"></span></div>
    <div class="err" id="err"></div>
  </section>
</main>
<div class="bar"><div class="hintbar" id="hintBar"></div><div class="row2"><button class="cancel" id="cancel" type="button">Cancel</button><button class="go" id="go" type="button" disabled>Save &amp; Next &rarr;</button></div></div>

<div id="viewer"><img id="viewImg" alt="Bill photo" /></div>
<div id="ok"><div class="box"><div class="tick">&#10003;</div><h2 style="margin:0">Payment collected!</h2><div class="muted" id="okInv"></div><div class="big"><b id="okAmt"></b></div>
  <div class="sum"><div><span>Method</span><b id="okM"></b></div><div><span>Date</span><b id="okT"></b></div><div><span>Photos</span><b id="okP"></b></div><div><span>Status</span><b>Pending approval</b></div></div>
  <button class="go" id="okGo" type="button">Next Shop &rarr;</button></div></div>

<script src="../shared/theme.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); },
    Q = new URLSearchParams(location.search),
    CODE = Q.get("code") || "", INV = (Q.get("inv") || "").trim(), AMT = Number(Q.get("amt")) || 0, RET = Number(Q.get("ret")) || 0, FIX = Q.get("fix") || "";
  var SPN = { cash: "Cash", upi: "UPI", bank_transfer: "Bank transfer" }, CAM = "\ud83d\udcf7";
  // sel: bill is open for collecting; files: bill photo; B: bill details by key ("cur" = the bill from the route plan)
  var S = { pm: { cur: { method: "cash", split: false }, old: { method: "cash", split: false } }, done: {}, cur: null, old: [], sel: {}, ok: {}, files: {}, B: {}, total: 0 };
  if (window.parent !== window) { var tp = $(".top"); if (tp) tp.style.display = "none"; }
  var WIDE = window.matchMedia("(min-width:900px)").matches;

  function api(path, data) {
    return fetch(path, { method: data ? "POST" : "GET", credentials: "same-origin", headers: data ? { "Content-Type": "application/json" } : {}, body: data ? JSON.stringify(data) : undefined })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "Request failed"); return j; }); });
  }
  function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function money(v) { return "\u20b9" + Number(v || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function dmy(d) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ""); return m ? m[3] + "/" + m[2] + "/" + m[1] : esc(d); }
  function pz(v) { return Math.round(Number(v) * 100); }
  function hist(x) {
    var M = { cash: "Cash", upi: "UPI", bank_transfer: "Bank" };
    if (!x.payments) return "";
    if (!x.payments.length) return "";
    return x.payments.map(function (p) {
      var d = p.at ? new Date(p.at).toLocaleDateString("en-IN", { day: "numeric", month: "short", timeZone: "Asia/Kolkata" }) : "", ap = p.status === "approved";
      return '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;font-size:12px;color:var(--muted);line-height:1.35"><span><b style="color:var(--text)">' + money(p.amount).replace(/\.00$/, "") + "</b>" + (d ? " \u00b7 " + d : "") + (p.by ? " \u00b7 " + esc(p.by) : "") + (M[p.method] ? " \u00b7 " + M[p.method] : "") + '</span><span style="font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:' + (ap ? "rgba(22,163,74,.14)" : "rgba(217,119,6,.14)") + ";color:" + (ap ? "#16a34a" : "#d97706") + '">' + (ap ? "Approved" : "Pending") + "</span></div>";
    }).join("");
  }
  function evUrl(p) { var t = String(p || "").split("/").pop().replace(/\.(jpg|png|webp)$/i, ""); return t && t !== "no-photo" ? "/api/accounts/evidence/" + t : ""; }
  function rawDataUrl(f) { return new Promise(function (ok, no) { var r = new FileReader(); r.onload = function () { ok(r.result); }; r.onerror = no; r.readAsDataURL(f); }); }
  // Shrink phone photos to max 1600 px JPEG before upload.
  function dataUrl(f) {
    return new Promise(function (ok) {
      var url = URL.createObjectURL(f), img = new Image();
      img.onload = function () {
        try {
          var k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
          c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.72));
        } catch (e) { URL.revokeObjectURL(url); rawDataUrl(f).then(ok); }
      };
      img.onerror = function () { URL.revokeObjectURL(url); rawDataUrl(f).then(ok); };
      img.src = url;
    });
  }
  // Each bill photo uploads in the background as soon as it is taken, so saving does not wait for it.
  var UPL = new WeakMap();
  function uploadPhoto(f) {
    var p = UPL.get(f);
    if (!p) { p = dataUrl(f).then(function (d) { return api("/api/accounts/evidence", { data: d }); }); UPL.set(f, p); p.catch(function () { UPL.delete(f); }); }
    return p;
  }
  function view(src) { $("#viewImg").src = src; $("#viewer").style.display = "flex"; }
  $("#viewer").onclick = function () { this.style.display = "none"; };
  document.addEventListener("input", function (e) {
    var t = e.target;
    document.querySelectorAll(".bad").forEach(function (x) { x.classList.remove("bad"); });
    if (t && t.type === "number") { var m = /^(-?\d*\.\d{2})\d+$/.exec(t.value); if (m) t.value = m[1]; }
  }, true);
  document.addEventListener("click", function (e) { var h = e.target.closest("[data-tg]"); if (h) { h.parentNode.classList.toggle("open"); syncOld(); } });

  if (FIX) {
    document.querySelector(".top h1").textContent = "Correct Collection";
    var fb = document.createElement("div");
    fb.style.cssText = "background:rgba(13,148,136,.1);border:1px solid rgba(13,148,136,.35);border-radius:12px;padding:12px 14px;display:grid;gap:4px;font-size:13px";
    var selfEd = !Q.get("reason") || /^(Employee is editing this collection|Editing your collection)$/i.test(Q.get("reason"));
    fb.innerHTML = "<b>" + (selfEd ? "Finish your collection" : "Office asked for a correction") + "</b>" +
      (Q.get("was") ? '<span style="color:var(--muted)">You entered:</span><span style="font-size:15px;font-weight:700">' + esc(Q.get("was")) + (INV ? " \u00b7 Invoice #" + esc(INV) : "") + "</span>" : "") +
      (selfEd ? "<span>It is on hold until you save it again. Check the amount and how it was paid, then tap Save.</span>" : "<span><b>Office note:</b> " + esc(Q.get("reason")) + "</span><span>Fix it, then tap Save.</span>");
    document.querySelector("main.wrap").insertBefore(fb, document.querySelector("main.wrap").firstChild);
  }
  $("#sName").textContent = Q.get("name") || "";
  $("#sArea").textContent = Q.get("area") || "";
  $("#sPhone").textContent = Q.get("phone") ? "\u260e " + Q.get("phone") : "";

  // ---------- numbers
  // Two payment groups: "cur" = the current bill, "old" = the old credit bills. Each has its own payment option.
  function grp(k) { return k === "cur" ? "cur" : "old"; }
  function amt(k) { var i = $('[data-a="' + k + '"]'); return i && S.sel[k] ? Number(i.value) || 0 : 0; }
  function gTotal(g) { var n = 0; Object.keys(S.sel).forEach(function (k) { if (S.sel[k] && grp(k) === g) n += amt(k); }); return Math.round(n * 100) / 100; }
  function isCrG(g) { return g === "cur" && S.pm.cur.method === "credit"; }
  function pblk(g) { return document.querySelector('[data-pay="' + g + '"]'); }
  function splitPayments(g) {
    var o = [], b = pblk(g);
    if (!b) return o;
    ["cash", "upi", "bank_transfer"].forEach(function (m) { var i = b.querySelector('[data-sp="' + m + '"]'), v = i ? Number(i.value) : 0; if (v > 0) o.push({ method: m, amount: v }); });
    return o;
  }
  function splitSum(g) { return splitPayments(g).reduce(function (n, p) { return n + pz(p.amount); }, 0); }
  // The bill from the route plan needs a photo only for Pay Later (new bill, or some amount received).
  function curPhotoNeeded() { return !!(S.cur && S.pm.cur.method === "credit" );   
   }

  // draws one payment block and tells whether its split (if any) adds up
  function payUi(g) {
    var b = pblk(g);
    if (!b) return { ok: true };
    var pm = S.pm[g], isCr = isCrG(g), on = pm.split && !isCr, t = gTotal(g), ok = true;
    b.querySelectorAll(".tile").forEach(function (x) { x.classList.toggle("on", x.getAttribute("data-m") === pm.method); });
    b.querySelector('[data-seg="one"]').classList.toggle("on", !on);
    b.querySelector('[data-seg="split"]').classList.toggle("on", on);
    b.querySelector(".split").classList.toggle("open", on);
    b.querySelector(".tiles").style.display = on ? "none" : "grid";
    b.querySelector(".seg").style.display = isCr ? "none" : "";
    var cm = b.querySelector(".crmsg"); if (cm) cm.style.display = isCr ? "grid" : "none";
    if (on) {
      var p = splitPayments(g), m = b.querySelector(".splitmsg"), rem = (pz(t) - splitSum(g)) / 100;
      if (!(t > 0)) { m.textContent = "Enter amount first."; ok = false; }
      else if (rem !== 0) { m.textContent = (rem > 0 ? "Left " + money(rem) : "Over " + money(-rem)); ok = false; }
      else if (p.length < 2) { m.textContent = "Pick 2 or more."; ok = false; }
      else m.textContent = "✓ " + p.map(function (q) { return SPN[q.method] + " " + money(q.amount); }).join(" + ");
    }
    return { ok: ok };
  }

  function recalc() {
    var tc = gTotal("cur"), to = gTotal("old"), isCr = isCrG("cur");
    S.total = Math.round((tc + to) * 100) / 100;
    $("#total").textContent = money(S.total);
    var op = document.querySelector(".oldpay");

  // ---------- load the shop's bills
  function loadInvoices() {
    var today = new Date().toLocaleDateString("en-IN", { day: "2-digit", month: "2-digit", year: "numeric", timeZone: "Asia/Kolkata" });
    api("/api/accounts/customers/" + encodeURIComponent(CODE) + "/invoices").then(function (d) {
      var all = d.invoices || [], key = INV.toLowerCase();
      var mine = all.filter(function (x) { return String(x.invoice_no).trim().toLowerCase() === key; })[0];
      S.curNote = "";
      if (mine) {
        var av = Number(mine.availableToCollect), out = Number(mine.outstanding);
        // A return the delivery person recorded is still waiting for approval, so the ledger has not reduced the bill yet:
        // take it off here (only the part the ledger has not already credited).
        var pendRet = Math.max(0, RET - (Number(mine.returnAmount) || 0));
        if (pendRet > 0) { av = Math.max(0, av - pendRet); out = Math.max(0, out - pendRet); }
        S.cur = av > 0 ? { id: mine.id, max: av, out: out } : null;
        S.B.cur = { key: "cur", inv: INV, date: today, noThumb: 1, tag: '<span class="tagn">Current bill</span>', dueLabel: "Bill amount: " + money(out > 0 ? out : mine.original_amount), av: av, out: out,
          extra: (pendRet > 0 ? '<small class="muted" style="display:block">Return ' + money(pendRet) + " deducted (waiting for approval)</small>" : "") + (av > 0 ? "" : '<small class="muted" style="display:block">' + (out > 0 ? "Already collected." : "Already paid.") + "</small>") + hist(mine) };
      } else if (INV && AMT > 0) {
        var netA = Math.max(0, AMT - RET);
        S.cur = netA > 0 ? { id: "NEW", max: netA, out: netA } : null;
        S.B.cur = { key: "cur", inv: INV, date: today, noThumb: 1, dueLabel: "Bill amount: " + money(netA), av: netA, out: netA, tag: '<span class="tagn">New bill</span>', extra: RET > 0 ? '<small class="muted" style="display:block">Return ' + money(Math.min(RET, AMT)) + " deducted (waiting for approval)</small>" : "" };
      } else { S.cur = null; delete S.B.cur; S.curNote = "Bill not in plan."; }
      S.old = all.filter(function (x) { return Number(x.outstanding) > 0 && String(x.invoice_no).trim().toLowerCase() !== key; });
      S.old.forEach(function (x) {
        S.B[x.id] = { key: x.id, inv: x.invoice_no, date: dmy(x.invoice_date), thumb: evUrl(x.evidence_path), dueLabel: "Due " + money(x.outstanding), av: Number(x.availableToCollect), out: Number(x.outstanding),
          extra: (Number(x.pendingAmount) > 0 ? '<small class="muted" style="display:block">' + money(x.pendingAmount) + " pending</small>" : "") +
            (Number(x.pendingReturn) > 0 ? '<small style="display:block;color:#b45309;font-weight:700">' + money(x.pendingReturn) + " return pending approval (bill " + esc(x.invoice_no) + ")</small>" : "") };
      });
      renderBills(); recalc();
      if (!S.cur && !S.old.some(function (x) { return Number(x.availableToCollect) > 0; })) {
        ["totCard"].forEach(function (id) { $("#" + id).style.display = "none"; });
        S.nothing = true; $("#go").textContent = "Next shop \u2192"; $("#go").disabled = false; $("#hintBar").textContent = "";
      }
    }).catch(function (e) {
      $("#bills").innerHTML = '<div class="muted">' + esc(/not found/i.test(e.message) ? "Can't load bills." : e.message) + "</div>";
      if (INV && AMT > 0) {
        var netB = Math.max(0, AMT - RET);
        S.cur = netB > 0 ? { id: "NEW", max: netB, out: netB } : null;
        S.B.cur = { key: "cur", inv: INV, date: "", noThumb: 1, dueLabel: "Bill amount: " + money(netB), av: netB, out: netB, tag: '<span class="tagn">New bill</span>', extra: RET > 0 ? '<small class="muted" style="display:block">Return ' + money(Math.min(RET, AMT)) + " deducted (waiting for approval)</small>" : "" };
        renderBills();
      }
      recalc();
    });
  }

  // ---------- save
  function fe(msg, sel) { var e = new Error(msg); e.sel = sel; return e; }
  function showErr(e) {
    $("#err").textContent = e.message || "Something went wrong";
    var el = e.sel && $(e.sel);
    if (el) { el.classList.add("bad"); try { el.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (x) {} }
    else { try { $("#err").scrollIntoView({ block: "center" }); } catch (x) {} }
  }
  // Inside the route screen the parent decides what happens next; opened on its own (editing from History) we go back there.
  function leaveSheet(msg) {
    if (window.parent !== window) { try { parent.postMessage(msg, location.origin); return; } catch (e) {} }
    window.location.href = "collections-history.html";
  }
  function newKey() { return crypto.randomUUID ? crypto.randomUUID() : "COL-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
  $("#go").onclick = async function () {
    var isCr = isCrG("cur"), btn = this;
    $("#err").textContent = "";
    document.querySelectorAll(".bad").forEach(function (x) { x.classList.remove("bad"); });
    btn.disabled = true; btn.textContent = "Saving...";
    try {
      var curA = amt("cur"), allocCur = [], allocOld = [];
      if (isCr && !(S.total > 0)) { // nothing received: everything stays on credit
        if (S.cur && S.cur.id === "NEW") {
          if (!S.files.cur) throw fe("Add bill photo.", '[data-add="cur"]');
          if (S.files.cur.size > 25 * 1024 * 1024) throw fe("Photo max 25 MB.", '[data-add="cur"]');
          var cu = await uploadPhoto(S.files.cur);
          await api("/api/accounts/delivery-invoice", { customerCode: CODE, invoiceNo: INV, evidencePath: cu.evidencePath });
        }
        leaveSheet({ gmCollect: "done", credit: S.cur !== null });
        return;
      }
      if (S.cur && !isCr && !(curA > 0)) throw fe("Enter amount or choose Pay Later.");
      if (curA > 0) {
        var u = { evidencePath: undefined }, id = S.cur.id;
        if (isCr && S.files.cur) {
          if (S.files.cur.size > 25 * 1024 * 1024) throw fe("Photo max 25 MB.", '[data-add="cur"]');
          u = await uploadPhoto(S.files.cur);
        } else if (isCr) throw fe("Add bill photo.", '[data-add="cur"]');
        if (id === "NEW") { var ci = await api("/api/accounts/delivery-invoice", { customerCode: CODE, invoiceNo: INV, evidencePath: u.evidencePath }); id = ci.invoiceId; }
        allocCur.push({ invoiceId: id, amount: curA, evidencePath: u.evidencePath });
      }
      Object.keys(S.sel).forEach(function (k) {
        if (!S.sel[k] || k === "cur") return;
        var a = amt(k);
        if (a > 0) allocOld.push({ invoiceId: k, amount: a });
      });
      for (var oa of allocOld) {
        var of = S.files[oa.invoiceId];
        if (!of) throw fe("Add the bill photo for every old bill.", '[data-add="' + oa.invoiceId + '"]');
        if (of.size > 25 * 1024 * 1024) throw fe("Photo max 25 MB.", '[data-add="' + oa.invoiceId + '"]');
        oa.evidencePath = (await uploadPhoto(of)).evidencePath;
      }
      if (!allocCur.length && !allocOld.length) throw fe("Enter amount.");
      // old bills and the current bill are saved as two collections, each with its own payment option
      var jobs = [];
      if (allocOld.length) jobs.push({ g: "old", alloc: allocOld });
      if (allocCur.length) jobs.push({ g: "cur", alloc: allocCur });
      var fixFor = allocCur.length ? "cur" : "old", labels = [];
      S.done = S.done || {};
      for (var j of jobs) {
        var g = j.g, pm = S.pm[g], gcr = isCrG(g), gt = j.alloc.reduce(function (n, x) { return n + pz(x.amount); }, 0), label;
        if (S.done[g]) { labels.push(S.done[g]); continue; } // already saved on an earlier try
        var key = newKey(), corr = g === fixFor ? FIX || undefined : undefined, blk = pblk(g);
        if (pm.split && !gcr) {
          if (splitSum(g) !== gt || splitPayments(g).length < 2) throw fe("Amounts must match total.", '[data-pay="' + g + '"]');
          var sp = await api("/api/accounts/collections/split", { customerCode: CODE, payments: splitPayments(g), allocations: j.alloc, requestKey: key, note: noteVal(), correctsId: corr });
          label = (sp.parts || splitPayments(g)).map(function (q) { return SPN[q.method]; }).join(" + ");
        } else {
          var PM = gcr ? blk.querySelector(".crmethod").value : pm.method;
          await api("/api/accounts/collections", { customerCode: CODE, method: PM, allocations: j.alloc, requestKey: key, note: noteVal(), correctsId: corr });
          label = SPN[PM] + (gcr ? " + Credit" : "");
        }
        S.done[g] = label; labels.push(label);
      }
      var label2 = labels.filter(function (x, i) { return labels.indexOf(x) === i; }).join(" · ");
      $("#okInv").textContent = INV ? "Invoice #" + INV : "";
      $("#okAmt").textContent = money(S.total);
      $("#okM").textContent = label2;
      $("#okT").textContent = new Date().toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Kolkata" });
      var photos = allocCur.filter(function (x) { return !!x.evidencePath; }).length;
      $("#okP").textContent = photos + (photos === 1 ? " photo" : " photos");
      var info = { gmCollect: "saved", inv: INV, amount: S.total, method: label2, time: $("#okT").textContent, photos: $("#okP").textContent };
      if (window.parent !== window) { try { parent.postMessage(info, location.origin); return; } catch (e2) {} }
      $("#ok").style.display = "flex";
    } catch (e) {
      showErr(e); btn.disabled = false; btn.textContent = "Save & Next →"; recalc();
    }
  };
  $("#cancel").onclick = function () { leaveSheet({ gmCollect: "cancel" }); };
  $("#x").onclick = function () { leaveSheet({ gmCollect: "cancel" }); };
  $("#okGo").onclick = function () { leaveSheet({ gmCollect: "done" }); };

  loadInvoices();
  recalc();
})();
</script>
<script src="../shared/upi-qr.js"></script>
</body>
</html>
