<!doctype html>
<html lang="en"><head><script src="../shared/loading.js"></script><script src="../shared/sync.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Collect payment - General Traders</title><link rel="stylesheet" href="../shared/theme.css"><style>
:root{--primary:#0b7a55;--on-primary:#fff;--t-primary:#e4f5ee;--amber:#d97706}
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;margin:0;overflow-x:hidden;background:var(--bg);color:var(--text)}
.muted{font-size:12px;color:var(--muted)}
h3{font-size:14px;display:flex;align-items:center;gap:8px;margin:0}
.top{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--card);border-bottom:1px solid var(--border)}
.top h1{margin:0;font-size:19px}.top button{border:0;background:none;color:var(--text);font-size:24px;line-height:1;cursor:pointer;padding:4px 8px}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:12px 12px 104px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.col{display:contents}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;display:grid;gap:12px;min-width:0}
.card>*{min-width:0}
.shop{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center}
.shop .ic{width:48px;height:48px;border-radius:12px;background:var(--t-primary);display:grid;place-items:center;font-size:24px}
.shop b{font-size:16px;display:block}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:14px}.meta b{font-weight:700}
.bill{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-radius:12px;background:var(--t-primary)}
.bill small{display:block;color:var(--muted);font-size:12px}.bill b{font-size:clamp(24px,8vw,30px);white-space:nowrap}
.stat{white-space:nowrap;padding:5px 12px;border-radius:10px;font-size:12px;font-weight:700;background:rgba(245,158,11,.15);color:var(--amber);border:1px solid rgba(245,158,11,.4)}
.ch{display:flex;align-items:center;gap:10px;cursor:pointer;justify-content:space-between}
.ch:after{content:"\25BE";color:var(--muted);transition:transform .15s}.coll.open>.ch:after,.coll.open>.ch:after{transform:rotate(180deg)}
.coll>.cb,.cr>.cb{display:none}.coll.open>.cb,.cr.open>.cb{display:grid;gap:10px}
#creditCard{padding:0;border:0;background:none}
.cr{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;display:grid;gap:10px}
.cr.has{border-color:#f59e0b;background:#fff8ec}
.cr .ch>div:nth-child(2){flex:1}.cr .ico{font-size:22px}.cr small{display:block;color:var(--muted);font-size:12px}.cr .tot2{color:var(--amber);font-size:16px}
.cr.open>.ch:after{transform:rotate(180deg)}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;border-top:1px solid var(--border);padding-top:10px}
.row .th{width:56px;height:56px;border-radius:10px;background:var(--bg);border:1px solid var(--border);display:grid;place-items:center;font-size:10px;color:var(--muted);text-align:center;cursor:pointer;overflow:hidden}
.row .th img{width:100%;height:100%;object-fit:cover}
.row b{font-size:14px}.row small{font-size:12px}
.due{display:inline-block;background:rgba(220,38,38,.1);color:#dc2626;font-weight:700;border-radius:8px;padding:2px 8px;margin-top:3px}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.row .btn{border-color:#f59e0b;color:var(--amber)}
.btn.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.more{grid-column:1/-1;display:none;gap:8px}.more.open{display:grid}
input[type=number],textarea{width:100%;min-height:44px;border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--bg);color:var(--text);font:inherit;min-width:0}
.amt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.amt input{min-height:52px;font-size:20px}.amt .btn{min-height:52px;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{flex:1;min-width:70px;min-height:44px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--border);border-radius:12px;padding:10px 6px;min-height:72px;text-align:center;background:var(--card);color:var(--text);font:inherit;font-size:13px;font-weight:700;cursor:pointer;position:relative}
.tile span{display:block;font-size:22px}
.tile.on{border:2px solid var(--primary);background:var(--t-primary)}
.tile.on:after{content:"\2713";position:absolute;top:4px;right:8px;color:var(--primary);font-weight:900}
.tile.credit{grid-column:1/-1;display:flex;gap:10px;align-items:center;justify-content:center;min-height:52px}.tile.credit span{display:inline;font-size:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:999px;padding:3px;background:var(--bg)}
.seg button{border:0;border-radius:999px;padding:9px;font:inherit;font-size:14px;font-weight:700;background:none;color:var(--text);cursor:pointer}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.split{display:grid;gap:8px}.split label{font-size:12px;color:var(--muted);font-weight:700;display:grid;gap:4px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{border:1.5px dashed var(--border);border-radius:14px;min-height:88px;display:grid;place-items:center;align-content:center;text-align:center;font:inherit;font-size:14px;font-weight:600;background:var(--bg);color:var(--text);cursor:pointer;position:relative}
.ph span{display:block;font-size:24px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:12px;position:absolute;inset:0}
.ph .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#111;color:#fff;border:0;z-index:2;font-size:14px;padding:0;cursor:pointer}
#curPrev{grid-column:1/-1;min-height:120px}
textarea#note{min-height:100px;resize:vertical}
.tot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px;border-radius:12px;background:var(--t-primary)}
.tot small{display:block;color:var(--muted);font-size:13px}.tot b{font-size:28px}
.tot{flex-wrap:wrap}.tot>div{min-width:0}.tot .badge{max-width:100%;white-space:normal;text-align:center;line-height:1.3;margin-left:auto}
.badge{padding:7px 12px;border-radius:12px;font-size:12px;font-weight:800;background:rgba(34,197,94,.18);color:#16a34a}
.badge.warn{background:rgba(245,158,11,.18);color:var(--amber)}
.go{border:0;border-radius:12px;min-height:48px;padding:10px 14px;background:var(--primary);color:var(--on-primary);font:inherit;font-size:15px;font-weight:700;cursor:pointer;width:100%}
.go:disabled{opacity:.45;cursor:not-allowed}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--border)}
.bar .go{flex:1;width:auto}
.cancel{flex:0 0 30%;min-height:48px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.hide-credit{display:none!important}
.bad{border-color:var(--danger)!important;box-shadow:0 0 0 3px rgba(220,38,38,.18)}
.err{color:var(--danger);font-size:13px;min-height:16px}
#viewer,#ok{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;padding:14px}
#viewer{background:rgba(0,0,0,.9)}#viewer img{max-width:100%;max-height:100%;border-radius:10px}
#ok{background:rgba(0,0,0,.6)}
#ok .box{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:420px;display:grid;gap:12px;text-align:center}
#ok .tick{width:64px;height:64px;border-radius:50%;background:#16a34a;color:#fff;font-size:34px;display:grid;place-items:center;margin:auto}
#ok .sum{border:1px solid var(--border);border-radius:14px;padding:4px 12px;text-align:left}
#ok .sum div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:14px}
#ok .sum div:first-child{border-top:0}
@media(min-width:900px){
 .wrap{max-width:1040px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;padding:16px 20px 110px;align-items:start}
 .col{display:grid;gap:16px;align-content:start;min-width:0}
 .shop{grid-template-columns:48px 1fr}
 .tiles{grid-template-columns:repeat(4,1fr)}.tile.credit{grid-column:auto;display:block;min-height:72px}.tile.credit span{display:block}
 #photoCard>.ch:after{display:none}#photoCard>.ch{cursor:default}#photoCard>.cb{display:grid!important}
 .bar{padding-left:max(20px,calc((100% - 1040px)/2 + 20px));padding-right:max(20px,calc((100% - 1040px)/2 + 20px));justify-content:flex-end}
 .bar .go{flex:0 0 320px}.cancel{flex:0 0 140px}
}
</style></head><body>
<div class="top"><h1>Collect Payment</h1><button id="x" type="button" aria-label="Close">&times;</button></div>
<main class="wrap">
 <div class="col">
  <section class="card">
   <div class="shop"><div class="ic">&#127978;</div><div><b id="sName"></b><small class="muted" id="sArea"></small><small class="muted" id="sPhone" style="display:block"></small></div></div>
   <div class="meta"><span>Invoice <b id="sInv"></b></span><span>&#128197; <b id="sDate"></b></span></div>
   <div class="bill"><div><small>Bill amount</small><b id="sAmt"></b></div><span class="stat" id="sChip">Pending</span></div>
  </section>
  <section class="card" id="creditCard"><div id="credit"></div></section>
  <section class="card" id="curCard">
   <h3 id="curH">&#8377; Amount received</h3>
   <div id="curMsg" class="muted"></div>
   <div id="curBox" style="display:grid;gap:10px">
    <div class="amt"><input id="curAmt" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"><button class="btn" id="curFull" type="button">Full amount</button></div>
    <div class="chips" id="chips"></div>
   </div>
  </section>
  <section class="card" id="payCard">
   <h3>&#128179; Payment method</h3>
   <div class="tiles" id="tiles"><button type="button" class="tile on" data-m="cash"><span>&#128181;</span>Cash</button><button type="button" class="tile" data-m="upi"><span>&#128241;</span>UPI</button><button type="button" class="tile" data-m="bank_transfer"><span>&#127974;</span>Bank</button><button type="button" class="tile credit" data-m="credit"><span>&#129534;</span>Credit (Pay Later)</button></div>
   <div id="splitRow" style="display:grid;gap:6px"><small style="font-weight:700;font-size:13px">Payment mode</small><div class="seg"><button type="button" class="on" id="segOne">Single</button><button type="button" id="segSplit">Split</button></div><input type="checkbox" id="splitChk" style="display:none"></div>
   <div id="crMsg" class="muted" style="display:none;font-size:14px">No payment today. Add to credit.</div>
   <div class="split" id="splitBox" style="display:none">
    <label>Cash amount<input id="sp_cash" type="number" min="0" step="0.01" placeholder="0.00"></label>
    <label>UPI amount<input id="sp_upi" type="number" min="0" step="0.01" placeholder="0.00"></label>
    <label>Bank transfer amount<input id="sp_bank_transfer" type="number" min="0" step="0.01" placeholder="0.00"></label>
    <div class="muted" id="splitMsg"></div>
   </div>
  </section>
 </div>
 <div class="col">
  <section class="card coll open" id="photoCard">
   <div class="ch" data-tg><h3>&#128247; Bill photo <span class="muted">Required</span></h3></div>
   <div class="cb"><div class="photos"><div class="ph" id="curPrev" style="display:none"></div><button type="button" class="ph" id="addPhoto"><span>&#128247;</span>Take photo</button><button type="button" class="ph" id="scanPhoto"><span>&#9638;</span>Scan bill</button></div>
   <input type="file" id="curFile" accept="image/jpeg,image/png,image/webp" capture="environment" style="display:none"></div>
  </section>
  <section class="card coll" id="noteCard">
   <div class="ch" data-tg><h3>&#128221; Add a note <span class="muted">Optional</span></h3></div>
   <div class="cb"><textarea id="note" maxlength="250" rows="3" placeholder="Add any note about this collection..."></textarea><div class="muted" style="text-align:right" id="noteCnt">0 / 250</div></div>
  </section>
  <section class="card" id="totCard">
   <div class="tot"><div><small>Total collected</small><b id="total">&#8377;0.00</b></div><span class="badge warn" id="match" style="display:none"></span></div>
   <div class="err" id="err"></div>
  </section>
 </div>
</main>
<div class="bar"><button class="cancel" id="cancel" type="button">Cancel</button><button class="go" id="go" type="button" disabled>Save &amp; Next &rarr;</button></div>

<div id="viewer"><img id="viewImg" alt="Bill photo"></div>
<div id="ok"><div class="box"><div class="tick">&#10003;</div><h2 style="margin:0">Payment collected!</h2><div class="muted" id="okInv"></div><div class="bill" style="justify-content:center"><b id="okAmt"></b></div><div class="sum"><div><span>Method</span><b id="okM"></b></div><div><span>Collected on</span><b id="okT"></b></div><div><span>Bill photo</span><b id="okP"></b></div><div><span>Status</span><b>Waiting for office approval</b></div></div><button class="go" id="okGo" type="button">Next Shop &rarr;</button></div></div>
<script src="../shared/theme.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); },
    Q = new URLSearchParams(location.search),
    CODE = Q.get("code") || "", INV = (Q.get("inv") || "").trim(), AMT = Number(Q.get("amt")) || 0;
  var SPN = { cash: "Cash", upi: "UPI", bank_transfer: "Bank transfer" };
  var S = { method: "cash", cur: null, curFile: null, curPrev: "", old: [], oldSel: {} };
  if (window.parent !== window) { var tp = document.querySelector('.top'); if (tp) tp.style.display = 'none'; }
  var WIDE = window.matchMedia("(min-width:900px)").matches;
  if (WIDE) $("#noteCard").classList.add("open");

  function api(path, data) {
    return fetch(path, { method: data ? "POST" : "GET", credentials: "same-origin", headers: data ? { "Content-Type": "application/json" } : {}, body: data ? JSON.stringify(data) : undefined })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "Request failed"); return j; }); });
  }
  function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function money(v) { return "\u20b9" + Number(v || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function dmy(d) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ""); return m ? m[3] + "/" + m[2] + "/" + m[1] : esc(d); }
  function pz(v) { return Math.round(Number(v) * 100); }
  function evUrl(p) { var t = String(p || "").split("/").pop().replace(/\.(jpg|png|webp)$/i, ""); return t ? "/api/accounts/evidence/" + t : ""; }
  function rawDataUrl(f) { return new Promise(function (ok, no) { var r = new FileReader(); r.onload = function () { ok(r.result); }; r.onerror = no; r.readAsDataURL(f); }); }
  // Shrink phone photos to max 1600 px JPEG before upload.
  function dataUrl(f) {
    return new Promise(function (ok) {
      var url = URL.createObjectURL(f), img = new Image();
      img.onload = function () {
        try {
          var k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
          c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.72));
        } catch (e) { URL.revokeObjectURL(url); rawDataUrl(f).then(ok); }
      };
      img.onerror = function () { URL.revokeObjectURL(url); rawDataUrl(f).then(ok); };
      img.src = url;
    });
  }
  function view(src) { $("#viewImg").src = src; $("#viewer").style.display = "flex"; }
  $("#viewer").onclick = function () { this.style.display = "none"; };
  // Amount fields: allow at most 2 decimal places (runs before the other input handlers).
  document.addEventListener("input", function (e) {
    var t = e.target;
    document.querySelectorAll(".bad").forEach(function (x) { x.classList.remove("bad"); });
    if (t && t.type === "number") { var m = /^(-?\d*\.\d{2})\d+$/.exec(t.value); if (m) t.value = m[1]; }
  }, true);
  document.addEventListener("click", function (e) {
    var h = e.target.closest("[data-tg]"); if (!h) return;
    h.parentNode.classList.toggle("open");
  });

  // ---- shop header
  $("#sName").textContent = Q.get("name") || "";
  $("#sArea").textContent = Q.get("area") || "";
  $("#sPhone").textContent = Q.get("phone") ? "\u260e " + Q.get("phone") : "";
  $("#sInv").textContent = INV ? "#" + INV : "-";
  $("#sDate").textContent = new Date().toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric", timeZone: "Asia/Kolkata" });
  $("#sAmt").textContent = money(AMT);

  // ---- totals
  function curAmount() { return S.cur ? Number($("#curAmt").value) || 0 : 0; }
  function oldAmount(id) { var i = $('[data-oa="' + id + '"]'); return i ? Number(i.value) || 0 : 0; }
  function splitPayments() { var o = []; ["cash", "upi", "bank_transfer"].forEach(function (m) { var v = Number($("#sp_" + m).value); if (v > 0) o.push({ method: m, amount: v }); }); return o; }
  function splitSum() { return splitPayments().reduce(function (n, p) { return n + pz(p.amount); }, 0); }
  function recalc() {
    var n = curAmount();
    Object.keys(S.oldSel).forEach(function (id) { if (S.oldSel[id]) n += oldAmount(id); });
    S.total = n;
    $("#total").textContent = money(n);
    var on = $("#splitChk").checked, ok = n > 0;
    $("#segOne").classList.toggle("on", !on); $("#segSplit").classList.toggle("on", on);
    $("#splitBox").style.display = on ? "grid" : "none";
    $("#tiles").style.display = on ? "none" : "grid";
    if (on) {
      var p = splitPayments(), m = $("#splitMsg"), rem = (pz(n) - splitSum()) / 100;
      if (!(n > 0)) { m.textContent = "Enter the amount received above first."; ok = false; }
      else if (rem !== 0) { m.textContent = "Total " + money(n) + " \u00b7 " + (rem > 0 ? "Remaining " + money(rem) : "Over by " + money(-rem)); ok = false; }
      else if (p.length < 2) { m.textContent = "Use at least two payment methods."; ok = false; }
      else m.textContent = "\u2713 Matches total: " + p.map(function (q) { return SPN[q.method] + " " + money(q.amount); }).join(" + ");
    }
    var b = $("#match");
    if (S.cur && curAmount() > 0 && !Object.keys(S.oldSel).some(function (k) { return S.oldSel[k]; })) {
      b.style.display = "";
      if (pz(curAmount()) === pz(S.cur.max)) { b.className = "badge"; b.textContent = "\u2713 Matches bill"; }
      else { b.className = "badge warn"; b.textContent = "Part payment: " + money(S.cur.max - curAmount()) + " still due"; }
    } else b.style.display = "none";
    $("#go").disabled = S.method === "credit" ? false : !ok;
  }

  // ---- load invoices
  function loadInvoices() {
    api("/api/accounts/customers/" + encodeURIComponent(CODE) + "/invoices").then(function (d) {
      var all = d.invoices || [], key = INV.toLowerCase();
      var mine = all.filter(function (x) { return String(x.invoice_no).trim().toLowerCase() === key; })[0];
      if (mine) {
        var av = Number(mine.availableToCollect);
        S.cur = av > 0 ? { id: mine.id, max: av } : null;
        $("#curMsg").textContent = av > 0 ? "" : (Number(mine.outstanding) > 0 ? "A payment for this bill is already waiting for office approval." : "This bill is already fully paid.");
      } else if (INV && AMT > 0) { S.cur = { id: "NEW", max: AMT }; $("#curMsg").textContent = ""; }
      else { S.cur = null; $("#curMsg").textContent = "This bill is not on your plan."; }
      $("#curBox").style.display = S.cur ? "grid" : "none";
      $("#photoCard").style.display = S.cur ? "" : "none";
      $("#curAmt").max = S.cur ? S.cur.max : "";
      var chips = [500, 1000, 1500, 2000].filter(function (v) { return S.cur && v < S.cur.max; }).slice(0, 3);
      $("#chips").innerHTML = chips.map(function (v) { return '<button type="button" class="btn" data-c="' + v + '">\u20b9' + v.toLocaleString("en-IN") + "</button>"; }).join("");
      document.querySelectorAll("[data-c]").forEach(function (b) { b.onclick = function () { $("#curAmt").value = b.getAttribute("data-c"); recalc(); }; });

      S.old = all.filter(function (x) { return Number(x.outstanding) > 0 && String(x.invoice_no).trim().toLowerCase() !== key; });
      renderOld();
      recalc();
      if (!S.cur && !S.old.some(function (x) { return Number(x.availableToCollect) > 0; })) {
        ["payCard", "photoCard", "noteCard", "totCard"].forEach(function (id) { $("#" + id).style.display = "none"; });
        $("#curH").textContent = "\u2713 Nothing more to collect";
        if (!$("#curMsg").textContent) $("#curMsg").textContent = "This shop has no unpaid bill left to collect.";
        S.method = "credit"; $("#go").textContent = "Next shop \u2192"; $("#go").disabled = false;
      }
    }).catch(function (e) {
      $("#credit").innerHTML = '<div class="muted">' + esc(/not found/i.test(e.message) ? "Could not check old credit for this shop." : e.message) + "</div>";
      S.cur = INV && AMT > 0 ? { id: "NEW", max: AMT } : null;
      $("#curBox").style.display = S.cur ? "grid" : "none";
      recalc();
    });
  }

  function renderOld() {
    var sum = S.old.reduce(function (a, x) { return a + Number(x.outstanding || 0); }, 0);
    if (!S.old.length) { $("#credit").innerHTML = '<div class="cr"><div class="ch" style="cursor:default"><b>\u2713 No old credit</b></div></div>'; $(".cr .ch").classList.add("nochev"); return; }
    $("#credit").innerHTML = '<div class="cr has' + (WIDE ? " open" : "") + '"><div class="ch" data-tg><div class="ico">\ud83d\uddc2</div><div><b>Old Credit</b><small>' + S.old.length + (S.old.length > 1 ? " bills" : " bill") + " \u00b7 Outstanding</small></div><b class=\"tot2\">" + money(sum) + "</b></div><div class=\"cb\">" +
      S.old.map(function (x) {
        var u = evUrl(x.evidence_path), av = Number(x.availableToCollect), id = esc(x.id);
        return '<div class="row"><div class="th" data-v="' + esc(u) + '">' + (u ? '<img src="' + esc(u) + '" alt="Bill" onerror="this.parentNode.textContent=\'No photo\'">' : "No photo") + "</div>" +
          "<div><b>Invoice No. " + esc(x.invoice_no) + "</b><small class=\"muted\" style=\"display:block\">\ud83d\udcc5 " + dmy(x.invoice_date) + "</small><span class=\"due small\">Due: " + money(x.outstanding) + "</span>" +
          (Number(x.pendingAmount) > 0 ? "<small class=\"muted\" style=\"display:block\">" + money(x.pendingAmount) + " waiting for approval</small>" : "") + "</div>" +
          (av > 0 ? '<button type="button" class="btn" data-t="' + id + '">Collect</button>' : '<span class="muted">Pending</span>') +
          '<div class="more" id="more_' + id + '"><input data-oa="' + id + '" type="number" min="0" max="' + av.toFixed(2) + '" step="0.01" placeholder="Enter amount (max ' + av.toFixed(2) + ')">' +
          '<div class="photos" style="grid-template-columns:120px"><div class="ph" data-op="' + id + '" style="display:none"></div><button type="button" class="ph" data-oadd="' + id + '"><span>\ud83d\udcf7</span>Add photo</button></div>' +
          '<input type="file" data-of="' + id + '" accept="image/jpeg,image/png,image/webp" capture="environment" style="display:none"></div></div>';
      }).join("") + "</div></div>";
    document.querySelectorAll("[data-v]").forEach(function (t) { t.onclick = function () { var s = t.getAttribute("data-v"); if (s) view(s); }; });
    document.querySelectorAll("[data-t]").forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute("data-t"), on = !S.oldSel[id];
        S.oldSel[id] = on; b.className = "btn" + (on ? " on" : ""); b.textContent = on ? "Selected" : "Collect";
        $("#more_" + id).className = "more" + (on ? " open" : ""); recalc();
      };
    });
    document.querySelectorAll("[data-oa]").forEach(function (i) { i.oninput = recalc; });
    document.querySelectorAll("[data-oadd]").forEach(function (b) {
      var id = b.getAttribute("data-oadd"), f = $('[data-of="' + id + '"]');
      b.onclick = function () { f.click(); };
      f.onchange = function () {
        var file = f.files[0]; if (!file) return; S["of_" + id] = file;
        var p = $('[data-op="' + id + '"]'), url = URL.createObjectURL(file);
        p.style.display = ""; p.innerHTML = '<img src="' + url + '" alt="">'; b.textContent = "Change photo";
      };
    });
  }

  // ---- current bill controls
  $("#curAmt").oninput = function () { if (S.cur && Number(this.value) > S.cur.max) this.value = S.cur.max.toFixed(2); recalc(); };
  $("#curFull").onclick = function () { if (S.cur) { $("#curAmt").value = S.cur.max.toFixed(2); recalc(); } };
  $("#tiles").onclick = function (e) {
    var t = e.target.closest("[data-m]"); if (!t) return;
    S.method = t.getAttribute("data-m");
    document.querySelectorAll(".tile").forEach(function (x) { x.classList.toggle("on", x === t); });
    var cr = S.method === "credit";
    ["curCard", "photoCard", "noteCard", "totCard", "splitRow", "splitBox"].forEach(function (id) { $("#" + id).classList.toggle("hide-credit", cr); });
    $("#crMsg").style.display = cr ? "block" : "none";
    recalc();
  };
  $("#segOne").onclick = function () { $("#splitChk").checked = false; recalc(); };
  $("#segSplit").onclick = function () { $("#splitChk").checked = true; recalc(); };
  ["cash", "upi", "bank_transfer"].forEach(function (m) { $("#sp_" + m).oninput = recalc; });
  $("#note").oninput = function () { $("#noteCnt").textContent = this.value.length + " / 250"; };
  function pick() { $("#curFile").click(); }
  $("#addPhoto").onclick = pick; $("#scanPhoto").onclick = pick;
  $("#curFile").onchange = function () {
    var f = this.files[0]; if (!f) return;
    S.curFile = f; S.curPrev = URL.createObjectURL(f);
    var p = $("#curPrev"); p.style.display = "";
    p.innerHTML = '<img src="' + S.curPrev + '" alt="Bill photo"><button type="button" class="x" id="rmPhoto">\u00d7</button>';
    $("#rmPhoto").onclick = function (e) { e.stopPropagation(); S.curFile = null; p.style.display = "none"; p.innerHTML = ""; $("#curFile").value = ""; };
    p.onclick = function () { view(S.curPrev); };
  };

  // ---- save
  var LBL = { "#photoCard": "Bill photo", "#payCard": "Payment method", "#curCard": "Amount received", "#creditCard": "Old credit" };
  function fe(msg, sel) { var e = new Error(msg); e.sel = sel; return e; }
  function showErr(e) {
    var m = e.message || "Something went wrong", sel = e.sel ||
      (/photo|evidence/i.test(m) ? "#photoCard" : /payment method|split|add up|Cash, UPI/i.test(m) ? "#payCard" : /amount|exceed|outstanding|total|allocation/i.test(m) ? "#curCard" : /invoice|customer/i.test(m) ? "#creditCard" : "");
    var el = sel && $(sel), label = LBL[sel] || (sel && sel.indexOf("data-oadd") > -1 ? "Old credit photo" : "");
    $("#err").textContent = m + (label ? "  \u2192 check: " + label : "");
    if (el) {
      var c = el.closest(".coll,.cr"); if (c) c.classList.add("open");
      el.classList.add("bad");
      try { el.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (x) {}
    } else { try { $("#err").scrollIntoView({ block: "center" }); } catch (x) {} }
  }
  $("#go").onclick = async function () {
    if (S.method === "credit") { try { parent.postMessage({ gmCollect: "done", credit: S.cur !== null }, location.origin); } catch (e) {} return; }
    var btn = this, err = $("#err"); err.textContent = ""; document.querySelectorAll(".bad").forEach(function (x) { x.classList.remove("bad"); }); btn.disabled = true; btn.textContent = "Saving...";
    try {
      var allocations = [];
      if (curAmount() > 0) {
        if (!S.curFile) throw fe("Add a photo of the current bill.", "#photoCard");
        if (S.curFile.size > 5 * 1024 * 1024) throw fe("Each photo must be 5 MB or smaller.", "#photoCard");
        var u = await api("/api/accounts/evidence", { data: await dataUrl(S.curFile) }), id = S.cur.id;
        if (id === "NEW") { var ci = await api("/api/accounts/delivery-invoice", { customerCode: CODE, invoiceNo: INV, evidencePath: u.evidencePath }); id = ci.invoiceId; }
        allocations.push({ invoiceId: id, amount: curAmount(), evidencePath: u.evidencePath });
      }
      for (var k of Object.keys(S.oldSel)) {
        if (!S.oldSel[k]) continue;
        var a = oldAmount(k), f = S["of_" + k];
        if (!(a > 0)) continue;
        if (!f) throw fe("Add a photo for every old credit bill you collect.", '[data-oadd="' + k + '"]');
        if (f.size > 5 * 1024 * 1024) throw fe("Each photo must be 5 MB or smaller.", '[data-oadd="' + k + '"]');
        var uo = await api("/api/accounts/evidence", { data: await dataUrl(f) });
        allocations.push({ invoiceId: k, amount: a, evidencePath: uo.evidencePath });
      }
      if (!allocations.length) throw fe("Enter an amount to collect.", "#curCard");
      var key = crypto.randomUUID ? crypto.randomUUID() : "COL-" + Date.now() + "-" + Math.random().toString(36).slice(2), label;
      if ($("#splitChk").checked) {
        if (splitSum() !== pz(S.total) || splitPayments().length < 2) throw fe("The payment amounts must add up to the total.", "#payCard");
        var sp = await api("/api/accounts/collections/split", { customerCode: CODE, payments: splitPayments(), allocations: allocations, requestKey: key, note: $("#note").value });
        label = (sp.parts || splitPayments()).map(function (q) { return SPN[q.method]; }).join(" + ");
      } else {
        await api("/api/accounts/collections", { customerCode: CODE, method: S.method, allocations: allocations, requestKey: key, note: $("#note").value });
        label = SPN[S.method];
      }
      $("#okInv").textContent = INV ? "Invoice #" + INV : "";
      $("#okAmt").textContent = money(S.total); $("#okM").textContent = label;
      $("#okT").textContent = new Date().toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Kolkata" });
      $("#okP").textContent = allocations.length + (allocations.length > 1 ? " photos" : " photo") + " attached";
      var info = { gmCollect: "saved", inv: INV, amount: S.total, method: label, time: $("#okT").textContent, photos: $("#okP").textContent };
      if (window.parent !== window) { try { parent.postMessage(info, location.origin); return; } catch (e2) {} }
      $("#ok").style.display = "flex";
    } catch (e) { showErr(e); btn.disabled = false; btn.textContent = "Save & Next \u2192"; }
  };
  function close() { try { parent.postMessage({ gmCollect: "cancel" }, location.origin); return; } catch (e) {} history.back(); }
  $("#cancel").onclick = close; $("#x").onclick = close;
  $("#okGo").onclick = function () { try { parent.postMessage({ gmCollect: "done" }, location.origin); } catch (e) {} };

  loadInvoices(); recalc();
})();
</script></body></html>
