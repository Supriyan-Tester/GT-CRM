<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Office Cash Deposit</title><link rel="stylesheet" href="../shared/theme.css"><style>body{padding:18px;color:var(--text)}.wrap{max-width:760px;margin:auto}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid label{display:grid;gap:5px;color:var(--muted);font-size:13px}.grid input,textarea{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;width:100%}button{padding:10px 14px;border:0;border-radius:9px;background:var(--primary);color:white;font-weight:700}#msg{color:var(--muted)}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style><script src="../shared/form-check.js"></script></head><body><main class="wrap"><h1>Office Cash Deposit</h1><p>Submit physical cash deposited at the office. Billing must verify and confirm the count before custody transfers.</p><section class="card"><b>Cash denominations <span class="fc-star">*</span></b><div class="grid" id="notes"></div><p>Calculated total: <b id="total">₹0.00</b></p><label>Deposit note <textarea id="note" maxlength="300" rows="2"></textarea></label><p><button id="submit" disabled>Submit deposit for verification</button></p><p id="msg" role="status"></p></section><p><a href="cash-handover.html">Cash handover</a> · <a href="home.html">Home</a></p></main><script src="../shared/theme.js"></script><script>(function(){const $=id=>document.getElementById(id),ds=[500,200,100,50,20,10];$('notes').innerHTML=ds.map(d=>'<label>₹'+d+' notes<input type="number" min="0" step="1" value="0" id="d'+d+'"></label>').join('');function total(){return ds.reduce((s,d)=>s+d*(Number($('d'+d).value)||0),0)}function update(){$('total').textContent='₹'+total().toLocaleString('en-IN',{minimumFractionDigits:2});}$('notes').addEventListener('input',update);function api(url,data){return fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d;});}$('submit').onclick=async()=>{let amount=total();FC.clear();if(!amount)return FC.fail('d500','Enter the number of notes deposited.');let denominations=ds.map(denomination=>({denomination,pieceCount:Number($('d'+denomination).value)||0}));$('submit').disabled=true;$('msg').textContent='Submitting deposit…';try{await api('/api/accounts/office-deposits',{amount,denominations,note:$('note').value,requestKey:'OFD-'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2))});$('msg').textContent='Deposit submitted. Employee custody will transfer only after Billing confirms receipt.';ds.forEach(d=>$('d'+d).value=0);$('note').value='';update();}catch(e){$('msg').textContent=e.message;$('submit').disabled=false;}};update();})();</script></body></html>
