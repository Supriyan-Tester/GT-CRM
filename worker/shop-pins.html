<!DOCTYPE html>
<html lang="en">
<head><script src="../shared/sync.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>General Traders - Shop locations</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  .sp-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .sp-head h1 { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .sp-head p { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .sp-hero { border-radius: var(--radius-card); padding: 16px; margin-bottom: 12px; color: var(--on-hero); background: linear-gradient(135deg, var(--hero1), var(--primary)); }
  .sp-hero small { display: block; font-size: 12.5px; opacity: .9; }
  .sp-hero strong { display: block; font-size: 26px; font-weight: 800; line-height: 1.25; }
  .sp-bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.28); margin-top: 10px; overflow: hidden; }
  .sp-bar i { display: block; height: 100%; border-radius: 99px; background: #fff; transition: width .4s ease; }
  .sp-search { margin-bottom: 12px; }
  .sp-filters { display: flex; gap: 8px; margin-bottom: 12px; }
  .sp-filters select { flex: 0 0 42%; min-width: 0; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 0 10px; font-family: inherit; font-size: 14px; }
  .sp-filters .sp-search { flex: 1; margin: 0; min-width: 0; }
  .sp-more { margin: 4px 0 14px; }
  .sp-search input { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 0 14px; font-family: inherit; font-size: 14px; }
  .sp-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow); padding: 14px; margin-bottom: 10px; }
  .sp-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .sp-name { font-size: 15px; font-weight: 700; line-height: 1.3; word-break: break-word; }
  .sp-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .sp-need { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .sp-call { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; background: var(--t-primary); color: var(--primary); display: flex; align-items: center; justify-content: center; text-decoration: none; }
  .sp-call svg { width: 18px; height: 18px; }
  .sp-go { margin-top: 12px; }
  .sp-msg { font-size: 13px; margin-top: 8px; color: var(--muted); }
  .sp-msg.bad { color: var(--danger); }
  .sp-msg.ok { color: var(--success); font-weight: 600; }
  .sp-form { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); display: none; }
  .sp-form.on { display: block; }
  .sp-got { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--success); }
  .sp-lbl { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 8px 0 4px; }
  .sp-in { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 0 12px; font-family: inherit; font-size: 14px; }
  .sp-row { display: flex; gap: 8px; margin-top: 12px; }
  .sp-row .btn { flex: 1; }
  .sp-done { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .sp-done:last-child { border-bottom: 0; }
  .sp-done svg { width: 18px; height: 18px; color: var(--success); flex: 0 0 auto; }
  .sp-done span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sp-list { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px; }
  .sp-sec { font-size: 14px; font-weight: 700; margin: 16px 0 8px; }
  .sp-empty { text-align: center; padding: 34px 14px; color: var(--muted); font-size: 14px; }
  .sp-empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
</style></head>
<body>
<main class="app">
  <header class="sp-head">
    <div><h1>Shop locations</h1><p>Stand at the shop and tap the button. The office needs each shop's location once.</p></div>
    <button class="icon-btn" id="themeToggle" aria-label="Switch light or dark theme">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <div id="view"></div>
</main>

<nav class="nav" aria-label="Main Navigation">
  <div>
    <a href="home.html">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="route.html">
      <svg class="icon" viewBox="0 0 24 24"><path d="M9 20l-6-2V4l6 2 6-2 6 2v14l-6-2-6 2zM9 6v14M15 4v14"/></svg>
      Route
    </a>
    <a href="advances.html">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.8 9A2 2 0 0 0 13 8h-2a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4h-2a2 2 0 0 1-1.8-1M12 6v12"/></svg>
      Account
    </a>
    <a href="attendance.html">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Attendance
    </a>
    <a href="profile.html">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      Profile
    </a>
  </div>
</nav>

<script src="../shared/theme.js"></script>
<script src="../shared/mock-data.js"></script>
<script>
  if (!localStorage.getItem('gm_logged_in')) { window.location.href = 'login.html'; }
  var $ = function (i) { return document.getElementById(i); };
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var CALL = '<svg class="icon" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>';
  var TICK = '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>';
  var query = '', area = '', shownN = 30, PAGE = 30, open = null, got = {};   // open = code of the card whose form is showing; got[code] = what is waiting to be saved ({lat,lng,acc} or {nogps:true})

  function needText(s) { var n = s.needs.map(function (x) { return x === 'pin' ? 'location' : x; }); return n.length ? 'Needs: ' + n.join(', ') : ''; }

  function card(s) {
    var g = got[s.code], needPh = s.needs.indexOf('phone') > -1, needAd = s.needs.indexOf('address') > -1, c = esc(s.code);
    var sub = [s.area, s.address].filter(Boolean).join(' · ') || 'No address yet';
    return '<div class="sp-card" data-c="' + c + '"><div class="sp-top"><div style="min-width:0"><div class="sp-name">' + esc(s.name) + '</div><div class="sp-sub">' + esc(sub) + '</div><div class="sp-need">' + esc(needText(s)) + '</div></div>' +
      (s.phone ? '<a class="sp-call" href="tel:' + esc(s.phone) + '" aria-label="Call shop">' + CALL + '</a>' : '') + '</div>' +
      (s.hasPin ? '' : '<button class="btn sp-go" type="button" data-go="' + c + '">' + (g && !g.nogps ? 'Get location again' : 'Use my current location') + '</button>') +
      '<div class="sp-msg' + (g && !g.nogps ? ' ok' : '') + '" data-m="' + c + '">' + (g && !g.nogps ? 'Location found (accurate to about ' + g.acc + ' m)' : '') + '</div>' +
      '<div class="sp-form on" data-f="' + c + '">' +
        (needPh ? '<label class="sp-lbl" for="ph-' + c + '">Shop phone (optional)</label><input class="sp-in" id="ph-' + c + '" type="tel" inputmode="numeric" maxlength="14" placeholder="10-digit number">' : '') +
        (needAd ? '<label class="sp-lbl" for="ad-' + c + '">Address (optional)</label><input class="sp-in" id="ad-' + c + '" type="text" maxlength="200" placeholder="Street, area">' : '') +
        '<div class="sp-row"><button class="btn" type="button" data-save="' + c + '">Save shop</button></div>' +
      '</div></div>';
  }

  function render() {
    if (GM.paintPinBadge) GM.paintPinBadge();
    var all = GM.pinTasks(), left = all.filter(function (s) { return !s.done; }), done = all.filter(function (s) { return s.done; });
    var q = query.trim().toLowerCase();
    var areas = {}; left.forEach(function (s) { var a = s.area || 'No area'; areas[a] = (areas[a] || 0) + 1; });
    if (area && !areas[area]) area = '';
    var shown = left.filter(function (s) { return (!area || (s.area || 'No area') === area) && (!q || (s.name + ' ' + s.area + ' ' + s.address).toLowerCase().indexOf(q) > -1); });
    var h = '';
    if (!all.length) {
      $('view').innerHTML = '<div class="sp-empty"><b>No shops to save</b>When the office sends you a list of shops, it shows up here.</div>';
      return;
    }
    h += '<div class="sp-hero"><small>Saved so far</small><strong>' + done.length + ' of ' + all.length + ' shops</strong><div class="sp-bar"><i style="width:' + Math.round(done.length / all.length * 100) + '%"></i></div></div>';
    if (!left.length) h += '<div class="sp-empty"><b>All done</b>Every shop on your list is saved. Thank you.</div>';
    else {
      h += '<div class="sp-filters"><select id="areaSel" aria-label="Area"><option value="">All areas (' + left.length + ')</option>' + Object.keys(areas).sort().map(function (a) { return '<option value="' + esc(a) + '"' + (a === area ? ' selected' : '') + '>' + esc(a) + ' (' + areas[a] + ')</option>'; }).join('') + '</select>' +
        '<div class="sp-search"><input type="search" id="q" placeholder="Search shops" value="' + esc(query) + '" autocomplete="off"></div></div>';
      h += shown.length ? shown.slice(0, shownN).map(card).join('') : '<div class="sp-empty">No shop matches.</div>';
      if (shown.length > shownN) h += '<button class="btn btn-secondary sp-more" type="button" id="moreBtn">Show next ' + Math.min(PAGE, shown.length - shownN) + ' (' + (shown.length - shownN) + ' more)</button>';
    }
    if (done.length) h += '<div class="sp-sec">Saved (' + done.length + ')</div><div class="sp-list">' + done.slice(0, 60).map(function (s) { return '<div class="sp-done">' + TICK + '<span>' + esc(s.name) + '</span></div>'; }).join('') + '</div>';
    var keep = document.activeElement && document.activeElement.id === 'q', typedVals = {};
    [].forEach.call($('view').querySelectorAll('.sp-in'), function (e) { if (e.value) typedVals[e.id] = e.value; });
    $('view').innerHTML = h;
    Object.keys(typedVals).forEach(function (id) { var e = $(id); if (e && !e.value) e.value = typedVals[id]; });
    if (keep && $('q')) { var el = $('q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    var qi = $('q'); if (qi) qi.oninput = function () { query = qi.value; shownN = PAGE; render(); };
    var as = $('areaSel'); if (as) as.onchange = function () { area = as.value; shownN = PAGE; render(); };
    var mb = $('moreBtn'); if (mb) mb.onclick = function () { shownN += PAGE; render(); };
    [].forEach.call($('view').querySelectorAll('[data-go]'), function (b) { b.onclick = function () { locate(b.getAttribute('data-go')); }; });
    [].forEach.call($('view').querySelectorAll('[data-save]'), function (b) { b.onclick = function () { save(b.getAttribute('data-save')); }; });
  }

  function msg(code, text, cls) { var m = $('view').querySelector('[data-m="' + code.replace(/"/g, '') + '"]'); if (m) { m.textContent = text; m.className = 'sp-msg' + (cls ? ' ' + cls : ''); } }
  function find(code) { return GM.pinTasks().filter(function (s) { return s.code === code; })[0]; }

  // Listens to the phone's location for up to 12 seconds and keeps the most accurate reading.
  // 100 m or better is accepted. If it stays weaker, the employee can still choose "Use it anyway" (laptops have no GPS, so they stay around 100 m or more).
  function accept(code, pos) {
    var acc = Math.round(pos.coords.accuracy || 0);
    got[code] = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: acc }; open = code;
    var typed = {}; ['ph', 'ad'].forEach(function (p) { var e = $(p + '-' + code); if (e) typed[p] = e.value; });
    render();
    ['ph', 'ad'].forEach(function (p) { var e = $(p + '-' + code); if (e && typed[p]) e.value = typed[p]; });
    suggestAddress(code, got[code]);
  }
  function locate(code) {
    var s = find(code); if (!s) return;
    if (!window.isSecureContext) { msg(code, 'Location works only on a secure (https) address. Ask the office for the app link.', 'bad'); return; }
    if (!navigator.geolocation) { msg(code, 'This phone cannot give its location.', 'bad'); return; }
    var btn = $('view').querySelector('[data-go="' + code.replace(/"/g, '') + '"]'); if (btn) btn.disabled = true;
    var best = null, fin = false, wid = null, tick = null, t0 = Date.now();
    msg(code, 'Getting your location...');
    function stop() { fin = true; if (wid != null) navigator.geolocation.clearWatch(wid); clearInterval(tick); if (btn) btn.disabled = false; }
    function done() {
      if (fin) return; stop();
      if (!best) { msg(code, 'Could not get your location. Try again outside the shop.', 'bad'); return; }
      var acc = Math.round(best.coords.accuracy || 0);
      if (acc <= 100) { accept(code, best); return; }
      var m = $('view').querySelector('[data-m="' + code.replace(/"/g, '') + '"]');
      if (m) {
        m.className = 'sp-msg bad'; m.innerHTML = 'Signal is weak (about ' + acc + ' m). Step outside the shop and try again, or use it anyway. ';
        var u = document.createElement('button'); u.type = 'button'; u.className = 'btn btn-secondary'; u.style.cssText = 'margin-top:8px;min-height:38px'; u.textContent = 'Use it anyway (about ' + acc + ' m)';
        u.onclick = function () { accept(code, best); }; m.appendChild(u);
      }
    }
    wid = navigator.geolocation.watchPosition(function (pos) {
      if (fin) return;
      if (!best || pos.coords.accuracy < best.coords.accuracy) best = pos;
      var acc = Math.round(best.coords.accuracy || 0);
      if (acc <= 25) { done(); return; }
      msg(code, 'Getting a better signal... (about ' + acc + ' m)');
    }, function (err) {
      if (fin) return;
      if (best) { done(); return; }
      stop(); msg(code, err && err.code === 1 ? 'Location is blocked. Allow location for this site in the browser settings, then try again.' : 'Could not get your location. Try again outside the shop.', 'bad');
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    tick = setInterval(function () { if (Date.now() - t0 >= 12000) done(); }, 500);
  }

  // Fills the address box with a suggestion from the map service when the shop has no address. The employee can change it. Silent if offline.
  function suggestAddress(code, fix) {
    var s = find(code), box = $('ad-' + code); if (!s || s.address || !box) return;
    var ctl = ('AbortController' in window) ? new AbortController() : null, to = setTimeout(function () { if (ctl) ctl.abort(); }, 8000);
    fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat=' + fix.lat + '&lon=' + fix.lng, { headers: { 'Accept': 'application/json' }, signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        clearTimeout(to);
        var a = (j && j.address) || {}, parts = [a.house_number, a.road, a.neighbourhood || a.suburb || a.hamlet, a.city || a.town || a.village].filter(Boolean);
        var txt = parts.length ? parts.join(', ') : ((j && j.display_name) || '').split(',').slice(0, 3).join(',').trim();
        var b = $('ad-' + code); if (b && !b.value && got[code] === fix && txt) b.value = txt;
      }).catch(function () { clearTimeout(to); });
  }

  function save(code) {
    var s = find(code); if (!s) return;
    var g = got[code], ph = $('ph-' + code), ad = $('ad-' + code), phone = ph ? ph.value.trim() : '', addr = ad ? ad.value.trim() : '';
    if (phone) { var d = phone.replace(/\D/g, ''); if (d.length === 12 && d.indexOf('91') === 0) d = d.slice(2); if (d.length === 11 && d.charAt(0) === '0') d = d.slice(1); if (d.length !== 10) { msg(code, 'Phone number should have 10 digits. Fix it, or clear it to skip.', 'bad'); return; } }
    var shop = { code: s.code, name: s.name }, ok;
    if (!s.hasPin && !(g && !g.nogps)) { msg(code, 'Tap "Use my current location" first, standing at the shop.', 'bad'); return; }
    if (s.hasPin) {
      if (!phone && !addr) { msg(code, 'Type a phone number or an address first.', 'bad'); return; }
      ok = GM.saveShopInfo(shop, { phone: phone, address: addr });
    } else ok = GM.savePin(shop, g.lat, g.lng, g.acc, { phone: phone, address: addr });
    if (!ok) { msg(code, 'Could not save. This shop may already be saved.', 'bad'); delete got[code]; open = null; render(); return; }
    delete got[code]; open = null; render();
  }

  window.addEventListener('gm-sync', function () { var typing = [].some.call(document.querySelectorAll('.sp-in'), function (e) { return e.value; }) || Object.keys(got).length; if (!typing) render(); });
  render();
</script>
</body>
</html>
