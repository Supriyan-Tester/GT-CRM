<!DOCTYPE html>
<html lang="en">
<head><script src="../shared/sync.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>General Traders - Shop Bill</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  .app{ background:none; padding:14px 16px 190px; gap:12px; }
  body{ background:var(--bg); }
  html[data-theme="dark"] body{ background:#0B1316; }
  .app > *{ flex-shrink:0; }
  .dv-head{ display:flex; align-items:center; gap:10px; padding-top:2px; }
  .dv-back{ width:40px; height:40px; border-radius:12px; background:var(--card); border:1px solid var(--border); display:grid; place-items:center; color:var(--text); flex-shrink:0; }
  .dv-back svg{ width:19px; height:19px; }
  .dv-title{ flex:1; min-width:0; }
  .dv-title h1{ color:var(--text); font:800 19px/1.2 'Plus Jakarta Sans','Inter',sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dv-title p{ font-size:12.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dv-head .gt-switch{ box-shadow:none; }
  .dv-head .gt-switch button{ width:32px; height:30px; }


  .bl-cols{ display:flex; flex-direction:column; gap:12px; }
  .bl-sum{ padding:15px; border-radius:22px; background:linear-gradient(135deg,var(--t-primary),var(--card) 85%); border:1px solid var(--border); box-shadow:var(--shadow); }
  .bl-sum .top{ display:flex; gap:12px; align-items:center; }
  .bl-av{ width:46px; height:46px; border-radius:13px; background:var(--primary); color:var(--on-primary); display:grid; place-items:center; flex-shrink:0; }
  .bl-av svg{ width:23px; height:23px; }
  .bl-sum b.p{ display:block; font:800 17px/1.2 'Plus Jakarta Sans','Inter',sans-serif; color:var(--text); }
  .bl-sum small{ font-size:12.5px; color:var(--muted); }
  .bl-chips{ display:flex; gap:8px; margin-top:13px; flex-wrap:wrap; }
  .bl-chips span{ font:700 12px Inter,sans-serif; padding:5px 11px; border-radius:99px; background:var(--card); border:1px solid var(--border); color:var(--text); }
  .bl-chips i{ font-style:normal; color:var(--muted); font-weight:600; }
  .bl-srch{ display:none; align-items:center; gap:9px; height:44px; padding:0 13px; border-radius:13px; border:1px solid var(--border); background:var(--card); color:var(--muted); }
  .bl-srch svg{ width:17px; height:17px; flex-shrink:0; }
  .bl-srch input{ flex:1; min-width:0; border:0; background:none; outline:0; color:var(--text); font:500 13.5px Inter,sans-serif; }
  .bl-reg{ background:var(--card); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow); overflow:hidden; }
  .bl-bh{ display:flex; justify-content:space-between; align-items:center; padding:12px 14px; }
  .bl-bh b{ font:800 14.5px 'Plus Jakarta Sans','Inter',sans-serif; color:var(--text); }
  .bl-bh span{ font:700 11.5px Inter,sans-serif; color:var(--primary); background:var(--t-primary); padding:3px 10px; border-radius:99px; }
  .bl-tr{ display:grid; grid-template-columns:1fr 34px 28px 46px 58px; gap:5px; align-items:start; padding:9px 12px; border-top:1px solid var(--border); font-size:12.5px; }
  .bl-tr.h{ background:var(--t-primary); font:700 10.5px Inter,sans-serif; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); align-items:center; border-top:0; }
  .bl-tr .nm{ font-weight:700; line-height:1.25; color:var(--text); overflow-wrap:anywhere; }
  .bl-tr .nm em{ font-style:normal; color:var(--muted); font-weight:600; }
  .bl-tr .r{ text-align:right; font-variant-numeric:tabular-nums; }
  .bl-tr .mt{ color:var(--muted); }
  .bl-tr .q{ text-align:center; }
  .bl-tr .q span{ display:inline-block; min-width:26px; text-align:center; padding:2px 5px; border-radius:7px; background:var(--t-accent); color:var(--accent); font:800 12.5px Inter,sans-serif; }
  .bl-tr .a{ font-weight:700; color:var(--primary); }
  .bl-tr.ret{ background:var(--t-danger); } .bl-tr.ret .nm{ color:var(--danger); }
  .bl-tf{ padding:10px 14px; border-top:1px solid var(--border); display:flex; justify-content:space-between; gap:10px; font-size:13px; color:var(--muted); }
  .bl-tf b{ color:var(--text); }
  .bl-tf.neg b{ color:var(--danger); white-space:nowrap; }
  .bl-tf.g{ background:var(--t-primary); border-top:2px solid var(--primary); font:800 15px Inter,sans-serif; color:var(--text); }
  .bl-tf.g b{ color:var(--primary); font-size:16px; }
  .bl-empty{ padding:22px 14px; text-align:center; color:var(--muted); font-size:13px; border-top:1px solid var(--border); }
  .bl-side{ display:none; }
  .bl-btm{ position:fixed; left:0; right:0; bottom:calc(76px + env(safe-area-inset-bottom,0px)); z-index:40; padding:10px 16px 12px; background:var(--card); border-top:1px solid var(--border); box-shadow:0 -6px 18px rgba(15,23,42,.07); display:flex; align-items:center; gap:12px; }
  .bl-btm .t small{ display:block; font-size:11px; color:var(--muted); }
  .bl-btm .t b{ font:800 20px 'Plus Jakarta Sans','Inter',sans-serif; color:var(--primary); }
  .bl-go{ flex:1; height:48px; border-radius:13px; background:linear-gradient(135deg,var(--hero1),var(--hero2)); color:var(--on-hero); font:800 14.5px Inter,sans-serif; display:flex; align-items:center; justify-content:center; gap:7px; text-decoration:none; }
  .bl-go svg{ width:18px; height:18px; }
  .nav a.brand-side{ display:none; }
  @media (min-width:900px){
    .app{ max-width:1120px; padding:28px 32px 48px; }
    .nav a.brand-side{ display:flex; flex-direction:row; align-items:center; gap:12px; min-height:0; padding:4px 8px 20px; margin-bottom:12px; border-radius:0; border-bottom:1px solid var(--border); color:var(--text); background:none; }
    .nav a.brand-side:hover{ background:none; }
    .brand-name{ font:800 16px 'Plus Jakarta Sans','Inter',sans-serif; display:block; }
    .brand-sub{ display:block; font-size:11.5px; color:var(--muted); font-weight:500; }
    .brand-logo{ width:44px; height:44px; border-radius:12px; background:#fff; border:1px solid var(--border); display:grid; place-items:center; overflow:hidden; flex-shrink:0; }
    .brand-logo img{ width:40px; display:block; }
    .nav a{ font-weight:600; }
  }
  .dv-shop b, .dv-stats strong, .dv-bh b, .dv-it .n, .dv-note b, .reason-card b, .dv-visit strong.t{ color:var(--text); }
  .dv-stats strong[style]{ color:var(--primary); }
  .dv-bar{ z-index:40; }

</style>
<style>
  @media (min-width:900px){
    .dv-title h1{ font-size:26px; }
    .bl-cols{ display:grid; grid-template-columns:minmax(0,1.5fr) 360px; gap:16px; align-items:start; }
    .bl-main{ display:flex; flex-direction:column; gap:12px; grid-column:1; grid-row:1; }
    .bl-aside{ grid-column:2; grid-row:1; display:flex; flex-direction:column; gap:12px; }
    .bl-btm{ position:static; padding:0; background:none; border:0; box-shadow:none; }
    .bl-btm .t{ display:none; }
    .bl-tr{ grid-template-columns:1fr 80px 60px 80px 100px; font-size:13.5px; padding:11px 16px; }
    .bl-side{ display:block; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:14px; }
    .bl-side div{ display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--border); font-size:13.5px; color:var(--muted); }
    .bl-side div:first-child{ border:0; padding-top:0; } .bl-side b{ color:var(--text); }
    .bl-side div.tt b{ color:var(--primary); font-size:17px; }
    .bl-chips span:last-child{ display:none; }
  }
</style>

<style>

/* GM-WORKER-FULL-WIDTH-v1 */
.app {
    width: 100% !important;
    max-width: none !important;
    box-sizing: border-box !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
}
</style>
</head>
<body>
<main class="app">
 <div id="leaveStrip"></div>
 <header class="dv-head">
   <a href="delivery.html" id="backBtn" class="dv-back" aria-label="Back to delivery"><svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
   <div class="dv-title"><h1 id="hTitle">Bill</h1><p id="hSub">&nbsp;</p></div>
   <span class="badge b-muted" id="hBadge">Pending</span>
   <button class="icon-btn" id="themeToggle" aria-label="Switch light or dark theme">
     <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
   </button>
 </header>
 <div class="bl-cols">
  <div class="bl-main">
   <section class="bl-sum">
     <div class="top"><span class="bl-av"><svg class="icon" viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9c0 2 1.5 3 3 3s3-1 3-3c0 2 1.5 3 3 3s3-1 3-3c0 2 1.5 3 3 3"/></svg></span>
     <div><b class="p" id="sName">Shop</b><small id="sMeta">&nbsp;</small></div></div>
     <div class="bl-chips"><span id="cItems">0 <i>items</i></span><span id="cQty">0 <i>total qty</i></span><span id="cTot">&#8377;0 <i>bill total</i></span></div>
   </section>
   <label class="bl-srch" id="srchBox"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="srch" type="search" placeholder="Search item on this bill" autocomplete="off"></label>
   <section class="bl-reg" id="reg"></section>
  </div>
  <div class="bl-aside">
   <div class="bl-side" id="side"></div>
   <div class="bl-btm"><div class="t"><small id="btmLbl">Bill total</small><b id="btmAmt">&#8377;0</b></div><a class="bl-go" id="goBack" href="delivery.html"><svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Back to delivery</a></div>
  </div>
 </div>
 <p class="dv-foot">Cash &amp; payments recorded on physical paper invoice</p>
</main>
<nav class="nav" aria-label="Main Navigation">
  <a href="home.html" class="brand-side" aria-label="General Traders">
    <span class="brand-logo"><img src="../assets/logo.png" alt=""></span>
    <span><b class="brand-name">General Traders</b><small class="brand-sub">Distribution &amp; Delivery</small></span>
  </a>
  <div>
    <a href="home.html"><svg class="icon" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Home</a>
    <a href="route.html" aria-current="page"><svg class="icon" viewBox="0 0 24 24"><path d="M9 20l-6-2V4l6 2 6-2 6 2v14l-6-2-6 2zM9 6v14M15 4v14"/></svg>Route</a>
    <a href="advances.html"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.8 9A2 2 0 0 0 13 8h-2a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4h-2a2 2 0 0 1-1.8-1M12 6v12"/></svg>Account</a>
    <a href="attendance.html"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Attendance</a>
    <a href="profile.html"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</a>
  </div>
</nav>
<script src="../shared/theme.js"></script>
<script src="../shared/mock-data.js"></script>
<script src="../shared/visit.js"></script>
<script>
  var shopId = new URLSearchParams(location.search).get('id');
  var shop = shopId ? GM.getShop(shopId) : GM.getNextShop();
  if (!shop) { location.replace('route.html'); }
  GMVisit.strip(document.getElementById('leaveStrip'));
  function e(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function money(n) { n = Math.round((Number(n) || 0) * 100) / 100; return '\u20B9' + n.toLocaleString('en-IN', { minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2 }); }
  function $(id) { return document.getElementById(id); }
  var items = shop.items || [], all = GM.getShops() || [], idx = 0;
  for (var i = 0; i < all.length; i++) if (all[i].id === shop.id) idx = i + 1;
  var rets = (GM.getReturns() || []).filter(function (r) { return r.billNo === shop.billNo; });
  var retDed = 0; rets.forEach(function (r) { retDed += Number(r.deductionAmount) || 0; });
  var retNames = {}; rets.forEach(function (r) { retNames[String(r.productName).toUpperCase()] = 1; });
  var totalQty = 0, total = 0;
  items.forEach(function (x) { var q = Number(x.qty) || 0; totalQty += q; total += q * (Number(x.rate) || 0); });
  if (!items.length) total = Number(shop.billAmount) || 0;
  var net = total - retDed, hasRet = retDed > 0;
  var B = { pending: ['b-muted', 'Pending'], delivered: ['b-success', 'Delivered'], retry: ['b-accent', 'Retry later'], cancelled: ['b-danger', 'Cancelled'] }[shop.status] || ['b-muted', 'Pending'];
  $('hTitle').textContent = 'Bill ' + (shop.billNo || '');
  $('hSub').textContent = idx ? 'Stop ' + idx + ' of ' + all.length : 'Shop bill';
  $('hBadge').className = 'badge ' + B[0]; $('hBadge').textContent = B[1];
  $('sName').textContent = shop.name;
  $('sMeta').textContent = 'Bill No ' + (shop.billNo || '-') + ((shop.billDate || shop.date) ? ' \u00b7 ' + (shop.billDate || shop.date) : '');
  $('cItems').innerHTML = items.length + ' <i>' + (items.length === 1 ? 'item' : 'items') + '</i>';
  $('cQty').innerHTML = totalQty + ' <i>total qty</i>';
  $('cTot').innerHTML = money(total) + ' <i>bill total</i>';
  $('backBtn').href = $('goBack').href = 'delivery.html?id=' + encodeURIComponent(shop.id);
  $('btmLbl').textContent = hasRet ? 'Net payable' : 'Bill total';
  $('btmAmt').textContent = money(hasRet ? net : total);
  $('side').innerHTML = '<div><span>Items</span><b>' + items.length + '</b></div><div><span>Total qty</span><b>' + totalQty + '</b></div><div' + (hasRet ? '' : ' class="tt"') + '><span>Bill total</span><b>' + money(total) + '</b></div>' +
    (hasRet ? '<div><span>Returned</span><b style="color:var(--danger)">\u2212 ' + money(retDed) + '</b></div>' : '') + (hasRet ? '<div class="tt"><span>Net payable</span><b>' + money(net) + '</b></div>' : '');
  if (items.length > 8) $('srchBox').style.display = 'flex';

  function draw(q) {
    q = String(q || '').toLowerCase().trim();
    var rows = '', shown = 0;
    items.forEach(function (x, n) {
      if (q && String(x.name).toLowerCase().indexOf(q) < 0) return;
      shown++;
      var qt = Number(x.qty) || 0, r = Number(x.rate) || 0, mrp = Number(x.mrp) || 0;
      rows += '<div class="bl-tr' + (retNames[String(x.name).toUpperCase()] ? ' ret' : '') + '"><span class="nm"><em>' + (n + 1) + '.</em> ' + e(x.name) + '</span><span class="r mt">' + (mrp > 0 ? money(mrp) : '\u2014') + '</span><span class="q"><span>' + qt + '</span></span><span class="r">' + money(r) + '</span><span class="r a">' + money(qt * r) + '</span></div>';
    });
    var h = '<div class="bl-bh"><b>Items on this bill</b><span>' + items.length + (items.length === 1 ? ' item' : ' items') + '</span></div>';
    if (!items.length) h += '<div class="bl-empty">No item list was uploaded for this bill.<br>Bill amount: ' + money(total) + '</div>';
    else {
      h += '<div class="bl-tr h"><span>Item</span><span class="r">MRP</span><span class="q">Qty</span><span class="r">Rate</span><span class="r">Amount</span></div>' + (shown ? rows : '<div class="bl-empty">No matching item.</div>');
      h += '<div class="bl-tf"><span>Total qty</span><b>' + totalQty + '</b></div>';
    }
    h += '<div class="bl-tf g"><span>Bill total</span><b>' + money(total) + '</b></div>';
    if (hasRet) {
      rets.forEach(function (r) { h += '<div class="bl-tf neg"><span>Returned: ' + e(r.productName) + ' \u00d7 ' + e(r.quantity) + '</span><b>\u2212 ' + money(r.deductionAmount) + '</b></div>'; });
      h += '<div class="bl-tf g"><span>Net payable</span><b>' + money(net) + '</b></div>';
    }
    $('reg').innerHTML = h;
  }
  draw('');
  $('srch').addEventListener('input', function () { draw(this.value); });
</script>
</body>
</html>
