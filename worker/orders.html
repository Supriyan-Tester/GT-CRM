<!doctype html>
<html lang="en">
<head>
  <script src="../shared/loading.js"></script>
  <script src="../assets/icons.js"></script>
  <script src="../shared/sync.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Assigned Orders - General Traders</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <style>
    body{background:var(--bg)} .app{max-width:760px;margin:auto;padding:16px 14px 100px;gap:14px}
    .head{display:flex;align-items:center;gap:12px}.head a{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);text-decoration:none}.head h1{font-size:19px;font-weight:800;color:var(--text)}.head p{font-size:12px;color:var(--muted)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted);font-size:12px}.refresh,.submit{border:0;border-radius:11px;padding:10px 14px;background:var(--primary);color:#fff;font-weight:750;cursor:pointer}.refresh{background:var(--card);border:1px solid var(--border);color:var(--text)}
    .order{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:15px;box-shadow:var(--shadow);display:grid;gap:12px}.order-top{display:flex;justify-content:space-between;gap:10px}.order h2{font-size:15px;color:var(--text)}.pill{font-size:10px;font-weight:800;padding:5px 8px;border-radius:30px;background:var(--t-primary);color:var(--primary);height:max-content}.meta{font-size:12px;color:var(--muted);margin-top:3px}.items{display:grid;gap:9px}.line{border-top:1px solid var(--border);padding-top:10px;display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:9px;align-items:center}.line b{font-size:13px;color:var(--text)}.line small{display:block;color:var(--muted);font-size:11px}.line input,.note{width:100%;min-width:0;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px;padding:9px;font:inherit}.reason{grid-column:1/-1;display:none}.reason.show{display:block}.note{min-height:64px;resize:vertical}.empty{padding:30px 18px;text-align:center;border:1px dashed var(--border);border-radius:18px;color:var(--muted);background:var(--card)}.empty b{display:block;color:var(--text);margin-bottom:5px}.order-actions{display:flex;justify-content:flex-end;gap:8px}.submit:disabled,.refresh:disabled{opacity:.55;cursor:wait}
    .nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}.nav a{color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;padding:8px 14px;border-radius:10px}.nav a[aria-current=page]{color:var(--primary);background:var(--t-primary)}
    @media(min-width:700px){.app{padding-top:24px}.order{padding:18px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="head"><a href="home.html" aria-label="Back to home">←</a><div><h1>Assigned Orders</h1><p>Orders assigned to your delivery account</p></div></header>
    <div class="toolbar"><span id="summary" class="muted">Loading assigned orders…</span><button class="refresh" id="refresh" type="button">Refresh</button></div>
    <section id="orders" aria-live="polite"><div class="empty">Loading…</div></section>
  </main>
  <nav class="nav"><a href="home.html">Home</a><a href="route.html">Route</a><a href="orders.html" aria-current="page">Assigned Orders</a><a href="collections.html">Collections</a><a href="attendance.html">Attendance</a></nav>
  <script src="../shared/theme.js"></script>
  <script>
    (function(){
      var root=document.getElementById('orders'), summary=document.getElementById('summary'), refresh=document.getElementById('refresh');
      function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
      function api(path,method,data){return fetch(path,{method:method||'GET',credentials:'same-origin',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Request failed');return j})})}
      function render(list){summary.textContent=list.length+' assigned order'+(list.length===1?'':'s');if(!list.length){root.innerHTML='<div class="empty"><b>No assigned orders</b>New orders assigned by the office will appear here.</div>';return}
        root.innerHTML=list.map(function(o){return '<article class="order" data-order="'+esc(o.id)+'"><div class="order-top"><div><h2>'+esc(o.shop||o.code)+' · '+esc(o.id)+'</h2><div class="meta">'+esc(o.area||'')+' · Shop '+esc(o.code||'')+'</div></div><span class="pill">OUT FOR DELIVERY</span></div>'+
          (o.notes?'<p class="meta">'+esc(o.notes)+'</p>':'')+'<div class="items">'+(o.items||[]).map(function(it){return '<div class="line" data-item="'+esc(it.id)+'"><div><b>'+esc(it.name||it.id)+'</b><small>Ordered: '+esc(it.qty)+' '+esc(it.unit||'')+'</small></div><label class="muted">Delivered qty<input class="delivered" type="number" min="0" max="'+Number(it.qty)+'" step="'+(/kg/i.test(it.unit||'')?'0.001':'1')+'" value="'+Number(it.qty)+'" inputmode="decimal"></label><input class="reason" type="text" maxlength="160" placeholder="Reason for short delivery / return" aria-label="Return reason"></div>'}).join('')+'</div><label class="muted">Delivery note<textarea class="note" maxlength="300" placeholder="Optional note for office"></textarea></label><div class="order-actions"><button class="submit" type="button">Submit delivery result</button></div></article>'}).join('');
        Array.prototype.forEach.call(root.querySelectorAll('.line'),function(line){var q=line.querySelector('.delivered'),reason=line.querySelector('.reason'),max=Number(q.max);function update(){var v=Number(q.value);reason.classList.toggle('show',Number.isFinite(v)&&v<max);if(v>=max)reason.value=''}q.addEventListener('input',update);update()});
        Array.prototype.forEach.call(root.querySelectorAll('.submit'),function(btn){btn.addEventListener('click',function(){var card=btn.closest('[data-order]'),rows=[],valid=true;Array.prototype.forEach.call(card.querySelectorAll('.line'),function(line){var q=line.querySelector('.delivered'),v=Number(q.value),max=Number(q.max),reason=line.querySelector('.reason').value.trim();if(!Number.isFinite(v)||v<0||v>max||(v<max&&!reason))valid=false;rows.push({id:line.dataset.item,deliveredQty:v,returnReason:reason})});if(!valid){alert('Check delivered quantities and enter a reason for every short-delivered item.');return}btn.disabled=true;btn.textContent='Submitting…';api('/api/worker/order-result','POST',{orderId:card.dataset.order,items:rows,note:card.querySelector('.note').value}).then(function(){return load()}).catch(function(e){alert(e.message);btn.disabled=false;btn.textContent='Submit delivery result'})})})
      }
      function load(){refresh.disabled=true;return api('/api/worker/orders').then(function(j){render(j.orders||[])}).catch(function(e){root.innerHTML='<div class="empty"><b>Could not load assigned orders</b>'+esc(e.message)+'</div>';summary.textContent='Unable to load'}).finally(function(){refresh.disabled=false})}
      refresh.addEventListener('click',load);load();
    })();
  </script>
</body>
</html>
