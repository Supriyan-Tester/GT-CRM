<!DOCTYPE html>
<html lang="en">
<head><script src="shared/sync.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>General Traders - Sign in</title>
<link rel="stylesheet" href="shared/theme.css">
<style>
  .top{display:flex;justify-content:flex-end;margin-bottom:8px}
  .toggle{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:3px}
  .toggle button{width:34px;height:34px;border:0;border-radius:50%;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
  .toggle button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
  .toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
  .logo{display:flex;justify-content:center;margin:16px 0 24px}
  .logo-inner{background:var(--logo-bg);border-radius:14px;padding:8px 18px}
  .logo img{display:block;width:140px;height:auto}
  .head{margin-bottom:24px;text-align:center}
  .head h1{font-size:26px;font-weight:700}
  .head .sub{font-size:14px;color:var(--muted);margin-top:6px}
  .cc{padding:0 14px;font-size:15px;font-weight:600;border-right:1px solid var(--border);height:24px;display:flex;align-items:center;color:var(--text)}
  .show{background:none;border:0;color:var(--primary);font-size:13px;font-weight:600;cursor:pointer;padding:0 14px;height:100%}
  .row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px}
  .btn-forgot{background:var(--t-primary);color:var(--primary);border:1px solid rgba(15,118,110,.2);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .group+.group{margin-top:18px}
  .spacer{flex:1}
  .demo-box{margin-top:18px;background:var(--t-primary);border:1px dashed var(--primary);border-radius:10px;padding:6px 14px;font-size:13px;color:var(--primary)}
  .demo-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
  .demo-btn{background:var(--primary);color:var(--on-primary);border:0;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
  .leave-notice{display:none;margin-bottom:16px;padding:14px;border-radius:12px;background:var(--t-info);border:1px solid var(--info);color:var(--info);font-size:13px;line-height:1.4}
  .leave-notice.active{display:block}
  .legal{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;padding-top:24px}
</style></head>
<body>
<main class="screen">
  <div class="top">
    <div class="toggle" role="group" aria-label="Theme">
      <button id="tl" aria-label="Light theme" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button id="td" aria-label="Dark theme" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </div>

  <div class="logo"><div class="logo-inner"><img src="assets/logo.png" alt="General Traders"></div></div>

  <div class="head">
    <h1>Sign in</h1>
    <p class="sub">General Traders</p>
  </div>

  <div id="leaveNotice" class="leave-notice">
    <strong>ðŸŒ´ On Approved Leave Today</strong><br>
    Admin has marked your leave for today. Enjoy your day off! Contact admin if you need to report to duty.
  </div>

  <form class="card" id="form" novalidate>
    <div class="group">
      <label for="phone">Mobile Number</label>
      <div class="field" id="phoneField">
        <span class="cc">+91</span>
        <input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="Enter 10-digit mobile" maxlength="11">
      </div>
    </div>

    <div class="group">
      <label for="pw">Password</label>
      <div class="field" id="pwField">
        <input id="pw" type="password" autocomplete="current-password" placeholder="Enter your password">
        <button type="button" class="show" id="showPw" aria-label="Show password">Show</button>
      </div>
    </div>

    <div class="row"><span></span><button type="button" class="btn-forgot" id="forgot">Forgot password?</button></div>
    <div class="msg" id="msg" role="alert"></div>
    <button class="btn" id="go" type="submit" disabled>Sign In</button>

  </form>
  <div id="chgBox" class="card" style="display:none"></div>

  <div class="spacer"></div>
  <p class="legal">General Traders Delivery Fleet System<br>Need help? Contact Fleet Admin at <strong data-admin-phone></strong></p>
</main>

<script src="shared/theme.js"></script>
<script src="shared/mock-data.js"></script>
<script src="shared/admin.js"></script>
<script>
  var phone = document.getElementById('phone'), phoneField = document.getElementById('phoneField'),
      pw = document.getElementById('pw'), pwField = document.getElementById('pwField'),
      go = document.getElementById('go'), msg = document.getElementById('msg'),
      leaveNotice = document.getElementById('leaveNotice');

  function phoneDigits() { return phone.value.replace(/\D/g, '').slice(0, 10); }
  function pwValue() { return pw.value; }
  function clearErrors() {
    phoneField.classList.remove('err'); pwField.classList.remove('err');
    leaveNotice.classList.remove('active'); msg.className = 'msg'; msg.style.color = ''; msg.textContent = '';
  }
  function refresh() { go.disabled = !(phoneDigits().length === 10 && pwValue().length >= 6); }
  function fmt(d) { return d.slice(0, 5) + ' ' + d.slice(5); }

  phone.addEventListener('input', function () {
    var d = phoneDigits();
    phone.value = d.length > 5 ? fmt(d) : d;
    clearErrors(); refresh();
    if (d.length === 10) pw.focus();
  });

  pw.addEventListener('input', function () { clearErrors(); refresh(); });
  document.getElementById('showPw').addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    this.textContent = show ? 'Hide' : 'Show';
    this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  // Any earlier session on this browser ends when the sign-in page opens.
  try { var lx = new XMLHttpRequest(); lx.open('POST', '/api/logout', true); lx.send(); } catch (e) {}

  document.getElementById('forgot').addEventListener('click', function () {
    msg.className = 'msg'; msg.style.color = 'var(--primary)';
    msg.textContent = 'Please WhatsApp Fleet Admin at ' + GM.getWorker().adminPhone + ' to reset your password.';
  });

  function post(url, obj, cb) {
    fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { cb(r, j); }); })
      .catch(function () { cb({ ok: false, status: 0 }, { error: 'Could not reach the server. Check the connection and try again.' }); });
  }
  function enter(j, typedPw) {
    // Forget whatever the previous person left in this browser, then load only what this account may see.
    if (window.GMSync) { GMSync.clearLocal(); GMSync.pull(); }
    if (j.role === 'admin') {
      GA.setSession({ id: j.id, name: j.name, role: j.adminRole });
      if (j.must) { askNewPassword(typedPw); return; }
      msg.className = 'msg ok'; msg.textContent = 'Signing in...';
      setTimeout(function () { window.location.href = 'admin/index.html'; }, 300);
      return;
    }
    GM.setWorker({ id: j.id, name: j.name, phone: j.phone, role: 'Delivery Executive', onLeaveToday: false, emergencyContact: j.emergency || '' });
    GM.applyTodayPlan();
    msg.className = 'msg ok'; msg.textContent = 'Signing in...';
    try { localStorage.setItem('gm_logged_in', 'true'); } catch (err) {}
    setTimeout(function () { window.location.href = 'worker/home.html'; }, 300);
  }
  // First sign-in with a temporary admin password: the admin must choose their own.
  function askNewPassword(current) {
    var form = document.getElementById('form'), box = document.getElementById('chgBox');
    form.style.display = 'none'; box.style.display = ''; box.className = '';
    box.innerHTML = '<h2 style="margin:0 0 6px;font-size:20px">Choose your own password</h2><p style="margin:0 0 14px;color:var(--muted)">This was a temporary password. Pick a new one (at least 8 characters).</p>' +
      '<div class="field" style="margin-bottom:10px"><input id="np1" type="password" autocomplete="new-password" placeholder="New password"></div>' +
      '<div class="field" style="margin-bottom:10px"><input id="np2" type="password" autocomplete="new-password" placeholder="Repeat new password"></div>' +
      '<div class="msg" id="npMsg" role="alert"></div><button class="btn" id="npGo" type="button">Save and continue</button>';
    document.getElementById('npGo').onclick = function () {
      var a = document.getElementById('np1').value, b = document.getElementById('np2').value, m = document.getElementById('npMsg');
      if (a.length < 8) { m.textContent = 'Use at least 8 characters.'; return; }
      if (a !== b) { m.textContent = 'The two passwords do not match.'; return; }
      post('/api/change-password', { current: current, next: a }, function (r, j) {
        if (!r.ok) { m.textContent = j.error || 'Could not save the password.'; return; }
        window.location.href = 'admin/index.html';
      });
    };
  }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var d = phoneDigits(), p = pwValue();
    if (!/^[6-9]\d{9}$/.test(d)) {
      phoneField.classList.add('err');
      msg.textContent = 'Enter a valid 10-digit mobile number';
      return;
    }
    go.disabled = true; msg.className = 'msg'; msg.textContent = '';
    post('/api/login', { phone: d, password: p }, function (r, j) {
      if (r.ok && j.ok) { enter(j, p); return; }
      go.disabled = false;
      if (j.code === 'leave') { leaveNotice.classList.add('active'); return; }
      if (r.status === 401 || !j.error) pwField.classList.add('err');
      msg.textContent = j.error || 'Incorrect mobile number or password.';
      if (r.status === 401) { pw.value = ''; pw.focus(); }
      refresh();
    });
  });
</script></body>
</html>
